<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1604">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pictures</title>
<style>
:root{--ink:#0a1018;--panel:#142030;--panel-rgb:20,32,48;--line:#223349;--text:#e8eef6;--mute:#8b9bb0;--accent:#4f93e0;--a:79,147,224}
/* one colour theme per source (same as My Songs / My PDFs); Cloud keeps the original look */
body[data-src=phone]{--ink:#07140f;--panel:#0f2519;--panel-rgb:15,37,25;--line:#1d4630;--mute:#8dbba3;--accent:#4cc38a;--a:76,195,138;--acc-hi:#c9f3de;--bar-end:#0f3d2c}
body[data-src=gdrive]{--ink:#140f05;--panel:#2a1f0a;--panel-rgb:42,31,10;--line:#4d3a12;--mute:#c9b27c;--accent:#f4b942;--a:244,185,66;--acc-hi:#ffe9b8;--bar-end:#4a3408}
body[data-src=sd]{--ink:#0d0a1b;--panel:#191331;--panel-rgb:25,19,49;--line:#32275a;--mute:#a79fc8;--accent:#a78bfa;--a:167,139,250;--acc-hi:#e4dcff;--bar-end:#2e1f5c}
body[data-src=phone] #top,body[data-src=sd] #top,body[data-src=gdrive] #top{background:linear-gradient(135deg,var(--bar-end),var(--panel) 50%,var(--bar-end));border-bottom-color:rgba(var(--a),.6)}
body[data-src=phone] #top h1,body[data-src=sd] #top h1,body[data-src=gdrive] #top h1{color:var(--acc-hi);text-shadow:0 0 12px rgba(var(--a),.55)}
body[data-src=phone] #rtxt,body[data-src=sd] #rtxt,body[data-src=gdrive] #rtxt{color:var(--mute)}
body.sd #key,body.sd #upl{display:none}
body[data-src=gdrive] #key{display:none}
#source{display:none;flex:1;min-height:0}
body[data-v=source] #source{display:flex;flex-direction:column;justify-content:center;gap:14px;padding:24px}
#source h2{margin:0}#source p{margin:0;color:var(--mute);line-height:1.5}
.srcbtn{display:flex;align-items:center;gap:14px;height:auto;min-height:72px;padding:12px 16px;text-align:left;border-radius:16px}
.srcbtn svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;color:var(--accent)}
.srcbtn b{display:block;font-size:16px}.srcbtn small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px;line-height:1.35}
#serr{color:#ff8f8f;min-height:1.2em}
#sback,#lback{height:40px;background:transparent;border-color:transparent;color:var(--mute)}
#fbox{display:flex;flex-direction:column;gap:6px;min-width:250px}
#fbox[hidden]{display:none}
.frow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.frow .fl{min-width:0;font-size:13px;font-weight:600}
.frow small{display:block;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mute);font-size:11.5px;font-weight:400}
.frow button,#reinit,#gdswitch{height:36px;padding:0 12px;font-size:12px;white-space:nowrap}
#reinit,#gdswitch{width:100%}
#gdbox{display:flex;flex-direction:column;gap:4px}#gdbox[hidden]{display:none}
#gdacc{display:block;color:var(--mute);font-size:11.5px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#srow{display:flex;gap:8px}
#srow button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;padding:0 10px}
#srow button svg{width:20px;height:20px;margin:0;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#srow button.on{border-color:var(--accent);color:var(--accent);background:rgba(var(--a),.18)}
/* ── thumbnail grid (month groups) ── */
#grid{display:none;flex:1;min-height:0}
body[data-v=grid] #grid{display:flex;flex-direction:column;padding:10px 12px 6px}
body[data-v=grid] footer #info{display:none}
#gtop{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 4px 8px}
#gtit{font-size:15px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#gcnt{color:var(--mute);font-size:12px;white-space:nowrap}
#gright{display:flex;align-items:center;gap:10px;flex:none}
#selbtn{min-width:0;height:30px;padding:0 14px;border-radius:15px;font-size:12px;font-weight:600;color:var(--mute)}
#selbtn[hidden]{display:none}
#syncbtn{min-width:0;height:30px;padding:0 12px;border-radius:15px;font-size:12px;font-weight:600;color:var(--accent);margin-right:6px}
#syncbtn[hidden]{display:none}
#selbtn.on{border-color:#e5484d;color:#ff8f8f;background:rgba(229,72,77,.18)}
#gbox{flex:1;min-height:0;overflow-y:auto;border:1px solid var(--line);border-radius:14px;padding:0 4px}
.gm{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;width:100%;height:38px;margin:0;padding:0 12px;border-radius:0 0 10px 10px;border-width:0 0 1px;background:rgba(var(--panel-rgb),.96);font-size:13px;font-weight:600;text-align:left}
.gm em{font-style:normal;color:var(--mute);font-size:11.5px;font-weight:600;margin-left:auto;margin-right:10px}
.gm i{font-style:normal;color:var(--mute);transition:transform .45s}
.gm.open i{transform:rotate(90deg)}
.gg{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:4px 0 10px}
.gg.off{display:none}
@keyframes gopen{from{opacity:0}to{opacity:1}}
.gg:not(.off),.gw:not(.off){animation:gopen .5s ease-out}
.gd.open + .gg{max-height:var(--gh,60vh);overflow-y:auto;overscroll-behavior:contain;border-radius:0 0 8px 8px}
#gbox::after{content:"";display:block;height:55vh}
@media (prefers-reduced-motion:reduce){.gg:not(.off),.gw:not(.off){animation:none}}
.gb{border:1px solid var(--line);border-radius:12px;margin:0 0 10px}
.gb .gm{border-radius:11px 11px 0 0}
.gb .gm:not(.open){border-radius:11px;border-bottom-width:0}
.gw{padding:0 6px 6px}
.gw.off{display:none}
.gd{position:sticky;top:38px;z-index:1;display:flex;align-items:center;justify-content:space-between;width:100%;height:34px;margin:0;padding:0 10px;border-radius:0 0 8px 8px;border-width:0 0 1px;background:rgba(var(--panel-rgb),.96);font-size:12.5px;font-weight:600;text-align:left}
.gd em{font-style:normal;color:var(--mute);font-size:11px;font-weight:600;margin-left:auto;margin-right:10px}
.gd i{font-style:normal;color:var(--mute);transition:transform .45s}
.gd b.cl{display:none;place-items:center;flex:none;width:28px;height:28px;margin-right:8px;border-radius:50%;border:1px solid var(--line);color:var(--accent)}
.gd.open b.cl{display:grid}
.gd b.cl svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gd b.cl:active{background:var(--line)}
.gd b.pk{flex:none;margin-right:8px;font-size:11.5px;font-weight:700;letter-spacing:.2px;color:var(--accent);white-space:nowrap}
.gd b.pk[hidden]{display:none}
.gd b.cl.on{background:var(--accent);color:#000;border-color:var(--accent)}
#upbar{display:flex;align-items:center;gap:6px;padding:6px 4px;font-size:12.5px;font-weight:600}
#upbar[hidden]{display:none}
#upn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--accent)}
#upbar button{min-width:0;height:34px;padding:0 12px;font-size:12.5px;border-radius:10px}
#upgo{border-color:var(--accent);color:var(--accent);font-weight:700}
.th.usel{outline:2px solid var(--accent);outline-offset:-2px}
.th.usel img.on{opacity:.6}
.th.usel::after{content:"\2713";position:absolute;top:5px;left:5px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#000;font-size:13px;font-weight:700;line-height:20px;text-align:center}
.gd.open i{transform:rotate(90deg)}
@media (min-width:520px){.gg{grid-template-columns:repeat(4,1fr)}}
.th{position:relative;aspect-ratio:1;height:auto;min-width:0;padding:0;border:0;border-radius:6px;overflow:hidden;background:var(--panel)}
.th img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s}
.th img.on{opacity:1}
.th.sel{outline:2px solid #e5484d;outline-offset:-2px}
.th.sel img.on{opacity:.6}
.th.sel::after{content:"\2713";position:absolute;top:5px;left:5px;width:20px;height:20px;border-radius:50%;background:#e5484d;color:#fff;font-size:13px;font-weight:700;line-height:20px;text-align:center}
.th .upd{position:absolute;top:5px;right:5px;z-index:2;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);color:var(--accent,#4cc38a);display:grid;place-items:center;pointer-events:none}
.th .upd svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.th.busy{pointer-events:none}
.th.busy img.on{opacity:.25}
.th.busy::after{content:"";top:50%;left:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;background:none;animation:gspin .7s linear infinite}
@keyframes gspin{to{transform:rotate(360deg)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none;background:var(--ink);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;max-width:760px;margin:0 auto;display:flex;flex-direction:column;padding-top:0}
button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:44px;height:44px;cursor:pointer}
button:active{background:var(--line)}
button:disabled{opacity:.3;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent)}
#list,#viewer,#login{display:none;flex:1;min-height:0}
body[data-v=list] #list{display:flex;flex-direction:column;padding:10px 12px 6px}
#box{flex:1;min-height:0;overflow-y:auto;border:1px solid var(--line);border-radius:14px;padding:6px}
body[data-v=view] #viewer{display:block;position:relative;overflow:hidden;touch-action:none}
body[data-v=login] #login{display:flex;flex-direction:column;justify-content:center;gap:12px;padding:24px}
body[data-v=login] footer,body[data-v=source] footer{display:none}
.topic{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;height:auto;min-height:40px;margin:0 0 4px;padding:5px 12px;text-align:left;border-radius:10px}
.topic>span:first-child{flex:1;min-width:0}
.topic b{display:block;font-weight:600;font-size:14px;line-height:1.3}
.topic small{display:block;color:var(--mute);font-size:11px;line-height:1.3}
.topic small:empty{display:none}
.topic .r{flex:none;display:flex;align-items:center;gap:8px}
.topic em.n{flex:none;font-style:normal;font-size:11px;font-weight:600;line-height:1;padding:3px 8px;border-radius:10px;color:#e2b877;background:rgba(255,153,51,.1);border:1px solid rgba(255,153,51,.3);font-variant-numeric:tabular-nums}
.topic.hd{display:flex}
.topic.hd i{font-style:normal;color:var(--mute);transition:transform .15s}
.grp.open>.hd i{transform:rotate(90deg)}
.kids{display:none;margin:-1px 0 6px 10px;padding-left:8px;border-left:2px solid var(--line)}
.grp.open>.kids{display:block}
.kids .topic:last-child{margin-bottom:0}
.bm{display:inline-block;width:15px;height:15px;margin-left:8px;vertical-align:-2px;fill:#f5b942;stroke:#f5b942;stroke-width:1.5;stroke-linejoin:round}
.link{display:block;margin:14px auto 0;background:none;border:0;color:var(--mute);height:auto;padding:8px;font-size:14px}
#track{display:flex;position:absolute;left:0;top:0}
#track>.msg{flex:0 0 100%}
.slide{flex:none;position:relative}
.slide img{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);object-fit:contain;border-radius:6px;transform-origin:center;will-change:transform;user-select:none;-webkit-user-drag:none}
.slide img:not([src]){visibility:hidden}
.msg{color:var(--mute);text-align:center;padding:48px 20px;line-height:1.5}
.arrow{display:none;position:absolute;top:50%;margin-top:-22px;z-index:3;border-radius:50%;background:#0a1018cc;font-size:26px;line-height:1;place-items:center}
#rib{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:4;max-width:88%;padding:4px 14px;border-radius:0 0 10px 10px;background:rgba(120,120,120,.5);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);color:#fff;font-size:12px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.4)}
#rib[hidden]{display:none}
#exifov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(0,0,0,.6)}
#exifov[hidden]{display:none}
#exifov>div{display:flex;flex-direction:column;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 26px;text-align:center}
#exifov small{color:var(--mute)}
@media (orientation:landscape){#rib{display:none}}
#toast{position:absolute;top:76px;left:50%;transform:translateX(-50%);z-index:8;background:#0a1018e6;border:1px solid var(--line);border-radius:12px;padding:8px 16px;text-align:center;max-width:86%;pointer-events:none;opacity:0;transition:opacity .9s ease}
#toast.on{opacity:1;transition:opacity .2s}
#toast small{display:block;color:var(--mute);font-size:12px}
#toast b{font-size:15px}
#aL{left:10px}#aR{right:10px}
@media (pointer:fine){body[data-v=view] .arrow{display:grid}}
footer{position:relative;display:flex;gap:6px;align-items:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,153,51,.28)}
.mid{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px}
footer svg,#fsx svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block;margin:auto}
#info{position:absolute;left:0;right:0;bottom:calc(100% + 4px);text-align:center;line-height:1.25;pointer-events:none;color:rgba(232,238,246,.6);text-shadow:0 1px 3px rgba(0,0,0,.85)}
#cnt{display:block;font-size:13px;font-weight:600}
#lbl{display:block;font-size:11px;padding:0 14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body:not([data-v=view]) #info,#panel:not([hidden]) ~ #info{display:none}
#fsx{display:none;position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));right:12px;z-index:5;border-radius:50%;background:#0a1018cc}
#panel{position:absolute;right:12px;bottom:calc(100% + 8px);z-index:6;display:flex;flex-direction:column;gap:8px;padding:10px;background:rgba(var(--panel-rgb),.72);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px}
#panel[hidden],#pinrow[hidden]{display:none}
#prow,#pinrow{display:flex;gap:8px;align-items:center}
#pinrow{flex-direction:column;gap:6px}
#pin{width:100%;box-sizing:border-box;height:34px;text-align:center;caret-color:transparent}
#kp{display:grid;grid-template-columns:repeat(3,40px);gap:6px}
#kp button{min-width:0;width:40px;height:34px;padding:0;font-size:15px;border-radius:10px}
#kp #pinok{color:var(--accent);border-color:var(--accent);font-size:13px;font-weight:700}
#pin{width:110px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:0 12px;font:inherit;letter-spacing:3px}
#pinerr{color:#ff8f8f;font-size:12px;min-height:0}
#del.on{border-color:#e5484d;color:#ff8f8f}
#slide{flex:1;min-width:0;max-width:340px;height:44px;position:relative;margin:0 4px;border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.04);overflow:hidden}
#slide.off{display:none}
#fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(229,72,77,.28)}
#hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-left:40px;font-size:11px;letter-spacing:.3px;color:var(--mute);white-space:nowrap;pointer-events:none}
#trash{position:absolute;left:2px;top:2px;min-width:38px;width:38px;height:38px;border-radius:50%;color:#ff8f8f;border-color:#e5484d66;touch-action:none;cursor:grab;transition:transform .2s ease}
#trash.drag{transition:none;cursor:grabbing}
#slide.busy #fill{transition:width .25s ease}
#slide.busy #trash{opacity:.45}
#slide.busy #hint{color:#ffd0d0}
#trash svg{width:20px;height:20px}
#info.warn{color:#ff9a9a}
body.max footer{display:none!important}
body.max #fsx{display:block}
/* ── saffron top ribbon ── */
#top{position:relative;z-index:5;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(11px + env(safe-area-inset-top)) 16px 11px;background:linear-gradient(135deg,#2a1604,#4a2808 50%,#2a1604);border-bottom:1px solid rgba(255,153,51,.6);animation:ribGlow 4.5s ease-in-out infinite}
#top h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.3px;color:#ffd9a0;text-shadow:0 0 12px rgba(255,153,51,.55)}
#top .tr{display:flex;align-items:center;gap:8px;position:relative;z-index:1}
#top #refresh{min-width:34px;width:34px;height:34px;padding:0;display:grid;place-items:center;border-radius:50%;background:rgba(255,153,51,.14);border:1px solid rgba(255,153,51,.5);color:#ffd9a0}
#top #refresh svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .5s}
#top #refresh:active svg{transform:rotate(180deg)}
#rtxt{color:#e2b877;font-size:12px;white-space:nowrap}
.topic{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.favlab{display:flex;align-items:center;gap:8px;margin:10px 4px 6px;font-size:11px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--accent)}
.favlab::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(var(--a),.7),transparent)}
.favlab:first-child{margin-top:2px}
#shareBtn[hidden]{display:none}
#top .tl{display:flex;align-items:center;gap:6px;min-width:0}
body[data-src=github]{--tape:#1ea7ff;--tape2:#8fd3ff;--tapetxt:#00263f}
body[data-src=phone]{--tape:#22e07a;--tape2:#9af5c4;--tapetxt:#013a1c}
body[data-src=sd]{--tape:#b44cff;--tape2:#dcb0ff;--tapetxt:#ffffff}
body[data-src=gdrive]{--tape:#ffc83d;--tape2:#ffe39a;--tapetxt:#3a2800}
.tapes{position:relative;display:inline-block;padding:5px 7px;line-height:1;filter:drop-shadow(0 0 5px var(--tape,#ff9933))}
.tape{position:relative;display:inline-block;padding:4px 12px;font-size:10px;font-weight:800;letter-spacing:.9px;color:var(--tapetxt,#3d1b00);background:var(--tape,#ff9933);transform:rotate(-8deg);clip-path:polygon(0 0,100% 0,96% 25%,100% 50%,96% 75%,100% 100%,0 100%,4% 75%,0 50%,4% 25%);white-space:nowrap}
.tape:empty{display:none}
.t2{position:absolute;left:0;right:0;top:50%;height:11px;margin-top:-5px;background:var(--tape2,#ffc27a);transform:rotate(15deg);clip-path:polygon(0 0,100% 0,97% 30%,100% 50%,97% 70%,100% 100%,0 100%,3% 70%,0 50%,3% 30%)}
#top .glint{position:absolute;top:0;bottom:0;left:0;width:34%;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,170,70,.24),transparent);transform:translateX(-120%) skewX(-18deg);animation:ribSweep 7s ease-in-out infinite}
@keyframes ribGlow{0%,100%{box-shadow:0 4px 16px -6px rgba(255,153,51,.35)}50%{box-shadow:0 6px 28px -4px rgba(255,153,51,.75)}}
@keyframes ribSweep{0%{transform:translateX(-120%) skewX(-18deg)}60%,100%{transform:translateX(320%) skewX(-18deg)}}
body[data-v=login] #top,body[data-v=source] #top,body[data-v=view] #top{display:none}
body[data-v=login] #app,body[data-v=source] #app,body[data-v=view] #app,body.nobar #app{padding-top:env(safe-area-inset-top)}
body[data-v=view] #toast{top:calc(14px + env(safe-area-inset-top))}
body.nobar #top{display:none}
body.max #top{display:none}
body.max #app{padding-top:0}

/* ── start screen: title + glowing saffron Start button; tap = full screen, then it fades away ── */
#start-screen{position:fixed;inset:0;z-index:10000;display:flex;align-items:flex-end;justify-content:center;padding:0 24px calc(32px + env(safe-area-inset-bottom,0px)) 24px;background:radial-gradient(circle at 50% 38%,#4a2606 0%,#0a1018 70%);--start-img:none}
#start-screen::before{content:"";position:absolute;inset:0;background:var(--start-img) center/cover no-repeat;opacity:0}
#start-screen.ready::before{animation:startReveal 5s ease-in-out forwards}
@keyframes startReveal{to{opacity:1}}
#start-text{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);padding:0 20px;text-align:center;pointer-events:none}
#start-text h1{margin:0 0 10px;font-size:clamp(30px,min(9vw,14vh),56px);letter-spacing:.5px;color:#ffd9a0;text-shadow:0 0 24px rgba(255,153,51,.6),0 2px 12px rgba(0,0,0,.6);opacity:0;transform:translateY(28px)}
#start-text p{margin:0;color:#e2b877;font-size:15px;opacity:0;transform:translateY(28px)}
#start-screen.ready #start-text h1{animation:textRise 2.6s cubic-bezier(.2,.7,.3,1) .6s forwards}
#start-screen.ready #start-text p{animation:textRise 2.6s cubic-bezier(.2,.7,.3,1) 1.6s forwards}
@keyframes textRise{to{opacity:1;transform:none}}
#start-btn{position:relative;z-index:1;appearance:none;cursor:pointer;width:76px;height:76px;min-width:0;border-radius:50%;padding:0;border:2px solid rgba(255,255,255,.9);color:#3a1c02;font:700 11px/1 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;background:radial-gradient(circle at 35% 30%,#ffe9c9 0%,#ff9933 60%,#e07a14 100%);opacity:0;pointer-events:none}
#start-screen.btn-on #start-btn{pointer-events:auto;animation:startBtnIn .8s ease-out forwards,startGlow 1.8s ease-in-out infinite}
@keyframes startBtnIn{to{opacity:1}}
/* source tiles on the landing screen: same look as the gear-menu source buttons, with a thin accent border */
#stiles{position:relative;z-index:1;width:100%;max-width:420px;display:grid;grid-template-columns:1fr 1fr;gap:10px;opacity:0;pointer-events:none}
#start-screen.btn-on #stiles{pointer-events:auto;animation:startBtnIn .8s ease-out forwards}
#stiles button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:auto;min-height:76px;padding:10px;font-size:12px;border:1px solid rgba(var(--a),.55);border-radius:12px}
#stiles button svg{width:26px;height:26px;margin:0;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#stiles button.on{border-color:var(--accent);color:var(--accent);background:rgba(var(--a),.18)}
#stiles button:disabled{opacity:.3}
#stiles button small{display:block;max-width:100%;color:var(--mute);font-size:10.5px;line-height:1.25;text-align:center;min-height:1.25em}
@media (orientation:landscape){#stiles{grid-template-columns:repeat(4,1fr);max-width:640px}#stiles button{min-height:64px}}
#start-btn:active{transform:scale(.95)}
@keyframes startGlow{0%,100%{box-shadow:0 0 8px 2px rgba(255,153,51,.75),0 0 18px 6px rgba(255,153,51,.45),inset 0 1px 0 rgba(255,255,255,.7)}50%{box-shadow:0 0 16px 6px rgba(255,190,110,1),0 0 34px 14px rgba(255,153,51,.7),inset 0 1px 0 rgba(255,255,255,.7)}}
#start-screen.leaving{pointer-events:none;animation:startFade 2.5s ease forwards}
#start-screen.leaving #start-btn{animation:startBtnOut 2.5s ease forwards}
@keyframes startFade{0%,15%{opacity:1}100%{opacity:0}}
@keyframes startBtnOut{0%{transform:scale(1);opacity:1}100%{transform:scale(1.3);opacity:0}}
@media (prefers-reduced-motion:reduce){#top,#top .glint{animation:none}#start-screen.btn-on #start-btn,#start-screen.btn-on #stiles{opacity:1;animation:none}#start-screen.ready #start-text h1,#start-screen.ready #start-text p{animation-duration:.01s;animation-delay:0s}#start-screen.leaving{animation-duration:.3s}#start-screen.leaving #start-btn{animation:none}}

/* ── upload dialog ── */
#ud{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,8,12,.74);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#ud[hidden]{display:none}
#ubox{width:min(420px,100%);max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:16px;background:var(--panel);border:1px solid rgba(255,153,51,.45);border-radius:16px;box-shadow:0 0 28px -6px rgba(255,153,51,.4)}
#ubox h3{margin:0;font-size:17px;color:#ffd9a0}
#ubox label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute)}
#ubox label[hidden]{display:none}
#ubox input[type=text],#ubox select{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--ink);color:var(--text);padding:0 12px;font:inherit;font-size:14px;min-width:0}
#ubox input:disabled,#ubox select:disabled,#unewb:disabled{opacity:.5}
#ufrow{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--mute)}
#unewb{min-width:34px;width:34px;height:34px;border-radius:10px;color:#ffb25c;border-color:rgba(255,153,51,.4)}
#unewb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block;margin:auto}
#usum{margin:0;font-size:13px;color:#e2b877}
#uprev{color:var(--mute);font-size:12px;min-height:15px;word-break:break-all}
#uprog{display:flex;flex-direction:column;gap:6px}
#uprog[hidden]{display:none}
#ubar{height:6px;border-radius:3px;background:var(--ink);overflow:hidden}
#ubar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9933,#ffd9a0);transition:width .2s}
#ust{font-size:12px;color:var(--mute)}
#uerr{margin:0;color:#ff8f8f;font-size:13px;line-height:1.4}
#uerr:empty{display:none}
.urow{display:flex;gap:8px;justify-content:flex-end;margin-top:2px}
.urow button{min-width:88px;padding:0 16px}
#ugo{background:linear-gradient(135deg,#ffb25c,#ff9933);color:#3a1c02;font-weight:700;border-color:transparent}
#ugo:disabled{opacity:.4}

/* ── upload to Drive: full screen, console on top, Drive folders listed below ── */
#ud.full{padding:0;align-items:stretch}
#ud.full #ubox{width:100%;height:100%;max-height:none;border-radius:0;border:0;box-shadow:none;overflow:hidden;padding:calc(12px + env(safe-area-inset-top)) 14px calc(10px + env(safe-area-inset-bottom))}
#ulist{display:flex;flex-direction:column;flex:1;min-height:0;gap:6px;border-top:1px solid var(--line);padding-top:8px}
#ulist[hidden]{display:none}
#ulh{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--mute)}
#uref{min-width:0;height:30px;padding:0 12px;font-size:12px;border-radius:8px}
#ulbox{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;-webkit-overflow-scrolling:touch}
#ubox:has(#umin:not([hidden])) #ulbox{opacity:.45;pointer-events:none}
.ufo{display:flex;align-items:center;gap:10px;flex:none;width:100%;height:auto;min-height:44px;padding:8px 12px;text-align:left;font-size:14px;border-radius:10px;background:var(--ink)}
.ufo svg{flex:none;width:18px;height:18px;fill:none;stroke:var(--accent,#ffb25c);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ufo span{flex:1;min-width:0;overflow-wrap:anywhere}
.ufo em{flex:none;font-style:normal;font-size:11px;color:var(--accent,#ffb25c)}
.ufo.on{border-color:var(--accent,#ff9933);background:rgba(var(--a,255,153,51),.16);box-shadow:inset 0 0 0 1px var(--accent,#ff9933)}
.ulmsg{padding:16px 8px;color:var(--mute);font-size:13px;text-align:center;line-height:1.5}

/* ── upload minimised: breathing indicator in the banner ── */
#upind{display:flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:15px;background:rgba(var(--a,255,153,51),.14);border:1px solid rgba(var(--a,255,153,51),.55);color:var(--acc-hi,#ffd9a0);font-size:12px;font-weight:600;white-space:nowrap;animation:upBreath 2.2s ease-in-out infinite}
#upind[hidden]{display:none}
#upind b{display:block;width:16px;height:16px;overflow:hidden;flex:none;color:var(--accent,#ffb25c)}
#upind svg{display:block;width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;animation:upArrow 1.1s ease-in infinite}
#upit{font-variant-numeric:tabular-nums}
#upind.done{animation:none}#upind.done b{color:#4cc38a}#upind.done svg{animation:none}
@keyframes upBreath{0%,100%{box-shadow:0 0 3px 0 rgba(var(--a,255,153,51),.2);opacity:.7}50%{box-shadow:0 0 14px 2px rgba(var(--a,255,153,51),.7);opacity:1}}
@keyframes upArrow{0%{transform:translateY(9px);opacity:0}30%{opacity:1}100%{transform:translateY(-9px);opacity:0}}
@media (prefers-reduced-motion:reduce){#upind,#upind svg{animation:none}}

/* ── mobile app (Capacitor or installed to home screen): already full screen, so no max / min buttons ── */
body.app #max,body.app #fsx{display:none!important}
body{-webkit-touch-callout:none}
#login h2{margin:0}#login p{margin:0;color:var(--mute);line-height:1.5}
#login input{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:0 14px;font:inherit}
#lerr{color:#ff8f8f}
@media (orientation:landscape) and (pointer:coarse), (orientation:landscape) and (max-height:500px){
  body[data-v=view] footer{display:none}
  body[data-v=view] #app{max-width:none;margin:0;padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left)}
  body[data-v=view] .slide img{inset:0;width:100%;height:100%;border-radius:0}
}
</style>

const nat = (a, b) => a.localeCompare(b, undefined, {numeric: true});
let mem = "";
const getTok = () => { try { return localStorage.getItem("ghtok") || mem; } catch (e) { return mem; } };
const setTok = v => { mem = v; try { v ? localStorage.setItem("ghtok", v) : localStorage.removeItem("ghtok"); } catch (e) {} };

const setSrc = v => { try { localStorage.setItem("picsrc", v); } catch (e) {} };
const SV = d => '<svg viewBox="0 0 24 24"><path d="' + d + '"/></svg>';
const SRC_ICO = {github: SV("M18 10a6 6 0 0 0-11.6-1.6A4.5 4.5 0 0 0 7 17h11a3.5 3.5 0 0 0 0-7z"), phone: SV("M7 2h10a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zM10.5 19h3"), sd: SV("M7 3h7l4 4v14H7zM11 3v4M14 3v4"), gdrive: SV("M9 3h6l7 12-3.5 6h-13L2 15zM9 3l7 12h6M16 15l-3.5 6")};
const SRC_ORDER = ["github", "phone", "sd", "gdrive"], SRC_NAME = {github: "Cloud", phone: "Phone storage", sd: "SD card", gdrive: "Google Drive"}, SRC_SHORT = {github: "Cloud", phone: "Phone", sd: "SD card", gdrive: "Drive"};
const isLocal = v => v === "phone" || v === "sd";
const sdOk = () => { try { return !window.AndroidSd || AndroidSd.sdPresent() !== false; } catch (e) { return true; } };   // no card inserted: grey the SD option out

async function openFolder(i) {
  const my = ++ticket; cur = i; setLast(parsed[i].n); freeUrls(); resetZoom();
  track.style.transition = "none"; track.style.transform = "";
  note("Loading photos..."); show("view"); fit();
  try {
    let list = listCache[parsed[i].n];
    if (!list) {
      const r = await api(parsed[i].n);
      if (my !== ticket) return;
      if (r.status === 401) { setTok(""); return fail("PIN was rejected. Enter it again."); }
      if (!r.ok) return note("Could not open this folder (error " + r.status + "). Check the folder name exists in the repo and the PIN can read it.");
      list = await r.json();
      if (my !== ticket) return;
      listCache[parsed[i].n] = list;
    }
    const ents = list.filter(x => x.type === "file" && /\.(webp|jpe?g|png|gif)$/i.test(x.name));
    if ((isLocal(getSrc()) || getSrc() === "gdrive") && ents.some(x => x.mod)) sortByDate(ents);   // phone / SD: by date, like the gallery
    else ents.sort((a, b) => nat(a.name, b.name));
    files = ents.map(x => x.name); modOf = {}; ents.forEach(x => { modOf[x.name] = x.mod || 0; });
    if (!files.length) { startEnd = false; pending = null; updateBar(); return note("No photos in this folder."); }
    track.innerHTML = ""; cache = new Array(files.length); imgs = [];
    files.forEach(() => {
      const s = document.createElement("div"); s.className = "slide";
      const im = document.createElement("img"); im.alt = ""; im.draggable = false; im.onload = () => applyFill(im);
      s.appendChild(im); track.appendChild(s); imgs.push(im);
    });
    fit();
    const n = files.length, at = Math.min(Math.max(0, startAt), n - 1), s0 = startEnd ? Math.max(0, n - FIRST) : at;
    place(startEnd ? n - 1 : at, false);
    for (let k = s0; k < s0 + FIRST; k++) load(k);
    startEnd = false; startAt = 0;
    if (pending) { toast(pending.a, pending.b); pending = null; }
  } catch (e) { if (my === ticket) note("Network error. Check your connection and try again."); }
}

function load(k) {

    .then(b => { const u = typeof b === "string" ? b : URL.createObjectURL(b); if (my === ticket && im.isConnected) { im.src = u; if (im.decode) im.decode().catch(() => {}); } else if (typeof b !== "string") URL.revokeObjectURL(u); return u; })
    .catch(e => { const j = cache.indexOf(p); if (j >= 0) cache[j] = 0; if (e === 401 && my === ticket) { setTok(""); fail("PIN was rejected. Enter it again."); } });
  cache[k] = p;
}

  upToDrive = false; $("ud").classList.remove("full"); $("ulist").hidden = true; upDay = ""; $("unewb").hidden = false; $("ualb").hidden = true; $("uname").parentElement.hidden = false; $("uprev").hidden = false;
  upFiles = files.slice().sort((a, b) => (a.lastModified - b.lastModified) || nat(a.name, b.name));   // oldest photo first, so numbers follow the date taken
  const sel = $("ufold"); sel.innerHTML = "";
  parsed.forEach(f => { const o = document.createElement("option"); o.value = f.n; o.textContent = f.n.replace(/\//g, " / "); sel.appendChild(o); });
  const last = getLast();
  upNew = !parsed.length;
  if (parsed.length) sel.value = cur >= 0 && parsed[cur] ? parsed[cur].n : (parsed.some(f => f.n === last) ? last : parsed[0].n);
  $("unew").value = ""; $("unew").placeholder = toDrive() ? "Album/trip, e.g. " + GD_ALBUMS[0] + "/2026 12 25 Goa" : "Folder name (use / for a sub-folder)";
  $("usum").textContent = upFiles.length + (upFiles.length === 1 ? " photo selected" : " photos selected") + (toDrive() ? " \u00b7 original quality" : "");
  $("uprog").hidden = true; $("ubar").firstChild.style.width = "0";
  $("ugo").disabled = false; $("ugo").textContent = "Upload"; $("ucancel").textContent = "Cancel"; $("umin").hidden = true;
  ["ufold", "ualb", "unew", "uname", "unewb"].forEach(i => $(i).disabled = false);
  upFolderChanged();
  $("ud").hidden = false;
}
const closeUpload = () => { if (upBusy) return; $("ud").hidden = true; upFiles = []; };

// minimise: the window hides, the upload keeps running, a breathing pill in the banner shows progress (tap it to open the window again)
function upIndText() { const m = /(\d+) of (\d+)/.exec($("ust").textContent); $("upit").textContent = m ? m[1] + "/" + m[2] : "Uploading"; }
new MutationObserver(upIndText).observe($("ust"), {childList: true, characterData: true, subtree: true});
function upMinimize() {
  if (!upBusy) return;
  upMin = true; clearTimeout(upDoneT); $("ud").hidden = true;
  $("upind").className = ""; $("upind").hidden = false; upIndText();
}
function upRestore() { upMin = false; clearTimeout(upDoneT); $("upind").hidden = true; $("ud").hidden = false; }
function upEnded(ok, n) {                                  // a run has finished
  $("umin").hidden = true;
  if (!upMin) return;
  upMin = false;
  if (ok) { $("upit").textContent = "Uploaded " + n; $("upind").className = "done"; upDoneT = setTimeout(() => { $("upind").hidden = true; }, 4000); }
  else { $("upind").hidden = true; $("ud").hidden = false; }   // stopped / errors: bring the window back so the result is seen
}
$("umin").onclick = upMinimize;
$("upind").onclick = () => { if ($("upind").classList.contains("done")) { clearTimeout(upDoneT); $("upind").hidden = true; } else if (upBusy) upRestore(); };

$("upl").onclick = () => { if (upBusy) { if (upMin) upRestore(); return; } closePanel(); $("ufile").click(); };
$("ufile").onchange = () => { const fl = Array.from($("ufile").files || []).filter(f => /^image\//.test(f.type) || IMG_RE.test(f.name)); $("ufile").value = ""; if (fl.length) openUpload(fl); };
$("ufold").onchange = () => upFolderChanged();
$("unewb").onclick = () => { upNew = !upNew; upFolderChanged(true); };
$("unew").oninput = () => { upErr(); upPreview(); upListMark(); const a = gdAlbumOf($("unew").value); if (a && !$("ualb").hidden) $("ualb").value = a; };
$("uname").oninput = upPreview;
$("ucancel").onclick = () => { if (upBusy) { upStop = true; $("ucancel").disabled = true; $("ucancel").textContent = "Stopping\u2026"; } else closeUpload(); };
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("ud").hidden) { if (upBusy) upMinimize(); else closeUpload(); } });

const readB64 = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result.split(",")[1]); r.onerror = () => rej(new Error("read")); r.readAsDataURL(b); });
const loadImg = f => new Promise((res, rej) => { const u = URL.createObjectURL(f), im = new Image(); im.onload = () => { URL.revokeObjectURL(u); res(im); }; im.onerror = () => { URL.revokeObjectURL(u); rej(new Error("decode")); }; im.src = u; });
const canvasBlob = (c, type, q) => new Promise(res => c.toBlob(res, type, q));
async function convert(file) {
  const gif = file.type === "image/gif" || /\.gif$/i.test(file.name), web = file.type === "image/webp" || /\.webp$/i.test(file.name);
  if (gif || web) return {blob: file, ext: gif ? "gif" : "webp"};
  let src; try { src = await createImageBitmap(file, {imageOrientation: "from-image"}); } catch (e) { src = await loadImg(file); }
  const w0 = src.width || src.naturalWidth, h0 = src.height || src.naturalHeight, k = Math.min(1, UMAX / Math.max(w0, h0));
  const c = document.createElement("canvas"); c.width = Math.round(w0 * k); c.height = Math.round(h0 * k);
  const x = c.getContext("2d"); x.drawImage(src, 0, 0, c.width, c.height);
  let blob = await canvasBlob(c, "image/webp", UQ), ext = "webp";
  if (!blob || blob.type !== "image/webp") { x.globalCompositeOperation = "destination-over"; x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); blob = await canvasBlob(c, "image/jpeg", UQ); ext = "jpg"; }
  if (src.close) src.close(); c.width = c.height = 0;
  if (!blob) throw new Error("convert");
  return {blob, ext};
}

$("ugo").onclick = async () => {
  if (upBusy) return;
  const folder = destFolder();
  if (!folder) return upErr("Type a folder name.");
  if (folder.split("/").some(seg => !seg.trim() || seg.startsWith("."))) return upErr("Folder names cannot be empty or start with a dot.");
  if (!$("uname").value.trim()) return upErr("Type the first file name.");
  if (toDrive()) return uploadDrive(folder);
  upErr(); upBusy = true; upStop = false;
  ["ufold", "ualb", "unew", "uname", "unewb"].forEach(i => $(i).disabled = true);
  $("ugo").disabled = true; $("ucancel").textContent = "Stop"; $("uprog").hidden = false; $("umin").hidden = false;
  const total = upFiles.length, next = makeNamer($("uname").value, takenSet(folder));
  let ok = 0, bad = 0, msg = "";
  for (let i = 0; i < total && !upStop; i++) {
    $("ust").textContent = "Uploading " + (i + 1) + " of " + total + (bad ? " \u00b7 " + bad + " failed" : "");
    $("ubar").firstChild.style.width = Math.round(i / total * 100) + "%";
    let conv, b64;
    try { conv = await convert(upFiles[i]); b64 = await readB64(conv.blob); }
    catch (e) { bad++; continue; }
    let sent = false, fatal = false;
    for (let t = 0; t < 6 && !sent; t++) {
      const name = next(conv.ext);
      try {
        const r = await fetch("https://api.github.com/repos/" + OWNER + "/" + REPO + "/contents/" + enc(folder + "/" + name), {
          method: "PUT", headers: {...hdr(false), "Content-Type": "application/json"},
          body: JSON.stringify({message: "Add " + name, content: b64})});
        if (r.ok) {
          const j = await r.json();
          if (getSrc() === "github") {                      // the user may have switched source while the window was minimised
          if (!listCache[folder]) listCache[folder] = [];
          if (!parsed.some(f => f.n === folder)) {          // brand-new folder: add it to the list
            const keep = cur >= 0 && parsed[cur] ? parsed[cur].n : null;
            parsed.push(parseFolder(folder)); parsed.sort((a, b) => NEWEST_FIRST ? nat(b.n, a.n) : nat(a.n, b.n));
            if (keep) cur = parsed.findIndex(f => f.n === keep);
          }
          listCache[folder].push({name, type: "file", sha: j.content && j.content.sha});
          }
          sent = true; ok++;
        } else if (r.status === 422) continue;               // name already taken: try the next number
        else { fatal = true; msg = r.status === 401 || r.status === 403 || r.status === 404 ? "The PIN needs Contents: read & write for this repository." : "GitHub error " + r.status + "."; break; }
      } catch (e) { fatal = true; msg = "Network error."; break; }
    }
    if (fatal) { bad += total - i; break; }
    if (!sent) bad++;
  }
  upBusy = false;
  $("ubar").firstChild.style.width = Math.round(ok / total * 100) + "%";
  if (document.body.dataset.v === "list") { renderList(); }
  updateBar();
  if (ok && !bad && !upStop) { $("ud").hidden = true; upFiles = []; toast("", "Uploaded " + ok + (ok === 1 ? " photo" : " photos") + " to " + folder.replace(/\//g, " / ")); upEnded(true, ok + (ok === 1 ? " photo" : " photos")); return; }
  $("ust").textContent = "Uploaded " + ok + " of " + total + (upStop ? " (stopped)" : "") + (bad && !upStop ? " \u00b7 " + bad + " not uploaded" : "");
  upErr(msg || (bad && !upStop ? "Some photos could not be read or uploaded." : ""));
  $("ucancel").disabled = false; $("ucancel").textContent = "Close"; upEnded(false);
};

// Google Drive upload: same dialog, but the folder must sit inside an album (Family / General / Work) and every photo is sent in its original quality
async function uploadDrive(folder) {
  const first = folder.split("/")[0], alb = gdAlbumOf(first);
  if (!alb) return upErr("Start with " + GD_ALBUMS.join(", ") + ", e.g. " + GD_ALBUMS[0] + "/2026 12 25 Goa");
  folder = alb + folder.slice(first.length);
  upErr(); upBusy = true; upStop = false;
  ["ufold", "ualb", "unew", "uname", "unewb"].forEach(i => $(i).disabled = true);
  $("ugo").disabled = true; $("ucancel").textContent = "Stop"; $("uprog").hidden = false; $("umin").hidden = false;
  const total = upFiles.length;
  let ok = 0, bad = 0, msg = "", pid = "", next = null, taken = null;
  try {
    pid = await gdEnsure(folder);
    taken = getSrc() === "gdrive" ? takenSet(folder) : new Set();                          // also skip names other phones already added to this Drive folder
    (await gdList("'" + pid + "' in parents and trashed=false", "name")).forEach(x => taken.add(String(x.name).toLowerCase()));
    next = makeNamer($("uname").value, taken);
  } catch (e) { msg = gdMsg(e); bad = total; pid = ""; }
  for (let i = 0; pid && i < total && !upStop; i++) {
    $("ust").textContent = "Uploading " + (i + 1) + " of " + total + (bad ? " \u00b7 " + bad + " failed" : "");
    $("ubar").firstChild.style.width = Math.round(i / total * 100) + "%";
    const f = upFiles[i], ext = extOf(f);
    if (!/^(webp|jpe?g|png|gif)$/i.test(ext)) { bad++; msg = "Only JPG, PNG, WebP and GIF photos can be uploaded."; continue; }
    const name = f.lazy ? uniqName(f.name, taken) : next(ext);       // from the phone: keep the original file name (a number is added only if the name is taken)
    try {
      let srcFile = f;
      if (f.lazy) { try { srcFile = new File([await readLocal(f.src, f.path)], f.name, {type: f.type, lastModified: f.lastModified}); } catch (e) { throw new Error("phone:Could not read the photo from the phone."); } }
      const j = await gdUpload(srcFile, name, pid, ext), th = j.thumbnailLink || "";
      if (getSrc() === "gdrive") {                          // only when browsing Drive: add the new photo to the lists
      if (!listCache[folder]) listCache[folder] = [];
      if (!parsed.some(x => x.n === folder)) {              // brand-new folder: add it to the list
        const keep = cur >= 0 && parsed[cur] ? parsed[cur].n : null;
        parsed.push(parseFolder(folder)); gdSort();
        if (keep) cur = parsed.findIndex(x => x.n === keep);
      }
      listCache[folder].push({name, type: "file", sha: "", id: j.id, thumb: th, mod: f.lastModified || Date.now()}); GDI[folder + "/" + name] = {id: j.id, thumb: th};
      }
      if (f.pk) picksAdd(f.pk, f.name);
      ok++;
    } catch (e) { msg = gdMsg(e); bad += total - i; break; }
  }
  upBusy = false;
  picksPaint();
  $("ubar").firstChild.style.width = Math.round(ok / total * 100) + "%";
  if (document.body.dataset.v === "list") renderList();
  updateBar();
  if (ok && !bad && !upStop) { $("ud").hidden = true; upFiles = []; upSelCancel(); toast("", "Uploaded " + ok + (ok === 1 ? " photo" : " photos") + " to " + folder.replace(/\//g, " / ")); upEnded(true, ok + (ok === 1 ? " photo" : " photos")); return; }
  $("ust").textContent = "Uploaded " + ok + " of " + total + (upStop ? " (stopped)" : "") + (bad && !upStop ? " \u00b7 " + bad + " not uploaded" : "");
  upErr(msg || (bad && !upStop ? "Some photos could not be uploaded." : ""));
  $("ucancel").disabled = false; $("ucancel").textContent = "Close"; upEnded(false);
}

// ── START SCREEN ────────────────────────────────────────────────────────
// Full screen can only be requested from a tap, so the tap on "Start" asks for it, then the screen fades away (2.5 s).
// (iPhone Safari has no full-screen API: there only the top ribbon is hidden. In an app it is already full screen.)
(function () {
  const scr = $("start-screen"), box = $("stiles");
  const m = /url\(["']?(.*?)["']?\)/.exec(getComputedStyle(scr).getPropertyValue("--start-img"));
  const ready = () => scr.classList.add("ready");
  if (m) { const img = new Image(); img.onload = img.onerror = ready; img.src = m[1]; setTimeout(ready, 1500); } else ready();
  setTimeout(() => scr.classList.add("btn-on"), 1000);
  let done = false;
  const finish = () => { if (!done) { done = true; scr.remove(); realign(); } };
  const begin = () => {
    if (!IN_APP) { if (canFS) setMax(true); else document.body.classList.add("nobar"); }
    setTimeout(realign, 150);
    scr.classList.add("leaving");
    scr.addEventListener("animationend", e => { if (e.target === scr) finish(); });
    setTimeout(finish, 3200);
  };
  SRC_ORDER.forEach(v => {                                 // one tile per source, same icons / names as the gear menu
    const b = document.createElement("button");
    b.type = "button"; b.dataset.src = v; b.innerHTML = SRC_ICO[v] + "<span>" + SRC_NAME[v] + "</span><small></small>";
    b.setAttribute("aria-label", SRC_NAME[v]);
    b.onclick = () => {
      if (scr.classList.contains("leaving")) return;
      begin();
      if (v !== getSrc() || document.body.dataset.v === "source") goSrc(v);   // same source as last time: it is already loading behind this screen
    };
    box.appendChild(b);
  });
  showSrcIco();                                            // marks the last-used tile and greys out SD card when none is inserted
  const fmtGB = b => { const g = b / 1073741824; return (g >= 10 ? Math.round(g) : g.toFixed(1)) + " GB"; };
  const spaceTxt = (f, t) => fmtGB(f) + " free of " + fmtGB(t);
  const setLine = (v, txt) => { const s = box.querySelector('button[data-src="' + v + '"] small'); if (s) s.textContent = txt; };
  setLine("github", "GitHub");
  if (window.AndroidSd && typeof AndroidSd.space === "function") {
    ["phone", "sd"].forEach(v => {
      if (v === "sd" && !sdOk()) return setLine(v, "No card");
      try { const r = AndroidSd.space(v).split("\t"); setLine(v, r.length === 2 ? spaceTxt(+r[0], +r[1]) : ""); } catch (e) {}
    });
  }
  try { setLine("gdrive", localStorage.getItem("gdSpace") || ""); } catch (e) {}      // last known figure shows at once
  let seen = ""; try { seen = localStorage.getItem("gdok") || ""; } catch (e) {}
  if (seen && window.AndroidGDrive) {                                                  // only if you have signed in to Drive before
    gdFetch("https://www.googleapis.com/drive/v3/about?fields=storageQuota").then(r => r.ok ? r.json() : null).then(j => {
      const q = j && j.storageQuota; if (!q || !q.limit) return;
      const t = spaceTxt(q.limit - q.usage, +q.limit);
      setLine("gdrive", t); try { localStorage.setItem("gdSpace", t); } catch (e) {}
    }).catch(() => {});
  }
})();
