<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portuguese Course</title>
<style>
html, body {
    margin: 0;
    height: 100%;
    background: #0a0a0a;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
    scrollbar-width: none;
    -ms-overflow-style: none;
}
html::-webkit-scrollbar, body::-webkit-scrollbar { width: 0; height: 0; background: transparent; }

#outer {
    margin: 20px;
    margin-bottom: 0;
    height: calc(100vh - 40px - 64px);
    display: flex;
    flex-direction: row;
    gap: 14px;
    overflow: hidden;
}

/* SIDEBAR — full topic index */
#sidebar {
    width: 280px;
    flex-shrink: 0;
    background: #111;
    border: 1px solid #333;
    border-radius: 8px;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: thin;
    scrollbar-color: #333 #0a0a0a;
    transition: width 0.2s ease;
}
#sidebar.collapsed {
    width: 42px;
}
#sidebar::-webkit-scrollbar { width: 8px; }
#sidebar::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

#sidebar-title {
    padding: 14px 16px 10px 16px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #666;
    border-bottom: 1px solid #222;
    position: sticky;
    top: 0;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    white-space: nowrap;
}
#sidebar.collapsed #sidebar-title {
    padding: 14px 0;
    justify-content: center;
}
#sidebar-title .title-text {
    overflow: hidden;
    transition: opacity 0.15s ease;
}
#sidebar.collapsed #sidebar-title .title-text {
    display: none;
}
#sidebar-toggle {
    background: none;
    border: 1px solid #333;
    border-radius: 5px;
    color: #999;
    width: 24px;
    height: 24px;
    flex-shrink: 0;
    padding: 0;
    font-size: 13px;
    font-weight: normal;
    line-height: 1;
    box-shadow: none;
    display: flex;
    align-items: center;
    justify-content: center;
}
#sidebar-toggle:hover {
    background: #1a1a1a;
    color: #00c8ff;
    box-shadow: none;
}
#sidebar.collapsed #sidebar-list {
    display: none;
}

/* SEARCH BOX */
#sidebar-search-row {
    padding: 8px 12px;
    border-bottom: 1px solid #222;
    position: sticky;
    top: 45px;
    background: #111;
    z-index: 1;
}
#sidebar.collapsed #sidebar-search-row {
    display: none;
}
#topic-search {
    width: 100%;
    box-sizing: border-box;
    background: #0a0a0a;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 7px 28px 7px 10px;
    color: #eee;
    font-size: 13px;
    font-family: inherit;
    outline: none;
}
#topic-search::placeholder { color: #666; }
#topic-search:focus { border-color: #00c8ff88; }
#search-wrap {
    position: relative;
}
#search-clear {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    padding: 0;
    background: none;
    border: none;
    border-radius: 50%;
    color: #777;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    box-shadow: none;
}
#search-clear:hover {
    background: #222;
    color: #fff;
    box-shadow: none;
}
#search-wrap.has-text #search-clear {
    display: flex;
}
#search-wrap {
    position: relative;
}
#search-clear {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: #2a2a2a;
    color: #999;
    font-size: 12px;
    line-height: 1;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: none;
}
#search-clear:hover {
    background: #3a3a3a;
    color: #fff;
    box-shadow: none;
}
#search-clear.visible {
    display: flex;
}
#search-count {
    font-size: 11px;
    color: #666;
    padding: 4px 2px 0 2px;
}

/* SEARCH MATCH / DIM STATES */
.topic-item.search-match {
    background: #0d1f2b;
    border-left-color: #00c8ff;
    color: #fff;
}
.topic-item.search-dim {
    opacity: 0.28;
}

.topic-item {
    padding: 10px 16px;
    font-size: 14.5px;
    line-height: 1.4;
    color: #ccc;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
}
.topic-item:hover {
    background: #1a1a1a;
    color: #fff;
}
.topic-item.active {
    background: #0d1f2b;
    color: #00c8ff;
    border-left-color: #00c8ff;
    font-weight: bold;
}

/* HOVER TOOLTIP — shows English gloss of the topic */
#topic-tooltip {
    position: fixed;
    z-index: 50;
    max-width: 260px;
    background: #1a1a1a;
    color: #ddd;
    border: 1px solid #00c8ff55;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 13px;
    line-height: 1.45;
    box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    pointer-events: none;
    opacity: 0;
    transform: translateY(-50%) translateX(-6px);
    transition: opacity 0.12s ease, transform 0.12s ease;
}
#topic-tooltip.visible {
    opacity: 1;
    transform: translateY(-50%) translateX(0);
}

/* RIGHT COLUMN — content + nav stacked */
#main-col {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
    overflow: hidden;
}

/* CONTENT PANEL */
#content-panel {
    position: relative;
    overflow: hidden;
    border: 1px solid #333;
    border-radius: 8px;
    flex: 1;
    min-height: 0;
}

#content-box {
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    box-sizing: border-box;
    padding: 20px 26px;
    scrollbar-width: thin;
    scrollbar-color: #333 #0a0a0a;
    font-size: 17px;
    line-height: 1.6;
}
#content-box::-webkit-scrollbar { width: 8px; }
#content-box::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

/* default styling for whatever content gets dropped in */
#content-box h1, #content-box h2, #content-box h3 {
    color: #00c8ff;
    margin-top: 0.2em;
}
#content-box table {
    border-collapse: collapse;
    margin: 14px 0;
    width: 100%;
}
#content-box th, #content-box td {
    border: 1px solid #333;
    padding: 8px 12px;
    text-align: left;
}
#content-box th {
    background: #131313;
    color: #28a745;
}
#content-box tr:nth-child(even) td { background: #0e0e0e; }
#content-box p { margin: 0.6em 0; }
#content-box .pt { color: #fff; font-weight: bold; }
#content-box .en { color: #999; font-style: italic; }

/* SENTENCE CHECKER */
#sentence-check-panel {
    flex-shrink: 0;
    background: #111;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 10px 16px;
}
#sc-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #999;
    cursor: pointer;
    user-select: none;
    padding: 2px 0;
}
#sentence-check-panel.expanded #sc-header {
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid #222;
}
#sc-header:hover { color: #00c8ff; }
#sc-toggle-icon {
    color: #666;
    font-size: 11px;
    transition: transform 0.15s ease;
}
#sentence-check-panel.expanded #sc-toggle-icon {
    transform: rotate(90deg);
}
#sc-body {
    display: none;
}
#sentence-check-panel.expanded #sc-body {
    display: block;
}
#sc-row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
}
#sc-input {
    flex: 1;
    resize: none;
    box-sizing: border-box;
    background: #0a0a0a;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 8px 10px;
    color: #eee;
    font-size: 14.5px;
    font-family: inherit;
    outline: none;
    line-height: 1.4;
}
#sc-input::placeholder { color: #666; }
#sc-input:focus { border-color: #00c8ff88; }
#sc-check-btn {
    flex-shrink: 0;
    padding: 8px 16px;
    font-size: 14px;
}
#sc-check-btn:disabled {
    opacity: 0.5;
    cursor: default;
}
#sc-result {
    margin-top: 10px;
    font-size: 14px;
    line-height: 1.5;
}
#sc-result:empty { margin-top: 0; }
#sc-ok {
    color: #28a745;
}
#sc-error-item {
    border-left: 3px solid #ff4d4d;
    background: #1a0e0e;
    padding: 8px 10px;
    border-radius: 4px;
    margin-bottom: 6px;
}
#sc-result .sc-error-item {
    border-left: 3px solid #ff4d4d;
    background: #1a0e0e;
    padding: 8px 10px;
    border-radius: 4px;
    margin-bottom: 6px;
}
#sc-result .sc-error-msg { color: #eee; }
#sc-result .sc-error-suggest { color: #00c8ff; font-weight: bold; }
#sc-result .sc-error-context { color: #888; font-size: 13px; margin-top: 2px; }
#sc-result .sc-error-rule { margin-top: 4px; font-size: 12px; }
#sc-result .sc-error-rule a { color: #888; text-decoration: none; border-bottom: 1px dotted #555; }
#sc-result .sc-error-rule a:hover { color: #00c8ff; border-bottom-color: #00c8ff; }
#sc-result .sc-fail { color: #ff8080; }
#sc-corrected {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid #222;
    color: #ccc;
}
#sc-corrected b { color: #28a745; }

/* BOTTOM NAV */
#bottom-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 14px 0;
}
button {
    padding: 8px 18px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
    transition: transform 0.15s ease, filter 0.15s ease;
    background: #0077cc;
    color: #fff;
    box-shadow: 0 0 8px rgba(0,119,204,0.5);
}
button:hover { background: #0099ff; box-shadow: 0 0 16px rgba(0,153,255,0.9); }
button:active { transform: scale(0.97); }

#counter {
    font-size: 15px;
    color: #aaa;
    min-width: 60px;
    text-align: center;
}

/* Wrapper put around every lesson page. On desktop it generates no box (layout unchanged). */
.page-canvas { display: contents; }

/* ── MOBILE-ONLY CONTROLS (hidden on desktop, so desktop is unchanged) ── */
#bottom-nav { position: relative; }
#menuBtn, #fsBtn { display: none; }

/* ── MOBILE (portrait phones): topic list first, then full-width scrollable lesson ── */
@media (max-width: 700px) {
  #outer { margin: 4px 4px 0 4px; gap: 4px; height: calc(100dvh - 56px); }

  /* Bottom bar becomes a compact bordered strip: ☰  <  1 / 30  >  ⛶ */
  #bottom-nav {
      height: 40px; box-sizing: border-box; padding: 0; margin: 0 4px 4px 4px; gap: 4px;
      background: #111; border: 1px solid #333; border-radius: 8px;
  }
  #bottom-nav button,
  #bottom-nav button:hover {
      background: #1a1a1a; color: #ccc; border: 1px solid #333; border-radius: 6px;
      box-shadow: none; padding: 0; font-weight: 700;
  }
  #bottom-nav #prevBtn, #bottom-nav #nextBtn { width: 38px; height: 32px; font-size: 22px; line-height: 1; }
  #bottom-nav .nav-label { display: none; }
  #counter { min-width: 40px; font-size: 12px; }
  #bottom-nav #menuBtn, #bottom-nav #fsBtn {
      display: block; position: absolute; top: 3px; height: 32px; font-size: 19px; line-height: 1;
      color: #00c8ff; border-color: #00c8ff66;
  }
  #bottom-nav #menuBtn { left: 6px; width: 36px; }
  #bottom-nav #fsBtn   { right: 6px; width: 34px; font-size: 18px; }
  #bottom-nav #menuBtn.open { background: #00c8ff; color: #111; }

  /* Sidebar = full-width list when open, completely gone when closed */
  #sidebar { width: 100%; }
  #sidebar.collapsed { display: none; }
  #sidebar-toggle { display: none; }
  #sidebar-title { height: 40px; box-sizing: border-box; padding: 0 16px; }
  #sidebar-search-row { top: 40px; }
  #topic-search { font-size: 16px; }          /* stops iOS zooming in on focus */
  .topic-item { padding-top: 12px; padding-bottom: 12px; }   /* bigger tap targets */
  #topic-tooltip { display: none; }                          /* no hover on touch */
  body.side-open #main-col { display: none; }

  #main-col { gap: 4px; }

  /* Lesson: edge-to-edge; the page is laid out on a fixed-width canvas and scrolls left/right
     instead of being squeezed to the phone width. Change 900px to taste. */
  #content-box { padding: 12px 10px 40px 10px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  #content-box .page-canvas { display: block; box-sizing: border-box; width: 100%; min-width: 900px; }

  /* Bigger invisible tap area around the 🔊 buttons (no visual or layout change; speech code untouched) */
  #content-box .spk-btn::after { content: ""; position: absolute; top: -10px; right: -10px; bottom: -10px; left: -10px; }

  /* "Check a sentence" panel is not shown on phones */
  #sentence-check-panel { display: none; }
}
</style>
</head>
<body>

<div id="outer">
    <div id="sidebar">
        <div id="sidebar-title">
            <span class="title-text">Topics</span>
            <button id="sidebar-toggle" aria-label="Collapse sidebar" title="Collapse sidebar">&#171;</button>
        </div>
        <div id="sidebar-search-row">
            <div id="search-wrap">
                <input type="text" id="topic-search" placeholder="Search e.g. esse, aquilo, tenho…" autocomplete="off">
                <button id="search-clear" aria-label="Clear search" title="Clear search">&#10005;</button>
            </div>
            <div id="search-count"></div>
        </div>
        <div id="sidebar-list"></div>
    </div>
    <div id="main-col">
        <div id="content-panel">
            <div id="content-box"></div>
        </div>
        <div id="sentence-check-panel">
            <div id="sc-header">
                <span>&#9997;&#65039; Check a sentence (Portuguese)</span>
                <span id="sc-toggle-icon">&#9656;</span>
            </div>
            <div id="sc-body">
                <div id="sc-row">
                    <textarea id="sc-input" rows="2" placeholder="Type a Portuguese sentence to check…"></textarea>
                    <button id="sc-check-btn">Check</button>
                </div>
                <div id="sc-result"></div>
            </div>
        </div>
    </div>
</div>

<div id="topic-tooltip"></div>

<div id="bottom-nav">
    <button id="menuBtn" title="Topics list">&#9776;</button>
    <button id="prevBtn" aria-label="Previous topic" title="Previous">&#8592;<span class="nav-label"> Prev</span></button>
    <span id="counter">1 / 1</span>
    <button id="nextBtn" aria-label="Next topic" title="Next"><span class="nav-label">Next </span>&#8594;</button>
    <button id="fsBtn" title="Full screen / reading mode">&#9974;</button>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────────────────
// Raw GitHub base URL for topic files. Each entry below fetches
// BASE_URL + slug + ".html" and drops that HTML straight into the page.
const BASE_URL = "https://raw.githubusercontent.com/nerdysrisha/vidyarambha/main/docs/subjects/pt/";

// ── TOPIC LIST (edit labels/slugs here as needed) ────────────────────────────
const topics = [
	["00-credits",                         "Créditos / Credits",
		"Course credits and acknowledgements.",
		"credits, créditos, curso de língua portuguesa, professor, shiv kumar singh, casa da índia, oriente, lisboa, sobre este curso, aviso, disclaimer"],
    ["00-introduction",                    "Introdução — Identificação pessoal",
        "Opening lesson: basic personal identification (name, greetings, first phrases).",
        "chamo-me, sou da, sou de, falo português, falo inglês, moro em, trabalho na, trabalho num, tenho anos, não sou casado, os meus pais vivem, alfabeto português, pronúncia, letra, identificação pessoal"],
    ["01-artigos",                         "1. Artigos",
        "Definite articles: o / a / os / as (\"the\").",

    ["01b-artigo-indefinido-genero-numero", "1b. Artigo indefinido, género, número, demonstrativos e cores",
        "Indefinite articles (a/an), noun gender & number, intro to demonstratives, and colors.",
        "isto, isso, aquilo, branco, branca, brancos, brancas, verde, verdes, azul, azuis, cor de rosa, de, da, do, artigo indefinido e género dos nomes, número dos nomes, demonstrativos invariáveis, cores, preposições e adjetivos, uso dos artigos"],
    ["02-verbos-basicos",                  "2. Verbos básicos",
        "A first set of essential everyday verbs.",
        "ser, estar, ter, há, sou, és, é, somos, são, estou, estás, está, estamos, estão, tenho, tens, tem, temos, têm"],
    ["03-ser-usos-principais",             "3. Ser — usos principais",
        "Main uses of \"ser\" (to be) — identity, origin, characteristics — permanent/inherent states.",
        "ser, indiano, italiano, professor, médico, casado, solteiro, sou de faro, é de lisboa, é do professor, é da maria, uma hora, duas horas, de madeira, de vidro, em portugal, em moçambique, o joão, a maria, inteligente, salgada, nacionalidade, profissão, estado civil, origem — ser de, posse — ser de, tempo cronológico, matéria — ser de, localização geográfica, identidade nome, características"],
    ["04-estar-usos-principais",           "4. Estar — usos principais",
        "Main uses of \"estar\" (to be) — location, temporary states, feelings.",
        "estar, em casa, no trabalho, cansado, doente, calor, frio, com fome, com sede, aberta, quente, como está?, estou bem, já está, ainda não, localização, situação temporária, tempo meteorológico, estar com + nome, estado condição, cumprimentar perguntar como alguém está, já está? — situação concluída"],
    ["05-ser-vs-estar",                    "5. Ser vs. estar",
        "Direct comparison: when to use \"ser\" vs \"estar\" for \"to be\".",
        "ser, estar, ela é loura, ele é inteligente, o vestido é novo, a água do mar é salgada, o limão é azedo, hoje estou cansado, a sopa está salgada, o leite não está bom está azedo, o vestido está roto, ele é de lisboa mas agora está no porto, são 10 horas da manhã e já está tanto calor"],
    ["05b-nacionalidades-verbos-ar-estar",  "5b. Nacionalidades, verbos -ar e estar",
        "Nationalities, regular -ar verb conjugation, more practice with estar.",
        "inglês, inglesa, italiano, italiana, espanhol, espanhola, alemão, alemã, belga, ingleses, inglesas, italianos, italianas, espanhóis, espanholas, alemães, alemãs, belgas, eu falo, tu falas, você ele ela fala, nós falamos, vocês eles elas falam, eu estou, tu estás, você ele ela está, nós estamos, vocês eles elas estão, género e número das nacionalidades, presente do indicativo verbos -ar, presente do indicativo estar, ser e estar"],
    ["06-ter",                             "6. Ter (+ Há)",
        "The verb \"ter\" (to have) and the impersonal \"há\" (there is/are).",
        "ter, tenho, tens, tem, temos, têm, tenho fome, tenho sede, tu tens fome?, ele tem sede, estou com fome, estou com sede, eles estão com fome, há, há um carro, há um rapaz na rua, há 20 rapazes na rua, há 13 pessoas na sala, há dinheiro na carteira"],
    ["07-palavras-de-tempo",               "7. Palavras de tempo",
        "Time-related vocabulary: days, months, telling time, time expressions.",
        "manhã, tarde, noite, madrugada, de manhã, à tarde, à noite, segunda-feira, terça-feira, quarta-feira, quinta-feira, sexta-feira, sábado, domingo, hoje, amanhã, depois de amanhã, ontem, anteontem, fim de semana, férias, feriados, bom fim de semana, boas férias, bom feriado, zero, um, dois, três, quatro, cinco, seis, sete, oito, nove, dez, onze, doze, treze, catorze, quinze, dezasseis, dezassete, dezoito, dezanove, vinte, vinte e um, trinta, quarenta, cinquenta, sessenta, setenta, oitenta, noventa, cem, cento, duzentos, trezentos, mil, partes do dia, dias da semana, outros dias e referências de tempo, fim de semana férias feriados, números cardinais"],
    ["08-antes-depois",                    "8. Antes / depois",

        "antes de, depois de, antes de sair fecho a porta, depois de comer lavo os dentes, chegámos antes das nove, ele saiu depois de mim, antes do trabalho vou ao ginásio, depois da reunião vamos almoçar"],
    ["09-expressoes",                      "9. Expressões",
        "Common everyday expressions and idioms.",
        "bom dia, boa tarde, boa noite, olá, adeus, até logo, até amanhã, por favor, obrigado/a, desculpa, com licença, muito prazer, boa quinta-feira, boa viagem, boa sorte, boa reunião, boa conversa, bom trabalho, bom almoço, bom sábado, bom fim de semana, bom sonho, abra a porta por favor, pode repetir por favor, pode repetir se faz favor, como está?, como estás?, estou bem obrigado/a, e consigo?, e contigo?, tudo bem?, tudo bem obrigado/a, muito prazer em conhecê-lo, muito prazer em conhecê-la, igualmente, para mim também, já está?, ainda não, é tudo?, ainda há mais, porquê?, porque..., também, está bem, tá bem, saudações e despedidas, votos de boa sorte, pedidos educados, perguntar responder como está, conhecer alguém, expressões úteis do dia a dia"],
    ["10-tipos-de-verbos",                 "10. Tipos de verbos",
        "Verb categories/conjugation groups (-ar, -er, -ir) overview.",

// ── STATE ─────────────────────────────────────────────────────────────────
let currentIndex = 0;
const sidebarList = document.getElementById("sidebar-list");
const contentBox  = document.getElementById("content-box");
const counterEl   = document.getElementById("counter");
const tooltipEl   = document.getElementById("topic-tooltip");

// strip accents + lowercase, so "esse" also matches "essa", "és", etc.
function normalizeSearch(s) {
    return s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
}

// build sidebar once, listing every topic
const topicEls = topics.map(([slug, label, desc, keywords], i) => {
    const item = document.createElement("div");
    item.className = "topic-item";
    item.textContent = label;
    item.dataset.index = i;
    item.dataset.search = normalizeSearch(label + " " + (keywords || ""));
    item.addEventListener("click", () => loadTopic(i));

    item.addEventListener("mouseenter", () => {
        tooltipEl.textContent = desc || "";
        if (!desc) return;
        const rect = item.getBoundingClientRect();
        tooltipEl.style.left = (rect.right + 10) + "px";
        tooltipEl.style.top  = (rect.top + rect.height / 2) + "px";
        tooltipEl.classList.add("visible");
    });
    item.addEventListener("mouseleave", () => {
        tooltipEl.classList.remove("visible");
    });

    sidebarList.appendChild(item);
    return item;
});

const isMobile = () => window.matchMedia("(max-width: 700px)").matches;
// previous topic (from the "nothing opened yet" state on a phone, go to the last one)
const goPrev = () => loadTopic(currentIndex < 0 ? topics.length - 1 : currentIndex - 1);

function loadTopic(i) {
    currentIndex = ((i % topics.length) + topics.length) % topics.length;
    const [slug] = topics[currentIndex];
    if (isMobile()) setSidebarCollapsed(true);   // phone: hide the list after picking a topic

    topicEls.forEach((el, idx) => el.classList.toggle("active", idx === currentIndex));
    topicEls[currentIndex].scrollIntoView({ block: "nearest" });

    counterEl.textContent = (currentIndex + 1) + " / " + topics.length;
    contentBox.innerHTML = '<div style="color:#666;padding:10px 0;">Loading…</div>';

    // stop any speech from the previous topic before swapping content
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();

    fetch(BASE_URL + slug + ".html")
        .then(r => { if (!r.ok) throw new Error("HTTP " + r.status + " for " + slug + ".html"); return r.text(); })
        .then(html => { contentBox.innerHTML = '<div class="page-canvas">' + html + '</div>'; contentBox.scrollTop = 0; contentBox.scrollLeft = 0; })
        .catch(err => {
            contentBox.innerHTML = '<div style="color:#f66;padding:12px 0;">' + err.message + '</div>';
        });
}

document.getElementById("prevBtn").onclick = goPrev;
document.getElementById("nextBtn").onclick = () => loadTopic(currentIndex + 1);

// ── SEARCH ───────────────────────────────────────────────────────────────
const searchInput = document.getElementById("topic-search");
const searchCount = document.getElementById("search-count");
const searchWrap  = document.getElementById("search-wrap");
const searchClear = document.getElementById("search-clear");

function runSearch() {
    const q = normalizeSearch(searchInput.value.trim());
    searchWrap.classList.toggle("has-text", searchInput.value.length > 0);

    if (!q) {
        topicEls.forEach(el => el.classList.remove("search-match", "search-dim"));
        searchCount.textContent = "";
        return;
    }

    let matches = 0;
    topicEls.forEach(el => {
        const isMatch = el.dataset.search.includes(q);
        el.classList.toggle("search-match", isMatch);
        el.classList.toggle("search-dim", !isMatch);
        if (isMatch) matches++;
    });

    searchCount.textContent = matches === 0
        ? "No topics found"
        : matches + " topic" + (matches === 1 ? "" : "s") + " found";
}

searchInput.addEventListener("input", runSearch);

searchClear.addEventListener("click", () => {
    searchInput.value = "";
    runSearch();
    searchInput.focus();
});

searchInput.addEventListener("keydown", e => {
    if (e.key === "Escape" && searchInput.value) {
        e.stopPropagation();
        searchInput.value = "";
        runSearch();
    }
});

// ── SIDEBAR COLLAPSE ─────────────────────────────────────────────────────
const sidebarEl   = document.getElementById("sidebar");
const toggleBtn    = document.getElementById("sidebar-toggle");
const menuBtn      = document.getElementById("menuBtn");
function setSidebarCollapsed(collapsed) {
    sidebarEl.classList.toggle("collapsed", collapsed);
    toggleBtn.innerHTML = collapsed ? "&#187;" : "&#171;";
    toggleBtn.title = collapsed ? "Expand sidebar" : "Collapse sidebar";
    tooltipEl.classList.remove("visible");
    document.body.classList.toggle("side-open", !collapsed);   // only has an effect on phones (see CSS)
    menuBtn.classList.toggle("open", !collapsed);
}
toggleBtn.addEventListener("click", () => setSidebarCollapsed(!sidebarEl.classList.contains("collapsed")));
menuBtn.addEventListener("click",   () => setSidebarCollapsed(!sidebarEl.classList.contains("collapsed")));

// Rotating / resizing from phone to desktop width: bring the sidebar back
window.matchMedia("(max-width: 700px)").addEventListener("change", e => {
    if (!e.matches) setSidebarCollapsed(false);
});

// ── FULLSCREEN / READING MODE (button is phone-only) ────────────────────
const fsBtn = document.getElementById("fsBtn");
fsBtn.addEventListener("click", () => {
    if (!document.fullscreenElement) {
        const el = document.documentElement;
        if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    } else {
        document.exitFullscreen().catch(() => {});
    }
});

    fsBtn.innerHTML = on ? "&#10005;" : "&#9974;";
    fsBtn.title = on ? "Exit full screen" : "Full screen / reading mode";
});

document.addEventListener("keydown", e => {
    if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
    if (e.key === "ArrowRight") { e.preventDefault(); loadTopic(currentIndex + 1); }
    if (e.key === "ArrowLeft")  { e.preventDefault(); goPrev(); }
});

// ── TEXT-TO-SPEECH (Portuguese) ──────────────────────────────────────────────
// Lesson HTML fetched into #content-box is inserted via innerHTML, so any
// <script> tags embedded in those files never execute. This engine lives in
// the shell instead — registered ONCE, delegated on #content-box, which
// persists across topic swaps (only its innerHTML changes). Lesson files just
// need the markup: a button.spk-btn inside an element carrying data-pt="...".
function pickPortugueseVoice() {
    const voices = window.speechSynthesis.getVoices();
    return (
        voices.find(v => v.lang === "pt-PT") ||
        voices.find(v => v.lang && v.lang.indexOf("pt") === 0) ||
        null
    );
}

function speakPortuguese(text, btn) {
    if (!("speechSynthesis" in window)) {
        alert("Speech is not supported in this browser.");
        return;
    }
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "pt-PT";
    utter.rate = 0.6; // slower for clearer learning
    const voice = pickPortugueseVoice();
    if (voice) utter.voice = voice;

    document.querySelectorAll(".spk-btn.speaking").forEach(b => b.classList.remove("speaking"));
    if (btn) {
        btn.classList.add("speaking");
        utter.onend = () => btn.classList.remove("speaking");
        utter.onerror = () => btn.classList.remove("speaking");
    }
    window.speechSynthesis.speak(utter);
}

if ("speechSynthesis" in window) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

contentBox.addEventListener("click", e => {
    const btn = e.target.closest(".spk-btn");
    if (!btn) return;
    const wrap = btn.closest("[data-pt]");
    if (!wrap) return;
    e.preventDefault();
    speakPortuguese(wrap.getAttribute("data-pt"), btn);
});

// ── SENTENCE CHECKER (LanguageTool free public API) ──────────────────────────
// Free, no API key. Rate limit: 20 requests/min per IP. See:
// https://languagetool.org/http-api
const LT_ENDPOINT = "https://api.languagetool.org/v2/check";

const scPanel   = document.getElementById("sentence-check-panel");
const scHeader  = document.getElementById("sc-header");
const scInput   = document.getElementById("sc-input");
const scBtn     = document.getElementById("sc-check-btn");
const scResult  = document.getElementById("sc-result");

scHeader.addEventListener("click", () => {
    const expanded = scPanel.classList.toggle("expanded");
    if (expanded) scInput.focus();
});

function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
}

async function checkSentence() {
    const text = scInput.value.trim();
    if (!text) return;

    scBtn.disabled = true;
    scBtn.textContent = "Checking…";
    scResult.innerHTML = "";

    try {
        const params = new URLSearchParams({
            text: text,
            language: "pt-PT"
        });

        const res = await fetch(LT_ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: params.toString()
        });

        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        const matches = data.matches || [];

        if (matches.length === 0) {
            scResult.innerHTML = '<div id="sc-ok">&#10003; Looks correct!</div>';
            return;
        }

        // Build the list of issues (in original order)
        let html = "";
        matches.forEach(m => {
            const errFragment = text.substring(m.offset, m.offset + m.length);
            const suggestions = (m.replacements || []).slice(0, 3).map(r => r.value).filter(Boolean);
            html += '<div class="sc-error-item">';
            html += '<div class="sc-error-msg">' + escapeHtml(m.message) + '</div>';
            if (suggestions.length) {
                html += '<div class="sc-error-suggest">&#8594; ' + suggestions.map(escapeHtml).join(", ") + '</div>';
            }
            html += '<div class="sc-error-context">"' + escapeHtml(errFragment) + '" in: ' + escapeHtml(m.context.text) + '</div>';
            if (m.rule && m.rule.id) {
                const ruleUrl = "https://community.languagetool.org/rule/show/" + encodeURIComponent(m.rule.id) + "?lang=pt-PT";
                const categoryName = m.rule.category && m.rule.category.name ? m.rule.category.name : "Rule";
                html += '<div class="sc-error-rule">' + escapeHtml(categoryName) +
                    ' — <a href="' + ruleUrl + '" target="_blank" rel="noopener">' + escapeHtml(m.rule.id) + '</a></div>';
            }
            html += '</div>';
        });

        // Build a best-effort auto-corrected sentence (apply first suggestion
        // for each match, working right-to-left so offsets stay valid)
        let corrected = text;
        const sortedByOffsetDesc = [...matches].sort((a, b) => b.offset - a.offset);
        sortedByOffsetDesc.forEach(m => {
            const rep = m.replacements && m.replacements[0] && m.replacements[0].value;
            if (rep !== undefined) {
                corrected = corrected.slice(0, m.offset) + rep + corrected.slice(m.offset + m.length);
            }
        });
        if (corrected !== text) {
            html += '<div id="sc-corrected">Suggested: <b>' + escapeHtml(corrected) + '</b></div>';
        }

        scResult.innerHTML = html;
    } catch (err) {
        scResult.innerHTML = '<div class="sc-fail">Could not check sentence (' + escapeHtml(err.message) +
            '). The free LanguageTool API may be rate-limited — try again in a moment.</div>';
    } finally {
        scBtn.disabled = false;
        scBtn.textContent = "Check";
    }
}

scBtn.addEventListener("click", checkSentence);
scInput.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        checkSentence();
    }
});

// Desktop: start on Topic 0 (as before).
// Phone: show only the topic list first; nothing is opened until a topic is tapped.
if (isMobile()) {
    currentIndex = -1;
    counterEl.textContent = "– / " + topics.length;
    contentBox.innerHTML = '<div style="color:#666;padding:20px 0;text-align:center;">Select a topic from the list (&#9776;) to begin.</div>';
    document.body.classList.add("side-open");
    menuBtn.classList.add("open");
} else {
    loadTopic(0);
}
</script>
