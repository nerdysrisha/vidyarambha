<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Recorder</title>
<style>
:root{--t:0px;--l:0px;--r:0px;--b:0px;--bg:#000;--card:#000;--red:#e53935;--deep:#8e0e1a;--tx:#fde9ea;--mut:#c99aa0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif}
body{display:flex;flex-direction:column}
/* banner runs behind the camera hole; labels sit far left / far right so the camera never covers them */
header{flex:none;height:max(var(--t),46px);display:flex;justify-content:space-between;align-items:center;padding:0 calc(24px + var(--r)) 0 calc(24px + var(--l));background:#000;border-bottom:1px solid var(--red);font-size:14px;font-weight:600}
header span{max-width:38%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tm{font-variant-numeric:tabular-nums}
main{flex:1;overflow:auto;padding:16px calc(16px + var(--r)) calc(16px + var(--b)) calc(16px + var(--l));display:flex;flex-direction:column;gap:14px}
.seg{display:flex;align-items:center;justify-content:center;gap:14px;padding:4px 0}
.seg button{display:flex;align-items:center;gap:6px;padding:6px 4px;border:0;background:none;color:var(--mut);font-size:15px;font-weight:600}
.seg button.on{color:#fff}
.seg button.on svg{color:#3b82f6}
.seg button:disabled{opacity:.6}
.seg svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.seg .sw{flex:none;position:relative;width:46px;height:26px;padding:0;border-radius:13px;border:1.5px solid #3b82f6;background:#000}
.seg .sw::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#3b82f6;transition:transform .25s ease}
.seg.s .sw::after{transform:translateX(20px)}
.fade{animation:fin 2s ease both}
@keyframes fin{from{opacity:0}to{opacity:1}}
.card{background:#000;border:1px solid var(--red);border-radius:16px;padding:4px 14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;font-size:15px}
.row+.row{border-top:1px solid #4a1a22}
.opts{background:#000;border:1px solid var(--red);border-radius:16px;padding:4px 16px}
.row.col{flex-direction:column;align-items:stretch;gap:10px}
.row.col>label{color:var(--mut);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px 22px}
.chips label{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--tx)}
input[type=radio]{width:20px;height:20px;margin:0;accent-color:var(--red)}
.opts .row+.row{border-top:1px solid #4a1a22}
.row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
select,input[type=text]{background:var(--bg);color:var(--tx);border:1px solid #6d2a33;border-radius:8px;padding:10px;font-size:16px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--red)}

#msg{text-align:center;color:#ffb4b8;font-size:14px;word-break:break-word}
#msg:empty{display:none}
#go{position:absolute;z-index:2;right:16px;bottom:14px;width:60px;height:60px;border-radius:50%;border:2px solid var(--red);background:#000;color:#fff;font-size:12px;font-weight:700;box-shadow:0 0 14px #e5393577;animation:b 2.2s infinite}
#go.rec{border-color:#ff6b6b;color:#ff6b6b;animation:none}
#go:disabled{opacity:.5;animation:none}
@keyframes b{50%{box-shadow:0 0 5px #e5393533}}
.btns{display:flex;gap:10px;justify-content:center}
.sm{padding:10px 20px;border-radius:22px;border:1px solid var(--red);background:none;color:var(--tx);font-size:15px}
.pri{padding:14px;border:2px solid var(--red);border-radius:12px;background:#000;color:#fff;font-size:17px;font-weight:600}
.sec{padding:12px;border:1px solid var(--red);border-radius:12px;background:none;color:var(--tx);font-size:15px}
.hint{color:var(--mut);font-size:12px;text-align:center;margin:4px 0 0}

/* stage: ONE fixed panel. Options fade out; live view + round buttons fade in. Everything stays inside the border */
.stage{position:relative;flex:none;height:240px;padding:0;overflow:hidden}
.pn,.live{position:absolute;inset:0;transition:opacity .4s ease}
.pn{padding:10px 16px 14px;overflow:auto;display:flex;flex-direction:column;opacity:0;pointer-events:none}
.pn.on{opacity:1;pointer-events:auto}
.pn .row{padding:9px 0}
.pn .chips{gap:8px 18px}
.live{opacity:0;pointer-events:none}
.live canvas{position:absolute;left:0;top:0;width:100%;height:150px;display:block}
.live .mc{position:absolute;left:50%;top:75px;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center}
.live .mc svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.live .cap{position:absolute;left:0;right:0;top:142px;text-align:center;font-size:13px;color:var(--mut)}
#vt{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
body.rv .pn{opacity:0;pointer-events:none}
body.rv .live{opacity:1}

/* round buttons sit inside the panel: START/STOP bottom-right, PAUSE / DISCARD / MUTE fade in beside */
#pz,#dz,#sz,#mz{position:absolute;z-index:2;bottom:14px;width:52px;height:52px;border-radius:50%;border:2px solid var(--red);background:#000;color:#fff;font-size:9px;font-weight:700;opacity:0;pointer-events:none;transform:scale(.8);transition:opacity .4s ease,transform .4s ease,background .2s,left .3s ease}
#pz{left:16px}
#dz{left:76px}
#sz{left:136px;background:var(--red)}
#mz{left:196px}
#dz.arm{background:var(--red)}
body.rv #pz,body.rv #dz,body.rv #sz,body.rv #mz,body.dn #sz,body.dn #dz{opacity:1;pointer-events:auto;transform:none}
body.dn #sz{left:16px}
body.dn #dz{left:76px}
/* 'stopped' view: same panel, nothing to leave */
.done{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:22px 16px 0;gap:6px;text-align:center;opacity:0;pointer-events:none;transition:opacity .4s ease}
.done .dk{font-size:15px;color:var(--mut)}
.done .dd{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;min-height:40px}
.done .dm{font-size:13px;color:var(--mut);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.done .dh{font-size:12px;color:var(--mut)}
body.dn .done{opacity:1}
body.dn .pn,body.dn .live{opacity:0;pointer-events:none}
body.dn #sg{opacity:.35;pointer-events:none}
#ctl{display:none!important}
#sg,#un,#msg,.lst{transition:opacity .35s ease}
body.rv #sg,body.rv #un,body.rv #msg,body.rv .lst{opacity:0;pointer-events:none}

/* recordings list */
.lst{flex:none;padding:0 14px}
.lh{display:flex;justify-content:space-between;align-items:center;padding:14px 0;font-size:15px;cursor:pointer}
.lh .cv{display:inline-block;color:var(--mut);transition:transform .3s ease;margin-left:6px}
.lst.open .cv{transform:rotate(180deg)}
.lst:not(.open) #hc{display:none}
.lnk{background:none;border:0;color:var(--mut);font-size:13px;padding:4px}
#hl{max-height:0;overflow:hidden;transition:max-height .4s ease}
.lst.open #hl{max-height:46vh;overflow:auto;padding-bottom:8px}
.hi{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid #4a1a22;cursor:pointer}
.hi:first-child{border-top:0}
.hi:active{background:#1a0508}
.ic{flex:none;width:38px;height:38px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:20px}
.mt{flex:1;min-width:0}
.nm{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{flex:none;color:var(--mut);font-size:22px}
.empty{color:var(--mut);font-size:14px;text-align:center;padding:28px 0}

/* full-screen panels: save sheet and folder browser */
.ov{position:fixed;left:0;right:0;bottom:0;top:max(var(--t),46px);background:var(--bg);z-index:5;display:flex;flex-direction:column}
.pad{flex:1;overflow:auto;padding:16px calc(16px + var(--r)) calc(16px + var(--b)) calc(16px + var(--l));display:flex;flex-direction:column;gap:12px}
.pad h2{margin:0;font-size:20px}
.pad label{color:var(--mut);font-size:13px}
.dir{background:#000;border:1px solid var(--red);border-radius:10px;padding:12px;word-break:break-all;font-size:14px}
.bar{display:flex;gap:10px}.bar button{flex:1}
#list{flex:1;overflow:auto;min-height:120px}
.fr{padding:14px 8px;border-bottom:1px solid #4a1a22;font-size:16px}
#perm{background:#000;border:1px solid var(--red);border-radius:10px;padding:12px;font-size:14px;display:flex;flex-direction:column;gap:10px}
#sm{color:#ffb4b8;font-size:14px}
</style>
</head>
<body>
<header><span>● Recorder</span><span id="tm">Ready</span></header>

<main>
  <div class="seg" id="sg">
    <button id="tv" onclick="tab('voice')"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span>Voice</span></button>
    <button class="sw" id="sw" aria-label="Switch between Voice and Screen" onclick="tab(mode === 'voice' ? 'screen' : 'voice')"></button>
    <button id="ts" onclick="tab('screen')"><span>Screen</span><svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2.5"/><circle cx="12" cy="12" r="3"/></svg></button>
  </div>

  <div class="card stage" id="stage">
    <div class="pn on" id="ov1">
      <div class="row col"><label>Quality</label>
        <div class="chips" id="vq"><label><input type="radio" name="vq" value="std">Standard</label><label><input type="radio" name="vq" value="hq">High</label></div></div>
      <div class="hint">Standard: mono, smaller file · High: stereo, clearer</div>
    </div>
    <div class="pn" id="os">
      <div class="row"><label for="mic">Record microphone</label><input type="checkbox" id="mic"></div>
      <div class="row col"><label>Video quality</label>
        <div class="chips" id="sq"><label><input type="radio" name="sq" value="720">720p</label><label><input type="radio" name="sq" value="1080">1080p</label><label><input type="radio" name="sq" value="max">Full Screen</label></div></div>
      <div class="row col"><label>Frame rate</label>
        <div class="chips" id="fps"><label><input type="radio" name="fps" value="30">30 fps</label><label><input type="radio" name="fps" value="60">60 fps</label></div></div>
    </div>
    <div class="live" id="vz">
      <div id="vt">00:00</div>
      <canvas id="wv"></canvas>
      <div class="mc"><svg id="icV" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><svg id="icS" viewBox="0 0 24 24" style="display:none"><rect x="6" y="2" width="12" height="20" rx="2.5"/><circle cx="12" cy="12" r="3"/></svg></div>
      <div class="cap" id="vcap"></div>
    </div>
    <div class="done" id="dn">
      <div class="dk" id="dnKind">Recording stopped</div>
      <div class="dd" id="dnDur"></div>
      <div class="dm" id="dnName"></div>
      <div class="dh">Save puts it in Downloads</div>
    </div>
    <button id="pz">PAUSE</button>
    <button id="dz">DISCARD</button>
    <button id="sz">SAVE</button>
    <button id="mz" hidden>MUTE</button>
    <button id="go">START</button>
  </div>

  <div class="btns" id="ctl" hidden><button class="sm" id="ps" hidden>Pause</button><button class="sm" id="mu" hidden>🎤 Mute</button></div>
  <div id="msg"></div>

  <div class="card" id="un" hidden>
    <div class="row"><b>Not saved yet</b></div>
    <div id="unl"></div>
  </div>

  <div class="card lst" id="lst">
    <div class="lh" id="lh"><b>Recordings <span id="hn" style="color:var(--mut);font-weight:400"></span></b><span><button class="lnk" id="hc" hidden>Clear list</button><span class="cv">▾</span></span></div>
    <div id="hl"></div>
  </div>

</main>

<!-- save sheet -->
<div class="ov" id="sheet" hidden><div class="pad">
  <h2>Save recording</h2>
  <label for="fn">File name</label>
  <input type="text" id="fn" autocomplete="off">
  <label>Save in</label>
  <div class="dir" id="dirTxt"></div>
  <button class="sec" id="chg">Choose folder</button>
  <div id="perm" hidden>Allow file access so the app can save into your folders.<button class="sec" id="allow">Allow access</button></div>
  <button class="pri" id="sv">Save</button>
  <button class="sec" id="later">Save later</button>
  <button class="sec" id="dc">Discard</button>
  <div id="sm"></div>
</div></div>

<!-- folder browser -->
<div class="ov" id="br" hidden><div class="pad">
  <div class="bar"><button class="sec" id="up">⬆ Up</button><button class="sec" id="nf">＋ New folder</button></div>
  <div class="dir" id="bpath"></div>
  <div class="bar" id="nfrow" hidden><input type="text" id="nfn" placeholder="Folder name" style="flex:2"><button class="sec" id="nfok">Create</button></div>
  <div id="list"></div>
  <button class="pri" id="use">Use this folder</button>
  <button class="sec" id="bc">Cancel</button>
</div></div>

<script>
const A = window.AndroidRec, $ = id => document.getElementById(id);
let after = '', auto = '', doneName = '', lastSec = 0;
let mode = 'voice', cur = 'idle', muted = false, P = {}, sh = { name: '', dir: '' }, bp = null, roots = [];
try { P = JSON.parse(localStorage.getItem('rec') || '{}'); } catch (e) {}
const D = { mic: true, sq: '1080', fps: '30', vq: 'hq' };
for (const k in D) if (P[k] === undefined) P[k] = D[k];
const sv = () => { try { localStorage.setItem('rec', JSON.stringify(P)); } catch (e) {} };

$('mic').checked = P.mic;
$('mic').onchange = () => { P.mic = $('mic').checked; sv(); };

['sq', 'fps', 'vq'].forEach(id => {
  document.querySelectorAll('input[name=' + id + ']').forEach(r => {
    r.checked = r.value === String(P[id]);
    r.onchange = () => { if (r.checked) { P[id] = r.value; sv(); } };
  });
});

function tab(m) {
  mode = m;
  $('tv').classList.toggle('on', m === 'voice');
  $('ts').classList.toggle('on', m === 'screen');
  $('sg').classList.toggle('s', m === 'screen');
  $('ov1').classList.toggle('on', m === 'voice');
  $('os').classList.toggle('on', m === 'screen');
}
const fmt = s => { const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return (h ? h + ':' : '') + String(m).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };

/* ---------- live status ---------- */
let rvOn = false;
function setRv(on) {                                  // options fade out / live view fades in; recordings fold away
  if (on === rvOn) return; rvOn = on;
  document.body.classList.toggle('rv', on);
  if (on) $('lst').classList.remove('open');
}
function poll() {
  if (!A) return;
  const p = A.status().split('|'), sec = +p[1], ps = p[2] === '1', last = p.slice(5).join('|');
  cur = p[0]; muted = p[3] === '1';
  const on = cur === 'voice' || cur === 'screen', busy = cur === 'saving';
  if (on && cur !== mode) tab(cur);
  if (on) lastSec = sec;
  $('go').textContent = on ? 'STOP' : doneName ? 'NEW' : 'START';
  $('go').classList.toggle('rec', on);
  $('go').disabled = busy;
  $('ps').hidden = !on; $('ps').textContent = ps ? 'Resume' : 'Pause';
  $('mu').hidden = !(cur === 'screen' && P.mic); $('mu').textContent = muted ? '🔇 Unmute' : '🎤 Mute';
  $('ctl').hidden = $('ps').hidden && $('mu').hidden;
  $('tm').textContent = on ? (ps ? '⏸ ' : '● ') + fmt(sec) : busy ? 'Saving…' : 'Ready';
  const rv = on || busy;                              // Voice and Screen share the same recording view
  setRv(rv);
  $('icV').style.display = mode === 'screen' ? 'none' : '';
  $('icS').style.display = mode === 'screen' ? '' : 'none';
  $('mz').hidden = !(rv && cur === 'screen' && P.mic);
  $('mz').textContent = muted ? 'UNMUTE' : 'MUTE';
  $('vt').textContent = fmt(sec || 0);
  $('pz').textContent = ps ? 'RESUME' : 'PAUSE';
  document.querySelectorAll('.seg button,main input').forEach(e => e.disabled = on || busy);
  if (!on && !busy && last) {
    A.ack();
    if (last.startsWith('done|')) {
      const nm = last.slice(5), act = after; after = '';
      if (act === 'discard') { A.discard(nm); $('msg').textContent = 'Recording discarded'; loadPending(); }
      else if (act === 'save') { loadPending(); autoSave(nm); }
      else { loadPending(); showDone(nm); }
    } else if (last.startsWith('saved|')) {               // saved quietly by a long press on the dot
      const sp = last.slice(6), k = sp.lastIndexOf('/');
      after = ''; $('msg').textContent = 'Saved: ' + sp; addHist(sp.slice(k + 1), sp.slice(0, k)); loadPending();
    } else { after = ''; $('msg').textContent = last === 'discarded' ? 'Recording discarded' : last; }
  }
}

$('go').onclick = () => {
  if (!A) { $('msg').textContent = 'Open this inside the Android app.'; return; }
  if (cur === 'voice' || cur === 'screen') { stopWith('stopped'); return; }
  if (doneName) { exitDone(); return; }                // NEW: back to the options; the file stays under "Not saved yet"
  $('msg').textContent = '';
  A.start(mode, JSON.stringify(mode === 'screen' ? { mic: P.mic, q: P.sq, fps: +P.fps } : { q: P.vq }));
};
$('ps').onclick = () => { if ($('ps').textContent === 'Pause') A.pause(); else A.resume(); setTimeout(poll, 250); };
$('mu').onclick = () => { A.mute(!muted); setTimeout(poll, 250); };

/* ---------- voice listening waves ---------- */
const cv = $('wv'), cx = cv.getContext('2d');
let lvT = 0, lvS = 0, ph = 0;
setInterval(() => {                                   // mic level 0-100 from the service, ~10x per second
  if (!A || cur !== 'voice') { lvT = 0; return; }
  lvT = +A.status().split('|')[4] || 0;
}, 100);
function frame(t) {
  requestAnimationFrame(frame);
  if (!rvOn) return;                                  // only draw while recording
  const d = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  if (cv.width !== Math.round(W * d) || cv.height !== Math.round(H * d)) { cv.width = Math.round(W * d); cv.height = Math.round(H * d); }
  cx.setTransform(d, 0, 0, d, 0, 0);
  cx.clearRect(0, 0, W, H);
  if (mode === 'screen') {                            // screen: pulsing rings instead of voice waves
    const pr = $('ps').textContent === 'Resume';
    for (let k = 0; k < 3; k++) {
      const q = pr ? k / 3 : ((t / 1800 + k / 3) % 1);
      cx.beginPath(); cx.arc(W / 2, H / 2, 24 + q * 34, 0, 7);
      cx.strokeStyle = 'rgba(229,57,53,' + ((1 - q) * (pr ? .25 : .6)) + ')'; cx.lineWidth = 2; cx.stroke();
    }
    $('vcap').textContent = pr ? 'Paused' : cur === 'saving' ? 'Saving…' : 'Recording your screen';
    return;
  }
  const on = cur === 'voice', pz = on && $('ps').textContent === 'Resume', live = on && !pz;
  const tgt = live ? lvT / 100 : 0;
  lvS += (tgt - lvS) * (tgt > lvS ? .35 : .12);       // quick rise, slow fall
  const br = (Math.sin(t / 700) + 1) / 2;             // breathing 0..1
  const amp = live ? .05 + lvS * .95 : pz ? 0 : .03 + br * .04;
  ph += .05 + lvS * .12;
  const m = H / 2, rg = 26 + (live ? lvS * 30 : br * 4);
  const g = cx.createRadialGradient(W / 2, m, 20, W / 2, m, rg + 12);
  g.addColorStop(0, 'rgba(229,57,53,.45)'); g.addColorStop(1, 'rgba(229,57,53,0)');
  if (!pz) { cx.fillStyle = g; cx.beginPath(); cx.arc(W / 2, m, rg + 12, 0, 7); cx.fill(); }
  for (let i = 0; i < 3; i++) {
    cx.beginPath();
    for (let x = 0; x <= W; x += 3) {
      const env = Math.pow(Math.sin(Math.PI * x / W), 2);
      const y = m + Math.sin(x / (26 + i * 14) + ph * (1 + i * .35) + i * 2) * amp * (m - 30) * env * (1 - i * .25);
      x ? cx.lineTo(x, y) : cx.moveTo(x, y);
    }
    cx.strokeStyle = ['#ff6b6b', '#e53935', '#8e0e1a'][i];
    cx.globalAlpha = 1 - i * .25; cx.lineWidth = 2.2 - i * .4; cx.stroke();
  }
  cx.globalAlpha = 1;
  $('vcap').textContent = pz ? 'Paused' : cur === 'saving' ? 'Saving…' : !on ? 'Press START, then speak here' : lvS < .06 ? 'Listening… speak now' : 'Capturing your voice';
}
requestAnimationFrame(frame);

/* ---------- voice: pause / stop / save to Downloads ---------- */
$('mz').onclick = () => { A.mute(!muted); setTimeout(poll, 250); };
const stopWith = a => { after = a; A.stop(); setTimeout(poll, 600); };
function showDone(nm) {                               // recording has ended: the same panel offers SAVE / DISCARD
  doneName = nm;
  $('dnKind').textContent = /\.mp4$/i.test(nm) ? 'Screen recording stopped' : 'Voice recording stopped';
  $('dnDur').textContent = lastSec ? fmt(lastSec) : '';
  $('dnName').textContent = nm;
  document.body.classList.add('dn');
  $('go').textContent = 'NEW';
}
function exitDone() {
  doneName = '';
  document.body.classList.remove('dn');
  $('go').textContent = 'START';
  loadPending();
}
let dzT = 0;
$('dz').onclick = () => {                              // first tap arms ("SURE?"), second tap discards
  if (cur !== 'voice' && cur !== 'screen' && !doneName) return;
  const b = $('dz');
  if (dzT) {
    clearTimeout(dzT); dzT = 0; b.textContent = 'DISCARD'; b.classList.remove('arm');
    if (doneName) { A.discard(doneName); $('msg').textContent = 'Recording discarded'; exitDone(); }
    else stopWith('discard');
    return;
  }
  b.textContent = 'SURE?'; b.classList.add('arm');
  dzT = setTimeout(() => { dzT = 0; b.textContent = 'DISCARD'; b.classList.remove('arm'); }, 3000);
};
$('sz').onclick = () => {                              // while recording: stop + save to Downloads; when stopped: save
  if (doneName) autoSave(doneName);
  else if (cur === 'voice' || cur === 'screen') stopWith('save');
};
$('pz').onclick = () => { if ($('ps').textContent === 'Pause') A.pause(); else A.resume(); setTimeout(poll, 250); };
function autoSave(nm) {
  let d = '/storage/emulated/0/Download';
  try { const dd = A.defaultDir(); if (/download/i.test(dd)) d = dd; } catch (e) {}
  if (!A.hasFiles()) { openSheet(nm); return; }       // no file access yet: use the normal save sheet
  sh.name = nm; sh.dir = d; auto = nm;
  $('fn').value = nm.replace(/\.[^.]+$/, '');
  $('msg').textContent = 'Saving…';
  A.saveTo(nm, d, $('fn').value);
}
window.addEventListener('saved', () => { auto = ''; if (doneName) exitDone(); });
window.addEventListener('recerr', e => {              // Downloads save failed: fall back to the save sheet
  if (!auto) return;
  const n = auto; auto = ''; openSheet(n); $('sm').textContent = e.detail;
});

/* ---------- save sheet ---------- */
function openSheet(name) {
  sh.name = name;
  sh.dir = localStorage.getItem('dir') || A.defaultDir();
  $('fn').value = name.replace(/\.[^.]+$/, '');
  $('dirTxt').textContent = sh.dir;
  $('sm').textContent = ''; $('sv').disabled = false;
  $('perm').hidden = A.hasFiles();
  $('sheet').hidden = false;
}
$('chg').onclick = openBr;
$('allow').onclick = () => A.requestFiles();
$('later').onclick = () => { $('sheet').hidden = true; loadPending(); };
$('dc').onclick = () => {
  if (!confirm('Delete this recording?')) return;
  A.discard(sh.name); $('sheet').hidden = true; $('msg').textContent = 'Recording discarded'; loadPending();
};
$('sv').onclick = () => {
  if (!A.hasFiles()) { $('perm').hidden = false; $('sm').textContent = 'Allow file access first.'; return; }
  $('sm').textContent = 'Saving…'; $('sv').disabled = true;
  A.saveTo(sh.name, sh.dir, $('fn').value);
};
window.addEventListener('saved', e => {
  $('sheet').hidden = true; $('sv').disabled = false;
  $('msg').textContent = 'Saved: ' + e.detail; loadPending();
  let n = String(e.detail || ''); n = n.substring(n.lastIndexOf('/') + 1);
  if (!n) n = $('fn').value + ((sh.name.match(/\.[^.]+$/) || [''])[0]);
  addHist(n, sh.dir);
});

/* ---------- folder browser ---------- */
function row(t, f) {
  const d = document.createElement('div'); d.className = 'fr'; d.textContent = t;
  if (f) d.onclick = f; $('list').appendChild(d);
}
function go(p) {
  bp = p; $('list').innerHTML = '';
  ['use', 'nf', 'up'].forEach(i => $(i).hidden = p === null);
  $('nfrow').hidden = true;
  $('bpath').textContent = p === null ? 'Choose storage' : p;
  if (p === null) { roots.forEach(r => row('💾 ' + r.n, () => go(r.p))); return; }
  const d = JSON.parse(A.listDir(p));
  if (!d.ok) { row('Cannot open this folder (is file access allowed?)'); return; }
  if (!d.dirs.length) row('No folders here. Use this folder, or make a new one.');
  d.dirs.forEach(n => row('📁 ' + n, () => go(p + '/' + n)));
}
function openBr() {
  if (!A.hasFiles()) { $('perm').hidden = false; $('sm').textContent = 'Allow file access first.'; return; }
  roots = JSON.parse(A.roots());
  let p = sh.dir;
  while (p && p.length > 1 && !JSON.parse(A.listDir(p)).ok) p = p.substring(0, p.lastIndexOf('/'));
  $('br').hidden = false;
  go(p && p.length > 1 ? p : null);
}
$('up').onclick = () => { if (roots.some(r => r.p === bp)) go(null); else go(bp.substring(0, bp.lastIndexOf('/'))); };
$('nf').onclick = () => { $('nfrow').hidden = !$('nfrow').hidden; };
$('nfok').onclick = () => {
  const r = A.mkdir(bp, $('nfn').value);
  if (r === 'ok') { $('nfn').value = ''; go(bp); } else $('bpath').textContent = r;
};
$('use').onclick = () => {
  sh.dir = bp; try { localStorage.setItem('dir', bp); } catch (e) {}
  $('dirTxt').textContent = bp; $('br').hidden = true;
};
$('bc').onclick = () => { $('br').hidden = true; };

/* ---------- recordings not saved yet ---------- */
function mk(tag, text, cls, fn) { const e = document.createElement(tag); e.textContent = text; if (cls) e.className = cls; if (fn) e.onclick = fn; return e; }
function loadPending() {
  if (!A) return;
  const L = JSON.parse(A.pending()), box = $('unl');
  $('un').hidden = !L.length; box.innerHTML = '';
  L.forEach(f => {
    const r = document.createElement('div'); r.className = 'row';
    r.appendChild(mk('span', f.n + ' (' + (f.s / 1048576).toFixed(1) + ' MB)'));
    const b = document.createElement('div'); b.className = 'btns';
    b.appendChild(mk('button', 'Save', 'sm', () => autoSave(f.n)));
    b.appendChild(mk('button', 'Discard', 'sm', () => { if (confirm('Discard ' + f.n + '?')) { A.discard(f.n); loadPending(); } }));
    r.appendChild(b); box.appendChild(r);
  });
}

/* ---------- saved recordings list (remembered on this phone) ---------- */
function loadHist() { try { return JSON.parse(localStorage.getItem('hist') || '[]'); } catch (e) { return []; } }
function addHist(n, d) {
  const L = loadHist();
  L.unshift({ n: n, d: d, t: Date.now() });
  try { localStorage.setItem('hist', JSON.stringify(L.slice(0, 100))); } catch (e) {}
  renderHist();
}
function openDir(d) {
  if (A && typeof A.openDir === 'function') {
    const r = A.openDir(d);
    if (r && r !== 'ok') $('msg').textContent = r;
  } else $('msg').textContent = 'Add openDir() to MainActivity and rebuild to open folders.';
}
function openRec(h) {                                      // open the saved file in the player app
  if (A && typeof A.openFile === 'function') {
    const r = A.openFile(h.d, h.n);
    if (r && r !== 'ok') $('msg').textContent = r;
  } else openDir(h.d);
}
function renderHist() {
  const L = loadHist(), box = $('hl');
  box.innerHTML = '';
  $('hc').hidden = !L.length;
  $('hn').textContent = L.length ? '· ' + L.length : '';
  if (!L.length) { box.appendChild(mk('div', 'No saved recordings yet', 'empty')); return; }
  L.forEach(h => {
    const r = document.createElement('div'); r.className = 'hi'; r.onclick = () => openRec(h);
    r.appendChild(mk('div', /\.mp4$/i.test(h.n) ? '📱' : '🎙', 'ic'));
    const m = document.createElement('div'); m.className = 'mt';
    const when = new Date(h.t).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    m.appendChild(mk('div', h.n, 'nm'));
    m.appendChild(mk('div', when + ' · ' + String(h.d || '').replace(/^\/storage\/emulated\/0/, 'Internal'), 'sub'));
    r.appendChild(m);
    const fb = mk('div', '📂', 'chev', ev => { ev.stopPropagation(); openDir(h.d); }); fb.style.padding = '8px';
    r.appendChild(fb);
    box.appendChild(r);
  });
}
$('lh').onclick = () => $('lst').classList.toggle('open');
$('hc').onclick = ev => {
  ev.stopPropagation();
  if (!confirm('Clear this list? Your files are not deleted.')) return;
  try { localStorage.removeItem('hist'); } catch (e) {}
  renderHist();
};

/* ---------- native events ---------- */
function ins(s) {                                   // top|left|right|bottom in CSS px, sent by MainActivity
  const a = s.split('|');
  ['t', 'l', 'r', 'b'].forEach((k, i) => document.documentElement.style.setProperty('--' + k, (a[i] || 0) + 'px'));
}
window.addEventListener('insets', e => ins(e.detail));
window.addEventListener('recerr', e => { $('msg').textContent = e.detail; $('sm').textContent = e.detail; $('sv').disabled = false; });
document.addEventListener('visibilitychange', () => { if (!document.hidden && A) { $('perm').hidden = A.hasFiles(); loadPending(); } });
if (A) ins(A.insets());

tab('voice');
loadPending();
renderHist();
setInterval(poll, 1000);
poll();
</script>
</body>
</html>
