const LANGS = [
    { code: "te", short: "తె", name: "తెలుగు" },
    { code: "en", short: "EN", name: "English" },
    { code: "hi", short: "हि", name: "हिन्दी" },
    { code: "fr", short: "FR", name: "Français" }

// A new language goes here.  
];
const LANG_KEY = "gitaLang";
let curLang = "te";
try { const sv = localStorage.getItem(LANG_KEY); if (LANGS.some(l => l.code === sv)) curLang = sv; } catch (e) {}

function buildVerses() {
    const NUM_N = /^\d[\d\s,\-–]*$/;
    const numbered = Array.from(contentBox.querySelectorAll(".verse-block")).filter(b => NUM_N.test((b.dataset.n || "").trim()));   // cards that count in 2/72
    contentBox.querySelectorAll(".verse-block").forEach(block => {
        if (block.dataset.built) return;
        const data = {};
        block.querySelectorAll(":scope > [data-lang]").forEach(d => {
            const sl = d.querySelector(".sl"), mn = d.querySelector(".mn");
            data[d.dataset.lang] = { sl: sl ? sl.innerHTML.trim().replace(/\s*\r?\n\s*/g, "<br>") : "", mn: mn ? mn.innerHTML.trim() : "" };   // line breaks in the shloka source become <br>
            d.remove();
        });
        if (!Object.keys(data).length) return;
        block.dataset.built = "1";
        // corner tag from data-n: "5" -> "Verse 5"; anything else (e.g. "Chapter 18 — Closing") is shown as written
        const n = (block.dataset.n || "").trim();
        const tag = document.createElement("span");
        const chM = (flatTopics[currentFlatIndex] && flatTopics[currentFlatIndex].path || "").match(/chapter(\d+)/i);   // chapter number from the file name
        tag.className = "verse-tag"; tag.textContent = NUM_N.test(n) ? (chM ? "Ch " + chM[1] + " · " : "") + (numbered.indexOf(block) + 1) + "/" + numbered.length : n;
        block.appendChild(tag);
        // shloka (one div, refilled when the language changes)
        const grid = document.createElement("div"); grid.className = "verse-grid";
        const sl = document.createElement("div"); sl.className = "sl";
        grid.appendChild(sl); block.appendChild(grid);
        // meaning tabs: one per language this verse has
        const items = LANGS.filter(l => data[l.code]);
        const box = document.createElement("div"); box.className = "mtabs";
        const bar = document.createElement("div"); bar.className = "mtab-bar"; bar.setAttribute("role", "tablist");
        box.appendChild(bar);
        const closed = document.createElement("div"); closed.className = "mtab-closed"; box.appendChild(closed);
        const tabs = {}, panels = {};
        const show = code => {   // code = language to open, null = fold back to the blank strip
            box.dataset.active = code || "";
            closed.hidden = !!code;
            items.forEach(l => {
                const on = l.code === code;
                tabs[l.code].setAttribute("aria-selected", on ? "true" : "false");
                panels[l.code].hidden = !on;
            });
        };
        items.forEach(l => {
            const tab = document.createElement("button");
            tab.type = "button"; tab.className = "mtab mtab-" + l.code; tab.setAttribute("role", "tab"); tab.textContent = l.short; tab.title = l.name; tab.setAttribute("aria-label", l.name);
            bar.appendChild(tab);
            const panel = document.createElement("div");
            panel.className = "mtab-panel"; panel.setAttribute("role", "tabpanel");
            const mn = document.createElement("div"); mn.className = "mn"; mn.dataset.lang = l.code; mn.innerHTML = '<div class="mn-in">' + data[l.code].mn + '</div>';
            panel.appendChild(mn); box.appendChild(panel);
            tabs[l.code] = tab; panels[l.code] = panel;
            tab.addEventListener("click", e => { e.stopPropagation(); show(box.dataset.active === l.code ? null : l.code); });
        });
        bar.addEventListener("keydown", e => {
            if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
            const t = Array.from(bar.children), i = t.indexOf(document.activeElement); if (i < 0) return;
            t[(i + (e.key === "ArrowRight" ? 1 : t.length - 1)) % t.length].focus(); e.preventDefault();
        });
        box.addEventListener("click", e => e.stopPropagation());   // reading a meaning must not start the audio either
        block.appendChild(box);
        // language change: refill the shloka and open that language's meaning (empty panel when this verse lacks it)
        block._apply = code => { sl.dataset.lang = code; sl.innerHTML = data[code] ? data[code].sl : ""; show(data[code] ? code : null); };
        block._apply(curLang);
    });
}

function fitVerses() {
    const all = Array.from(contentBox.querySelectorAll(".verse-block, .verse-refrain"));
    const land = window.matchMedia("(orientation: landscape) and (max-height: 520px)").matches;   // phone landscape focus mode
    const desktop = window.matchMedia("(min-width: 701px) and (min-height: 521px)").matches;       // desktop / tablet: the stacked frame, verse sized to its box
    if (!land && !desktop && !window.matchMedia("(max-width: 700px)").matches) {
        all.forEach(b => { b.style.fontSize = ""; b.style.whiteSpace = ""; });
        return;
    }
    const blocks = desktop ? all.filter(b => b.classList.contains("verse-block")) : all;   // desktop: refrain blocks keep their normal size
    all.filter(b => !blocks.includes(b)).forEach(b => { b.style.fontSize = ""; b.style.whiteSpace = ""; });
    const MAXPX = land ? 30 : (desktop ? 26 : FIT_MAX);
    const portrait = window.matchMedia("(max-width: 700px) and (orientation: portrait), (min-width: 701px) and (min-height: 521px)").matches;   // stacked frame (phone portrait, desktop, tablet)
    if (!contentBox.clientWidth) return;   // content hidden (topic list is open)
    const TEST = 20;
    blocks.forEach(b => { b.style.whiteSpace = "nowrap"; b.style.fontSize = TEST + "px"; });
    const range = document.createRange();
    const results = blocks.map(b => {
        const cs = getComputedStyle(b);
        let avail = b.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
        if (land && b.classList.contains("verse-block")) avail = contentBox.classList.contains("verse-full") ? avail - 18 : (avail - 20) / 2;   // tucked: verse takes the full width (minus room for the pill)   // landscape: verse = left half, purport = right half
        const slEl = b.querySelector(":scope > .verse-grid .sl");
        if (slEl) {   // the verse sits in a bordered box: fit its widest line to the space inside the box
            const gs = getComputedStyle(slEl.parentElement);
            avail -= parseFloat(gs.paddingLeft) + parseFloat(gs.paddingRight) + parseFloat(gs.borderLeftWidth) + parseFloat(gs.borderRightWidth);
            range.selectNodeContents(slEl);
            const tw = range.getBoundingClientRect().width;
            let f = tw > 0 ? (desktop ? Math.min(TEST * (avail / tw) * 0.98, 26) : TEST * (avail / Math.max(tw, avail)) * 0.98) : MAXPX;   // desktop: short verses may grow up to 26px
            if (portrait && b.clientHeight) {   // portrait: don't let a tall (many-line) verse take more than ~45% of the card; never below the minimum size
                const bs = getComputedStyle(b), innerH = b.clientHeight - parseFloat(bs.paddingTop) - parseFloat(bs.paddingBottom);
                const padY = parseFloat(gs.paddingTop) + parseFloat(gs.paddingBottom) + parseFloat(gs.borderTopWidth) + parseFloat(gs.borderBottomWidth);
                const lines = Math.max(1, slEl.innerHTML.split(/<br\s*\/?>/i).length);
                const lhPerPx = parseFloat(getComputedStyle(slEl).lineHeight) / TEST;     // line height per 1px of block font size
                if (lhPerPx > 0 && innerH > 0) f = Math.max(Math.min(f, (innerH * 0.45 - padY) / (lines * lhPerPx)), Math.min(f, FIT_MIN));
            }
            return f;
        }
        range.selectNodeContents(b);
        const w = range.getBoundingClientRect().width;     // width of widest line
        return w > 0 ? TEST * (avail / w) * 0.98 : MAXPX;
    });
    blocks.forEach((b, i) => {
        const fs = results[i];
        if (fs < FIT_MIN) { b.style.fontSize = FIT_MIN + "px"; b.style.whiteSpace = "normal"; }
        else { b.style.fontSize = (Math.floor(Math.min(fs, MAXPX) * 10) / 10) + "px"; }
    });
}
let fitTimer;
window.addEventListener("resize", () => { clearTimeout(fitTimer); fitTimer = setTimeout(fitVerses, 120); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitVerses);

// ── BOOKMARK + REOPEN LAST CHAPTER ──────────────────────────────────────
// ★ Double-tap (or double-click) a verse: a gold folded corner appears on it = THE bookmark (only one exists;
//   a new one replaces the old; double-tap it again to remove). It is saved at once in localStorage, as
//   chapter + verse number (not pixels), so it survives closing the page, clearing recent apps and resizes.
//   The bookmark button in the bottom bar opens that chapter and scrolls to the folded verse.
//   The last chapter you opened is reopened automatically when the page opens.
const BM_KEY = "gitaBookmark", LAST_KEY = "gitaLastTopic";
try { localStorage.removeItem("gitaReaderState"); } catch (e) {}   // leftover from the earlier scroll-saving test
let bookmark = null;                 // { path, index, label }
try { bookmark = JSON.parse(localStorage.getItem(BM_KEY)); } catch (e) {}
if (!bookmark || typeof bookmark.path !== "string" || typeof bookmark.index !== "number") bookmark = null;
let pageLoaded = false, pendingJump = false, bmUserMoved = false;
const bmBtn = document.getElementById("bmBtn");
const bmToast = document.getElementById("bm-toast");
let toastTimer;

function saveBookmark() {
    try { if (bookmark) localStorage.setItem(BM_KEY, JSON.stringify(bookmark)); else localStorage.removeItem(BM_KEY); } catch (e) {}
}
function showToast(msg) {
    bmToast.textContent = msg; bmToast.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => bmToast.classList.remove("show"), 2200);
}
function currentVerseBlock() {        // the verse being chanted / reached with the arrows, else the one filling most of the screen
    const list = bookmarkables(); if (!list.length) return null;
    const box = contentBox.getBoundingClientRect();
    const visible = el => { const r = el.getBoundingClientRect(); return Math.min(r.bottom, box.bottom) - Math.max(r.top, box.top); };
    const cand = contentBox.classList.contains("sync-playing") ? contentBox.querySelector(".verse-active") : contentBox.querySelector(".verse-focus");
    if (cand && list.includes(cand) && visible(cand) > Math.min(cand.getBoundingClientRect().height, box.height) * 0.3) return cand;
    let best = null, bestVis = -1;
    for (const el of list) { const v = visible(el); if (v > bestVis) { bestVis = v; best = el; } }
    return best;
}
function paintBmBtn() {                // filled = the verse you are on is bookmarked; ringed dot = a bookmark exists elsewhere; dim = none
    let state = "";
    try {
        if (bookmark) {
            state = "elsewhere";
            if (pageLoaded && currentFlatIndex >= 0 && flatTopics[currentFlatIndex].path === bookmark.path) {
                const b = currentVerseBlock();
                if (b && bookmarkables().indexOf(b) === bookmark.index) state = "has";
            }
        }
    } catch (e) { state = bookmark ? "elsewhere" : ""; }
    bmBtn.classList.toggle("has", state === "has");
    bmBtn.classList.toggle("elsewhere", state === "elsewhere");
}
function bookmarkables() {           // blocks that can carry the bookmark: verses (or plain paragraphs if a page has none)
    if (contentBox.querySelector(".preface-language")) return [];   // the preface is not bookmarkable
    const v = contentBox.querySelectorAll(".verse-block, .verse-refrain");
    return Array.from(v.length ? v : contentBox.querySelectorAll("p, li, blockquote, h2, h3"));
}
function blockFromTarget(t) {
    if (!t || !t.closest || t.closest("button, a, audio, .audio-player")) return null;
    const el = t.closest(".verse-block, .verse-refrain") || t.closest("p, li, blockquote, h2, h3");
    return el && bookmarkables().includes(el) ? el : null;
}
function markBookmark(topic) {       // draw the dog-ear if the bookmark is in the chapter now on screen
    contentBox.querySelectorAll(".bookmarked").forEach(n => n.classList.remove("bookmarked"));
    if (!bookmark || bookmark.path !== topic.path) return;
    const el = bookmarkables()[bookmark.index];
    if (el) el.classList.add("bookmarked");
}
function toggleBookmark(block) {
    const idx = bookmarkables().indexOf(block);
    if (idx < 0 || currentFlatIndex < 0) return;
    const topic = flatTopics[currentFlatIndex];
    if (bookmark && bookmark.path === topic.path && bookmark.index === idx) {
        bookmark = null; block.classList.remove("bookmarked");
        showToast("Bookmark removed");
    } else {
        const hadOther = !!bookmark;
        contentBox.querySelectorAll(".bookmarked").forEach(n => n.classList.remove("bookmarked"));
        bookmark = { path: topic.path, index: idx, label: topic.label };
        block.classList.add("bookmarked");
        showToast(hadOther ? "Bookmark moved to this verse" : "Bookmarked · press and hold the icon to come back");
    }
    saveBookmark(); paintBmBtn();
    if (window.getSelection) window.getSelection().removeAllRanges();
}

["wheel", "touchstart", "mousedown"].forEach(evt =>
    contentBox.addEventListener(evt, () => { bmUserMoved = true; }, { passive: true }));

function scrollToBookmarkBlock(flash) {
    const el = bookmark && bookmarkables()[bookmark.index];
    if (!el) return false;
    const box = contentBox.getBoundingClientRect(), r = el.getBoundingClientRect();
    const want = r.height > contentBox.clientHeight - 16 ? 8 : (contentBox.clientHeight - r.height) / 2;
    scrollAnim = null;
    contentBox.scrollTop += (r.top - box.top) - want;
    if (flash) { el.classList.add("bm-flash"); setTimeout(() => el.classList.remove("bm-flash"), 1500); }
    return true;
}
function jumpToBookmarkSoon() {      // verses get resized right after a chapter loads, so aim again a moment later
    bmUserMoved = false;
    const go = first => { if (!bmUserMoved) scrollToBookmarkBlock(first); };
    go(true);
    setTimeout(() => go(false), 350);
    setTimeout(() => go(false), 900);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => go(false));
}
function goToBookmark() {
    if (!bookmark) { showToast("No bookmark yet · tap the icon to bookmark the verse you are on"); return; }
    const i = flatTopics.findIndex(t => t.path === bookmark.path);
    if (i < 0) { showToast("Bookmarked chapter not found"); return; }
    if (i === currentFlatIndex && pageLoaded) {
        if (!scrollToBookmarkBlock(true)) showToast("Couldn't find the bookmarked verse");
        return;
    }
    pendingJump = true;              // open the chapter first; the jump happens once it has loaded
    loadTopic(i);
}
// tap = bookmark / un-bookmark the verse you are on;  press and hold (about half a second) = go to the bookmark
let bmHoldTimer = 0, bmHeld = false;
bmBtn.addEventListener("pointerdown", () => { bmHeld = false; clearTimeout(bmHoldTimer); bmHoldTimer = setTimeout(() => { bmHeld = true; goToBookmark(); }, 550); });
["pointerup", "pointerleave", "pointercancel"].forEach(ev => bmBtn.addEventListener(ev, () => clearTimeout(bmHoldTimer)));
bmBtn.addEventListener("contextmenu", e => e.preventDefault());
bmBtn.addEventListener("click", () => {
    if (bmHeld) { bmHeld = false; return; }                       // the long press already did its job
    if (!pageLoaded || currentFlatIndex < 0) return;
    const block = currentVerseBlock();
    if (!block) { showToast("Nothing to bookmark on this page"); return; }
    toggleBookmark(block);
});
let bmPaintRaf = 0;                                                // keep the icon honest while the text scrolls / the audio moves on
contentBox.addEventListener("scroll", () => { if (!bmPaintRaf) bmPaintRaf = requestAnimationFrame(() => { bmPaintRaf = 0; paintBmBtn(); }); }, { passive: true });
paintBmBtn();

// ── LOAD TOPIC ──────────────────────────────────────────────────────────
// ── PREFACE ──
// The preface file holds one <main class="preface-language" data-lang="xx"> per language. Show the chosen language; a language with no
// text yet falls back to English. To add a language later: copy the English <main>, set data-lang / lang, translate. Nothing here changes.
function applyPreface() {
    const pages = Array.from(contentBox.querySelectorAll(".preface-language"));
    if (!pages.length) return;
    const has = c => pages.find(p => p.dataset.lang === c && p.textContent.trim());
    const pick = has(curLang) || has("en") || pages[0];
    pages.forEach(p => { p.hidden = p !== pick; });
    setTimeout(prefaceFades, 0);
}
// the card keeps its border still; its text lives in .pf-scroll, which scrolls with a soft fade at the top / bottom edge
function prefaceFades() {
    contentBox.querySelectorAll(".pf-scroll").forEach(w => {
        w.classList.toggle("fade-t", w.scrollTop > 2);
        w.classList.toggle("fade-b", w.scrollTop + w.clientHeight < w.scrollHeight - 2);
    });
}
function initPreface() {
    if (!contentBox.querySelector(".preface-language")) return;
    contentBox.querySelectorAll(".preface-language").forEach(m => {
        if (m.querySelector(":scope > .pf-scroll")) return;
        const w = document.createElement("div"); w.className = "pf-scroll";
        while (m.firstChild) w.appendChild(m.firstChild);
        m.appendChild(w);
        w.addEventListener("scroll", prefaceFades, { passive: true });
    });
    applyPreface();
    prefaceFades(); setTimeout(prefaceFades, 150); setTimeout(prefaceFades, 600);
    contentBox.querySelectorAll(".preface-language .next").forEach(n => {   // "Tap Next to begin with Chapter 1" is tappable too
        n.setAttribute("role", "button"); n.tabIndex = 0;
        n.onclick = () => loadTopic(currentFlatIndex + 1);
        n.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); n.click(); } };
    });
}

function loadTopic(flatIndex) {
    if (flatIndex < 0 || flatIndex >= flatTopics.length) return;
    if (window.closeSidePeek) window.closeSidePeek();
    currentFlatIndex = flatIndex;
    if (window.playAll) window.playAll.paint();   // PLAY ALL: move the wave to this chapter line
    const topic = flatTopics[flatIndex];
    pageLoaded = false;
    try { localStorage.setItem(LAST_KEY, topic.path); } catch (e) {}   // BOOKMARK/REOPEN: remember last chapter
    stopAudioSync();   // (added) stop previous topic's audio
    if (window.matchMedia("(max-width: 700px)").matches) setSidebarCollapsed(true);   // phone: hide list after picking

    flatTopics.forEach(t => t.el.classList.remove("active", "last-read"));
    topic.el.classList.add("active");
    topic.el.scrollIntoView({ block: "nearest" });

    counterEl.textContent = counterText(flatIndex);
    contentBox.innerHTML = '<div style="color:#8a7a5a;text-align:center;padding:40px 0;">Loading…</div>';
    document.getElementById("verseNav").classList.remove("show");
    if (window.gitaScrubHide) gitaScrubHide();

    fetch(topic.path)
        .then(r => {
            if (r.status === 404) { const e = new Error("missing"); e.isMissing = true; throw e; }   // page not written yet
            if (!r.ok) throw new Error("HTTP " + r.status + " for " + topic.path);
            return r.text();
        })
        .then(raw => {
            if (currentFlatIndex !== flatIndex) return;   // another topic was picked meanwhile: drop this stale response
            const html = (topic.ext === "md" && window.marked) ? marked.parse(raw) : raw;
            contentBox.innerHTML = html;
            contentBox.scrollTop = 0;
            initPreface();   // preface page (no verses): show the chosen language, wire "Tap Next"
            paintChapterHead();   // heading + tagline in the chosen language
            buildVerses();   // build tag + shloka + meaning tabs from the language blocks (before audio sync / fitting look at the blocks)
            wireCopyButtons();
            if (window.hljs) contentBox.querySelectorAll("pre code").forEach(b => hljs.highlightElement(b));
            initAudioSync();   // (added) wire up audio highlighting if the page has it
            if (window.playAll) window.playAll.afterLoad(flatIndex);   // PLAY ALL: start this chapter's audio when Play All is on
            
            const hasVerses = !!contentBox.querySelector(".verse-block");
            document.getElementById("verseNav").classList.toggle("show", hasVerses);
            placeVerseNav();
            if (window.gitaScrubRefresh) gitaScrubRefresh();
            if (hasVerses) { const sp = document.createElement("div"); sp.className = "end-spacer"; contentBox.appendChild(sp); }
            fitVerses();
            setTimeout(fitVerses, 300);   // re-fit once fonts settle
            pageLoaded = true; markBookmark(topic);   // BOOKMARK: draw the dog-ear if it is in this chapter
            if (pendingJump) { pendingJump = false; jumpToBookmarkSoon(); }
        })
        .catch(err => {
            if (window.playAll) window.playAll.afterLoad(flatIndex, true);   // PLAY ALL: page missing / failed -> skip to the next chapter
            if (err.isMissing) {   // missing page = work in progress: just an icon
                contentBox.innerHTML = '<div role="img" aria-label="Work in progress" title="Work in progress" ' +
                    'style="text-align:center;font-size:64px;padding:70px 0;">🚧</div>';
                return;
            }
            contentBox.innerHTML =
                '<div style="color:#b5432f;padding:12px 0;text-align:center;">' + err.message +
                '<br><br>Make sure this page is served over http(s) (e.g. GitHub Pages or a local server) — ' +
                'opening the file directly (file://) blocks fetch() for security reasons.</div>';
        });
}

// ═════════ PLAY ALL (start) — remove this block (plus the 3 small "PLAY ALL" hook lines inside loadTopic) to take the feature out ═════════
// Plays the chapters one after another (Ch 1 -> 18). Each chapter keeps its own audio + verse sync; this only
// starts the audio after a chapter loads and moves on when it ends. The user's own actions always win:
//   click another chapter -> it loads and plays, Play All carries on from there
//   pause the chapter audio -> Play All is paused too (the circled button shows play)
//   tap Stop -> everything stops; chapters behave as before
window.playAll = (function () {
    const ctrl = document.getElementById("pa-ctrl");
    const bToggle = document.getElementById("pa-toggle"), bPrev = document.getElementById("pa-prev"),
          bNext = document.getElementById("pa-next"), bStop = document.getElementById("pa-stop");
    const ICON_PLAY  = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
    const ICON_PAUSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
    let on = false;

    const chapters = () => flatTopics.map((t, i) => t.front ? -1 : i).filter(i => i >= 0);   // preface is skipped
    const curAudio = () => document.querySelector("#content-panel audio[data-ends]") || document.querySelector("#content-panel audio");

    function paint() {   // buttons + the wave on the chapter line
        const a = curAudio(), playing = !!(a && !a.paused && !a.ended);
        ctrl.classList.toggle("pa-on", on);
        bToggle.innerHTML = (on && playing) ? ICON_PAUSE : ICON_PLAY;
        const label = !on ? "Play All chapters" : (playing ? "Pause" : "Resume");
        bToggle.title = label; bToggle.setAttribute("aria-label", label);
        flatTopics.forEach((t, i) => {
            const w = t.el.querySelector(".pa-wave"), here = on && i === currentFlatIndex && !t.front;
            if (!here) { if (w) w.remove(); t.el.classList.remove("pa-hold"); return; }
            if (!w) { const s = document.createElement("span"); s.className = "pa-wave"; t.el.appendChild(s); }
            t.el.classList.toggle("pa-hold", !playing);
        });
    }

    function stop() {
        on = false;
        const a = curAudio(); if (a) a.pause();
        paint();
    }

    function go(i) { loadTopic(i); }   // afterLoad() then starts the audio

    function advance() {   // next chapter, or finish after the last one
        const list = chapters(), nxt = list.find(i => i > currentFlatIndex);
        if (nxt === undefined) { stop(); return; }
        go(nxt);
    }

    function start() {
        const list = chapters(); if (!list.length) return;
        on = true; go(list[0]);   // always from chapter 1
    }

    // called by loadTopic once a chapter's page is on screen (failed = the page is missing / did not load)
    function afterLoad(idx, failed) {
        if (!on || idx !== currentFlatIndex) return;
        if (flatTopics[idx].front) { stop(); return; }   // user opened the preface: they want to read, so Play All ends
        if (failed) { setTimeout(() => { if (on && idx === currentFlatIndex) advance(); }, 400); return; }
        const a = curAudio();
        if (!a) { setTimeout(() => { if (on && idx === currentFlatIndex) advance(); }, 400); return; }   // chapter without audio: skip it
        a.addEventListener("play",  paint);
        a.addEventListener("pause", paint);
        a.addEventListener("ended", () => { if (on && a === curAudio()) advance(); });
        a.addEventListener("error", () => { if (on && a === curAudio()) setTimeout(advance, 400); });   // mp3 missing: skip it
        const p = a.play();
        if (p && p.catch) p.catch(() => paint());   // browser refused to auto-start: control shows play, one tap resumes
        paint();
    }

    bToggle.addEventListener("click", () => {
        if (!on) { start(); return; }
        const a = curAudio(); if (!a) return;
        if (a.paused) { const p = a.play(); if (p && p.catch) p.catch(() => {}); } else a.pause();
    });

// ── VERSE ARROWS + SNAP ──────────────────────────────────────────────────
// A verse sits at the TOP of the reading area. Down = the next verse that starts below the top line, Up = the previous verse
// that starts above it (inside a long verse, Up first returns to its start). With audio on the page the audio jumps to the verse
// (the sync scrolls + highlights it); without audio the verse is highlighted here.
function topOf(rect, box) { return contentBox.scrollTop + (rect.top - box.top) - TOP_PAD; }
function stepVerse(dir) {
    const blocks = Array.from(contentBox.querySelectorAll(".verse-block"));
    if (!blocks.length) return;
    const box = contentBox.getBoundingClientRect(), line = box.top + TOP_PAD, tol = 8;
    const rects = blocks.map(b => b.getBoundingClientRect());
    let i = -1;
    if (dir > 0) {
        i = rects.findIndex(r => r.top > line + tol);
        const st = window.gitaSyncState && window.gitaSyncState();
        if (st && st.started && st.active === i) i++;                 // that verse is already being chanted (e.g. the opening, still above its card): go one further
        if (i < 0 || i >= blocks.length) i = 0;                       // at the last verse: loop round to the first
    } else {
        for (let k = rects.length - 1; k >= 0; k--) if (rects[k].top < line - tol) { i = k; break; }
        if (i < 0 && contentBox.scrollTop > 4) {                      // above the first verse: back to the very top
            blocks.forEach(b => b.classList.remove("verse-focus"));
            syncUserScrollUntil = 0; smoothScrollTo(0, 700); return;
        }
        if (i < 0) i = blocks.length - 1;                             // already at the very top: loop round to the last verse
    }
    blocks.forEach(b => b.classList.remove("verse-focus"));
    syncUserScrollUntil = 0;
    if (window.gitaSyncSeek && window.gitaSyncSeek(i)) {              // chapter with audio: the audio jumps, the sync highlights + scrolls
        if (blocks[i].classList.contains("verse-active")) verseSwap(blocks[i], topOf(rects[i], box));   // same verse already active: scroll ourselves
        return;
    }
    blocks[i].classList.add("verse-focus");
    verseSwap(blocks[i], topOf(rects[i], box));
}

// When scrolling stops, glide to the nearest verse top (or the chapter top). Not while a finger is down, and not inside a long
// verse (e.g. English open): there it only snaps once the next verse is close.
let touchingBox = false, snapTimer = null;
function snapToNearest() {
    if (touchingBox || scrollAnim) return;
    const blocks = Array.from(contentBox.querySelectorAll(".verse-block"));
    if (!blocks.length) return;
    const box = contentBox.getBoundingClientRect(), h = contentBox.clientHeight, cur = contentBox.scrollTop;
    let best = { target: 0, el: null }, bestD = -cur;                 // the chapter top is a snap point too
    blocks.forEach(b => {
        const r = b.getBoundingClientRect(), target = topOf(r, box), d = target - cur;
        if (d < 0 && r.bottom > box.bottom + 4) return;               // still inside a tall verse: don't pull back to its start
        if (Math.abs(d) < Math.abs(bestD)) { best = { target, el: b }; bestD = d; }
    });
    if (Math.abs(bestD) > h * 0.35) return;                           // not near any verse: leave it where the reader stopped
    if (!window.gitaSyncSeek) {                                       // no audio: highlight the verse at the top
        blocks.forEach(b => b.classList.remove("verse-focus"));
        if (best.el) best.el.classList.add("verse-focus");
    }
    if (Math.abs(bestD) < 2) return;
    syncUserScrollUntil = 0;
    smoothScrollTo(best.target, 500);
}
contentBox.addEventListener("scroll", () => { clearTimeout(snapTimer); snapTimer = setTimeout(snapToNearest, 160); }, { passive: true });
contentBox.addEventListener("touchstart", () => { touchingBox = true; }, { passive: true });
["touchend", "touchcancel"].forEach(ev => contentBox.addEventListener(ev, () => {
    touchingBox = false; clearTimeout(snapTimer); snapTimer = setTimeout(snapToNearest, 160);
}, { passive: true }));

function topicPlainText() {
    const c = contentBox.cloneNode(true);
    c.querySelectorAll("audio, .audio-player, script, style, button, .verse-label, .copy-code-btn").forEach(n => n.remove());
    // collapse HTML source whitespace first, then turn <br> and block ends into real line breaks
    const tw = document.createTreeWalker(c, NodeFilter.SHOW_TEXT);
    for (let n = tw.nextNode(); n; n = tw.nextNode()) n.nodeValue = n.nodeValue.replace(/\s+/g, " ");
    c.querySelectorAll("br").forEach(br => br.replaceWith("\n"));
    c.querySelectorAll("p,div,h1,h2,h3,h4,h5,h6,ul,ol,blockquote,pre,hr").forEach(el => el.append("\n\n"));
    c.querySelectorAll("li").forEach(el => el.append("\n"));
    return c.textContent.split("\n").map(l => l.trim()).join("\n").replace(/\n{3,}/g, "\n\n").trim();
}
function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    return new Promise((res, rej) => {   // fallback for plain http / file://
        const ta = document.createElement("textarea");

        document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy") ? res() : rej(); } catch (e) { rej(e); } finally { ta.remove(); }
    });
}

function runSearch() {

        on = true;
        body.classList.remove("immerse-quick");
        body.classList.add("immerse-fade");
    }
    function reveal(thenHideAgain) {
        clearTimeout(tStart); clearTimeout(tIdle);
        on = false;
        body.classList.add("immerse-quick");           // quick fade back in
        body.classList.remove("immerse-fade");
        if (thenHideAgain && playing) tIdle = setTimeout(enter, IDLE_MS);
    }
    function play() { playing = true; if (!eligible()) return; clearTimeout(tStart); tStart = setTimeout(enter, START_AFTER); }
    function stop() { playing = false; clearTimeout(tStart); clearTimeout(tIdle); if (on || body.classList.contains("immerse-fade")) reveal(false); }
    // a tap while the controls are hidden (or fading) only brings them back
    document.addEventListener("click", e => { if (!on) return; e.stopPropagation(); e.preventDefault(); reveal(true); }, true);
    // any touch while the controls are showing postpones the next fade-out
    document.addEventListener("pointerdown", () => { if (playing && !on && eligible()) { clearTimeout(tStart); clearTimeout(tIdle); tIdle = setTimeout(enter, IDLE_MS); } }, true);
    // desktop (mouse): there is no "tap", so moving the mouse brings the controls back; entering / leaving full screen starts / ends the mode
    let lx = -1, ly = -1;
    document.addEventListener("mousemove", e => {
        if (coarse()) return;                                          // touch devices keep tap-to-reveal
        const moved = lx < 0 || Math.abs(e.clientX - lx) + Math.abs(e.clientY - ly) > 8;
        if (!moved) return;
        lx = e.clientX; ly = e.clientY;
        if (on) reveal(true);
        else if (playing && isFs()) { clearTimeout(tStart); clearTimeout(tIdle); tIdle = setTimeout(enter, IDLE_MS); }
    }, { passive: true });
    function onFsChange() {
        if (coarse()) return;
        if (isFs()) { if (playing) { clearTimeout(tStart); tStart = setTimeout(enter, START_AFTER); } }
        else { clearTimeout(tStart); clearTimeout(tIdle); if (on || body.classList.contains("immerse-fade")) reveal(false); }
    }
    document.addEventListener("fullscreenchange", onFsChange);
    document.addEventListener("webkitfullscreenchange", onFsChange);
    return { play, stop };
})();

// ── LANDSCAPE FOCUS MODE buttons: pause/play + mute drive the real (hidden) player; speed uses the existing speed pill ──
(function () {
    const lsPause = document.getElementById("lsPause"), lsMute = document.getElementById("lsMute");
    function src(sel) { return audioDock.querySelector(sel); }
    const ICON_PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
    const ICON_VOL  = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
    function paint() {                                   // copy the current icons from the real player buttons (default icons when there is no audio)
        const p = src(".ap-btn:not(.ap-mute)"), m = src(".ap-mute");
        lsPause.innerHTML = p ? p.innerHTML : ICON_PLAY;
        lsMute.innerHTML  = m ? m.innerHTML : ICON_VOL;
    }
    lsPause.addEventListener("click", () => { const p = src(".ap-btn:not(.ap-mute)"); if (p) p.click(); });
    lsMute.addEventListener("click",  () => { const m = src(".ap-mute"); if (m) m.click(); });
    new MutationObserver(paint).observe(audioDock, { childList: true, subtree: true });
    paint();
})();

// ── ROTATING THE PHONE: keep the same verse on screen ──
// The verse at the top is remembered while the reader scrolls; when the layout switches (portrait <-> landscape) the page re-fits
// the text and card heights, so the old scroll position would land on another verse. The remembered verse is put back at the top.
(function () {
    const mq = window.matchMedia("(orientation: landscape) and (max-height: 520px)");
    let anchor = -1, freezeUntil = 0, timers = [];
    function blocks() { return Array.from(contentBox.querySelectorAll(".verse-block")); }
    function topIndex() {
        if (contentBox.scrollTop < 2) return -1;                        // at the very top (chapter heading)
        const bs = blocks(), line = contentBox.getBoundingClientRect().top + TOP_PAD + 8;
        let idx = -1;
        for (let i = 0; i < bs.length; i++) { if (bs[i].getBoundingClientRect().top <= line) idx = i; else break; }
        return idx;
    }
    contentBox.addEventListener("scroll", () => { if (Date.now() >= freezeUntil) anchor = topIndex(); }, { passive: true });
    function restore() {
        if (touchingBox) return;
        scrollAnim = null;
        if (contentBox.classList.contains("sync-playing")) {          // being chanted right now: that verse wins over the remembered one
            const act = contentBox.querySelector(".verse-block.verse-active");
            if (act) { contentBox.scrollTop = topOf(act.getBoundingClientRect(), contentBox.getBoundingClientRect()); return; }
        }
        if (anchor < 0) { contentBox.scrollTop = 0; return; }
        const b = blocks()[anchor];
        if (b) contentBox.scrollTop = topOf(b.getBoundingClientRect(), contentBox.getBoundingClientRect());
    }
    function onChange() {
        freezeUntil = Date.now() + 1300;                                // scroll events caused by the re-layout must not change the remembered verse
        timers.forEach(clearTimeout);
        timers = [150, 400, 800, 1200].map(t => setTimeout(restore, t));   // after the text re-fit and the font settle
    }
    if (mq.addEventListener) mq.addEventListener("change", onChange); else mq.addListener(onChange);
    // desktop: full screen in/out and the side panel opening/closing change the reading width, which re-flows every verse
    window.keepVerseInView = () => { anchor = topIndex(); onChange(); };
    let lastW = contentBox.clientWidth;
    if (window.ResizeObserver) new ResizeObserver(() => {             // safety net, e.g. Esc / F11 leaving full screen
        const w = contentBox.clientWidth;
        if (w && w !== lastW) { lastW = w; if (Date.now() >= freezeUntil) onChange(); } else if (w) lastW = w;
    }).observe(contentBox);
})();

// ── LANDSCAPE = FULL SCREEN, no extra button ──
// If the page is already full screen (Start button), it simply stays. Otherwise full screen is requested on entering landscape;
// browsers only allow that after a touch, so if it is refused, the next tap anywhere (e.g. on play) switches it on.
(function () {
    const mq = window.matchMedia("(orientation: landscape) and (max-height: 520px)");
    let armed = false;
    function isFS() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
    function goFS() {
        const el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
        if (!req || isFS()) return Promise.resolve(isFS());
        try { const r = req.call(el, { navigationUI: "hide" }); return r && r.then ? r.then(() => true, () => false) : Promise.resolve(true); }
        catch (e) { return Promise.resolve(false); }
    }
    function onTouch() {
        if (IN_APP || !mq.matches) return;
        goFS().then(ok => { if (ok || isFS()) disarm(); });
    }
    function arm()    { if (armed) return; armed = true; document.addEventListener("touchend", onTouch, true); document.addEventListener("click", onTouch, true); }
    function disarm() { armed = false; document.removeEventListener("touchend", onTouch, true); document.removeEventListener("click", onTouch, true); }
    function onLand() { if (IN_APP || !mq.matches || isFS()) return; goFS().then(ok => { if (!ok && !isFS()) arm(); }); }
    if (mq.addEventListener) mq.addEventListener("change", onLand); else mq.addListener(onLand);
    onLand();
})();


// up / down in the landscape bar = the same actions as the portrait arrows
document.getElementById("lsUp").addEventListener("click",   () => { if (window.gitaHoldSuppress) { window.gitaHoldSuppress = false; return; } stepVerse(-1); });
document.getElementById("lsDown").addEventListener("click", () => { if (window.gitaHoldSuppress) { window.gitaHoldSuppress = false; return; } stepVerse(1); });


// ── MEANING PANEL (phones): never taller than the space left down to the bottom of the screen; longer text scrolls inside it ──
(function () {
    function capPanels() {
        const phone = window.matchMedia("(max-width: 700px), (orientation: landscape) and (max-height: 520px)").matches;
        contentBox.querySelectorAll(".mtab-panel").forEach(p => {
            if (!phone || p.hidden) { p.style.maxHeight = ""; return; }
            const block = p.closest(".verse-block"); if (!block) return;
            const cs = getComputedStyle(block);
            const rel = p.getBoundingClientRect().top - block.getBoundingClientRect().top;      // where the panel starts inside its verse card
            const avail = contentBox.clientHeight - TOP_PAD - rel - parseFloat(cs.paddingBottom) - parseFloat(cs.borderBottomWidth) - 2;
            p.style.maxHeight = Math.max(120, Math.floor(avail)) + "px";
        });
        refreshFades();
    }
    // soft fade at the top / bottom of a meaning text that is longer than its panel
    function updateFade(mn) {
        mn.classList.toggle("fade-t", mn.scrollTop > 2);
        mn.classList.toggle("fade-b", mn.scrollTop + mn.clientHeight < mn.scrollHeight - 2);
    }
    function refreshFades() { contentBox.querySelectorAll(".mtab-panel:not([hidden]) .mn").forEach(updateFade); }
    contentBox.addEventListener("scroll", e => { if (e.target.classList && e.target.classList.contains("mn")) updateFade(e.target); }, true);
    let raf = 0;
    new MutationObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(capPanels); setTimeout(capPanels, 400); })   // chapter loaded / tab switched (the 400 ms one runs after the text re-fit)
        .observe(contentBox, { childList: true, subtree: true, attributes: true, attributeFilter: ["hidden"] });
    window.addEventListener("resize", () => setTimeout(capPanels, 250));
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(capPanels);
})();





// ══ VERSE SCRUBBER (drag like a radio dial) + LANDSCAPE TUCK PILL ═══════════════════════════════
// Maths: the lane is (height - 2*PAD) px tall and holds N verses, so one verse = laneH / (N-1) px; index = round(fraction * (N-1)).
// While dragging, the thumb follows the finger freely and the bubble shows the nearest verse; on release the thumb glides to that
// verse and the page jumps there with the normal verse fade (same path as the up/down arrows, so audio sync keeps working).
(function () {
    const scrub = document.getElementById("verseScrub"), lane = scrub.querySelector(".vs-lane"), thumb = scrub.querySelector(".vs-thumb");
    const bubble = document.getElementById("vsBubble"), dim = document.getElementById("vsDim");
    const pill = document.getElementById("splitPill"), PAD = 18;
    let blocks = [], N = 0, dragging = false, shown = -1, awakeT, raf = 0;
    const glowIO = window.IntersectionObserver ? new IntersectionObserver(es => es.forEach(e => e.target.classList.toggle("glow", e.isIntersecting)), { root: contentBox, threshold: 0.15 }) : null;
    const landMQ = window.matchMedia("(orientation: landscape) and (max-height: 520px)");
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const laneH = () => Math.max(1, lane.clientHeight - 2 * PAD);
    const yOf = i => PAD + (N > 1 ? laneH() * i / (N - 1) : laneH() / 2);
    const NUMV = /^\d[\d\s,\-–]*$/;   // same test as the "k/N" tag on each card: only numbered verses count
    let isNum = [], numBefore = [], numTotal = 0;
    const labelOf = i => {              // numbered verse -> its real number (same as the card tag); opening / closing sections -> words
        if (isNum[i]) return String(numBefore[i]);
        return numBefore[i] === 0 ? "Intro" : (numBefore[i] >= numTotal ? "End" : "•");
    };
    function put(y, glide) {
        thumb.style.transition = (glide ? "top .4s cubic-bezier(.2,.8,.2,1), " : "") + "transform .2s ease"; thumb.style.top = y + "px";
    }
    function say(i) {
        if (i === shown) return; shown = i;
        bubble.textContent = labelOf(i);
        lane.setAttribute("aria-valuenow", i + 1);
        if (navigator.vibrate && dragging) navigator.vibrate(5);
    }
    function wake() { scrub.classList.add("awake"); clearTimeout(awakeT); awakeT = setTimeout(() => scrub.classList.remove("awake"), 1600); }
    function layout() {                     // below the audio dock if there is one; rebuild the ruler ticks
        const dock = contentPanel.classList.contains("has-dock") ? audioDock.offsetHeight : 0;
        if (!landMQ.matches) scrub.style.top = (dock + 44) + "px"; else scrub.style.top = "";
        lane.setAttribute("aria-valuemax", numTotal || N);
    }
    function currentIdx() {                 // the verse the reader is on: the last card whose top is above 35% of the screen
        const box = contentBox.getBoundingClientRect(), line = box.top + contentBox.clientHeight * 0.35; let k = 0;
        for (let i = 0; i < blocks.length; i++) { if (blocks[i].getBoundingClientRect().top <= line) k = i; else break; }
        return k;
    }
    function follow() { raf = 0; if (dragging || !N) return; const k = currentIdx(); say(k); put(yOf(k), true); }
    contentBox.addEventListener("scroll", () => { if (!N || dragging) return; wake(); if (!raf) raf = requestAnimationFrame(follow); }, { passive: true });
    function refresh() {
        blocks = Array.from(contentBox.querySelectorAll(".verse-block")); N = blocks.length; shown = -1;
        let c = 0; isNum = blocks.map(b => NUMV.test((b.dataset.n || "").trim())); numBefore = isNum.map(v => (c += v ? 1 : 0)); numTotal = c;
        if (glowIO) { glowIO.disconnect(); blocks.forEach(b => glowIO.observe(b)); }
        scrub.classList.toggle("show", N > 0); pill.classList.toggle("show", N > 0);
        if (N) {                                   // "‹ Previous chapter" on the first card, "Next chapter ›" on the last (replaces swipe + arrows on touch)
            const addLink = (blk, cls, txt, idx) => {
                const b = document.createElement("button"); b.type = "button"; b.className = "chap-link " + cls; b.textContent = txt; b.title = (cls === "chap-prev" ? "Previous chapter" : "Next chapter"); b.setAttribute("aria-label", b.title);
                ["pointerdown", "click", "dblclick"].forEach(ev => b.addEventListener(ev, e => e.stopPropagation()));
                b.addEventListener("click", () => loadTopic(idx)); blk.appendChild(b); blk.classList.add("has-chap-link");
            };
            if (currentFlatIndex > 0) addLink(blocks[0], "chap-prev", "«", currentFlatIndex - 1);
            if (currentFlatIndex < flatTopics.length - 1) addLink(blocks[N - 1], "chap-next", "»", currentFlatIndex + 1);
        }
        if (!N) return; layout(); const k = currentIdx(); say(k); put(yOf(k), false); placePill();
    }
    window.gitaScrubRefresh = refresh;
    window.gitaScrubHide = () => { N = 0; blocks = []; scrub.classList.remove("show"); pill.classList.remove("show"); };

    function gotoVerse(i) {                 // same path as the arrows: audio chapters seek, others highlight + fade-jump
        const box = contentBox.getBoundingClientRect(), r = blocks[i].getBoundingClientRect();
        blocks.forEach(b => b.classList.remove("verse-focus")); syncUserScrollUntil = 0;
        if (window.gitaSyncSeek && window.gitaSyncSeek(i)) { if (blocks[i].classList.contains("verse-active")) verseSwap(blocks[i], topOf(r, box)); return; }
        blocks[i].classList.add("verse-focus"); verseSwap(blocks[i], topOf(r, box));
    }
    function move(e) {
        const r = lane.getBoundingClientRect(), y = clamp(e.clientY - r.top, PAD, r.height - PAD);
        const f = (y - PAD) / laneH(), i = N > 1 ? Math.round(f * (N - 1)) : 0;
        put(y, false); say(i);
    }
    thumb.addEventListener("pointerdown", e => {
        if (!N) return; e.preventDefault(); dragging = true; scrub.classList.add("drag"); bubble.classList.add("on"); dim.classList.add("on"); contentBox.classList.add("vs-lock"); scrollAnim = null; wake(); clearTimeout(awakeT);
        try { thumb.setPointerCapture(e.pointerId); } catch (x) {}
        shown = -1; move(e);
    });
    thumb.addEventListener("pointermove", e => { if (dragging) move(e); });
    function release() {
        if (!dragging) return; dragging = false; scrub.classList.remove("drag"); bubble.classList.remove("on"); dim.classList.remove("on"); contentBox.classList.remove("vs-lock"); wake();
        const i = shown; put(yOf(i), true); gotoVerse(i);     // thumb glides onto the verse, page fades to it
    }
    thumb.addEventListener("pointerup", release); thumb.addEventListener("pointercancel", release);
    lane.addEventListener("keydown", e => { if (e.key === "ArrowUp" || e.key === "ArrowLeft") { e.preventDefault(); stepVerse(-1); } else if (e.key === "ArrowDown" || e.key === "ArrowRight") { e.preventDefault(); stepVerse(1); } });
    // ── PRESS & HOLD the up / down verse buttons (bottom bar; left rail in landscape) ──
    // A tap = one verse. Hold = the glass bubble in the middle counts through the verses (looping at both ends, a little faster the longer you hold);
    // let go and the page jumps to the verse showing in the bubble (same path as the arrows, so audio sync keeps working).
    (function () {
        let timer = 0, tick = 0, active = false, dir = 0, idx = 0, steps = 0;
        const stopAll = () => { clearTimeout(timer); clearTimeout(tick); timer = tick = 0; };
        function advance() {
            if (!active || !N) return;
            idx = (idx + dir + N) % N; say(idx); steps++;
            tick = setTimeout(advance, steps > 10 ? 70 : steps > 4 ? 110 : 170);
        }
        function begin() {
            timer = 0; if (!N) return;
            active = true; dragging = true; window.gitaHoldSuppress = true;
            idx = currentIdx(); shown = -1; say(idx);
            bubble.classList.add("on"); dim.classList.add("on"); contentBox.classList.add("vs-lock"); scrollAnim = null;
            tick = setTimeout(advance, 300);
        }
        function end() {
            stopAll();
            if (!active) return;
            active = false; dragging = false;
            bubble.classList.remove("on"); dim.classList.remove("on"); contentBox.classList.remove("vs-lock");
            gotoVerse(idx);
            setTimeout(() => { window.gitaHoldSuppress = false; }, 400);
        }
        [["lsUp", -1], ["lsDown", 1]].forEach(([id, d]) => {
            const b = document.getElementById(id);
            b.addEventListener("pointerdown", e => { if (e.button > 0) return; stopAll(); dir = d; steps = 0; timer = setTimeout(begin, 420); });
            ["pointerup", "pointercancel", "pointerleave"].forEach(ev => b.addEventListener(ev, end));
            b.addEventListener("contextmenu", e => e.preventDefault());
        });
    })();
    window.addEventListener("resize", () => { if (N) { layout(); put(yOf(shown < 0 ? 0 : shown), false); } placePill(); });
    if (window.ResizeObserver) new ResizeObserver(() => { if (N) { layout(); put(yOf(shown < 0 ? 0 : shown), false); } placePill(); }).observe(contentBox);

    // ── landscape: tap the pill on the divider = verse goes full width; tap again = split comes back ──
    function placePill() {
        if (!landMQ.matches) return;
        const cs = getComputedStyle(contentBox), pl = parseFloat(cs.paddingLeft) || 0, pr = parseFloat(cs.paddingRight) || 0, W = contentBox.clientWidth;
        const tucked = contentBox.classList.contains("verse-full");
        contentPanel.style.setProperty("--split-x", (tucked ? W - pr - 14 - 9 : pl + (W - pl - pr) / 2) + "px");   // centre of the golden box, or its right edge
        pill.classList.toggle("tucked", tucked);
        pill.setAttribute("aria-label", tucked ? "Show meaning (split view)" : "Show verse full width");
    }
    pill.addEventListener("click", () => {
        const tuck = !contentBox.classList.contains("verse-full");
        contentBox.classList.toggle("verse-full", tuck); placePill();
        if (tuck) setTimeout(fitVerses, 470); else fitVerses();   // growing: re-fit after the slide; shrinking: re-fit first
    });
    if (landMQ.addEventListener) landMQ.addEventListener("change", () => { placePill(); fitVerses(); });
})();

// ══ GEAR PANEL + CHAPTER LINKS ══════════════════════════════════════════════════════════════════
(function () {
    const grp = document.getElementById("gearGroup"), gb = document.getElementById("gearBtn"), pop = document.getElementById("gearPop");
    function setOpen(v) {
        pop.hidden = !v; gb.setAttribute("aria-expanded", v ? "true" : "false");
        if (!v && typeof closeLangPop === "function") closeLangPop();
    }
    gb.addEventListener("click", e => { e.stopPropagation(); setOpen(pop.hidden); });
    document.addEventListener("click", e => { if (!pop.hidden && !e.composedPath().includes(grp)) setOpen(false); });
    document.addEventListener("keydown", e => { if (e.key === "Escape" && !pop.hidden) setOpen(false); });
    document.getElementById("bmGo").addEventListener("click", () => goToBookmark());
    // language pop-up: a caret that points at the language button
    const lm = document.getElementById("langMain"), lp = document.getElementById("langPop");
    function caret() { if (lp.hidden) return; const x = lm.getBoundingClientRect(), y = lp.getBoundingClientRect(); lp.style.setProperty("--ax", Math.max(20, Math.min(y.width - 20, x.left + x.width / 2 - y.left)) + "px"); }
    lm.addEventListener("click", () => requestAnimationFrame(caret)); window.addEventListener("resize", caret);
})();
</script>
