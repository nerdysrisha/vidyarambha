<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1018">
<title>NerdyGH</title>
<style>
:root{--saf:244,179,90;--ink:#0a1018;--panel:#142030;--line:#223349;--text:#e8eef6;--mute:#8b9bb0;--accent:#4f93e0;--a:79,147,224;--bar:#10304f;--hi:#d3e6fb;--ok:#4cc38a;--bad:#f0645a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none;background:var(--ink);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;max-width:646px;margin:0 auto;display:flex;flex-direction:column}
button,input{font:inherit;color:var(--text)}
button{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:37px;min-width:37px;cursor:pointer}
button:active{background:var(--line)}
input{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:37px}
#top{position:relative;padding:calc(env(safe-area-inset-top,0px) + 12px) 15px 12px;background:linear-gradient(135deg,var(--bar),var(--panel) 55%,var(--bar));border-bottom:1px solid rgba(var(--a),.55)}
#top h1{margin:0;font-size:18.7px;color:var(--hi);text-shadow:0 0 10px rgba(var(--a),.5)}
#top p{margin:2px 0 0;color:var(--mute);font-size:11px}
#rf{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 9px);width:34px;height:34px;min-width:34px;min-height:34px;border-radius:17px;padding:0;display:flex;align-items:center;justify-content:center}
#rf svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#rf.spin svg{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#main{flex:1;min-height:0;overflow-y:auto;margin:8px 10px 10px;padding:10px 10px 20px}
nav{position:relative;display:flex;border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom,0px)}
.ng{position:absolute;left:0;top:0;height:2.4px;border-radius:0 0 2.4px 2.4px;background:rgb(var(--saf));box-shadow:0 0 9px rgb(var(--saf));animation:ngbr 2.2s ease-in-out infinite;transition:transform .32s cubic-bezier(.3,.9,.3,1),width .32s cubic-bezier(.3,.9,.3,1);pointer-events:none;z-index:2}
@keyframes ngbr{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes pgInL{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes pgInR{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
#main.pgl{animation:pgInL .3s cubic-bezier(.2,.8,.3,1)}
#main.pgr{animation:pgInR .3s cubic-bezier(.2,.8,.3,1)}
nav button{flex:1;border:0;border-radius:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9.8px;color:var(--mute);min-height:48px}
nav button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.card b{display:block;font-size:20px;color:var(--hi)}
.card small{color:var(--mute);font-size:10.5px}
.card.live{border-color:rgba(var(--saf),.9);animation:nbr 2.6s ease-in-out infinite}
.card.live b{color:rgb(var(--saf))}
@keyframes nbr{0%,100%{box-shadow:0 0 5px 0 rgba(var(--saf),.25)}50%{box-shadow:0 0 0 3px rgba(var(--saf),.16),0 0 16px 3px rgba(var(--saf),.55)}}
@keyframes nbd{0%,100%{opacity:.45;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}
h3{margin:14px 0 7px;font-size:12px;color:var(--hi);letter-spacing:.3px}
.row{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:5px;background:var(--panel);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.row:active{background:var(--line)}
.row .tx{flex:1;min-width:0}
.row b{display:block;font-size:12.8px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{display:block;color:var(--mute);font-size:10.2px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
em.n{font-style:normal;font-size:9.3px;font-weight:600;padding:2.5px 7px;border-radius:8px;color:var(--hi);background:rgba(var(--a),.14);border:1px solid rgba(var(--a),.35);white-space:nowrap}
.st{flex:none;width:12px;height:12px;border-radius:50%;background:var(--mute)}
.st.ok{background:var(--ok)}.st.bad{background:var(--bad)}
.st.live{background:rgb(var(--saf));animation:nbd 2.6s ease-in-out infinite}
.row.live{border-color:rgba(var(--saf),.9);animation:nbr 2.6s ease-in-out infinite}
.msg{color:var(--mute);text-align:center;padding:24px 16px;line-height:1.6;font-size:13px}
.err{color:var(--bad);font-size:12px;padding:6px 2px}
.chips{display:flex;gap:7px;margin:8px 0 10px}
.chip{min-height:30px;padding:0 12px;border-radius:15px;font-size:11px;white-space:nowrap}
.chip.on{border-color:var(--accent);color:var(--accent);background:rgba(var(--a),.16)}
.bk{margin-bottom:8px;font-size:12px;padding:0 12px}
.crumb{color:var(--mute);font-size:11px;margin:4px 0 8px;word-break:break-all}
</style>
</head>
<body>
<div id="app">
  <header id="top"><h1>NerdyGH</h1><p id="sub"></p><button id="rf" aria-label="Refresh"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v4h-4"/></svg></button></header>
  <div id="main"></div>
  <nav>
    <button data-v="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>Home</button>
    <button data-v="builds"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>Builds</button>
    <button data-v="repos"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM4 9h16M8 13h5"/></svg>Repos</button>
    <button data-v="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>Settings</button>
  </nav>
</div>
<script>
const $ = s => document.querySelector(s);
const KEY = "ghtok_nerdygh", POLL = 45000, MAXRUNREPOS = 20;
let mem = "", RL = "";
const ls = (k, v) => { try { if (v === undefined) return localStorage.getItem(k) || ""; v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) { return ""; } };
const tok = () => ls(KEY) || mem, setTok = v => { mem = v; ls(KEY, v || null); };
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const S = {user: null, repos: [], runs: [], t: 0, err: ""};
let view = "home", filt = "all", q = "", sel = null, path = "", items = null, busy = false, fbusy = false, tick = 0;

async function api(p) {
  const r = await fetch("https://api.github.com" + p, {headers: {Authorization: "Bearer " + tok(), Accept: "application/vnd.github+json"}});
  RL = r.headers.get("x-ratelimit-remaining") || RL;
  if (!r.ok) throw new Error(String(r.status));
  return r.json();
}
const ago = t => { const m = Math.max(0, Math.round((Date.now() - t) / 60000)); return m < 1 ? "now" : m < 60 ? m + "m" : m < 1440 ? Math.round(m / 60) + "h" : Math.round(m / 1440) + "d"; };
const isAct = w => ["queued", "in_progress", "waiting", "requested", "pending"].includes(w.st);

async function loadRepos() {
  let all = [];
  for (let p = 1; p <= 10; p++) { const j = await api("/user/repos?per_page=100&affiliation=owner&sort=pushed&page=" + p); all = all.concat(j); if (j.length < 100) break; }
  S.repos = all;
}
async function loadRuns() {
  const rs = S.repos.filter(r => !r.archived && !r.disabled).slice(0, MAXRUNREPOS);
  const out = await Promise.all(rs.map(r => api("/repos/" + r.full_name + "/actions/runs?per_page=5")
    .then(j => (j.workflow_runs || []).map(w => ({repo: r.name, full: r.full_name, name: w.display_title || w.name, br: w.head_branch, st: w.status, con: w.conclusion, t: Date.parse(w.run_started_at || w.created_at)})))
    .catch(() => [])));
  S.runs = out.flat().sort((a, b) => b.t - a.t);
}
async function refresh(full) {
  if (busy || !tok()) return;
  busy = true; $("#rf").classList.add("spin");
  try {
    if (!S.user) S.user = await api("/user");
    if (full || !S.repos.length) await loadRepos();
    await loadRuns();
    S.t = Date.now(); S.err = "";
  } catch (e) {
    if (e.message === "401") { setTok(""); S.user = null; S.err = "PIN was rejected. Enter it again in Settings."; }
    else S.err = "Could not reach GitHub (" + e.message + ").";
  }
  busy = false; $("#rf").classList.remove("spin");
  if (!(document.activeElement && document.activeElement.tagName === "INPUT")) render();
}
async function loadFiles() {
  fbusy = true; items = null; render();
  try {
    const j = await api("/repos/" + sel + "/contents/" + path.split("/").map(encodeURIComponent).join("/"));
    items = Array.isArray(j) ? j.sort((a, b) => (a.type === "dir" ? 0 : 1) - (b.type === "dir" ? 0 : 1) || a.name.localeCompare(b.name)) : [];
  } catch (e) { items = e.message === "404" ? [] : "err"; }
  fbusy = false; render();
}

const runRow = w => { const a = isAct(w); return '<div class="row' + (a ? " live" : "") + '"><i class="st ' + (a ? "live" : w.con === "success" ? "ok" : w.con === "failure" ? "bad" : "") + '"></i><div class="tx"><b>' + esc(w.name) + '</b><small>' + esc(w.repo) + " · " + esc(w.br) + " · " + ago(w.t) + '</small></div><em class="n">' + esc(a ? w.st.replace("_", " ") : (w.con || w.st)) + "</em></div>"; };
const repoRow = r => '<div class="row" data-repo="' + esc(r.full_name) + '"><div class="tx"><b>' + esc(r.name) + '</b><small>' + esc([r.language, "pushed " + ago(Date.parse(r.pushed_at)), r.stargazers_count ? "★" + r.stargazers_count : "", r.fork ? "fork" : "", r.archived ? "archived" : ""].filter(Boolean).join(" · ")) + '</small></div><em class="n">' + (r.private ? "private" : "public") + "</em></div>";

function vHome() {
  const R = S.repos, act = S.runs.filter(isAct), c = f => R.filter(f).length;
  let h = '<div class="grid"><div class="card"><b>' + R.length + '</b><small>Repos</small></div><div class="card"><b>' + c(r => !r.private) + '</b><small>Public</small></div><div class="card"><b>' + c(r => r.private) + '</b><small>Private</small></div>' +
    '<div class="card"><b>' + c(r => r.fork) + '</b><small>Forks</small></div><div class="card"><b>' + c(r => r.archived) + '</b><small>Archived</small></div><div class="card' + (act.length ? " live" : "") + '"><b>' + act.length + '</b><small>Building</small></div></div>';
  h += "<h3>Building now</h3>" + (act.length ? act.map(runRow).join("") : '<div class="msg">Nothing is building.</div>');
  h += "<h3>Latest runs</h3>" + (S.runs.filter(w => !isAct(w)).slice(0, 5).map(runRow).join("") || '<div class="msg">No runs yet.</div>');
  return h;
}
function vBuilds() {
  const act = S.runs.filter(isAct);
  return "<h3>Running now (" + act.length + ")</h3>" + (act.map(runRow).join("") || '<div class="msg">Nothing is building.</div>') +
    "<h3>Recent</h3>" + (S.runs.filter(w => !isAct(w)).slice(0, 25).map(runRow).join("") || '<div class="msg">No runs found in your ' + MAXRUNREPOS + " most recently pushed repos.</div>");
}
function repoList() {
  const l = S.repos.filter(r => (filt === "all" || (filt === "private") === r.private) && r.name.toLowerCase().includes(q.toLowerCase()));
  return l.map(repoRow).join("") || '<div class="msg">No repos match.</div>';
}
function vRepos() {
  if (sel) return vDetail();
  return '<input id="q" placeholder="Search repos" autocomplete="off" value="' + esc(q) + '"><div class="chips">' +
    ["all", "public", "private"].map(f => '<button class="chip' + (filt === f ? " on" : "") + '" data-f="' + f + '">' + f[0].toUpperCase() + f.slice(1) + "</button>").join("") + '</div><div id="lst">' + repoList() + "</div>";
}
function vDetail() {
  const r = S.repos.find(x => x.full_name === sel) || {name: sel};
  let h = '<button class="bk" data-back="1">← Repos</button><h3 style="margin-top:0">' + esc(r.name) + "</h3>" +
    (r.description ? '<div class="crumb">' + esc(r.description) + "</div>" : "") +
    '<div class="crumb">' + esc([r.private ? "private" : "public", r.default_branch, r.language, r.size != null ? Math.round(r.size / 1024) + " MB" : "", r.open_issues_count != null ? r.open_issues_count + " open issues/PRs" : ""].filter(Boolean).join(" · ")) + "</div>";
  const rr = S.runs.filter(w => w.full === sel).slice(0, 5);
  h += "<h3>Builds</h3>" + (rr.map(runRow).join("") || '<div class="msg">No runs.</div>');
  h += "<h3>Files</h3><div class=\"crumb\">/" + esc(path) + "</div>";
  if (path) h += '<div class="row" data-up="1"><div class="tx"><b>..</b></div></div>';
  if (fbusy) h += '<div class="msg">Loading...</div>';
  else if (items === "err") h += '<div class="err">Could not list files.</div>';
  else if (items) h += items.map(i => '<div class="row"' + (i.type === "dir" ? ' data-dir="' + esc(i.path) + '"' : "") + '><div class="tx"><b>' + (i.type === "dir" ? "📁 " : "") + esc(i.name) + "</b></div>" + (i.type === "dir" ? "" : '<em class="n">' + (i.size > 1024 ? Math.round(i.size / 1024) + " KB" : i.size + " B") + "</em>") + "</div>").join("") || '<div class="msg">Empty.</div>';
  return h;
}
function vSet() {
  const u = S.user;
  return '<h3 style="margin-top:0">GitHub PIN</h3>' + (u ? '<div class="crumb">Signed in as <b>' + esc(u.login) + "</b></div>" : '<div class="crumb">Paste your fine-grained token (read-only: Contents, Actions, Metadata).</div>') +
    '<input id="tin" type="password" placeholder="' + (u ? "Replace PIN" : "Token") + '" autocomplete="off"><div class="chips"><button id="tsave" class="chip on">Save</button>' + (u ? '<button id="tdel" class="chip">Remove PIN</button>' : "") + '</div><div id="msg" class="err"></div>' +
    '<div class="crumb">Rate limit left: ' + esc(RL || "?") + " / 5000 per hour<br>NerdyGH v1 · read-only</div>";
}
function render() {
  if (!tok()) view = "set";
  const m = $("#main"), st = m.scrollTop;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.v === view));
  $("#sub").textContent = S.user ? S.user.login + " · " + S.repos.length + " repos" + (S.t ? " · updated " + new Date(S.t).toTimeString().slice(0, 5) : "") : "Not connected";
  const body = view === "home" ? vHome() : view === "builds" ? vBuilds() : view === "repos" ? vRepos() : vSet();
  m.innerHTML = (S.err && view !== "set" ? '<div class="err">' + esc(S.err) + "</div>" : "") + (!S.repos.length && tok() && busy ? '<div class="msg">Loading...</div>' : body);
  m.scrollTop = st;
}

$("#main").addEventListener("click", e => {
  const t = e.target.closest("[data-repo],[data-f],[data-back],[data-up],[data-dir],#tsave,#tdel"); if (!t) return;
  if (t.dataset.repo) { sel = t.dataset.repo; path = ""; loadFiles(); $("#main").scrollTop = 0; }
  else if (t.dataset.f) { filt = t.dataset.f; render(); }
  else if (t.dataset.back) { sel = null; items = null; render(); }
  else if (t.dataset.up) { path = path.split("/").slice(0, -1).join("/"); loadFiles(); }
  else if (t.dataset.dir) { path = t.dataset.dir; loadFiles(); }
  else if (t.id === "tdel") { setTok(""); S.user = null; S.repos = []; S.runs = []; render(); }
  else if (t.id === "tsave") saveTok();
});
$("#main").addEventListener("input", e => { if (e.target.id === "q") { q = e.target.value; $("#lst").innerHTML = repoList(); } });
async function saveTok() {
  const v = $("#tin").value.trim(); if (!v) return;
  $("#msg").textContent = "Checking..."; setTok(v);
  try { S.user = await api("/user"); S.repos = []; view = "home"; S.err = ""; refresh(true); render(); }
  catch (e) { setTok(""); S.user = null; $("#msg").textContent = e.message === "401" ? "GitHub rejected this PIN." : "Could not reach GitHub (" + e.message + ")."; }
}
$("#rf").onclick = () => refresh(true);
document.querySelectorAll("nav button").forEach(b => b.onclick = () => { view = b.dataset.v; if (view !== "repos") sel = null; render(); $("#main").scrollTop = 0; });

/* ---------- breathing line above the active nav icon (glides between tabs) ---------- */
const navGlow = document.createElement("i"); navGlow.className = "ng"; $("nav").appendChild(navGlow);
function navGlowPlace() { const b = document.querySelector("nav button.on"); if (!b || !b.offsetWidth) return; navGlow.style.width = (b.offsetWidth - 16) + "px"; navGlow.style.transform = "translateX(" + (b.offsetLeft + 8) + "px)"; }
new MutationObserver(navGlowPlace).observe($("nav"), {attributes: true, attributeFilter: ["class"], subtree: true});
window.addEventListener("resize", navGlowPlace); window.addEventListener("load", navGlowPlace);
navGlow.style.transition = "none"; navGlowPlace(); requestAnimationFrame(() => requestAnimationFrame(() => { navGlow.style.transition = ""; }));

/* ---------- swipe left/right to switch tabs (loops around) ---------- */
{ let t0 = null; const pg = $("#main");
  const slideIn = d => { pg.classList.remove("pgl", "pgr"); void pg.offsetWidth; pg.classList.add(d < 0 ? "pgl" : "pgr"); setTimeout(() => pg.classList.remove("pgl", "pgr"), 340); };
  pg.addEventListener("touchstart", e => { t0 = null; if (e.touches.length !== 1 || e.target.closest("input")) return; t0 = {x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now()}; }, {passive: true});
  pg.addEventListener("touchend", e => {
    if (!t0) return; const c = e.changedTouches[0], dx = c.clientX - t0.x, dy = c.clientY - t0.y, dt = Date.now() - t0.t; t0 = null;
    if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.8 || dt > 700) return;
    const bs = [...document.querySelectorAll("nav button")], i = bs.findIndex(b => b.classList.contains("on")), n = (i + (dx < 0 ? 1 : -1) + bs.length) % bs.length;
    if (i < 0 || n === i) return; bs[n].click(); slideIn(dx);
  }, {passive: true});
  pg.addEventListener("touchcancel", () => { t0 = null; }, {passive: true}); }

/* ---------- live refresh: every 45 s while Home or Builds is showing ---------- */
setInterval(() => { if (!document.hidden && tok() && (view === "home" || view === "builds")) refresh(++tick % 10 === 0); }, POLL);
document.addEventListener("visibilitychange", () => { if (!document.hidden && tok()) refresh(false); });
render(); if (tok()) refresh(true);
</script>
</body>
</html>
