        else if (e.key === "Home") t = 0;
        else if (e.key === "End") t = d;
        if (t === null) return;
        e.preventDefault(); e.stopPropagation(); audio.currentTime = Math.min(d, Math.max(0, t));
    });

    paintBtn(); paintMute(); paintBuffered(); paint();
}

// Wires up a page that has <audio data-ends="...">: pinned player, speed buttons, verse highlight + auto-scroll, tap a verse to play it.
// Pages without data-ends are left alone.
function initAudioSync() {
    const audio = contentBox.querySelector("audio[data-ends]");
    if (!audio) return;

    const ends = audio.dataset.ends.split(",").map(parseSyncTime);
    const blocks = Array.from(contentBox.querySelectorAll(".verse-block"));
    if (ends.some(isNaN)) { console.warn("Audio sync: bad data-ends value"); return; }
    if (ends.length > blocks.length) {
        console.warn("Audio sync: " + ends.length + " times but only " + blocks.length + " blocks");
    }   // fewer times than blocks is fine: the remaining blocks are simply not synced
    const n = Math.min(ends.length, blocks.length);
    const starts = ends.slice(0, n).map((_, i) => (i === 0 ? 0 : ends[i - 1]));
    // Pin the player in the static dock above the scrolling text
    let holder = audio.closest(".audio-player");
    if (!holder) {   // page had a bare <audio>: wrap it so it sits in the pinned player
        holder = document.createElement("div"); holder.className = "audio-player";
        audio.parentNode.insertBefore(holder, audio); holder.appendChild(audio);
    }
    audioDock.appendChild(holder);
    contentPanel.classList.add("has-dock");
    buildCustomPlayer(audio, holder);   // replaces the browser's native controls

    // Playback speed: one pill in the nav bar (tap for the other two) = 1x / 1.5x / 1.75x. Choice is remembered.
    audio.setAttribute("controlsList", "nodownload noplaybackrate");   // hide the browser's own speed menu
    const SPEED_BTNS = Array.from(document.querySelectorAll("#speedGroup .speed-btn"));
    const SPEED_VALUES = SPEED_BTNS.map(b => parseFloat(b.dataset.rate));
    let rate = 1;
    try { const v = parseFloat(localStorage.getItem("audioRate")); if (SPEED_VALUES.includes(v)) rate = v; } catch (e) {}
    function paintSpeed() {
        SPEED_BTNS.forEach(b => { const on = parseFloat(b.dataset.rate) === rate; b.classList.toggle("active", on); b.hidden = on; });   // the pop-up lists only the OTHER speeds
        if (window.setSpeedLabel) window.setSpeedLabel(rate);
    }
    function applyRate() { audio.defaultPlaybackRate = rate; audio.playbackRate = rate; }
        document.getElementById("speedMain").disabled = false;
    SPEED_BTNS.forEach(b => {
        b.disabled = false;
        b.onclick = () => {          // onclick (not addEventListener) so topics don't stack handlers
            rate = parseFloat(b.dataset.rate); applyRate(); paintSpeed();
            if (window.closeSpeedPop) window.closeSpeedPop();
            try { localStorage.setItem("audioRate", String(rate)); } catch (e) {}
        };
    });
    applyRate(); paintSpeed();
    audio.addEventListener("loadedmetadata", applyRate);   // some browsers reset the rate when the file loads

    contentBox.classList.add("sync-on");
    let active = -1;
    let syncDisabled = false;

    // If the mp3 is missing/unplayable: switch sync off so the page is plain, scrollable text.
    function disableSync() {
        if (syncDisabled) return;
        syncDisabled = true;
        if (active >= 0) blocks[active].classList.remove("verse-active");
        active = -1;
        contentBox.classList.remove("sync-on", "sync-playing");
        audioDock.innerHTML = '<div class="audio-missing">\uD83D\uDD07 Audio not available for this page</div>';
        scrollAnim = null;
    }
    const srcEl = audio.querySelector("source");
    if (srcEl) srcEl.addEventListener("error", disableSync);
    audio.addEventListener("error", disableSync);
    audio.preload = "metadata";            // make the browser try the file now, so a missing mp3 is noticed on load
    audio.load();
    setTimeout(() => {                      // safety net if no error event fires
        if (audio.readyState === 0 && audio.networkState === 3) disableSync();
    }, 5000);

    // which verse is playing at time t (-1 = after the last one)
    function blockAt(t) {
        for (let i = 0; i < n; i++) if (t < ends[i]) return i;
        return -1;   // after the last block: nothing highlighted
    }

    // glide so this verse sits at the top of the reading area (900 = animation length in ms)
    function scrollToBlock(block) {
        if (Stage.active) { Stage.show(block); return; }   // fixed-frame layouts: fade to the verse instead of scrolling
        const boxRect = contentBox.getBoundingClientRect();
        const blkRect = block.getBoundingClientRect();
        smoothScrollTo(contentBox.scrollTop + (blkRect.top - boxRect.top) - TOP_PAD, 900);   // verse goes to the top
    }

    // highlight + scroll to the verse being played; called as the audio moves
    function update() {
        if (syncDisabled) return;
        const i = blockAt(audio.currentTime);
        if (i === active) return;
        if (active >= 0) blocks[active].classList.remove("verse-active");
        active = i;
        if (i < 0) return;
        blocks[i].classList.add("verse-active");
        contentBox.querySelectorAll(".verse-focus").forEach(b => b.classList.remove("verse-focus"));   // audio highlight takes over from the arrow highlight
        scrollToBlock(blocks[i]);
    }

    // Verse arrows: jump the audio (playing or paused) to verse i; the sync then scrolls + highlights it, and Play continues from there
    window.audioSyncState = () => ({ active, started: active >= 0 && audio.currentTime > starts[active] + 0.05 });
    window.audioSyncSeek = i => {
        if (syncDisabled || i < 0 || i >= n) return false;
        audio.currentTime = starts[i] + 0.01;
        return true;
    };
    audio.addEventListener("play",       () => { contentBox.classList.add("sync-playing"); update(); });
    audio.addEventListener("pause",      () => contentBox.classList.remove("sync-playing"));
    audio.addEventListener("ended",      () => { contentBox.classList.remove("sync-playing"); update(); });
    audio.addEventListener("timeupdate", () => update());
    audio.addEventListener("seeked",     () => update());

    // Tap a block to jump to its start and play
    blocks.slice(0, n).forEach((block, i) => {
        block.addEventListener("click", () => {
            if (document.body.classList.contains("touch-locked")) return;   // touch lock: ignore taps on verses
            if (syncDisabled) return;
            clearTimeout(pendingTapPlay);
            pendingTapPlay = setTimeout(() => {      // short wait: a 2nd quick tap means "bookmark", not "play"
                audio.currentTime = starts[i] + 0.01;
                const p = audio.play();
                if (p && p.catch) p.catch(() => {});
            }, 280);
        });
    });
}


// ── MOBILE FIT: size EACH verse so its longest line just fits the width ──
const FIT_MIN = 12;   // px: smallest verse text; below this the verse wraps onto more lines instead of shrinking
const FIT_MAX = 30;   // px: phone portrait: short verses may grow up to this (desktop and landscape have their own maximums, see fitVerses)
// TEXT SIZE button (bottom bar): cycles Normal -> Big -> Small. The number is how much of the "fills the box" size is used.
const TEXT_K = 0.92;   // fixed verse text scale (the old "normal" size)
const SPLIT_K = 0.78;     // landscape, meaning shown (split view): verse text is this much smaller than in full view. 1 = no shrink, 0.7 = much smaller.
const PORTRAIT_K = 1.0;  // phone portrait: verse text scale (smaller = more room around the stanza)
// Landscape + portrait use ONE font size for every stanza of a prayer (the size the longest stanza needs), so the page looks uniform.
// Every verse line becomes its own block (.vl): a short line stays one row, a long line breaks once near the middle (balanced), lines get a small gap.
function splitLines(el) {
    const parts = el.innerHTML.split(/<br\s*\/?>/i).map(x => x.trim()).filter(Boolean);
    el._raw = parts;                 // the source lines, kept so the same text can be laid out in other ways (see setVerseMode)
    el.dataset.mode = "lines";
    el.innerHTML = parts.map(x => '<span class="vl">' + x + '</span>').join("");
}
// Verse layout modes:  "lines" = the source line breaks (portrait, desktop)
//                      "danda" = source breaks ignored; a new row starts after every | or || (landscape, meaning hidden)
//                      "flow"  = source breaks ignored; the stanza is one block that wraps naturally (landscape, meaning shown)
const DANDA = /[|\u0964\u0965]/;     // | , \u0964 and \u0965 (the Devanagari danda signs)
function breakAtDanda(text) {         // "... | ... ||" -> rows ending at each | / || (a verse number between || marks stays on its row)
    return text.replace(/((?:[|\u0964\u0965]+)(?:\s*[\d\-,]+\s*[|\u0964\u0965]+)?)\s+/g, "$1\n").split("\n").map(x => x.trim()).filter(Boolean);
}
function setVerseMode(sl, mode) {
    const raw = sl._raw; if (!raw) return;
    if (mode === "danda" && !DANDA.test(raw.join(" "))) mode = "lines";   // a stanza with no | at all keeps its own breaks
    if (sl.dataset.mode === mode) return;
    sl.dataset.mode = mode;
    const parts = mode === "lines" ? raw : mode === "flow" ? [raw.join(" ").replace(/\s+([|\u0964\u0965]+)/g, "\u00A0$1")] : breakAtDanda(raw.join(" "));
    sl.innerHTML = parts.map(x => '<span class="vl">' + x + '</span>').join("");
}
// ── LANGUAGES + VERSES ──
// Prayer pages hold, per verse, one block per language:  <div data-lang="te"><div class="sl">shloka</div><div class="mn">meaning</div></div>
// The page shows the shloka + meaning of the chosen language (button in the bar, saved). The tabs under each verse are a per-verse peek at
// another language's meaning. A new language = one more line in LANGS (+ its CSS font line) and one more data-lang block per verse.
const LANGS = [
    { code: "te", short: "తె", name: "తెలుగు" },
    { code: "en", short: "EN", name: "English" },
    { code: "hi", short: "हि", name: "हिन्दी" },
    { code: "fr", short: "FR", name: "Français" }

// A new language goes here.  
];
const LANG_KEY = "prayersLang";
let curLang = "te";
try { const sv = localStorage.getItem(LANG_KEY); if (LANGS.some(l => l.code === sv)) curLang = sv; } catch (e) {}

// Turns each .verse-block (one data-lang block per language) into: corner tag + verse box + meaning tabs. Runs after every page load.
function buildVerses() {
    const NUM_N = /^\d[\d\s,\-–]*$/;
    const numbered = Array.from(contentBox.querySelectorAll(".verse-block")).filter(b => NUM_N.test((b.dataset.n || "").trim()));   // cards that count in 2/72
    contentBox.querySelectorAll(".verse-block").forEach(block => {

            data[d.dataset.lang] = { sl: sl ? sl.innerHTML.trim().replace(/\s*\r?\n\s*/g, "<br>") : "", mn: mn ? mn.innerHTML.trim() : "" };   // line breaks in the shloka source become <br>

        // corner tag from data-n: a plain number -> "5/43" (position / total); any other text (e.g. "Doha 1") is shown as written

        // meaning tabs: one per language this verse has

        const box = document.createElement("div"); box.className = "mtabs";
        const bar = document.createElement("div"); bar.className = "mtab-bar"; bar.setAttribute("role", "tablist");
        box.appendChild(bar);

        const tabs = {}, panels = {};
        const show = code => {   // code = language to open, null = fold back to the blank strip
            box.dataset.active = code || "";

            items.forEach(l => {

        items.forEach(l => {
            const tab = document.createElement("button");
            tab.type = "button"; tab.className = "mtab mtab-" + l.code; tab.setAttribute("role", "tab"); tab.textContent = l.short; tab.title = l.name; tab.setAttribute("aria-label", l.name);
            bar.appendChild(tab);
            const panel = document.createElement("div");
            panel.className = "mtab-panel"; panel.setAttribute("role", "tabpanel");
            const mn = document.createElement("div"); mn.className = "mn"; mn.dataset.lang = l.code; mn.innerHTML = '<div class="mn-in">' + data[l.code].mn + '</div>';
            panel.appendChild(mn); box.appendChild(panel);
            tabs[l.code] = tab; panels[l.code] = panel;
            tab.addEventListener("click", e => { e.stopPropagation(); show(box.dataset.active === l.code ? null : l.code); });
        });

            const t = Array.from(bar.children), i = t.indexOf(document.activeElement); if (i < 0) return;

        block.appendChild(box);
        // language change: refill the shloka and open that language's meaning (empty panel when this verse lacks it)
        const firstSl = LANGS.map(l => l.code).find(c => data[c] && data[c].sl);   // a language with no verse text of its own shows the first one that has it
        block._apply = code => { const sc = (data[code] && data[code].sl) ? code : firstSl; sl.dataset.lang = sc || code; sl.innerHTML = sc ? data[sc].sl : ""; splitLines(sl); show(data[code] && data[code].mn ? code : null); };
        block._apply(curLang);

}

// Picks the biggest font size at which the whole verse fits its box (width AND height). Long lines break once (balanced) instead of shrinking the whole stanza;
// short verses grow when there is room. Limits: FIT_MIN, and a maximum per layout.
function fitVerses() {
    const all = Array.from(contentBox.querySelectorAll(".verse-block, .verse-refrain"));
    const land = window.matchMedia("(orientation: landscape) and (max-height: 520px)").matches;   // phone landscape focus mode
    const desktop = window.matchMedia("(min-width: 701px) and (min-height: 521px)").matches;       // desktop / tablet: the stacked frame, verse sized to its box
    if (!land && !desktop && !window.matchMedia("(max-width: 700px)").matches) {
        all.forEach(b => { b.style.fontSize = ""; b.style.whiteSpace = ""; });
        return;
    }
    const blocks = desktop ? all.filter(b => b.classList.contains("verse-block")) : all;   // desktop: refrain blocks keep their normal size
    all.filter(b => !blocks.includes(b)).forEach(b => { b.style.fontSize = ""; b.style.whiteSpace = ""; });
    const MAXPX = land ? 36 : (desktop ? 48 : FIT_MAX);
    const portrait = window.matchMedia("(max-width: 700px) and (orientation: portrait), (min-width: 701px) and (min-height: 521px)").matches;   // stacked frame (phone portrait, desktop, tablet)
    if (!contentBox.clientWidth) return;   // content hidden (topic list is open)
    const stageEl = contentBox.querySelector(":scope > .stage");
    const meaningHidden = !!(land && stageEl && stageEl.classList.contains("mhide"));   // landscape: meaning slid away, the verse has the whole width
    const splitView = land && !meaningHidden;                         // landscape with the meaning shown -> smaller verse text, natural wrapping
    const phonePortrait = !land && !desktop;
    contentBox.querySelectorAll(".verse-block .sl").forEach(sl => setVerseMode(sl, land ? (meaningHidden ? "danda" : "flow") : "lines"));
    const fitKey = land ? "l" : (desktop ? "d" : "p");                // layout changed (e.g. phone turned): jump to the new size, no gliding
    const sameLayout = (window._lastFitKey === fitKey); window._lastFitKey = fitKey;
    const TEST = 20, GAP = 0.28, K = TEXT_K * (splitView ? SPLIT_K : (phonePortrait ? PORTRAIT_K : 1));   // GAP = space between verse lines in em (same number in the .vl CSS)
    const prevSize = blocks.map(b => sameLayout ? b.style.fontSize : "");   // remember the current sizes so a change can glide instead of jump
    contentBox.classList.add("fit-measure");                          // measuring: every row on one line, so its true width can be read
    blocks.forEach(b => { b.style.transition = "none"; b.style.whiteSpace = "nowrap"; b.style.fontSize = TEST + "px"; });
    const range = document.createRange();
    const results = blocks.map(b => {
        const cs = getComputedStyle(b);
        let avail = b.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
        if (land && b.classList.contains("verse-block")) avail = meaningHidden ? avail : (avail - 20) / 2;   // landscape: verse = left half, purport = right half
        const slEl = b.querySelector(":scope > .verse-grid .sl");
        if (slEl) {   // the verse sits in a bordered box: fit it to the space inside the box
            const grid = slEl.parentElement, gs = getComputedStyle(grid);
            avail -= parseFloat(gs.paddingLeft) + parseFloat(gs.paddingRight) + parseFloat(gs.borderLeftWidth) + parseFloat(gs.borderRightWidth);
            const lineEls = Array.from(slEl.children).filter(c => c.classList.contains("vl"));
            const w20 = (lineEls.length ? lineEls : [slEl]).map(l => { range.selectNodeContents(l); return range.getBoundingClientRect().width; });   // each line's width at TEST px
            const widest = Math.max(...w20, 1);
            const padT = parseFloat(gs.paddingTop), padB = parseFloat(gs.paddingBottom);
            let availH = 0;
            const inFlow = !!(b.parentNode && b.parentNode.classList && b.parentNode.classList.contains("flow-list"));   // flow list: block height = its own text, so use the card height instead (same size as split view)
            if (inFlow) availH = (contentBox.clientHeight - 6 - 14) * 0.60 - padT - padB;
            else { slEl.style.display = "none"; availH = grid.clientHeight - padT - padB; slEl.style.display = ""; }   // the verse box with the text taken out = the room it has (portrait: its CSS minimum height; landscape: the full column)
            if (land && availH > 0) availH = Math.min(availH, contentBox.clientHeight - 36 - padT - padB);
            const lh = parseFloat(getComputedStyle(slEl).lineHeight) / TEST;       // line height per 1px of font size
            const rowFill = slEl.dataset.mode === "flow" ? 0.90 : 0.96;            // natural wrapping wastes some room at the row ends
            let f = MAXPX;
            if (availH > 0 && lh > 0 && lineEls.length) {
                const heightAt = ff => { let rows = 0; w20.forEach(w => { rows += Math.max(1, Math.ceil((w * ff / TEST) / (avail * rowFill))); }); return ff * (rows * lh + GAP * (w20.length - 1)); };
                while (f > FIT_MIN && heightAt(f) > availH) f -= 0.5;
            } else f = Math.min(MAXPX, TEST * (avail / Math.max(widest, 1)) * 0.98);   // no height to go by: fit the widest line
            if (slEl.dataset.mode === "danda") f = Math.min(f, TEST * (avail / Math.max(widest, 1)) * 0.97);   // every | row must stay on ONE line
            return Math.max(f * K, 10);
        }
        range.selectNodeContents(b);
        const w = range.getBoundingClientRect().width;     // width of widest line (refrains, headings)
        return w > 0 ? TEST * (avail / w) * 0.98 : MAXPX;
    });
    contentBox.classList.remove("fit-measure");
    if (land || phonePortrait) {          // one size for every stanza: the smallest any stanza needs
        const idx = blocks.map((b, i) => i).filter(i => blocks[i].querySelector(":scope > .verse-grid .sl"));
        if (idx.length) { const m = Math.min(...idx.map(i => Math.min(results[i], MAXPX))); idx.forEach(i => { results[i] = m; }); }
    }
    blocks.forEach((b, i) => { if (prevSize[i]) b.style.fontSize = prevSize[i]; });   // back to the old size (no transition) ...
    void contentBox.offsetWidth;
    blocks.forEach(b => { b.style.transition = prevSize[blocks.indexOf(b)] ? "font-size .35s ease" : "none"; });   // ... then the new size is reached smoothly
    blocks.forEach((b, i) => {
        const fs = results[i];
        if (b.querySelector(":scope > .verse-grid .sl")) { b.style.whiteSpace = ""; b.style.fontSize = (Math.floor(Math.min(fs, MAXPX) * 10) / 10) + "px"; return; }
        if (fs < FIT_MIN) { b.style.fontSize = FIT_MIN + "px"; b.style.whiteSpace = "normal"; }
        else { b.style.fontSize = (Math.floor(Math.min(fs, MAXPX) * 10) / 10) + "px"; b.style.whiteSpace = ""; }
    });
    if (Stage.active) { Stage.recentre(); clearTimeout(window._recentreT); window._recentreT = setTimeout(() => Stage.recentre(), 420); }   // sizes changed: keep the stanza in the middle (again after the glide)
}
let fitTimer;
window.addEventListener("resize", () => { clearTimeout(fitTimer); fitTimer = setTimeout(fitVerses, 120); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitVerses);

// ── BOOKMARK + REOPEN LAST CHAPTER ──────────────────────────────────────

const BM_KEY = "prayersBookmark", LAST_KEY = "prayersLastTopic";

// Double-tap detection (capture phase = runs before the verse's own tap-to-play handler)
let lastTapEl = null, lastTapAt = 0;
contentBox.addEventListener("click", e => {
    if (document.body.classList.contains("touch-locked")) { lastTapEl = null; return; }   // touch lock: no double-tap bookmark either
    const block = blockFromTarget(e.target);
    if (!block) { lastTapEl = null; return; }
    const now = Date.now();
    if (lastTapEl === block && now - lastTapAt < DOUBLE_TAP_MS) {
        e.stopPropagation();                 // 2nd tap: don't start audio
        clearTimeout(pendingTapPlay);        // ...and cancel the audio the 1st tap queued
        lastTapEl = null;
        toggleBookmark(block);
        return;
    }
    lastTapEl = block; lastTapAt = now;
}, true);
contentBox.addEventListener("mousedown", e => {      // desktop: stop the double-click from selecting a word
    if (e.detail > 1 && blockFromTarget(e.target)) e.preventDefault();
});
["wheel", "touchstart", "mousedown"].forEach(evt =>
    contentBox.addEventListener(evt, () => { bmUserMoved = true; }, { passive: true }));

// scroll the bookmarked verse into view (and flash it when asked)
function scrollToBookmarkBlock(flash) {
    const el = bookmark && bookmarkables()[bookmark.index];
    if (!el) return false;
    if (Stage.active) {
        Stage.show(el);
        if (flash) { el.classList.add("bm-flash"); setTimeout(() => el.classList.remove("bm-flash"), 1500); }
        return true;
    }
    const box = contentBox.getBoundingClientRect(), r = el.getBoundingClientRect();
    const want = r.height > contentBox.clientHeight - 16 ? 8 : (contentBox.clientHeight - r.height) / 2;
    scrollAnim = null;
    contentBox.scrollTop += (r.top - box.top) - want;
    if (flash) { el.classList.add("bm-flash"); setTimeout(() => el.classList.remove("bm-flash"), 1500); }
    return true;
}
function jumpToBookmarkSoon() {      // verses get resized right after a prayer loads, so aim again a moment later
    bmUserMoved = false;
    const go = first => { if (!bmUserMoved) scrollToBookmarkBlock(first); };
    go(true);
    setTimeout(() => go(false), 350);
    setTimeout(() => go(false), 900);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => go(false));
}
if (bmBtn) bmBtn.addEventListener("click", () => {
    if (!bookmark) { showToast("No bookmark yet — double-tap a verse to place one"); return; }
    const i = flatTopics.findIndex(t => t.path === bookmark.path);
    if (i < 0) { showToast("Bookmarked prayer not found"); return; }
    if (i === currentFlatIndex && pageLoaded) {
        if (!scrollToBookmarkBlock(true)) showToast("Couldn't find the bookmarked verse");
        return;
    }
    pendingJump = true;              // open the prayer first; the jump happens once it has loaded
    loadTopic(i);
});
paintBmBtn();

// ── LOAD TOPIC ──────────────────────────────────────────────────────────
// ── PREFACE ──
// The preface file holds one <main class="preface-language" data-lang="xx"> per language. Show the chosen language; a language with no
// text yet falls back to English. To add a language later: copy the English <main>, set data-lang / lang, translate. Nothing here changes.
function applyPreface() {
    const pages = Array.from(contentBox.querySelectorAll(".preface-language"));
    if (!pages.length) return;
    const has = c => pages.find(p => p.dataset.lang === c && p.textContent.trim());
    const pick = has(curLang) || has("en") || pages[0];
    pages.forEach(p => { p.hidden = p !== pick; });
}
function initPreface() {
    if (!contentBox.querySelector(".preface-language")) return;
    applyPreface();
    contentBox.querySelectorAll(".preface-language .next").forEach(n => {   // "Tap Next to begin with the first prayer" is tappable too
        n.setAttribute("role", "button"); n.tabIndex = 0;
        n.onclick = () => loadTopic(currentFlatIndex + 1);
        n.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); n.click(); } };
    });
}

// ── REMEMBER WHERE YOU WERE (per prayer): audio time, whether it was playing, and the verse on screen ──
const topicMemory = {};
function rememberPosition(index) {
    if (index < 0 || !flatTopics[index] || !pageLoaded) return;      // nothing loaded (or still loading): keep what was saved before
    const blocks = Array.from(contentBox.querySelectorAll(".verse-block"));
    const a = document.querySelector("#content-panel audio");
    let verse = -1;
    if (Stage.active && Stage.items[Stage.index]) verse = blocks.indexOf(Stage.items[Stage.index].el);
    else if (contentBox.scrollTop >= 2) {
        const line = contentBox.getBoundingClientRect().top + TOP_PAD + 8;
        for (let i = 0; i < blocks.length; i++) { if (blocks[i].getBoundingClientRect().top <= line) verse = i; else break; }
    }
    const finished = a && a.duration && a.currentTime >= a.duration - 1;   // played to the end: start fresh next time
    topicMemory[flatTopics[index].path] = { time: a && !finished ? a.currentTime : 0, playing: !!(a && !a.paused && !a.ended), verse };
}
function restorePosition(topic) {
    const m = topicMemory[topic.path];
    if (!m) return;
    const a = document.querySelector("#content-panel audio");
    if (a && m.time > 0.5) {                                          // audio prayer: jump the audio back (the sync highlights + scrolls to the verse)
        const seek = () => {
            try { a.currentTime = m.time; } catch (e) {}
            if (m.playing) { const p = a.play(); if (p && p.catch) p.catch(() => {}); }   // it was playing when you left: carry on
        };
        if (a.readyState >= 1) seek(); else a.addEventListener("loadedmetadata", seek, { once: true });
        return;
    }
    const blocks = Array.from(contentBox.querySelectorAll(".verse-block"));
    if (m.verse >= 0 && blocks[m.verse]) {                            // no audio: put the same verse back
        const go = () => {
            if (Stage.active) Stage.show(blocks[m.verse]);
            else contentBox.scrollTop = topOf(blocks[m.verse].getBoundingClientRect(), contentBox.getBoundingClientRect());
        };
        go(); setTimeout(go, 400);
    }
}

function loadTopic(flatIndex) {
    if (flatIndex < 0 || flatIndex >= flatTopics.length) return;
    if (flatIndex === currentFlatIndex && pageLoaded) {   // same prayer is already open (maybe playing): just go back to it, no reload
        if (window.matchMedia("(max-width: 700px)").matches) {
            setSidebarCollapsed(true);
            if (window.restoreVerseView) window.restoreVerseView();
        }
        return;
    }
    rememberPosition(currentFlatIndex);   // leaving a prayer: note where you were
    currentFlatIndex = flatIndex;
    const topic = flatTopics[flatIndex];
    pageLoaded = false;
    try { localStorage.setItem(LAST_KEY, topic.path); } catch (e) {}   // BOOKMARK/REOPEN: remember last prayer
    stopAudioSync();   // (added) stop previous topic's audio
    Stage.release();   // forget the fixed frame of the previous prayer
    if (window.matchMedia("(max-width: 700px)").matches) setSidebarCollapsed(true);   // phone: hide list after picking

    flatTopics.forEach(t => t.el.classList.remove("active", "last-read"));
    topic.el.classList.add("active");
    topic.el.scrollIntoView({ block: "nearest" });

    counterEl.textContent = counterText(flatIndex);
    prayerNames = null; stripEnable(false, "");   // strip off while the next prayer loads
    contentBox.innerHTML = '<div style="color:#8a7a5a;text-align:center;padding:40px 0;">Loading…</div>';
    copyBtn.classList.remove("show");
    document.getElementById("verseNav").classList.remove("show");

    fetch(topic.path)
        .then(r => {
            if (r.status === 404) { const e = new Error("missing"); e.isMissing = true; throw e; }   // page not written yet
            if (!r.ok) throw new Error("HTTP " + r.status + " for " + topic.path);
            return r.text();
        })
        .then(raw => {
            if (currentFlatIndex !== flatIndex) return;   // another topic was picked meanwhile: drop this stale response
            contentBox.innerHTML = raw;
            contentBox.scrollTop = 0;
            readPrayerNames();   // hidden <div class="prayer-names"> -> strip text (then removed from the page)
            initPreface();   // preface page (no verses): show the chosen language, wire "Tap Next"
            buildVerses();   // build tag + shloka + meaning tabs from the language blocks (before audio sync / fitting look at the blocks)
            initAudioSync();   // (added) wire up audio highlighting if the page has it
            placeCopyBtn(); copyBtn.classList.add("show");
            const hasVerses = !!contentBox.querySelector(".verse-block");
            stripEnable(hasVerses, cleanLabel(topic.label));   // the strip only exists on pages with verses
            document.getElementById("verseNav").classList.toggle("show", hasVerses);
            placeVerseNav();
            if (hasVerses) { const sp = document.createElement("div"); sp.className = "end-spacer"; contentBox.appendChild(sp); }
            Stage.refresh();   // layouts that use the fixed frame: put the verses on the stage
            scheduleStrip();
            placeVerseNav();
            fitVerses();
            setTimeout(fitVerses, 300);   // re-fit once fonts settle
            restorePosition(topic);   // coming back to a prayer visited before: same audio point / verse
            pageLoaded = true; markBookmark(topic);   // BOOKMARK: draw the dog-ear if it is in this prayer
            if (pendingJump) { pendingJump = false; jumpToBookmarkSoon(); }
        })
        .catch(err => {
            if (err.isMissing) {   // missing page = work in progress: just an icon
                contentBox.innerHTML = '<div role="img" aria-label="Work in progress" title="Work in progress" ' +
                    'style="text-align:center;font-size:64px;padding:70px 0;">🚧</div>';
                return;
            }
            contentBox.innerHTML =
                '<div style="color:#b5432f;padding:12px 0;text-align:center;">' + err.message +
                '<br><br>Make sure this page is served over http(s) (e.g. GitHub Pages or a local server) — ' +
                'opening the file directly (file://) blocks fetch() for security reasons.</div>';
        });
}

// ── PRAYER NAME STRIP ───────────────────────────────────────────────────
// A thin strip with the prayer's name (in the chosen language) that appears as soon as the intro card has left the screen,
// and goes away again when you are back at the intro card. The name comes from a hidden block in each prayer page:
//     <div class="prayer-names" hidden>
//       <span data-lang="te">…</span> <span data-lang="en">…</span> <span data-lang="hi">…</span> <span data-lang="fr">…</span>
//     </div>
// (fallback order: chosen language -> en -> te -> the name in the prayer list). The block is read once, then removed from the page.
// "Intro card" = the first .intro-card on the page (or, if a page has none, the first verse).
const titleStrip = document.getElementById("titleStrip"), tsName = titleStrip.querySelector(".ts-name");
let prayerNames = null, stripEnabled = false, stripFallback = "", stripRaf = 0, stripFade = false;
function readPrayerNames() {
    prayerNames = null;
    const box = contentBox.querySelector(".prayer-names");
    if (!box) return;
    prayerNames = {};
    box.querySelectorAll("[data-lang]").forEach(n => { const t = n.textContent.trim(); if (t) prayerNames[n.dataset.lang] = t; });
    box.remove();
}
function stripSetName() {
    const n = prayerNames || {};
    const code = n[curLang] ? curLang : (n.en ? "en" : (n.te ? "te" : (Object.keys(n)[0] || "en")));
    tsName.textContent = n[code] || stripFallback;
    titleStrip.lang = n[code] ? code : "en";
}
function stripEnable(on, fallbackName) { stripEnabled = on; stripFallback = fallbackName || ""; stripSetName(); scheduleStrip(); }
function scheduleStrip() { if (!stripRaf) stripRaf = requestAnimationFrame(updateStrip); }
function updateStrip() {
    stripRaf = 0;
    const fadeStage = contentBox.querySelector(":scope > .stage:not(.flow)");       // landscape: one verse at a time in a fixed box
    const flowStage = contentBox.querySelector(":scope > .stage.flow");             // portrait: the stanzas scroll in one list
    const mode = fadeStage ? "fade" : (flowStage ? "flow" : "");
    let show = false;
    const anchor = stripEnabled ? (contentBox.querySelector(".intro-card") || contentBox.querySelector(".verse-block")) : null;
    if (anchor) {
        const item = anchor.closest(".stage-item");
        if (mode === "fade" && item) show = !item.classList.contains("is-current");     // the intro page has faded out
        else {                                                                          // scrolling: the intro card has moved off the top
            const box = anchor.closest(".flow-list") || contentBox;
            show = anchor.getBoundingClientRect().bottom <= box.getBoundingClientRect().top + 8;
        }
    }
    const fadeOn = show && mode === "fade";
    if (fadeOn !== stripFade) {                                                         // landscape: the box steps down / back up, so re-fit the verse
        stripFade = fadeOn; contentBox.classList.toggle("strip-on", fadeOn);
        if (window.fitVerses) { fitVerses(); setTimeout(fitVerses, 120); }
    }
    const ct = contentBox.offsetTop, st = titleStrip.style;
    if (mode === "fade")      { st.left = (parseFloat(getComputedStyle(contentBox).paddingLeft) + 14) + "px"; st.right = "22px"; st.top = (ct + 8) + "px"; }
    else if (mode === "flow") { st.left = "8px"; st.right = "8px"; st.top = (ct + 6) + "px"; }
    else                      { st.left = "0px"; st.right = "0px"; st.top = ct + "px"; }
    titleStrip.classList.toggle("boxed", mode !== "");
    titleStrip.classList.toggle("show", show);
}
contentBox.addEventListener("scroll", scheduleStrip, { passive: true, capture: true });     // also catches the stanza list scrolling inside the box
const stripMO = new MutationObserver(scheduleStrip);
stripMO.observe(contentBox, { subtree: true, childList: true, attributes: true, attributeFilter: ["class"] });   // new page, next verse, stage built / removed
stripMO.observe(contentPanel, { attributes: true, attributeFilter: ["class"] });                                  // audio dock appears -> strip moves down
if (window.ResizeObserver) { const ro = new ResizeObserver(scheduleStrip); ro.observe(contentBox); ro.observe(audioDock); }
window.addEventListener("resize", scheduleStrip);

// ── COPY BUTTON ──────────────────────────────────────────────────────────
const copyBtn = document.getElementById("copyBtn");
function placeCopyBtn() {   // sit just below the audio dock (if any), top-right of the text area
    copyBtn.style.top = ((contentPanel.classList.contains("has-dock") ? audioDock.offsetHeight : 0) + 8) + "px";
}
if (window.ResizeObserver) new ResizeObserver(placeCopyBtn).observe(audioDock);
window.addEventListener("resize", placeCopyBtn);

// keep the reading-area height in a CSS variable (used by .verse-block min-height)
function setAreaH() { contentBox.style.setProperty("--area-h", contentBox.clientHeight + "px"); placeVerseNav(); }
// Arrows sit inside the verse card's bottom-right corner (follows the card on desktop where it is centred and narrower)
function placeVerseNav() {
    const nav = document.getElementById("verseNav"), card = contentBox.querySelector(".verse-block");
    if (!card || !nav.classList.contains("show")) return;
    const panel = nav.parentElement.getBoundingClientRect(), c = card.getBoundingClientRect();
    if (c.width) nav.style.right = Math.max(8, Math.round(panel.right - c.right + 12)) + "px";
}
setAreaH();
if (window.ResizeObserver) new ResizeObserver(setAreaH).observe(contentBox); else window.addEventListener("resize", setAreaH);

// ── VERSE ARROWS + SNAP ──────────────────────────────────────────────────
// A verse sits at the TOP of the reading area. Down = the next verse that starts below the top line, Up = the previous verse
// that starts above it (inside a long verse, Up first returns to its start). With audio on the page the audio jumps to the verse
// (the sync scrolls + highlights it); without audio the verse is highlighted here.
function topOf(rect, box) { return contentBox.scrollTop + (rect.top - box.top) - TOP_PAD; }
// fixed-frame layouts (Stage): previous / next card; with audio the audio jumps and the sync fades to it
function stepVerseStaged(dir) {
    const n = Stage.items.length; if (!n) return;
    const to = (Stage.index + dir + n) % n;   // LOOP: past the last card wraps to the first, and vice versa
    const it = Stage.items[to], blocks = Array.from(contentBox.querySelectorAll(".verse-block"));
    blocks.forEach(b => b.classList.remove("verse-focus"));
    if (it.verse) {
        const i = blocks.indexOf(it.el);
        if (window.audioSyncSeek && window.audioSyncSeek(i)) {
            if (it.el.classList.contains("verse-active")) Stage.show(it.el);   // already the chanted verse: the sync will not move, so show it here
            return;
        }
        it.el.classList.add("verse-focus");
    }
    Stage.show(it.el);
}
function stepVerse(dir) {
    if (Stage.active) { stepVerseStaged(dir); return; }
    const blocks = Array.from(contentBox.querySelectorAll(".verse-block"));
    if (!blocks.length) return;
    const box = contentBox.getBoundingClientRect(), line = box.top + TOP_PAD, tol = 8;
    const rects = blocks.map(b => b.getBoundingClientRect());
    let i = -1;
    if (dir > 0) {
        i = rects.findIndex(r => r.top > line + tol);
        const st = window.audioSyncState && window.audioSyncState();
        if (st && st.started && st.active === i) i++;                 // that verse is already being chanted (e.g. the opening, still above its card): go one further
        if (i < 0 || i >= blocks.length) i = 0;                       // LOOP: past the last verse wraps to the first
    } else {
        for (let k = rects.length - 1; k >= 0; k--) if (rects[k].top < line - tol) { i = k; break; }
        if (i < 0 && contentBox.scrollTop <= 2) i = blocks.length - 1;   // LOOP: already at the top, so Up wraps to the last verse
        if (i < 0) {                                                  // above the first verse: back to the very top
            blocks.forEach(b => b.classList.remove("verse-focus"));
            smoothScrollTo(0, 700); return;
        }
    }
    blocks.forEach(b => b.classList.remove("verse-focus"));
    if (window.audioSyncSeek && window.audioSyncSeek(i)) {              // prayer with audio: the audio jumps, the sync highlights + scrolls
        if (blocks[i].classList.contains("verse-active")) smoothScrollTo(topOf(rects[i], box), 700);   // same verse already active: scroll ourselves
        return;
    }
    blocks[i].classList.add("verse-focus");
    smoothScrollTo(topOf(rects[i], box), 700);
}

// When scrolling stops, glide to the nearest verse top (or the prayer top). Not while a finger is down, and not inside a long
// verse (e.g. English open): there it only snaps once the next verse is close.
let touchingBox = false, snapTimer = null;
function snapToNearest() {
    if (Stage.active || touchingBox || scrollAnim) return;
    const blocks = Array.from(contentBox.querySelectorAll(".verse-block"));
    if (!blocks.length) return;
    const box = contentBox.getBoundingClientRect(), h = contentBox.clientHeight, cur = contentBox.scrollTop;
    let best = { target: 0, el: null }, bestD = -cur;                 // the prayer top is a snap point too
    blocks.forEach(b => {
        const r = b.getBoundingClientRect(), target = topOf(r, box), d = target - cur;
        if (d < 0 && r.bottom > box.bottom + 4) return;               // still inside a tall verse: don't pull back to its start
        if (Math.abs(d) < Math.abs(bestD)) { best = { target, el: b }; bestD = d; }
    });
    if (Math.abs(bestD) > h * 0.35) return;                           // not near any verse: leave it where the reader stopped
    if (!window.audioSyncSeek) {                                       // no audio: highlight the verse at the top
        blocks.forEach(b => b.classList.remove("verse-focus"));
        if (best.el) best.el.classList.add("verse-focus");
    }
    if (Math.abs(bestD) < 2) return;
    smoothScrollTo(best.target, 500);
}
contentBox.addEventListener("scroll", () => { clearTimeout(snapTimer); snapTimer = setTimeout(snapToNearest, 160); }, { passive: true });
contentBox.addEventListener("touchstart", () => { touchingBox = true; }, { passive: true });
["touchend", "touchcancel"].forEach(ev => contentBox.addEventListener(ev, () => {
    touchingBox = false; clearTimeout(snapTimer); snapTimer = setTimeout(snapToNearest, 160);
}, { passive: true }));
document.getElementById("versePrev").addEventListener("click", () => stepVerse(-1));
document.getElementById("verseNext").addEventListener("click", () => stepVerse(1));

// the page text without buttons / audio, for the Copy button
function topicPlainText() {
    const c = contentBox.cloneNode(true);
    c.querySelectorAll("audio, .audio-player, script, style, button").forEach(n => n.remove());
    // collapse HTML source whitespace first, then turn <br> and block ends into real line breaks
    const tw = document.createTreeWalker(c, NodeFilter.SHOW_TEXT);
    for (let n = tw.nextNode(); n; n = tw.nextNode()) n.nodeValue = n.nodeValue.replace(/\s+/g, " ");
    c.querySelectorAll("br").forEach(br => br.replaceWith("\n"));
    c.querySelectorAll("p,div,h1,h2,h3,h4,h5,h6,ul,ol,blockquote,hr").forEach(el => el.append("\n\n"));
    c.querySelectorAll("li").forEach(el => el.append("\n"));
    return c.textContent.split("\n").map(l => l.trim()).join("\n").replace(/\n{3,}/g, "\n\n").trim();
}
// copies text to the clipboard (with a fallback for plain http / file://)
function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    return new Promise((res, rej) => {   // fallback for plain http / file://
        const ta = document.createElement("textarea");
        ta.value = text; ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
        document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy") ? res() : rej(); } catch (e) { rej(e); } finally { ta.remove(); }
    });
}
copyBtn.onclick = () => {
    copyText(topicPlainText()).then(() => {
        copyBtn.classList.add("done"); copyBtn.title = "Copied";
        setTimeout(() => { copyBtn.classList.remove("done"); copyBtn.title = "Copy text"; }, 1600);
    }).catch(() => { copyBtn.title = "Copy failed"; });
};

document.getElementById("prevBtn").onclick = () => loadTopic(currentFlatIndex - 1 < 0 ? flatTopics.length - 1 : currentFlatIndex - 1);
document.getElementById("nextBtn").onclick = () => loadTopic((currentFlatIndex + 1) % flatTopics.length);

document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.tagName === "AUDIO") return;  // (added) AUDIO: arrows seek
    if (e.key === "ArrowRight") { e.preventDefault(); document.getElementById("nextBtn").click(); }
    if (e.key === "ArrowLeft")  { e.preventDefault(); document.getElementById("prevBtn").click(); }
});

// Swipe the text area: left = Next prayer, right = Previous prayer (only while unlocked)
(function () {
    let sx = 0, sy = 0, st = 0, tracking = false;
    contentBox.addEventListener("touchstart", e => {
        tracking = e.touches.length === 1;
        if (!tracking) return;
        sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now();
    }, { passive: true });
    contentBox.addEventListener("touchcancel", () => { tracking = false; }, { passive: true });
    contentBox.addEventListener("touchend", e => {
        if (!tracking) return;
        tracking = false;
        const t = e.changedTouches[0];
        const dx = t.clientX - sx, dy = t.clientY - sy;
        if (Date.now() - st > 700) return;                          // slow drag: not a swipe
        if (Math.abs(dx) < 70 || Math.abs(dy) > Math.abs(dx) * 0.5) return;   // too short, or mostly vertical (scrolling)
        const sel = window.getSelection && window.getSelection();
        if (sel && !sel.isCollapsed) return;                        // user is selecting text
        if (document.body.classList.contains("touch-locked")) {     // touch lock: a real swipe only shows the hint
            if (window.showLockHint) window.showLockHint();
            return;
        }
        document.getElementById(dx < 0 ? "nextBtn" : "prevBtn").click();
    }, { passive: true });
})();


// ── SEARCH ───────────────────────────────────────────────────────────────
const searchInput = document.getElementById("topic-search");
const searchCount = document.getElementById("search-count");
const searchClear = document.getElementById("search-clear");

// filters the list rows as you type (the search box is hidden for now, see #sidebar-search-row)
function runSearch() {
    const q = normalizeSearch(searchInput.value.trim());
    searchClear.classList.toggle("visible", searchInput.value.length > 0);

    if (!q) {
        flatTopics.forEach(t => t.el.classList.remove("search-match", "search-dim"));
        document.querySelectorAll(".category-block").forEach(b => b.classList.remove("collapsed", "search-dim-all"));
        searchCount.textContent = "";
        return;
    }

    let matches = 0;
    flatTopics.forEach(t => {
        const isMatch = t.el.dataset.search.includes(q);
        t.el.classList.toggle("search-match", isMatch);
        t.el.classList.toggle("search-dim", !isMatch);
        if (isMatch) matches++;
    });

    document.querySelectorAll(".category-block").forEach(block => {
        const hasMatch = !!block.querySelector(".topic-item.search-match");
        block.classList.remove("collapsed");
        block.classList.toggle("search-dim-all", !hasMatch && block.querySelectorAll(".topic-item").length > 0);
    });

    searchCount.textContent = matches === 0 ? "No topics found" : matches + " topic" + (matches === 1 ? "" : "s") + " found";
}

searchInput.addEventListener("input", runSearch);
searchClear.addEventListener("click", () => { searchInput.value = ""; runSearch(); searchInput.focus(); });
searchInput.addEventListener("keydown", e => {
    if (e.key === "Escape" && searchInput.value) { e.stopPropagation(); searchInput.value = ""; runSearch(); }
});

// ── SIDEBAR COLLAPSE ──────────────────────────────────────────────────
const sidebarEl = document.getElementById("sidebar");
const toggleBtn  = document.getElementById("sidebar-toggle");
const SIDE_CLOSE_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg>';   // double chevron pointing left = tuck the panel away
const SIDE_OPEN_SVG  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 17l5-5-5-5M6 17l5-5-5-5"/></svg>';    // double chevron pointing right = bring it back
// opens / closes the prayer list (full-width list on phones, narrow rail on desktop)
function setSidebarCollapsed(collapsed) {
    sidebarEl.classList.toggle("collapsed", collapsed);
    toggleBtn.innerHTML = collapsed ? SIDE_OPEN_SVG : SIDE_CLOSE_SVG;
    toggleBtn.title = collapsed ? "Expand sidebar" : "Collapse sidebar";
    toggleBtn.setAttribute("aria-label", toggleBtn.title);
    tooltipEl.classList.remove("visible");
    document.body.classList.toggle("side-open", !collapsed);
    const mb = document.getElementById("menuBtn");
    if (mb) mb.classList.toggle("open", !collapsed);
    setTimeout(fitVerses, 250);   // re-fit after sidebar width animation
}
document.getElementById("menuBtn").addEventListener("click", () => {
    const willCollapse = !sidebarEl.classList.contains("collapsed");
    setSidebarCollapsed(willCollapse);
    if (willCollapse && pageLoaded && window.restoreVerseView) window.restoreVerseView();   // back from the list: same verse on screen
});
toggleBtn.addEventListener("click", () => { if (window.keepVerseInView) window.keepVerseInView(); setSidebarCollapsed(!sidebarEl.classList.contains("collapsed")); });
setSidebarCollapsed(sidebarEl.classList.contains("collapsed"));   // paint the icon

// ── SPEED PILL + POPUP ────────────────────────────────────────────────
// The pill shows the current speed (1x / 1.5x / 1.75x). Tap it to pop up the other two; picking one updates the pill.
const speedMain = document.getElementById("speedMain");
const speedPop  = document.getElementById("speedPop");
window.closeSpeedPop = () => { speedPop.hidden = true; speedMain.setAttribute("aria-expanded", "false"); };
window.setSpeedLabel = r => { speedMain.innerHTML = r + "&times;"; };
window.resetSpeedUI  = () => { window.closeSpeedPop(); speedMain.disabled = true; speedMain.innerHTML = "1&times;"; };
speedMain.addEventListener("click", e => {
    e.stopPropagation();
    if (speedMain.disabled) return;
    speedPop.hidden = !speedPop.hidden;
    speedMain.setAttribute("aria-expanded", speedPop.hidden ? "false" : "true");
});
document.addEventListener("click", e => { if (!speedPop.hidden && !speedPop.contains(e.target)) window.closeSpeedPop(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") window.closeSpeedPop(); });

// ── LANGUAGE PILL + POPUP ──
const langMain = document.getElementById("langMain");
const langPop  = document.getElementById("langPop");
LANGS.forEach(l => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "lang-btn"; b.dataset.lang = l.code; b.textContent = l.short;
    b.title = l.name; b.setAttribute("aria-label", l.name); b.setAttribute("role", "menuitemradio");
    b.addEventListener("click", e => { e.stopPropagation(); setLang(l.code); closeLangPop(); });
    langPop.appendChild(b);
});
function closeLangPop() { langPop.hidden = true; langMain.setAttribute("aria-expanded", "false"); }
// updates the language button label and the tick in its pop-up
function paintLang() {
    const cur = LANGS.find(l => l.code === curLang) || LANGS[0];
    langMain.textContent = cur.short; langMain.title = "Language: " + cur.name;
    langPop.querySelectorAll(".lang-btn").forEach(b => b.setAttribute("aria-checked", b.dataset.lang === curLang ? "true" : "false"));
}
function setLang(code) {
    curLang = code;
    try { localStorage.setItem(LANG_KEY, code); } catch (e) {}
    paintLang();
    contentBox.querySelectorAll(".verse-block").forEach(b => { if (b._apply) b._apply(code); });
    stripSetName();   // prayer-name strip: new language
    applyPreface();   // preface page: swap to the chosen language's <main>
    fitVerses(); Stage.recentre(); setTimeout(() => { fitVerses(); Stage.recentre(); }, 300);   // the shloka text changed: re-fit its size (flow mode: and re-centre the stanza)
}
langMain.addEventListener("click", e => {
    e.stopPropagation();
    window.closeSpeedPop();
    langPop.hidden = !langPop.hidden;
    langMain.setAttribute("aria-expanded", langPop.hidden ? "false" : "true");
});
document.addEventListener("click", e => { if (!langPop.hidden && !langPop.contains(e.target)) closeLangPop(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeLangPop(); });
speedMain.addEventListener("click", closeLangPop);
paintLang();

// ── THEME (portrait + landscape phone; the sun / moon button is in the nav bar / left rail): light = default, dark = body.dark; choice is remembered ──
const THEME_KEY = "prayersTheme";
const themeBtn = document.getElementById("themeBtn");
// light / dark (dark only shows on phones); remembered in this browser
function setTheme(dark) {
    document.body.classList.toggle("dark", dark);
    themeBtn.setAttribute("aria-pressed", dark ? "true" : "false");
    themeBtn.title = dark ? "Light theme" : "Dark theme";
    themeBtn.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
    try { localStorage.setItem(THEME_KEY, dark ? "dark" : "light"); } catch (e) {}
}
themeBtn.addEventListener("click", e => { e.stopPropagation(); setTheme(!document.body.classList.contains("dark")); });
{ let t = null; try { t = localStorage.getItem(THEME_KEY); } catch (e) {} setTheme(t === "dark"); }

// ── FULLSCREEN / READING MODE ─────────────────────────────────────────
const fsBtn = document.getElementById("fsBtn");
const FS_ENTER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>';   // corners pointing out = go full screen
const FS_EXIT  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h5V3M21 8h-5V3M3 16h5v5M21 16h-5v5"/></svg>';   // corners pointing in = leave full screen
let sidebarBeforeReading = null;   // was the panel collapsed before full screen? (restored on exit)
// full screen / reading mode on or off (desktop also folds the list away)
function setReading(on) {
    const was = document.body.classList.contains("reading");
    if (on !== was && window.matchMedia("(min-width: 701px) and (min-height: 521px)").matches) {   // desktop / tablet only
        if (window.keepVerseInView) window.keepVerseInView();      // remember the verse BEFORE the layout changes
        if (on) { sidebarBeforeReading = sidebarEl.classList.contains("collapsed"); setSidebarCollapsed(true); }
        else if (sidebarBeforeReading !== null) { setSidebarCollapsed(sidebarBeforeReading); sidebarBeforeReading = null; }
    }
    document.body.classList.toggle("reading", on);
    fsBtn.innerHTML = on ? FS_EXIT : FS_ENTER;
    fsBtn.title = on ? "Exit full screen" : "Full screen / reading mode";
    fsBtn.setAttribute("aria-label", on ? "Exit full screen" : "Full screen");
    setTimeout(fitVerses, 250);
}
fsBtn.addEventListener("click", () => {
    if (!document.body.classList.contains("reading")) {
        setReading(true);
        const el = document.documentElement;
        if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    } else {
        setReading(false);
        if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    }
});
document.addEventListener("fullscreenchange", () => {   // e.g. phone's back gesture exits fullscreen
    //if (!document.fullscreenElement) setReading(false);
	  setReading(!!document.fullscreenElement);   // icon follows the real state, so Start's full screen shows "shrink"
    setTimeout(fitVerses, 250);
});

// ── TOUCH LOCK ────────────────────────────────────────────────────────
// While locked: verse taps, double-tap bookmark and the seek bar are ignored, and left/right swipes only show a hint.
// Scrolling up/down, Play/Pause, Prev/Next buttons, speed and the meaning tabs still work.
// It starts LOCKED each time the page opens; tap the padlock to unlock.
const lockBtn = document.getElementById("lockBtn");
const LOCK_SVG   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';   // closed padlock = locked
const UNLOCK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg>';   // open padlock = unlocked
// lock / unlock touches: taps on verses, double-tap bookmark, seek bar and swipes
const landMQ = window.matchMedia("(orientation: landscape) and (max-height: 520px)");   // phone landscape: no lock button, so the lock is not applied there
let touchLockWanted = true;
function applyTouchLock() { document.body.classList.toggle("touch-locked", touchLockWanted && !landMQ.matches); }
function setTouchLock(on) {
    touchLockWanted = on;
    lockBtn.setAttribute("aria-pressed", on ? "true" : "false");
    lockBtn.innerHTML = on ? LOCK_SVG : UNLOCK_SVG;
    lockBtn.title = on ? "Touch locked: tap to unlock" : "Lock touch (ignore accidental taps)";
    applyTouchLock();
}
if (landMQ.addEventListener) landMQ.addEventListener("change", applyTouchLock); else if (landMQ.addListener) landMQ.addListener(applyTouchLock);
const lockHint = document.getElementById("lockHint");
let lockHintTimer = null;
window.showLockHint = () => {
    const nav = document.getElementById("navbar");
    lockHint.style.bottom = (window.innerHeight - nav.getBoundingClientRect().top + 10) + "px";
    lockHint.innerHTML = UNLOCK_SVG + "<span>Unlock to swipe</span>";
    lockHint.classList.add("show");
    clearTimeout(lockHintTimer);
    lockHintTimer = setTimeout(() => lockHint.classList.remove("show"), 1600);
};
lockBtn.addEventListener("click", () => setTouchLock(!touchLockWanted));
setTouchLock(true);   // locked by default every time the page opens

document.body.classList.add("side-open");
document.getElementById("menuBtn").classList.add("open");
counterEl.textContent = counterText(-1);

// REOPEN: phones: stay on the prayer list (after Start) with the last-read prayer highlighted and scrolled into view;
// desktop: go straight to the last prayer (the list is visible beside it). Does nothing on a first visit.
(function () {
    let last = null;
    try { last = localStorage.getItem(LAST_KEY); } catch (e) {}
    const i = flatTopics.findIndex(t => t.path === last);
    if (i < 0) return;
    if (window.matchMedia("(max-width: 700px)").matches) {
        const el = flatTopics[i].el;
        el.classList.add("last-read");
        el.scrollIntoView({ block: "center" });
    } else loadTopic(i);
})();
// ── START SCREEN (phones and desktop) ───────────────────────────────────────────
// Fullscreen can only be requested from a tap, so the tap on "Start" asks for it and then fades the screen away (2.5 s).
// (iPhone Safari does not allow fullscreen for web pages; there the button simply fades away.)
// Timing knobs: BTN_PAUSE, the 1000 ms picture wait and the 7000 / 3200 ms safety timers are below; animation lengths are in the CSS ("START SCREEN").
(function () {
    const screenEl = document.getElementById("start-screen");
    const btn = document.getElementById("start-btn");
    if (!screenEl || !btn) return;
    const isTouch = window.matchMedia("(pointer: coarse)").matches;   // full screen is requested only on touch devices; desktop just fades the screen away
    // PICTURE OF THE DAY: images/1.webp = Sunday, 2 = Monday, 3 = Tuesday, 4 = Wednesday, 5 = Thursday, 6 = Friday, 7 = Saturday
    // (uses the device's own date). If today's file is missing, it falls back to images/daily-prayers.webp.
    const dayImg = BASE_URL + "images/" + (new Date().getDay() + 1) + ".webp";
    const fallbackImg = BASE_URL + "images/daily-prayers.webp";
    const setImg = url => screenEl.style.setProperty("--start-img", 'url("' + url + '")');
    // start the picture fade-in + text only once the picture has loaded (or after 1 s at the latest: the 1000 below)
    const ready = () => screenEl.classList.add("ready");
    const probe = new Image();
    probe.onload  = () => { setImg(dayImg); ready(); };
    probe.onerror = () => { setImg(fallbackImg); const f = new Image(); f.onload = f.onerror = ready; f.src = fallbackImg; };
    probe.src = dayImg;
    setTimeout(ready, 1000);
    // The glowing Start button appears only AFTER the picture is shown and both Telugu lines have risen, plus a quiet pause.
    // BTN_PAUSE = that pause in milliseconds (bigger = the button waits longer). The button's own fade-in length is startBtnIn in the CSS.
    const BTN_PAUSE = 800;
    const showBtn = () => screenEl.classList.add("btn-on");
    const lastLine = screenEl.querySelector("#start-text p:last-child");
    if (lastLine) lastLine.addEventListener("animationend", () => setTimeout(showBtn, BTN_PAUSE));
    setTimeout(showBtn, 7000);   // safety net: the button shows after 7 s at the latest, even if an animation event never fires
    let done = false;
    const finish = () => { if (!done) { done = true; screenEl.remove(); } };
    btn.addEventListener("click", () => {
        const el = document.documentElement;
        const req = el.requestFullscreen || el.webkitRequestFullscreen;
        if (req && isTouch) { try { const r = req.call(el, { navigationUI: "hide" }); if (r && r.catch) r.catch(() => {}); } catch (e) {} }
        screenEl.classList.add("leaving");
        screenEl.addEventListener("animationend", e => { if (e.target === screenEl) finish(); });
        setTimeout(finish, 3200);   // safety net: remove the screen after 3.2 s even if the fade-out event never fires
    });
})();

// ── LANDSCAPE FOCUS MODE buttons: pause/play + mute drive the real (hidden) player; speed uses the existing speed pill ──
(function () {
    const lsPause = document.getElementById("lsPause"), lsMute = document.getElementById("lsMute");
    function src(sel) { return audioDock.querySelector(sel); }
    const ICON_PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
    const ICON_VOL  = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
    function paint() {                                   // copy the current icons from the real player buttons (default icons when there is no audio)
        const p = src(".ap-btn:not(.ap-mute)"), m = src(".ap-mute");
        lsPause.innerHTML = p ? p.innerHTML : ICON_PLAY;
        lsMute.innerHTML  = m ? m.innerHTML : ICON_VOL;
    }
    lsPause.addEventListener("click", () => { const p = src(".ap-btn:not(.ap-mute)"); if (p) p.click(); });
    lsMute.addEventListener("click",  () => { const m = src(".ap-mute"); if (m) m.click(); });
    new MutationObserver(paint).observe(audioDock, { childList: true, subtree: true });
    paint();
})();

// ── ROTATING THE PHONE: keep the same verse on screen ──
// The verse at the top is remembered while the reader scrolls; when the layout switches (portrait <-> landscape) the page re-fits
// the text and card heights, so the old scroll position would land on another verse. The remembered verse is put back at the top.
(function () {
    const mq = window.matchMedia("(orientation: landscape) and (max-height: 520px)");
    let anchor = -1, freezeUntil = 0, timers = [];
    function blocks() { return Array.from(contentBox.querySelectorAll(".verse-block")); }
    function topIndex() {
        if (contentBox.scrollTop < 2) return -1;                        // at the very top (prayer heading)
        const bs = blocks(), line = contentBox.getBoundingClientRect().top + TOP_PAD + 8;
        let idx = -1;
        for (let i = 0; i < bs.length; i++) { if (bs[i].getBoundingClientRect().top <= line) idx = i; else break; }
        return idx;
    }
    contentBox.addEventListener("scroll", () => { if (Date.now() >= freezeUntil) anchor = topIndex(); }, { passive: true });
    function restore() {
        if (Stage.active) { contentBox.scrollTop = 0; return; }   // fixed-frame layout: nothing scrolls, the stage already shows the right verse
        if (touchingBox) return;
        scrollAnim = null;
        if (contentBox.classList.contains("sync-playing")) {          // being chanted right now: that verse wins over the remembered one
            const act = contentBox.querySelector(".verse-block.verse-active");
            if (act) { contentBox.scrollTop = topOf(act.getBoundingClientRect(), contentBox.getBoundingClientRect()); return; }
        }
        if (anchor < 0) { contentBox.scrollTop = 0; return; }
        const b = blocks()[anchor];
        if (b) contentBox.scrollTop = topOf(b.getBoundingClientRect(), contentBox.getBoundingClientRect());
    }
    function onChange() {
        freezeUntil = Date.now() + 1300;                                // scroll events caused by the re-layout must not change the remembered verse
        timers.forEach(clearTimeout);
        timers = [150, 400, 800, 1200].map(t => setTimeout(restore, t));   // after the text re-fit and the font settle
    }
    if (mq.addEventListener) mq.addEventListener("change", onChange); else mq.addListener(onChange);
    // desktop: full screen in/out and the side panel opening/closing change the reading width, which re-flows every verse
    window.keepVerseInView = () => { anchor = topIndex(); onChange(); };
    window.restoreVerseView = onChange;                               // re-place the remembered verse (e.g. after the topics list was open)
    let lastW = contentBox.clientWidth;
    if (window.ResizeObserver) new ResizeObserver(() => {             // safety net, e.g. Esc / F11 leaving full screen
        const w = contentBox.clientWidth;
        if (w && w !== lastW) { lastW = w; if (Date.now() >= freezeUntil) onChange(); } else if (w) lastW = w;
    }).observe(contentBox);
})();

// ── LANDSCAPE = FULL SCREEN, no extra button ──
// If the page is already full screen (Start button), it simply stays. Otherwise full screen is requested on entering landscape;
// browsers only allow that after a touch, so if it is refused, the next tap anywhere (e.g. on play) switches it on.
(function () {
    const mq = window.matchMedia("(orientation: landscape) and (max-height: 520px)");
    let armed = false;
    function isFS() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
    function goFS() {
        const el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
        if (!req || isFS()) return Promise.resolve(isFS());
        try { const r = req.call(el, { navigationUI: "hide" }); return r && r.then ? r.then(() => true, () => false) : Promise.resolve(true); }
        catch (e) { return Promise.resolve(false); }
    }
    function onTouch() {
        if (!mq.matches) return;
        goFS().then(ok => { if (ok || isFS()) disarm(); });
    }
    function arm()    { if (armed) return; armed = true; document.addEventListener("touchend", onTouch, true); document.addEventListener("click", onTouch, true); }
    function disarm() { armed = false; document.removeEventListener("touchend", onTouch, true); document.removeEventListener("click", onTouch, true); }
    function onLand() { if (!mq.matches || isFS()) return; goFS().then(ok => { if (!ok && !isFS()) arm(); }); }
    if (mq.addEventListener) mq.addEventListener("change", onLand); else mq.addListener(onLand);
    onLand();
})();


// up / down in the landscape bar = the same actions as the portrait arrows
document.getElementById("lsUp").addEventListener("click",   () => stepVerse(-1));
document.getElementById("lsDown").addEventListener("click", () => stepVerse(1));


// ── MEANING PANEL (phones): never taller than the space left down to the bottom of the screen; longer text scrolls inside it ──
(function () {
    function capPanels() {
        const phone = window.matchMedia("(max-width: 700px), (orientation: landscape) and (max-height: 520px)").matches;
        contentBox.querySelectorAll(".mtab-panel").forEach(p => {
            if (!phone || p.hidden) { p.style.maxHeight = ""; return; }
            const block = p.closest(".verse-block"); if (!block) return;
            const cs = getComputedStyle(block);
            const rel = p.getBoundingClientRect().top - block.getBoundingClientRect().top;      // where the panel starts inside its verse card
            const avail = contentBox.clientHeight - TOP_PAD - rel - parseFloat(cs.paddingBottom) - parseFloat(cs.borderBottomWidth) - 2;
            p.style.maxHeight = Math.max(120, Math.floor(avail)) + "px";
        });
        refreshFades();
    }
    // soft fade at the top / bottom of a meaning text that is longer than its panel
    function updateFade(mn) {
        mn.classList.toggle("fade-t", mn.scrollTop > 2);
        mn.classList.toggle("fade-b", mn.scrollTop + mn.clientHeight < mn.scrollHeight - 2);
    }
    function refreshFades() { contentBox.querySelectorAll(".mtab-panel:not([hidden]) .mn").forEach(updateFade); }
    contentBox.addEventListener("scroll", e => { if (e.target.classList && e.target.classList.contains("mn")) updateFade(e.target); }, true);
    let raf = 0;
    new MutationObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(capPanels); setTimeout(capPanels, 400); })   // prayer loaded / tab switched (the 400 ms one runs after the text re-fit)
        .observe(contentBox, { childList: true, subtree: true, attributes: true, attributeFilter: ["hidden"] });
    window.addEventListener("resize", () => setTimeout(capPanels, 250));
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(capPanels);
})();
