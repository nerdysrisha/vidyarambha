<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyStreamer</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; padding:16px; font-family: system-ui, sans-serif;
         background:#0B1A14; color:#e6f0ea; }
  h1 { font-size:1.3rem; margin:0 0 4px; }
  .build { font-size:.75rem; color:#7fa892; margin-bottom:16px; }
  input { width:100%; box-sizing:border-box; padding:12px; font-size:1rem;
          border-radius:10px; border:1px solid #2c4a3a; background:#12241b;
          color:#e6f0ea; margin-bottom:10px; }
  button { width:100%; padding:14px; font-size:1rem; border:none;
           border-radius:10px; background:#1f8a5b; color:#fff; font-weight:600; }
  button:disabled { background:#2c4a3a; color:#7fa892; }
  #status { margin:12px 0; font-size:.85rem; color:#9fc4ae; min-height:1.2em; }
  video { width:100%; border-radius:12px; background:#000; margin-top:8px; display:none; }
  .progress { height:6px; background:#12241b; border-radius:3px; overflow:hidden;
              margin-top:8px; display:none; }
  .progress > div { height:100%; width:0%; background:#1f8a5b; transition:width .2s; }
</style>
</head>
<body>
  <h1>MyStreamer</h1>
  <div class="build">__BUILD__</div>

  <input id="url" type="text" placeholder="Paste YouTube URL" autocomplete="off">
  <button id="go">Download &amp; Play</button>
  <div id="status"></div>
  <div class="progress" id="progWrap"><div id="prog"></div></div>
  <video id="vid" controls playsinline></video>

<script>
const YT = window.Capacitor && window.Capacitor.Plugins
             ? window.Capacitor.Plugins.YouTubePlugin : null;

const $ = id => document.getElementById(id);
const status = (t) => $('status').textContent = t;
const setProgress = (p) => {
  $('progWrap').style.display = p === null ? 'none' : 'block';
  if (p !== null) $('prog').style.width = Math.round(p * 100) + '%';
};

$('go').addEventListener('click', async () => {
  const url = $('url').value.trim();
  if (!url) return status('Paste a YouTube URL first.');
  if (!YT)  return status('Native plugin not available.');

  $('go').disabled = true;
  $('vid').style.display = 'none';
  setProgress(0);
  status('Fetching stream info…');

  try {
    const info = await YT.extract({ url });
    if (!info || !info.streamUrl) throw new Error(info && info.error || 'No stream URL');
    status('Downloading…');

    const progressListener = await YT.addListener('downloadProgress', (d) => {
      if (d.total > 0) setProgress(d.received / d.total);
    });

    const res = await YT.download({
      streamUrl: info.streamUrl,
      fileName: info.videoId + '.mp4',
      userAgent: info.userAgent
    });

    await progressListener.remove();
    setProgress(null);

    if (!res || !res.path) throw new Error(res && res.error || 'Download failed');

    status('Playing offline copy.');
    const v = $('vid');
    v.src = res.path;
    v.style.display = 'block';
    v.play();
  } catch (e) {
    setProgress(null);
    status('Error: ' + e.message);
    console.error(e);
  } finally {
    $('go').disabled = false;
  }
});
</script>
<script src="capacitor.js"></script>
</body>
</html>
