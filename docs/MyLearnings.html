<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Tech Learnings</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
html, body {
    margin: 0;
    height: 100%;
    background: #0a0a0a;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
    scrollbar-width: none;
    -ms-overflow-style: none;
}
html::-webkit-scrollbar, body::-webkit-scrollbar { width: 0; height: 0; background: transparent; }

#outer {
    margin: 20px;
    margin-bottom: 0;
    height: calc(100vh - 40px - 54px);
    display: flex;
    flex-direction: row;
    gap: 14px;
    overflow: hidden;
}

/* SIDEBAR */
#sidebar {
    width: 300px;
    flex-shrink: 0;
    background: #111;
    border: 1px solid #333;
    border-radius: 8px;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: thin;
    scrollbar-color: #333 #0a0a0a;
    transition: width 0.2s ease;
}
#sidebar.collapsed { width: 42px; }
#sidebar::-webkit-scrollbar { width: 8px; }
#sidebar::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

#sidebar-title {
    padding: 14px 16px 10px 16px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #666;
    border-bottom: 1px solid #222;
    position: sticky;
    top: 0;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    white-space: nowrap;
    z-index: 2;
}
#sidebar.collapsed #sidebar-title { padding: 14px 0; justify-content: center; }
#sidebar-title .title-text { overflow: hidden; }
#sidebar.collapsed #sidebar-title .title-text { display: none; }
#sidebar-toggle {
    background: none;
    border: 1px solid #333;
    border-radius: 5px;
    color: #999;
    width: 24px;
    height: 24px;
    flex-shrink: 0;
    padding: 0;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}
#sidebar-toggle:hover { background: #1a1a1a; color: #00c8ff; }
#sidebar.collapsed #sidebar-list { display: none; }

/* SEARCH */
#sidebar-search-row {
    padding: 8px 12px;
    border-bottom: 1px solid #222;
    position: sticky;
    top: 45px;
    background: #111;
    z-index: 1;
}
#sidebar.collapsed #sidebar-search-row { display: none; }
#topic-search {
    width: 100%;
    box-sizing: border-box;
    background: #0a0a0a;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 7px 28px 7px 10px;
    color: #eee;
    font-size: 13px;
    font-family: inherit;
    outline: none;
}
#topic-search::placeholder { color: #666; }
#topic-search:focus { border-color: #00c8ff88; }
#search-wrap { position: relative; }
#search-clear {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: #2a2a2a;
    color: #999;
    font-size: 12px;
    line-height: 1;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}
#search-clear.visible { display: flex; }
#search-clear:hover { background: #3a3a3a; color: #fff; }
#search-count { font-size: 11px; color: #666; padding: 4px 2px 0 2px; }

/* CATEGORY */
.category-block { border-bottom: 1px solid #1a1a1a; }
.category-header {
    padding: 11px 16px;
    font-size: 13.5px;
    font-weight: bold;
    color: #aaa;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    user-select: none;
}
.category-header:hover { background: #1a1a1a; color: #fff; }
.category-header .chev {
    font-size: 11px;
    color: #555;
    transition: transform 0.15s ease;
}
.category-block.collapsed .chev { transform: rotate(-90deg); }
.category-header .count {
    font-size: 11px;
    color: #555;
    font-weight: normal;
    margin-left: auto;
    margin-right: 8px;
}
.topic-list { }
.category-block.collapsed .topic-list { display: none; }

.topic-item {
    padding: 8px 16px 8px 30px;
    font-size: 14px;
    line-height: 1.4;
    color: #bbb;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
}
.topic-item:hover { background: #1a1a1a; color: #fff; }
.topic-item.active {
    background: #0d1f2b;
    color: #00c8ff;
    border-left-color: #00c8ff;
    font-weight: bold;
}
.topic-item.placeholder {
    color: #555;
    font-style: italic;
    cursor: default;
}
.topic-item.placeholder:hover { background: none; color: #555; }

/* SEARCH MATCH / DIM */
.topic-item.search-match { background: #0d1f2b; border-left-color: #00c8ff; color: #fff; }
.topic-item.search-dim { opacity: 0.25; }
.category-block.search-dim-all { opacity: 0.25; }

/* TOOLTIP */
#topic-tooltip {
    position: fixed;
    z-index: 50;
    max-width: 280px;
    background: #1a1a1a;
    color: #ddd;
    border: 1px solid #00c8ff55;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 13px;
    line-height: 1.45;
    box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    pointer-events: none;
    opacity: 0;
    transform: translateY(-50%) translateX(-6px);
    transition: opacity 0.12s ease, transform 0.12s ease;
}
#topic-tooltip.visible { opacity: 1; transform: translateY(-50%) translateX(0); }

/* RIGHT COLUMN */
#main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }

#content-panel {
    position: relative;
    overflow: hidden;
    border: 1px solid #333;
    border-radius: 8px;
    flex: 1;
    min-height: 0;
    background: #faf8f4;
}
#content-box {
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    box-sizing: border-box;
    padding: 30px 40px;
    background: #faf8f4;
    color: #2b2b2b;
    font-size: 15px;
    line-height: 1.7;
}
#content-box::-webkit-scrollbar { width: 9px; }
#content-box::-webkit-scrollbar-thumb { background: #ddd6c8; border-radius: 5px; }

#content-box h1 {
    color: #1a1a1a;
    font-size: 1.7em;
    margin: 0 0 6px 0;
    padding-bottom: 12px;
    border-bottom: 2px solid #c9a15a;
}
#content-box h2 {
    color: #6b4f1d;
    font-size: 1.3em;
    margin: 30px 0 12px 0;
}
#content-box h3 {
    color: #8a6d3b;
    font-size: 1.08em;
    margin: 22px 0 8px 0;
}
#content-box p { margin: 0 0 14px 0; }
#content-box ul, #content-box ol { margin: 0 0 16px 0; padding-left: 22px; }
#content-box li { margin-bottom: 5px; }
#content-box a { color: #a1521f; text-decoration: none; border-bottom: 1px solid #c9a15a88; }
#content-box a:hover { border-bottom-color: #a1521f; }
#content-box img, #content-box svg { max-width: 100%; height: auto; border-radius: 6px; }
#content-box hr { border: none; border-top: 1px solid #e8e2d5; margin: 24px 0; }

/* inline code */
#content-box code {
    background: #f0ead9;
    color: #8a5a1f;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: "Courier New", monospace;
    font-size: 0.9em;
}

/* fenced code blocks — dark panel sitting inside the light page, syntax highlighted */
#content-box pre {
    background: #1a1a1a;
    border: 1px solid #2e2a22;
    border-radius: 8px;
    padding: 16px 18px;
    overflow-x: auto;
    position: relative;
    margin: 8px 0 18px 0;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}
#content-box pre code {
    background: none;
    color: #eaeaea;
    padding: 0;
    font-size: 0.88em;
}
#content-box pre code.hljs { background: none; }

/* callouts — a plain markdown blockquote becomes a styled note box */
#content-box blockquote {
    background: #fbf6ea;
    border-left: 4px solid #c9a15a;
    border-radius: 6px;
    margin: 16px 0;
    padding: 12px 18px;
    color: #5a4a2a;
}
#content-box blockquote p:last-child { margin-bottom: 0; }

/* tables */
#content-box table {
    width: 100%;
    border-collapse: collapse;
    margin: 4px 0 20px 0;
    background: #fff;
    border: 1px solid #e8e2d5;
    border-radius: 6px;
    overflow: hidden;
}
#content-box th {
    text-align: left;
    padding: 9px 14px;
    color: #6b4f1d;
    background: #f4efe2;
    border-bottom: 2px solid #c9a15a;
    font-size: 0.92em;
}
#content-box td {
    padding: 9px 14px;
    border-bottom: 1px solid #efe9db;
    font-size: 0.94em;
}
#content-box tr:last-child td { border-bottom: none; }

.copy-code-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    background: #2a261e;
    border: 1px solid #3a3527;
    color: #c9a15a;
    border-radius: 5px;
    padding: 3px 9px;
    font-size: 11px;
    cursor: pointer;
}
.copy-code-btn:hover { background: #35301f; color: #fff; }
.copy-code-btn.copied { color: #8fd6b0; border-color: #8fd6b055; }

/* NAV BAR */
#navbar {
    height: 40px;
    flex-shrink: 0;
    background: #111;
    border: 1px solid #333;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin: 0 20px 20px 20px;
}
#navbar button {
    background: #1a1a1a;
    border: 1px solid #333;
    color: #ccc;
    border-radius: 6px;
    padding: 5px 14px;
    font-size: 13px;
    cursor: pointer;
}
#navbar button:hover { background: #222; color: #00c8ff; }
#counter { font-size: 12.5px; color: #777; min-width: 70px; text-align: center; }
</style>
</head>
<body>

<div id="outer">
    <div id="sidebar">
        <div id="sidebar-title">
            <span class="title-text">My Tech Learnings</span>
            <button id="sidebar-toggle" title="Collapse sidebar">&#171;</button>
        </div>
        <div id="sidebar-search-row">
            <div id="search-wrap">
                <input id="topic-search" type="text" placeholder="Search topics...">
                <button id="search-clear">&#10005;</button>
            </div>
            <div id="search-count"></div>
        </div>
        <div id="sidebar-list"></div>
    </div>

    <div id="main-col">
        <div id="content-panel">
            <div id="content-box">
                <div style="color:#8a7a5a;">Select a topic from the left to get started.</div>
            </div>
        </div>
    </div>
</div>

<div id="navbar">
    <button id="prevBtn">&#8592; Prev</button>
    <span id="counter">–</span>
    <button id="nextBtn">Next &#8594;</button>
</div>

<div id="topic-tooltip"></div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────────────
// Base path where category folders live, relative to this file.
// e.g. subjects/tech/confidential-computing/attestation-process.html
const BASE_URL = "subjects/tech/";

// ── CATEGORY / TOPIC DATA ─────────────────────────────────────────────────
// Each category: { name, slug, topics: [ [slug, label, desc, keywords, ext?], ... ] }
// ext is optional, defaults to "html". Use "md" for a Markdown source file —
// it'll be auto-rendered to HTML when loaded.
// An empty topics array = placeholder category ("coming soon").
const categories = [
    {
        name: "Confidential Computing",
        slug: "confidential-computing",
        topics: [
            ["attestation-process", "Attestation Process", "Custom attestation flow — how a workload proves it's running in a trusted TEE.", "attestation tee quote verification"],
            ["architecture-overview", "Architecture Overview", "Overall Confidential Computing architecture (generic + IBM Cloud specific).", "architecture diagram ibm cloud coco"],
            ["tdx-attestation-swimlane", "TDX Attestation Swimlane", "Step-by-step swimlane of Intel TDX attestation.", "tdx swimlane attestation intel"],
            ["kata-remote-deployments", "Kata Remote Deployments", "Notes on custom Kata Containers remote deployment setup.", "kata containers remote deployment"],
            ["virsh-mem-dump", "Virsh Memory Dump", "Notes on capturing/inspecting virsh memory dumps.", "virsh memory dump libvirt", "md"],
            ["ibm-coco-roks-trustee-hworld", "IBM CoCo on ROKS: Trustee + Hello World", "Full sequenced deploy: test Trustee first, then OpenShift cluster + confidential-containers + hello-world sample.", "ibm coco roks trustee hworld peerpod attestation deploy", "md"],
            ["sidecar-bridge-proxy-truste-tunnelling", "Side Car Tunnelling", "Side car tunnelling", "Side car Tunnelling", "md"],
            ["tdx_quote_generation_and_verification_sequence", "Quote Gen Verification", "Quote Gen Verification", "Quote Gen Verification", "html"],
			["cc-containers-layers", "Conf Compu Container Layers", "CC Container Layers", "Layers of Confidential Containers", "html"],
			["cvm-hardware-isolation", "CVM Hardware Isolation", "CVM Hardware Isolation", "How Hardware isolation occurs", "html"],
			["tls-handshake-sequence", "TLS Handshake", "TLS Handshake Sequence", "TLS Handshake Sequence", "html"]
					
 	



        ]
    },
    {
        name: "Kubernetes",
        slug: "kubernetes",
        topics: []
    },
    {
        name: "Networking",
        slug: "networking",
        topics: []
    },
	
    {
        name: "Confidential RAG",
        slug: "confidential-rag",
        topics: [
            ["conf-rag-full-architecture", "CRAG Architecture", "Confidential RAG Architecture", "Confidential RAG architecture", "html"]

        ]
    },
];

// ── STATE ───────────────────────────────────────────────────────────────
const sidebarList  = document.getElementById("sidebar-list");
const contentBox   = document.getElementById("content-box");
const counterEl     = document.getElementById("counter");
const tooltipEl      = document.getElementById("topic-tooltip");

// Flattened list of all real (non-placeholder) topics, in display order,
// for search + prev/next navigation. Each entry keeps a ref to its DOM node.
const flatTopics = [];
let currentFlatIndex = -1;

function normalizeSearch(s) {
    return s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
}

// ── BUILD SIDEBAR ──────────────────────────────────────────────────────
categories.forEach((cat, catIdx) => {
    const block = document.createElement("div");
    block.className = "category-block";

    const header = document.createElement("div");
    header.className = "category-header";
    header.innerHTML =
        '<span>' + cat.name + '</span>' +
        '<span class="count">' + (cat.topics.length || "") + '</span>' +
        '<span class="chev">&#9662;</span>';
    header.addEventListener("click", () => {
        block.classList.toggle("collapsed");
    });
    block.appendChild(header);

    const list = document.createElement("div");
    list.className = "topic-list";

    if (cat.topics.length === 0) {
        const ph = document.createElement("div");
        ph.className = "topic-item placeholder";
        ph.textContent = "No topics yet";
        list.appendChild(ph);
    } else {
        cat.topics.forEach(([slug, label, desc, keywords, ext]) => {
            const item = document.createElement("div");
            item.className = "topic-item";
            item.textContent = label;
            item.dataset.search = normalizeSearch(cat.name + " " + label + " " + (keywords || ""));

            const fileExt = ext || "html";
            const path = BASE_URL + cat.slug + "/" + slug + "." + fileExt;
            const flatIndex = flatTopics.length;
            flatTopics.push({ path, label, catName: cat.name, ext: fileExt, el: item });

            item.addEventListener("click", () => loadTopic(flatIndex));

            item.addEventListener("mouseenter", () => {
                tooltipEl.textContent = desc || "";
                if (!desc) return;
                const rect = item.getBoundingClientRect();
                tooltipEl.style.left = (rect.right + 10) + "px";
                tooltipEl.style.top  = (rect.top + rect.height / 2) + "px";
                tooltipEl.classList.add("visible");
            });
            item.addEventListener("mouseleave", () => tooltipEl.classList.remove("visible"));

            list.appendChild(item);
        });
    }

    block.appendChild(list);
    sidebarList.appendChild(block);
});

// ── LOAD TOPIC ──────────────────────────────────────────────────────────
function loadTopic(flatIndex) {
    if (flatIndex < 0 || flatIndex >= flatTopics.length) return;
    currentFlatIndex = flatIndex;
    const topic = flatTopics[flatIndex];

    flatTopics.forEach(t => t.el.classList.remove("active"));
    topic.el.classList.add("active");
    topic.el.scrollIntoView({ block: "nearest" });

    counterEl.textContent = (flatIndex + 1) + " / " + flatTopics.length;
    contentBox.innerHTML = '<div style="color:#8a7a5a;padding:10px 0;">Loading…</div>';

    fetch(topic.path)
        .then(r => { if (!r.ok) throw new Error("HTTP " + r.status + " for " + topic.path); return r.text(); })
        .then(raw => {
            const html = (topic.ext === "md" && window.marked) ? marked.parse(raw) : raw;
            contentBox.innerHTML = html;
            contentBox.scrollTop = 0;
            wireCopyButtons();
            if (window.hljs) {
                contentBox.querySelectorAll("pre code").forEach(block => hljs.highlightElement(block));
            }
        })
        .catch(err => {
            contentBox.innerHTML =
                '<div style="color:#b5432f;padding:12px 0;">' + err.message +
                '<br><br>Make sure this page is served over http(s) (e.g. GitHub Pages or a local server) — ' +
                'opening the file directly (file://) blocks fetch() for security reasons.</div>';
        });
}

document.getElementById("prevBtn").onclick = () => loadTopic(currentFlatIndex - 1 < 0 ? flatTopics.length - 1 : currentFlatIndex - 1);
document.getElementById("nextBtn").onclick = () => loadTopic((currentFlatIndex + 1) % flatTopics.length);

document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
    if (e.key === "ArrowRight") { e.preventDefault(); document.getElementById("nextBtn").click(); }
    if (e.key === "ArrowLeft")  { e.preventDefault(); document.getElementById("prevBtn").click(); }
});

// ── COPY-CODE BUTTONS (added to every <pre> in loaded topic content) ────
function wireCopyButtons() {
    contentBox.querySelectorAll("pre").forEach(pre => {
        if (pre.querySelector(".copy-code-btn")) return;
        const btn = document.createElement("button");
        btn.className = "copy-code-btn";
        btn.textContent = "Copy";
        btn.addEventListener("click", () => {
            navigator.clipboard.writeText(pre.innerText.replace(/^Copy\n?/, "")).then(() => {
                btn.textContent = "Copied";
                btn.classList.add("copied");
                setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("copied"); }, 1200);
            });
        });
        pre.style.position = "relative";
        pre.appendChild(btn);
    });
}

// ── SEARCH ───────────────────────────────────────────────────────────────
const searchInput = document.getElementById("topic-search");
const searchCount = document.getElementById("search-count");
const searchWrap  = document.getElementById("search-wrap");
const searchClear = document.getElementById("search-clear");

function runSearch() {
    const q = normalizeSearch(searchInput.value.trim());
    searchClear.classList.toggle("visible", searchInput.value.length > 0);

    if (!q) {
        flatTopics.forEach(t => t.el.classList.remove("search-match", "search-dim"));
        document.querySelectorAll(".category-block").forEach(b => b.classList.remove("collapsed", "search-dim-all"));
        // restore natural collapse state (none collapsed by default)
        searchCount.textContent = "";
        return;
    }

    let matches = 0;
    flatTopics.forEach(t => {
        const isMatch = t.el.dataset.search.includes(q);
        t.el.classList.toggle("search-match", isMatch);
        t.el.classList.toggle("search-dim", !isMatch);
        if (isMatch) matches++;
    });

    document.querySelectorAll(".category-block").forEach(block => {
        const hasMatch = !!block.querySelector(".topic-item.search-match");
        block.classList.remove("collapsed");
        block.classList.toggle("search-dim-all", !hasMatch && block.querySelectorAll(".topic-item").length > 0);
    });

    searchCount.textContent = matches === 0 ? "No topics found" : matches + " topic" + (matches === 1 ? "" : "s") + " found";
}

searchInput.addEventListener("input", runSearch);
searchClear.addEventListener("click", () => { searchInput.value = ""; runSearch(); searchInput.focus(); });
searchInput.addEventListener("keydown", e => {
    if (e.key === "Escape" && searchInput.value) { e.stopPropagation(); searchInput.value = ""; runSearch(); }
});

// ── SIDEBAR COLLAPSE (whole sidebar, not per-category) ──────────────────
const sidebarEl = document.getElementById("sidebar");
const toggleBtn  = document.getElementById("sidebar-toggle");
toggleBtn.addEventListener("click", () => {
    const collapsed = sidebarEl.classList.toggle("collapsed");
    toggleBtn.innerHTML = collapsed ? "&#187;" : "&#171;";
    toggleBtn.title = collapsed ? "Expand sidebar" : "Collapse sidebar";
    tooltipEl.classList.remove("visible");
});

// start with nothing loaded — user picks a topic explicitly
counterEl.textContent = "– / " + flatTopics.length;
</script>

</body>
</html>
