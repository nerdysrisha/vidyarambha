// ── DAILY LESSONS (English, Telugu, Hindi share one engine) ──────────────────
// Each topic has its own folder in the repo:  <dir>/index.json, <dir>/lesson-01.json …, <dir>/images/01-p1.jpg …
const ENG_ROOT = "https://raw.githubusercontent.com/nerdysrisha/vidyarambha/refs/heads/main/docs/subjects/";
const ENG_LANGS = {
    "english-daily": { dir: "english", speech: "en-IN", cls: "" },
    "telugu-daily":  { dir: "telugu",  speech: "te-IN", cls: "eng-lang eng-te" },
    "hindi-daily":   { dir: "hindi",   speech: "hi-IN", cls: "eng-lang eng-hi" }
};
Object.values(ENG_LANGS).forEach(c => { c.url = ENG_ROOT + c.dir + "/"; });

// Cache-busting (all lesson topics): GitHub's raw files are cached for a few minutes, so every JSON fetch
// gets a unique ?t=<time> and cache:"no-store". Images use one value per page load (reload = fresh images).
const ENG_PAGE_LOAD = Date.now();
function engFetch(cfg, file) {
    return fetch(cfg.url + file + "?t=" + Date.now(), { cache: "no-store" });
}
function engStop() { try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {} }
function engEl(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
}
function engTop(root) {
    const b = root.closest(".stack-box"), w = root.closest(".stack-wrapper");
    if (b) b.scrollTop = 0;
    if (w) w.scrollTop = 0;
    const body = root.querySelector(".eng-body");
    if (body) body.scrollTop = 0;
}
function engIsTrue(v) { return v === true || ["true", "t", "yes"].includes(String(v).toLowerCase()); }

// stable shuffle (same order all day / every visit); never returns the original order
function engShuffle(arr, seedStr) {
    const out = seededShuffle(arr.map((_, i) => i), mulberry32(hashStr(seedStr)));
    if (arr.length > 1 && out.every((v, i) => v === i)) out.push(out.shift());
    return out;   // original indexes, in display order
}

function engSpeak(text, cfg) {
    if (!window.speechSynthesis) return;
    try {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = cfg.speech; u.rate = 0.8;
        speechSynthesis.speak(u);
    } catch (e) {}
}

function engOpenImage(src) {
    const lb = engEl("div"); lb.id = "eng-lightbox";
    const im = document.createElement("img"); im.src = src;
    lb.appendChild(im);
    lb.onclick = () => lb.remove();
    document.body.appendChild(lb);
}

function renderLessons(box, val) {
    engStop();
    const cfg = ENG_LANGS[val];
    box.classList.add("eng-host");
    const root = engEl("div", "eng-root" + (cfg.cls ? " " + cfg.cls : ""));
    box.appendChild(root);
    root.appendChild(engEl("div", "eng-intro", "Loading lessons…"));
    engFetch(cfg, "index.json")
        .then(r => { if (!r.ok) throw new Error("HTTP " + r.status + " for " + cfg.dir + "/index.json"); return r.json(); })
        .then(idx => engShowPicker(root, idx, cfg))
        .catch(err => { root.innerHTML = ""; root.appendChild(engEl("div", "eng-err", err.message)); });
}

function engShowPicker(root, idx, cfg) {
    engStop();
    root.innerHTML = "";
    const titles = idx.lessons || {};
    const total  = idx.total || Object.keys(titles).length;
    const host = root.closest(".stack-box"); if (host) host.classList.remove("eng-reading");
    const body = engEl("div", "eng-body");

    const grid = engEl("div", "eng-grid");
    for (let n = 1; n <= total; n++) {
        const avail = !!titles[n];
        const b = engEl("button", "eng-lbtn" + (avail ? "" : " off"));
        b.appendChild(engEl("span", "eng-lnum", n));
        b.appendChild(engEl("span", "eng-ltitle", avail ? titles[n] : "Coming soon"));
        if (avail) b.onclick = () => engOpenLesson(root, idx, n, cfg);
        else b.disabled = true;
        grid.appendChild(b);
    }
    body.appendChild(grid);
    root.appendChild(body);
    engTop(root);
}

function engOpenLesson(root, idx, n, cfg) {
    engStop();
    root.innerHTML = "";
    root.appendChild(engEl("div", "eng-intro", "Loading lesson " + n + "…"));
    const file = "lesson-" + String(n).padStart(2, "0") + ".json";
    engFetch(cfg, file)
        .then(r => { if (!r.ok) throw new Error("HTTP " + r.status + " for " + cfg.dir + "/" + file); return r.json(); })
        .then(L => engRenderLesson(root, idx, n, L, cfg))
        .catch(err => {
            root.innerHTML = "";
            root.appendChild(engEl("div", "eng-err", err.message));
            const back = engEl("button", "eng-btn alt", "← Lessons");
            back.onclick = () => engShowPicker(root, idx, cfg);
            root.appendChild(back);
        });
}

// Builds one context card (paras + optional images) from a list of parts; returns {card, plain}
function engStoryCard(parts, cfg) {
    const card = engEl("div", "eng-story");
    const plain = [];
    parts.forEach(part => {
        const paras = part.paras || (part.text ? [part.text] : []);
        paras.forEach(t => { card.appendChild(engEl("p", null, t)); plain.push(t); });
        if (part.image) {
            const im = document.createElement("img");
            im.className = "eng-img";
            im.src = cfg.url + "images/" + part.image + "?t=" + ENG_PAGE_LOAD;
            im.alt = "";
            im.onerror = () => im.remove();            // image is optional
            im.onclick = () => engOpenImage(im.src);   // tap to enlarge
            card.appendChild(im);
        }
    });
    return { card, plain };
}

function engReadBtn(plain, cfg) {
    if (!window.speechSynthesis || !plain.length) return null;
    let reading = false;
    const rb = engEl("button", "eng-btn alt", "🔊 Read aloud");
    const reset = () => { reading = false; rb.textContent = "🔊 Read aloud"; };
    rb.onclick = () => {
        if (reading) { speechSynthesis.cancel(); reset(); return; }
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(plain.join(" "));
        u.lang = cfg.speech; u.rate = 0.85;
        u.onend = reset; u.onerror = reset;
        reading = true; rb.textContent = "⏹ Stop";
        speechSynthesis.speak(u);
    };
    return rb;
}

function engRenderSections(root, sections, n, bi, cfg) {
    sections.forEach((sec, si) => {
        const wrap = engEl("div", "eng-sec");
        wrap.appendChild(engEl("div", "eng-sec-title", sec.heading || ""));
        if (sec.note) wrap.appendChild(engEl("div", "eng-sec-note", sec.note));
        const list = document.createElement("div");
        engRenderSection(list, sec, n, bi * 100 + si, cfg);   // unique shuffle seed per block + section
        wrap.appendChild(list);
        root.appendChild(wrap);
    });
}

function engRenderLesson(root, idx, n, L, cfg) {
    root.innerHTML = "";

    // sticky ribbon: ☰ All lessons | title | Prev / Next (same for every subject)
    const host = root.closest(".stack-box"); if (host) host.classList.add("eng-reading");
    root.appendChild(engRibbon(root, idx, n, L, cfg));
    const body = engEl("div", "eng-body");
    root.appendChild(body);
    const bar = engEl("div", "eng-bar");   // holds Read aloud for the original layout

    if (Array.isArray(L.blocks)) {
        // NEW layout: each block = its own context (text + image) followed by ITS OWN questions
        L.blocks.forEach((blk, bi) => {
            const ctx = blk.context ? (Array.isArray(blk.context) ? blk.context : [blk.context]) : [];
            if (ctx.length) {
                const { card, plain } = engStoryCard(ctx, cfg);
                const rb = engReadBtn(plain, cfg);
                if (rb) { const row = engEl("div", "eng-bar"); row.appendChild(rb); body.appendChild(row); }
                body.appendChild(card);
            }
            engRenderSections(body, blk.sections || [], n, bi, cfg);
        });
    } else {
        // ORIGINAL layout: whole story first, then all questions (lesson 1 style)
        const { card, plain } = engStoryCard(L.story || [], cfg);
        body.appendChild(card);
        const rb = engReadBtn(plain, cfg);
        if (rb) { bar.appendChild(rb); body.insertBefore(bar, card); }
        engRenderSections(body, L.sections || [], n, 0, cfg);
    }

    body.appendChild(engEl("div", "eng-foot"));   // small breathing space at the end
    engTop(root);
}

// Neighbouring lessons that actually exist (skips "Coming soon" gaps); stays inside this subject only
function engNeighbour(idx, n, step) {
    const titles = idx.lessons || {};
    const total  = idx.total || Object.keys(titles).length;
    for (let k = n + step; k >= 1 && k <= total; k += step) if (titles[k]) return k;
    return null;
}

function engRibbon(root, idx, n, L, cfg) {
    const rib = engEl("div", "eng-ribbon");
    const menu = engEl("button", "eng-rbtn menu", "☰");
    menu.title = "All lessons"; menu.setAttribute("aria-label", "All lessons");
    menu.onclick = () => engShowPicker(root, idx, cfg);
    rib.appendChild(menu);
    rib.appendChild(engEl("div", "eng-ribbon-title", "Lesson " + n + " · " + (L.title || "")));
    const nav = engEl("div", "eng-ribbon-nav");
    const mk = (label, target, tip) => {
        const b = engEl("button", "eng-rbtn", label);
        b.title = tip; b.setAttribute("aria-label", tip);
        if (target) b.onclick = () => engOpenLesson(root, idx, target, cfg);
        else b.disabled = true;
        return b;
    };
    nav.appendChild(mk("‹", engNeighbour(idx, n, -1), "Previous lesson"));
    nav.appendChild(mk("›", engNeighbour(idx, n, 1), "Next lesson"));
    rib.appendChild(nav);
    return rib;
}

// One renderer per question type. Unknown types fall back to the generic question/answer list.
function engRenderSection(list, sec, n, si, cfg) {
    const items = sec.items || [];
    const letter = i => String.fromCharCode(97 + (i % 26));
    const row = html => list.insertAdjacentHTML("beforeend", html);
    const bare = (mark, q) => '<div class="question-row word-row"><div class="word-top">' +
        '<span class="question-letter">' + mark + '</span><span class="question-text">' + q + '</span></div></div>';

    switch (sec.type) {
        case "letters": {           // items: "అ" or {l, w, m, name, image}; sec.trace = number of tracing copies (default 1, 0 = none)
            const traces = sec.trace != null ? sec.trace : 1;
            const g = engEl("div", "eng-letters");
            items.forEach(it => {
                const o = typeof it === "string" ? { l: it } : it;
                const card = engEl("div", "eng-lcard");
                const r = engEl("div", "eng-lrow");
                const big = engEl("span", "eng-lbig", o.l);
                big.onclick = () => engSpeak(o.l, cfg);            // tap the letter to hear it (bonus)
                r.appendChild(big);
                for (let k = 0; k < traces; k++) r.appendChild(engEl("span", "eng-ltrace", o.l));
                card.appendChild(r);
                if (o.name) card.appendChild(engEl("div", "eng-lname", o.name));
                if (o.w || o.image) {
                    const ex = engEl("div", "eng-lex");
                    if (o.image) {
                        const im = document.createElement("img");
                        im.className = "eng-limg";
                        im.src = cfg.url + "images/" + o.image + "?t=" + ENG_PAGE_LOAD;
                        im.alt = "";
                        im.onerror = () => im.remove();            // image is optional
                        im.onclick = () => engOpenImage(im.src);
                        ex.appendChild(im);
                    }
                    if (o.w) {
                        const wd = engEl("div");
                        wd.appendChild(engEl("div", "eng-lword", o.w));
                        if (o.m) wd.appendChild(engEl("div", "eng-lmean", o.m));
                        ex.appendChild(wd);
                    }
                    card.appendChild(ex);
                }
                g.appendChild(card);
            });
            list.appendChild(g);
            break;
        }

        case "write":               // items: "prompt" or {q, lines (default 1), a (optional sample, hidden)}
            items.forEach(it => {
                const o = typeof it === "string" ? { q: it } : it;
                list.appendChild(engEl("div", "eng-wq")).innerHTML = o.q || "";
                for (let k = 0; k < (o.lines || 1); k++) list.appendChild(engEl("div", "eng-wline"));
                if (o.a) {
                    const s = engEl("div", "eng-wsample", "Sample: ");
                    s.appendChild(engEl("span", "answer", o.a));
                    list.appendChild(s);
                }
            });
            break;

        case "tf":
            items.forEach((it, i) => {
                const a = (engIsTrue(it.a) ? "True" : "False") + (it.why ? " — " + it.why : "");
                row(renderWordRow(letter(i), it.q + ' <span class="eng-paren">( )</span>', a));
            });
            break;

        case "discuss":
            items.forEach(it => {
                const q = typeof it === "string" ? it : it.q;
                const hint = typeof it === "string" ? "" : (it.hint || "");
                row(hint ? renderWordRow("•", q, hint) : bare("•", q));
            });
            break;

        case "sequence": {          // items are stored in the CORRECT order; shown shuffled
            const given = sec.given || [];
            engShuffle(items, "seq" + n + "-" + si).forEach(orig => {
                const num = orig + 1;
                const r = engEl("div", "eng-seq-row");
                const b = engEl("span", "eng-box");
                if (given.includes(num)) { b.textContent = String(num); b.classList.add("given"); }
                else b.appendChild(engEl("span", "answer", String(num)));
                const t = engEl("span", "eng-seq-text"); t.innerHTML = items[orig];
                r.append(b, t);
                list.appendChild(r);
            });
            break;
        }

        case "match": {             // items: [{l, r}] in the CORRECT pairing; right column is shuffled
            const rOrder = engShuffle(items, "mat" + n + "-" + si);
            const pos = {}; rOrder.forEach((orig, p) => { pos[orig] = p; });
            const g = engEl("div", "eng-match");
            const left = document.createElement("div"), right = document.createElement("div");
            items.forEach((it, i) => {
                const r = engEl("div", "eng-m-row");
                r.appendChild(engEl("span", null, (i + 1) + "."));
                const t = engEl("span"); t.innerHTML = it.l; r.appendChild(t);
                const bl = engEl("span", "eng-blank");
                bl.appendChild(engEl("span", "answer", String.fromCharCode(65 + pos[i])));
                r.appendChild(bl);
                left.appendChild(r);
            });
            rOrder.forEach((orig, p) => {
                const r = engEl("div", "eng-m-row");
                r.appendChild(engEl("span", null, String.fromCharCode(65 + p) + "."));
                const t = engEl("span"); t.innerHTML = items[orig].r; r.appendChild(t);
                right.appendChild(r);
            });
            g.append(left, right);
            list.appendChild(g);
            break;
        }

        default:                    // "qa", "fill" and any not-yet-invented type
            items.forEach((it, i) => {
                const q = typeof it === "string" ? it : it.q;
                const a = typeof it === "string" ? "" : (it.a != null ? String(it.a) : "");
                row(a ? renderWordRow(letter(i), q, a) : bare("(" + letter(i) + ")", q));
            });
    }
}

function generate(box, val) {

    box.innerHTML = "";
    const opt = options.find(o=>o[0]===val);
    if (opt) { const t = document.createElement("div"); t.className="problem-title"; t.textContent=opt[1]; box.appendChild(t); }

    if (ENG_LANGS[val]) { renderLessons(box, val); return; }

    if (val === "identify-time") {
        const scheme = getDailyClockScheme();
        fetch(BASE_URL + "identify-time.json")
            .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
            .then(d => {
                const [qi] = pickDailyIndices("identify-time", d.questions.length, 1);
                const rawAns  = String(d.answers[qi] ?? "");
                const timeStr = rawAns.replace(/\s*\(Q\d+\)$/, "").trim();

                const schemeBadge = document.createElement("div");
                schemeBadge.style.cssText = "font-size:13px;color:" + scheme.rim + ";background:rgba(0,0,0,0.3);border:1px solid " + scheme.rim + "44;border-radius:6px;padding:3px 10px;margin-bottom:12px;display:inline-block;";
                schemeBadge.textContent = "🎨 Today's theme: " + scheme.name;
                box.appendChild(schemeBadge);

                const block = document.createElement("div");
                block.style.cssText = "display:flex;flex-direction:column;align-items:center;gap:14px;padding:8px 0;";

                const canvas = document.createElement("canvas");
                canvas.width = 280; canvas.height = 280;
                canvas.style.cssText = "border-radius:50%;box-shadow:0 0 32px " + scheme.rim + "66;";

                const parts = timeStr.split(":").map(Number);
                const h = parts[0] % 12, m = parts[1] || 0;
                setTimeout(() => drawClockAt(canvas, 0, 0, 1, scheme), 30);

                const playBtn = document.createElement("button");
                playBtn.style.cssText = "background:" + scheme.rim + ";color:#000;font-size:18px;font-weight:bold;padding:10px 32px;border-radius:30px;border:none;cursor:pointer;box-shadow:0 0 18px " + scheme.rim + "99;letter-spacing:1px;";
                playBtn.textContent = "▶ Animate";
                playBtn.onclick = () => {
                    playBtn.disabled = true;
                    playBtn.textContent = "⏳ Playing…";
                    const startTime = performance.now();
                    const DURATION  = 1600;
                    if (canvas._clockRaf) cancelAnimationFrame(canvas._clockRaf);
                    function step(now) {
                        const progress = Math.min((now - startTime) / DURATION, 1);
                        const t = 1 - Math.pow(1 - progress, 3);
                        drawClockAt(canvas, (m/60)*t, ((h + m/60)/12)*t, 1, scheme);
                        if (progress < 1) {
                            canvas._clockRaf = requestAnimationFrame(step);
                        } else {
                            canvas._clockRaf = null;
                            playBtn.disabled = false;
                            playBtn.textContent = "▶ Again";
                        }
                    }
                    canvas._clockRaf = requestAnimationFrame(step);
                };

                const ansRow = document.createElement("div");
                ansRow.style.cssText = "display:flex;align-items:center;gap:12px;font-size:24px;";
                const ansLabel = document.createElement("span"); ansLabel.textContent = "What time is it?"; ansLabel.style.cssText = "color:#aaa;font-size:18px;";
                const ansSpan = document.createElement("span"); ansSpan.className = "answer"; ansSpan.textContent = timeStr;
                ansRow.appendChild(ansLabel); ansRow.appendChild(ansSpan);

                block.appendChild(canvas);
                block.appendChild(playBtn);
                block.appendChild(ansRow);
                block.appendChild(buildLiveClock(scheme));   // live "current time" clock, shown only in this topic
                box.appendChild(block);
            })
            .catch(err => { box.innerHTML += '<div style="color:#f66;padding:20px;">' + err.message + '</div>'; });
        return;
    }

    // ── SHAPES-DRAW ───────────────────────────────────────────────────────────────
    if (val === "shapes-draw") {
        const SHAPES_DATA = [
            { name:"circle",        type:"2d" }, { name:"oval",          type:"2d" },
            { name:"semicircle",    type:"2d" }, { name:"square",        type:"2d" },
            { name:"rectangle",     type:"2d" }, { name:"triangle",      type:"2d" },
            { name:"pentagon",      type:"2d" }, { name:"hexagon",       type:"2d" },
            { name:"heptagon",      type:"2d" }, { name:"octagon",       type:"2d" },
            { name:"nonagon",       type:"2d" }, { name:"decagon",       type:"2d" },
            { name:"parallelogram", type:"2d" }, { name:"rhombus",       type:"2d" },
            { name:"trapezoid",     type:"2d" }, { name:"kite",          type:"2d" },
            { name:"cube",          type:"3d" }, { name:"cuboid",        type:"3d" },
            { name:"sphere",        type:"3d" }, { name:"cylinder",      type:"3d" },
            { name:"cone",          type:"3d" }, { name:"pyramid",       type:"3d" }
        ];

        function drawShape(canvas, name) {
            const W = canvas.width, H = canvas.height;
            const cx = W/2, cy = H/2;
            const ctx = canvas.getContext("2d");
            ctx.clearRect(0,0,W,H);
            const FILL2D="#1a3a5c", STROKE2D="#00c8ff";
            const FILL3D_F="#1a3a2a", FILL3D_T="#0d2a1a", FILL3D_S="#0a1f14", STROKE3D="#34d399";
            function solidPath(pathFn, fill, stroke, lw) {
                ctx.beginPath(); pathFn();
                ctx.fillStyle=fill; ctx.fill();
                ctx.strokeStyle=stroke; ctx.lineWidth=lw||3; ctx.stroke();
            }
            function regularPolygon(n, r) {
                const a0=-Math.PI/2;
                ctx.moveTo(cx+r*Math.cos(a0), cy+r*Math.sin(a0));
                for (let i=1;i<=n;i++) { const a=a0+(2*Math.PI*i/n); ctx.lineTo(cx+r*Math.cos(a), cy+r*Math.sin(a)); }
                ctx.closePath();
            }
            const R=Math.min(W,H)*0.38;
            switch(name) {
                case "circle":        solidPath(()=>{ ctx.arc(cx,cy,R,0,2*Math.PI); }, FILL2D, STROKE2D); break;
                case "oval":          solidPath(()=>{ ctx.ellipse(cx,cy,R,R*0.6,0,0,2*Math.PI); }, FILL2D, STROKE2D); break;
                case "semicircle":    solidPath(()=>{ ctx.arc(cx,cy+R*0.2,R,Math.PI,0); ctx.lineTo(cx-R,cy+R*0.2); ctx.closePath(); }, FILL2D, STROKE2D); break;
                case "square":        { const s=R*1.35; solidPath(()=>{ ctx.rect(cx-s/2,cy-s/2,s,s); }, FILL2D, STROKE2D); break; }
                case "rectangle":     { const rw=R*1.7,rh=R*1.0; solidPath(()=>{ ctx.rect(cx-rw/2,cy-rh/2,rw,rh); }, FILL2D, STROKE2D); break; }
                case "triangle":      solidPath(()=>{ ctx.moveTo(cx,cy-R); ctx.lineTo(cx+R*0.95,cy+R*0.7); ctx.lineTo(cx-R*0.95,cy+R*0.7); ctx.closePath(); }, FILL2D, STROKE2D); break;
                case "parallelogram": solidPath(()=>{ const sk=R*0.4,w=R*1.4,h=R*0.8; ctx.moveTo(cx-w/2+sk,cy-h/2); ctx.lineTo(cx+w/2+sk,cy-h/2); ctx.lineTo(cx+w/2-sk,cy+h/2); ctx.lineTo(cx-w/2-sk,cy+h/2); ctx.closePath(); }, FILL2D, STROKE2D); break;
                case "rhombus":       solidPath(()=>{ ctx.moveTo(cx,cy-R); ctx.lineTo(cx+R*0.7,cy); ctx.lineTo(cx,cy+R); ctx.lineTo(cx-R*0.7,cy); ctx.closePath(); }, FILL2D, STROKE2D); break;
                case "trapezoid":     solidPath(()=>{ const tw=R*0.9,bw=R*1.6,h=R*0.85; ctx.moveTo(cx-tw,cy-h/2); ctx.lineTo(cx+tw,cy-h/2); ctx.lineTo(cx+bw,cy+h/2); ctx.lineTo(cx-bw,cy+h/2); ctx.closePath(); }, FILL2D, STROKE2D); break;
                case "kite":          solidPath(()=>{ ctx.moveTo(cx,cy-R); ctx.lineTo(cx+R*0.65,cy); ctx.lineTo(cx,cy+R*0.85); ctx.lineTo(cx-R*0.65,cy); ctx.closePath(); }, FILL2D, STROKE2D); break;
                case "pentagon":      solidPath(()=>regularPolygon(5,R),  FILL2D, STROKE2D); break;
                case "hexagon":       solidPath(()=>regularPolygon(6,R),  FILL2D, STROKE2D); break;
                case "heptagon":      solidPath(()=>regularPolygon(7,R),  FILL2D, STROKE2D); break;
                case "octagon":       solidPath(()=>regularPolygon(8,R),  FILL2D, STROKE2D); break;
                case "nonagon":       solidPath(()=>regularPolygon(9,R),  FILL2D, STROKE2D); break;
                case "decagon":       solidPath(()=>regularPolygon(10,R), FILL2D, STROKE2D); break;
                case "cube": {
                    const s=R*1.1, ex=s*0.55, ey=s*0.32;
                    solidPath(()=>{ ctx.moveTo(cx-s/2,cy-s/2+ey); ctx.lineTo(cx+s/2,cy-s/2+ey); ctx.lineTo(cx+s/2,cy+s/2+ey); ctx.lineTo(cx-s/2,cy+s/2+ey); ctx.closePath(); }, FILL3D_F, STROKE3D);
                    solidPath(()=>{ ctx.moveTo(cx-s/2,cy-s/2+ey); ctx.lineTo(cx-s/2+ex,cy-s/2); ctx.lineTo(cx+s/2+ex,cy-s/2); ctx.lineTo(cx+s/2,cy-s/2+ey); ctx.closePath(); }, FILL3D_T, STROKE3D);
                    solidPath(()=>{ ctx.moveTo(cx+s/2,cy-s/2+ey); ctx.lineTo(cx+s/2+ex,cy-s/2); ctx.lineTo(cx+s/2+ex,cy+s/2); ctx.lineTo(cx+s/2,cy+s/2+ey); ctx.closePath(); }, FILL3D_S, STROKE3D);
                    break;
                }
                case "cuboid": {
                    const w=R*1.5,h=R*0.9,ex=R*0.5,ey=R*0.28;
                    solidPath(()=>{ ctx.moveTo(cx-w/2,cy-h/2+ey); ctx.lineTo(cx+w/2,cy-h/2+ey); ctx.lineTo(cx+w/2,cy+h/2+ey); ctx.lineTo(cx-w/2,cy+h/2+ey); ctx.closePath(); }, FILL3D_F, STROKE3D);
                    solidPath(()=>{ ctx.moveTo(cx-w/2,cy-h/2+ey); ctx.lineTo(cx-w/2+ex,cy-h/2); ctx.lineTo(cx+w/2+ex,cy-h/2); ctx.lineTo(cx+w/2,cy-h/2+ey); ctx.closePath(); }, FILL3D_T, STROKE3D);
                    solidPath(()=>{ ctx.moveTo(cx+w/2,cy-h/2+ey); ctx.lineTo(cx+w/2+ex,cy-h/2); ctx.lineTo(cx+w/2+ex,cy+h/2); ctx.lineTo(cx+w/2,cy+h/2+ey); ctx.closePath(); }, FILL3D_S, STROKE3D);
                    break;
                }
                case "sphere": {
                    const grad=ctx.createRadialGradient(cx-R*0.3,cy-R*0.3,R*0.1,cx,cy,R);
                    grad.addColorStop(0,"#7dd3fc"); grad.addColorStop(0.4,"#1a3a5c"); grad.addColorStop(1,"#0a1520");
                    ctx.beginPath(); ctx.arc(cx,cy,R,0,2*Math.PI); ctx.fillStyle=grad; ctx.fill();
                    ctx.strokeStyle=STROKE2D; ctx.lineWidth=2; ctx.stroke();
                    ctx.beginPath(); ctx.ellipse(cx,cy,R,R*0.28,0,0,2*Math.PI);
                    ctx.strokeStyle="rgba(0,200,255,0.3)"; ctx.lineWidth=1.5; ctx.stroke();
                    break;
                }
                case "cylinder": {
                    const cr=R*0.75,ch=R*1.1,ey2=cr*0.32;
                    solidPath(()=>{ ctx.moveTo(cx-cr,cy-ch/2+ey2); ctx.lineTo(cx+cr,cy-ch/2+ey2); ctx.lineTo(cx+cr,cy+ch/2); ctx.lineTo(cx-cr,cy+ch/2); ctx.closePath(); }, FILL3D_F, STROKE3D);
                    solidPath(()=>{ ctx.ellipse(cx,cy-ch/2+ey2,cr,ey2,0,0,2*Math.PI); }, FILL3D_T, STROKE3D);
                    ctx.beginPath(); ctx.ellipse(cx,cy+ch/2,cr,ey2,0,0,Math.PI);
                    ctx.strokeStyle=STROKE3D; ctx.lineWidth=2; ctx.stroke();
                    break;
                }
                case "cone": {
                    const br=R*0.85,bey=br*0.32,tip=cy-R*1.05;
                    solidPath(()=>{ ctx.moveTo(cx,tip); ctx.lineTo(cx+br,cy+bey); ctx.lineTo(cx-br,cy+bey); ctx.closePath(); }, FILL3D_F, STROKE3D);
                    solidPath(()=>{ ctx.ellipse(cx,cy+bey,br,bey,0,0,2*Math.PI); }, FILL3D_T, STROKE3D);
                    break;
                }
                case "pyramid": {
                    const ps=R*1.1,ex2=ps*0.38,ey3=ps*0.22,tipY=cy-R*0.9;
                    const bl=cx-ps/2,br2=cx+ps/2,bot=cy+ps*0.4;
                    solidPath(()=>{ ctx.moveTo(cx,tipY); ctx.lineTo(bl,bot+ey3); ctx.lineTo(bl+ex2,bot); ctx.closePath(); }, FILL3D_S, STROKE3D);
                    solidPath(()=>{ ctx.moveTo(cx,tipY); ctx.lineTo(br2+ex2,bot); ctx.lineTo(br2,bot+ey3); ctx.closePath(); }, FILL3D_T, STROKE3D);
                    solidPath(()=>{ ctx.moveTo(cx,tipY); ctx.lineTo(bl,bot+ey3); ctx.lineTo(br2,bot+ey3); ctx.closePath(); }, FILL3D_F, STROKE3D);
                    ctx.beginPath(); ctx.moveTo(bl+ex2,bot); ctx.lineTo(br2+ex2,bot); ctx.lineTo(br2,bot+ey3); ctx.lineTo(bl,bot+ey3); ctx.closePath();
                    ctx.fillStyle="#0a1a10"; ctx.fill(); ctx.strokeStyle=STROKE3D; ctx.lineWidth=1.5; ctx.stroke();
                    break;
                }
            }
        }

        window._drawShape = drawShape;

        const idx = pickDailyIndices(val, SHAPES_DATA.length, 4);
        const picked = idx.map(i => SHAPES_DATA[i]);
        const letters = ["a","b","c","d"];
        const SIZE = 180;

        picked.forEach((shape, i) => {
                const row = document.createElement("div");
                row.style.cssText = [
                    "display:flex","align-items:center","gap:16px","padding:14px 20px",
                    "border-bottom:1px solid #1e1e1e","flex-wrap:nowrap",
                    "box-sizing:border-box","width:100%","min-height:70px"
                ].join(";");

                const letter = document.createElement("span");
                letter.style.cssText = "font-size:36px;font-weight:bold;color:#fff;flex-shrink:0;width:60px;text-align:right;";
                letter.textContent = "(" + letters[i] + ")";

                const badge = document.createElement("span");
                badge.style.cssText = "font-size:12px;font-weight:bold;text-transform:uppercase;"
                    + "letter-spacing:1px;padding:3px 10px;border-radius:4px;flex-shrink:0;"
                    + (shape.type==="3d"
                        ? "color:#34d399;background:rgba(52,211,153,0.1);border:1px solid rgba(52,211,153,0.3);"
                        : "color:#60a5fa;background:rgba(96,165,250,0.1);border:1px solid rgba(96,165,250,0.3);");
                badge.textContent = shape.type.toUpperCase();

                const nameSpan = document.createElement("span");
                nameSpan.style.cssText = [
                    "font-size:40px","font-weight:bold","color:#ffffff","flex:1",
                    "min-width:0","white-space:nowrap","overflow:hidden","text-overflow:ellipsis"
                ].join(";");
                nameSpan.textContent = capitalise(shape.name);

                //const hint = document.createElement("span");
                //hint.style.cssText = "color:#555;font-size:16px;flex-shrink:0;white-space:nowrap;";
                //hint.textContent = "\u2190 draw on paper";

                const canvas = document.createElement("canvas");
                canvas.width = SIZE; canvas.height = SIZE;
                canvas.className = "shape-answer-canvas";
                canvas.dataset.shapeName = shape.name;
                canvas.style.cssText = "display:none;border-radius:10px;background:#0d1a0d;"
                    + "border:2px solid #1e3a1e;flex-shrink:0;";

                row.appendChild(letter);
                row.appendChild(badge);
                row.appendChild(nameSpan);
                //row.appendChild(hint);
                row.appendChild(canvas);
                box.appendChild(row);
            });
        return;
    }

    if (val === "geometric-shapes" || val === "drawing-shapes") {
        fetch("https://api.github.com/repos/nerdysrisha/vidyarambha/contents/docs/subjects/maths/images/geometric-shapes")
            .then(res=>res.json())
            .then(files=>{
                const pngs = files.filter(f=>f.name.endsWith(".png"));
                const idx = pickDailyIndices(val, pngs.length, 4);
                const picked = idx.map(i=>pngs[i]);
                const letters = ["a","b","c","d"];
                if (val === "geometric-shapes") {
                    const container = document.createElement("div");
                    container.style.cssText = "display:flex;gap:40px;flex-wrap:wrap;padding:8px 0;";
                    picked.forEach((file,i)=>{
                        const block = document.createElement("div");
                        block.style.cssText = "display:flex;flex-direction:column;align-items:center;gap:8px;";
                        const img = document.createElement("img"); img.src=file.download_url; img.style.cssText="width:160px;height:160px;";
                        const lbl = document.createElement("span"); lbl.textContent="(" + letters[i] + ")"; lbl.style.cssText="font-size:20px;color:#aaa;";
                        const ansRow = document.createElement("div"); ansRow.style.cssText="display:flex;align-items:center;gap:8px;font-size:22px;";
                        ansRow.innerHTML = '<span class="answer">' + file.name.replace(".png","") + '</span>';
                        block.appendChild(img); block.appendChild(lbl); block.appendChild(ansRow);
                        container.appendChild(block);
                    });
                    box.appendChild(container);
                } else {
                    picked.forEach((file,i)=>{
                        const row = document.createElement("div"); row.className="question-row";
                        row.innerHTML = '<span class="question-letter">(' + letters[i] + ')</span><span class="question-text">' + file.name.replace(".png","") + '</span>' +
                            '<img src="' + file.download_url + '" style="width:180px;height:180px;display:none;margin-left:16px;" />' +
                            '<span class="inline-answer-wrap"><span class="answer">' + file.name.replace(".png","") + '</span></span>';
                        box.appendChild(row);
                    });
                }
            }).catch(err=>{ box.innerHTML += '<div style="color:#f66;padding:20px;">Error: ' + err.message + '</div>'; });
        return;
    }

    if (val === "draw-clock") {
        fetch(BASE_URL + "draw-clock.json")
            .then(r=>{ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
            .then(d=>{
                const idx = pickDailyIndices("draw-clock", d.questions.length, 1);
                idx.forEach((qi,j)=>{
                    const letter = String.fromCharCode(97+j);
                    let qText = String(d.questions[qi]??"").replace(/\t\(Q\d+\)$/,"").trim();
                    const timeMatch = qText.match(/(\d{1,2}:\d{2})/);
                    const time = timeMatch ? timeMatch[1] : "12:00";
                    const row = document.createElement("div");
                    row.className = "question-row";
                    row.style.cssText = "align-items:center;gap:20px;padding:12px 0 12px 20px;flex-wrap:wrap;";
                    row.innerHTML = '<span class="question-letter">(' + letter + ')</span>' +
                        '<span class="question-text" style="font-size:34px;font-weight:bold;">' + time + '</span>';
                    const canvas = document.createElement("canvas");
                    canvas.className="clock-answer"; canvas.width=180; canvas.height=180;
                    canvas.dataset.time=time; canvas.style.cssText="display:none;border-radius:50%;margin-left:20px;";
                    row.appendChild(canvas);
                    box.appendChild(row);
                });
            }).catch(err=>{ box.innerHTML+='<div style="color:#f66;padding:12px;">' + err.message + '</div>'; });
        return;
    }

    // ── PERIMETER SHAPES ─────────────────────────────────────────────────────────
    if (val === "perimeter-shapes") {
        const SHAPES = [
            { name:"Square",            sides:1, gen:(r)=>{ const s=r(3,12); return {vars:{s}, perimeter:4*s, formula:"4 × s", working:"4 × "+s+" = "+(4*s)+" cm", labels:[s,s,s,s], draw:"square"}; } },
            { name:"Rectangle",         sides:2, gen:(r)=>{ const l=r(4,14),w=r(2,9); return {vars:{l,w}, perimeter:2*(l+w), formula:"2 × (l + w)", working:"2 × ("+l+" + "+w+") = 2 × "+(l+w)+" = "+(2*(l+w))+" cm", labels:[l,w,l,w], draw:"rectangle", l, w}; } },
            { name:"Equilateral Triangle",sides:1,gen:(r)=>{ const s=r(3,12); return {vars:{s}, perimeter:3*s, formula:"3 × s", working:"3 × "+s+" = "+(3*s)+" cm", labels:[s,s,s], draw:"equitriangle"}; } },
            { name:"Right Triangle",    sides:3, gen:(r)=>{ const pairs=[[3,4,5],[5,12,13],[6,8,10],[8,15,17],[9,12,15]]; const t=pairs[r(0,4)]; return {vars:{a:t[0],b:t[1],c:t[2]}, perimeter:t[0]+t[1]+t[2], formula:"a + b + c", working:t[0]+" + "+t[1]+" + "+t[2]+" = "+(t[0]+t[1]+t[2])+" cm", labels:[t[0],t[1],t[2]], draw:"righttriangle", a:t[0], b:t[1], c:t[2]}; } },
            { name:"Parallelogram",     sides:2, gen:(r)=>{ const a=r(4,12),b=r(2,8); return {vars:{a,b}, perimeter:2*(a+b), formula:"2 × (a + b)", working:"2 × ("+a+" + "+b+") = 2 × "+(a+b)+" = "+(2*(a+b))+" cm", labels:[a,b,a,b], draw:"parallelogram", a, b}; } },
            { name:"Rhombus",           sides:1, gen:(r)=>{ const s=r(3,12); return {vars:{s}, perimeter:4*s, formula:"4 × s", working:"4 × "+s+" = "+(4*s)+" cm", labels:[s,s,s,s], draw:"rhombus"}; } },
            { name:"Trapezoid",         sides:4, gen:(r)=>{ const a=r(5,12),b=r(3,9),c=r(3,8),d=r(3,8); return {vars:{a,b,c,d}, perimeter:a+b+c+d, formula:"a + b + c + d", working:a+" + "+b+" + "+c+" + "+d+" = "+(a+b+c+d)+" cm", labels:[a,b,c,d], draw:"trapezoid", a, b, c, d}; } },
            { name:"Regular Pentagon",  sides:1, gen:(r)=>{ const s=r(3,10); return {vars:{s}, perimeter:5*s, formula:"5 × s", working:"5 × "+s+" = "+(5*s)+" cm", labels:[s,s,s,s,s], draw:"pentagon"}; } },
            { name:"Regular Hexagon",   sides:1, gen:(r)=>{ const s=r(3,9);  return {vars:{s}, perimeter:6*s, formula:"6 × s", working:"6 × "+s+" = "+(6*s)+" cm", labels:[s,s,s,s,s,s], draw:"hexagon"}; } },
            { name:"Regular Octagon",   sides:1, gen:(r)=>{ const s=r(3,8);  return {vars:{s}, perimeter:8*s, formula:"8 × s", working:"8 × "+s+" = "+(8*s)+" cm", labels:[s,s,s,s,s,s,s,s], draw:"octagon"}; } },
        ];

        // ── FIX 2: use refreshSeed if available, else use daily seed ─────────
        const seed = refreshSeeds[val] || dailySeed(val);
        const rng  = mulberry32(seed);
        function ri(a, b) { return a + Math.floor(rng() * (b - a + 1)); }

        const si = Math.floor(rng() * SHAPES.length);
        const sh = SHAPES[si];
        const q  = sh.gen(ri);

        // ── canvas drawing ────────────────────────────────────────────────────
        // FIX 1: showLabels is now always true — side lengths are part of the
        // question, not the answer. The working block (formula + working) is
        // toggled by _showAnswers instead.
        function drawPerimShape(canvas, type, q, showLabels) {
            const W = canvas.width, H = canvas.height;
            const ctx = canvas.getContext("2d");
            ctx.clearRect(0,0,W,H);
            const cx = W/2, cy = H/2;
            ctx.strokeStyle = "#00c8ff"; ctx.fillStyle = "#0a1a2a";
            ctx.lineWidth = 2.5; ctx.font = "bold 15px Arial"; ctx.fillStyle = "#0a1a2a";

            function label(x, y, txt) {
                if (!showLabels) return;
                ctx.save();
                ctx.font = "bold 15px Arial";
                ctx.fillStyle = "#fcd34d";
                ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText(txt + " cm", x, y);
                ctx.restore();
            }

            function poly(pts) {
                ctx.beginPath();
                ctx.moveTo(pts[0][0], pts[0][1]);
                pts.slice(1).forEach(p => ctx.lineTo(p[0],p[1]));
                ctx.closePath();
                ctx.fillStyle = "#0a1a2a"; ctx.fill();
                ctx.strokeStyle = "#00c8ff"; ctx.stroke();
            }

            function midLabel(p1, p2, txt, offset) {
                if (!showLabels) return;
                const mx = (p1[0]+p2[0])/2 + (offset||[0,0])[0];
                const my = (p1[1]+p2[1])/2 + (offset||[0,0])[1];
                label(mx, my, txt);
            }

            const pad = 55;
            if (type === "square") {
                const s = Math.min(W,H) - pad*2;
                const x0=cx-s/2, y0=cy-s/2, x1=cx+s/2, y1=cy+s/2;
                poly([[x0,y0],[x1,y0],[x1,y1],[x0,y1]]);
                midLabel([x0,y0],[x1,y0], q.labels[0], [0,-14]);
                midLabel([x1,y0],[x1,y1], q.labels[1], [22,0]);
                midLabel([x0,y1],[x1,y1], q.labels[2], [0,14]);
                midLabel([x0,y0],[x0,y1], q.labels[3], [-22,0]);
            } else if (type === "rectangle") {
                const lp = Math.min(W,H)*0.75, wp = Math.min(W,H)*0.45;
                const x0=cx-lp/2, y0=cy-wp/2, x1=cx+lp/2, y1=cy+wp/2;
                poly([[x0,y0],[x1,y0],[x1,y1],[x0,y1]]);
                midLabel([x0,y0],[x1,y0], q.labels[0], [0,-14]);
                midLabel([x1,y0],[x1,y1], q.labels[1], [28,0]);
                midLabel([x0,y1],[x1,y1], q.labels[2], [0,14]);
                midLabel([x0,y0],[x0,y1], q.labels[3], [-28,0]);
            } else if (type === "equitriangle") {
                const r2 = Math.min(W,H)/2 - 30;
                const pts = [0,1,2].map(i => { const a=(i*120-90)*Math.PI/180; return [cx+r2*Math.cos(a), cy+r2*Math.sin(a)]; });
                poly(pts);
                midLabel(pts[0],pts[1], q.labels[0], [18,-8]);
                midLabel(pts[1],pts[2], q.labels[1], [0,16]);
                midLabel(pts[2],pts[0], q.labels[2], [-18,-8]);
            } else if (type === "righttriangle") {
                const sz = Math.min(W,H) - pad*2;
                const p0=[cx-sz/2, cy+sz/2], p1=[cx+sz/2, cy+sz/2], p2=[cx-sz/2, cy-sz/2];
                poly([p0,p1,p2]);
                ctx.save(); ctx.strokeStyle="#aaa"; ctx.lineWidth=1.5;
                const rm=14;
                ctx.strokeRect(p0[0], p0[1]-rm, rm, rm);
                ctx.restore();
                midLabel(p0,p1, q.labels[0], [0,16]);
                midLabel(p0,p2, q.labels[1], [-28,0]);
                midLabel(p1,p2, q.labels[2], [22,-12]);
            } else if (type === "parallelogram") {
                const pw=Math.min(W,H)*0.65, ph=Math.min(W,H)*0.38, sk=30;
                const x0=cx-pw/2+sk, y0=cy-ph/2, x1=cx+pw/2+sk, y1=cy-ph/2;
                const x2=cx+pw/2-sk, y2=cy+ph/2, x3=cx-pw/2-sk, y3=cy+ph/2;
                poly([[x0,y0],[x1,y1],[x2,y2],[x3,y3]]);
                midLabel([x0,y0],[x1,y1], q.labels[0], [0,-16]);
                midLabel([x1,y1],[x2,y2], q.labels[1], [28,0]);
                midLabel([x2,y2],[x3,y3], q.labels[2], [0,16]);
                midLabel([x3,y3],[x0,y0], q.labels[3], [-28,0]);
            } else if (type === "rhombus") {
                const rw=Math.min(W,H)*0.42, rh=Math.min(W,H)*0.36;
                const pts=[[cx,cy-rh],[cx+rw,cy],[cx,cy+rh],[cx-rw,cy]];
                poly(pts);
                midLabel(pts[0],pts[1], q.labels[0], [20,-12]);
                midLabel(pts[1],pts[2], q.labels[1], [20,12]);
                midLabel(pts[2],pts[3], q.labels[2], [-20,12]);
                midLabel(pts[3],pts[0], q.labels[3], [-20,-12]);
            } else if (type === "trapezoid") {
                const bw=Math.min(W,H)*0.7, tw=Math.min(W,H)*0.4, ht=Math.min(W,H)*0.38;
                const p0=[cx-bw/2,cy+ht/2],p1=[cx+bw/2,cy+ht/2],p2=[cx+tw/2,cy-ht/2],p3=[cx-tw/2,cy-ht/2];
                poly([p0,p1,p2,p3]);
                midLabel(p0,p1, q.labels[0], [0,16]);
                midLabel(p1,p2, q.labels[1], [28,0]);
                midLabel(p2,p3, q.labels[2], [0,-16]);
                midLabel(p3,p0, q.labels[3], [-28,0]);
            } else {
                const nSides = type==="pentagon"?5:type==="hexagon"?6:8;
                const r3 = Math.min(W,H)/2 - 28;
                const pts = Array.from({length:nSides},(_,i)=>{ const a=(i*360/nSides-90)*Math.PI/180; return [cx+r3*Math.cos(a),cy+r3*Math.sin(a)]; });
                poly(pts);
                pts.forEach((p,i)=>{ const p2=pts[(i+1)%nSides]; midLabel(p,p2,q.labels[i]); });
            }
        }

        // ── build the question UI ─────────────────────────────────────────────
        const wrap = document.createElement("div");
        wrap.className = "_perimWrap";
        wrap.style.cssText = "display:flex;flex-direction:column;align-items:center;gap:16px;padding:12px 8px;";

        const qLabel = document.createElement("div");
        qLabel.style.cssText = "font-size:26px;font-weight:bold;color:#fff;text-align:center;";
        qLabel.textContent = "Find the perimeter of this " + sh.name + ":";
        wrap.appendChild(qLabel);

        const canvas = document.createElement("canvas");
        canvas.width = 320; canvas.height = 260;
        canvas.className = "perim-canvas";
        canvas.style.cssText = "border-radius:10px;background:#060e18;border:1px solid #1a3a5c;";
        wrap.appendChild(canvas);

        // FIX 1: Always draw with labels=true (side lengths are the question data)
        setTimeout(() => drawPerimShape(canvas, q.draw, q, true), 30);

        const ansBlock = document.createElement("div");
        ansBlock.className = "working-block";
        ansBlock.style.textAlign = "center";
        ansBlock.style.padding = "10px 14px";
        ansBlock.innerHTML =
            '<div><span class="w-label">Shape:</span> ' + sh.name + '</div>' +
            '<div><span class="w-label">Formula:</span> <span class="w-step">' + q.formula + '</span></div>' +
            '<div><span class="w-label">Working:</span> <span class="w-result">' + q.working + '</span></div>';
        wrap.appendChild(ansBlock);

        const ansSpan = document.createElement("span");
        ansSpan.className = "answer";
        ansSpan.style.cssText = "font-size:28px;font-weight:bold;margin-top:4px;";
        ansSpan.textContent = q.perimeter + " cm";
        wrap.appendChild(ansSpan);

        // FIX 1: _showAnswers only toggles the working block and answer span;
        // the canvas always shows labels.
        canvas._showAnswers = (show) => {
            if (show) ansBlock.classList.add("show");
            else      ansBlock.classList.remove("show");
        };

        box.appendChild(wrap);
        return;
    }

    // ── AVERAGE ──────────────────────────────────────────────────────────────────
    if (val === "average-numbers") {
        const rng = mulberry32(refreshSeeds[val] || dailySeed("average-numbers"));
        function ri(a,b){ return a + Math.floor(rng()*(b-a+1)); }

        const avgQs = [];
        for (let q = 0; q < 1; q++) {
            let nums, avg;
            let tries = 0;
            do {
                nums = [ri(10,30), ri(10,30), ri(10,30), ri(10,30)];
                const sum = nums.reduce((a,b)=>a+b,0);
                avg = sum / 4;
                tries++;
            } while (avg !== Math.floor(avg) && tries < 200);
            avgQs.push({ nums, sum: nums.reduce((a,b)=>a+b,0), avg });
        }

        avgQs.forEach((q, j) => {
            const letter = String.fromCharCode(97+j);
            const row = document.createElement("div");
            row.className = "question-row";
            row.style.cssText = "flex-direction:column;align-items:flex-start;padding:14px 20px 16px 20px;gap:6px;border-bottom:1px solid #1e1e1e;";

            const top = document.createElement("div");
            top.style.cssText = "display:flex;align-items:center;gap:16px;flex-wrap:wrap;";

            const ltr = document.createElement("span");
            ltr.className = "question-letter"; ltr.textContent = "(" + letter + ")";

            const qText = document.createElement("span");
            qText.style.cssText = "font-size:30px;font-weight:bold;color:#fff;";
            qText.textContent = "Average of:  " + q.nums.join(",  ");

            const ansSpan = document.createElement("span");
            ansSpan.className = "answer";
            ansSpan.style.cssText = "font-size:28px;font-weight:bold;";
            ansSpan.textContent = String(q.avg);

            top.append(ltr, qText, ansSpan);

            const wb = document.createElement("div");
            wb.className = "working-block";
            wb.style.paddingLeft = "80px";
            wb.innerHTML =
                '<div><span class="w-label">Step 1 — Add:</span> ' +
                q.nums.join(" + ") + ' = <span class="w-step">' + q.sum + '</span></div>' +
                '<div><span class="w-label">Step 2 — Divide by 4:</span> ' +
                q.sum + ' ÷ 4 = <span class="w-result">' + q.avg + '</span></div>';

            row.append(top, wb);
            box.appendChild(row);
        });
        return;
    }

    const numQuestions = NUM_MAP[val] || 2;
    fetch(BASE_URL + val + ".json")
        .then(r=>{ if(!r.ok) throw new Error("HTTP " + r.status + " for " + val + ".json"); return r.json(); })
        .then(d=>{
            if (!d.questions||!d.answers) throw new Error("Invalid JSON in " + val + ".json");
            const total = d.questions.length;
            const idx   = pickDailyIndices(val, total, numQuestions);
            idx.forEach((qi,j)=>{
                const letter = String.fromCharCode(97+j);
                let qText = String(d.questions[qi]??"").replace(/\t\(Q\d+\)$/,"").trim();
                const rawAnswer  = String(d.answers[qi]??"");
                const qCodeMatch = rawAnswer.match(/\(Q\d+\)$/);
                const qCode      = qCodeMatch ? qCodeMatch[0] : "";
                const aText      = rawAnswer.replace(/\s*\(Q\d+\)$/,"").trim();
                const aDisplay   = qCode ? aText + ' <span style="color:#555;font-size:0.7em;margin-left:6px;">' + qCode + '</span>' : aText;

                if (val === "number-names") {
                    const numMatch = qText.match(/\d[\d,]*/);
                    if (numMatch) {
                        const word = numberToWords(parseInt(numMatch[0].replace(/,/g, ""), 10));
                        qText = qText + ' <span class="num-word">' + word + '</span>';
                    }
                    box.innerHTML += '<div class="question-row">' +
                        '<span class="question-letter">(' + letter + ')</span>' +
                        '<span class="question-text">' + qText + '</span>' +
                    '</div>';
                    return;
                }

                let dataType = null;
                if (val === "bodmas")                         dataType = "bodmas";
                else if (MISSING_TYPES.has(val))              dataType = "missing";
                else if (val === "missing-number" || val === "pattern-completion") dataType = "sequence";
                else if (val === "subtract-with-borrow")      dataType = "subtract-borrow";
                else if (val === "multiply-2-digit")          dataType = "multiply-carry";

                if (val === "bodmas") {
                    qText = qText.replace(/([+\-×÷*/x])/gi," $1 ").replace(/\s+/g," ");
                    qText = '<span style="font-size:1.3em;letter-spacing:0.12em;--n:' + qText.trim().length + ';">' + qText + '</span>';
                }

                if (WORD_ROW_TYPES.has(val)) {
                    box.innerHTML += renderWordRow(letter, qText, aDisplay);
                } else if (STACKED_ROW_TYPES.has(val)) {
                    box.innerHTML += renderStackedRow(letter, qText, aDisplay, val);
                } else {
                    box.innerHTML += renderInlineRow(letter, qText, aDisplay, dataType);
                }
            });

            // Units topics: conversion info hidden behind a small Tip button, shown below the questions
            if (val.startsWith("units-")) {
                const tip = document.createElement("div");
                tip.className = "tip-wrap";
                const btn = document.createElement("button");
                btn.type = "button"; btn.className = "tip-btn"; btn.textContent = "\uD83D\uDCA1 Tip";
                const body = document.createElement("div");
                body.className = "tip-body";
                body.appendChild(buildUnitsRefCard(val));
                tip.appendChild(btn); tip.appendChild(body);
                box.appendChild(tip);
            }
        })
        .catch(err=>{
            box.innerHTML += '<div style="color:#f66;padding:12px;font-size:18px;">' + err.message + '</div>';
        });
}

// ── STACK STATE ───────────────────────────────────────────────────────────────
const stackOrder   = [];
let   currentIndex = 0;
let   isAnimating  = false;

function updateCounter() {
    const total = stackOrder.length;
    document.getElementById("bottom-qCounter").textContent = total===0 ? "0 / 0" : (currentIndex+1) + " / " + total;
    if (jumpSelect && stackOrder[currentIndex]) jumpSelect.value = stackOrder[currentIndex];
}

function navigateTo(newIdx, direction) {
    engStop();
    if (stackOrder.length===0) { updateCounter(); return; }
    if (isAnimating) return;
    if (newIdx===currentIndex && stackOrder.length>1) { updateCounter(); return; }
    isAnimating = true;
    const oldEl = stacks[stackOrder[currentIndex]];
    const newEl = stacks[stackOrder[newIdx]];
    currentIndex = newIdx;
    if (oldEl && oldEl!==newEl) {
        oldEl.style.transition="transform 0.38s ease,opacity 0.38s ease";
        oldEl.style.transform=direction==="next"?"translateX(-100%)":"translateX(100%)";
        oldEl.style.opacity="0";
        setTimeout(()=>{
            oldEl.classList.remove("visible-stack");
            oldEl.style.transform=""; oldEl.style.opacity=""; oldEl.style.transition="";
        }, 390);
    }
    if (newEl) {
        newEl.style.transition="none";
        newEl.style.transform=direction==="next"?"translateX(100%)":"translateX(-100%)";
        newEl.style.opacity="0";
        newEl.classList.add("visible-stack");
        newEl.scrollTop=0;
        requestAnimationFrame(()=>{
            requestAnimationFrame(()=>{
                newEl.style.transition="transform 0.38s ease,opacity 0.38s ease";
                newEl.style.transform="translateX(0)";
                newEl.style.opacity="1";
                setTimeout(()=>{ newEl.style.transition=""; newEl.style.transform=""; newEl.style.opacity=""; isAnimating=false; }, 400);
            });
        });
    }
    updateCounter();
}

function navigate(direction) {
    if (stackOrder.length===0) return;
    const idx = direction==="next"
        ? (currentIndex+1) % stackOrder.length
        : (currentIndex-1+stackOrder.length) % stackOrder.length;
    navigateTo(idx, direction);
}

// ── SWIPE: left = Next, right = Prev (touch screens) ─────────────────────────
(function () {
    let sx = 0, sy = 0, st = 0, tracking = false, blocked = false;
    function hScrollable(el) {      // a sideways-scrolling element must keep its own swipe
        for (; el && el !== questions; el = el.parentElement) {
            const cs = getComputedStyle(el);
            if ((cs.overflowX === "auto" || cs.overflowX === "scroll") && el.scrollWidth > el.clientWidth + 1) return true;
        }
        return false;
    }
    questions.addEventListener("touchstart", e => {
        tracking = e.touches.length === 1;
        if (!tracking) return;
        sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now();
        blocked = !!(e.target.closest && e.target.closest("input,select,textarea")) || hScrollable(e.target);
    }, { passive: true });
    questions.addEventListener("touchcancel", () => { tracking = false; }, { passive: true });
    questions.addEventListener("touchend", e => {
        if (!tracking) return;
        tracking = false;
        if (blocked) return;
        if (window.visualViewport && window.visualViewport.scale > 1.02) return;   // zoomed in: swipe pans, not navigates
        const t = e.changedTouches[0];
        const dx = t.clientX - sx, dy = t.clientY - sy;
        if (Date.now() - st > 700) return;                                      // slow drag: not a swipe
        if (Math.abs(dx) < 70 || Math.abs(dy) > Math.abs(dx) * 0.5) return;    // too short, or mostly vertical (scrolling)
        const sel = window.getSelection && window.getSelection();
        if (sel && !sel.isCollapsed) return;                                    // selecting text
        navigate(dx < 0 ? "next" : "prev");
    }, { passive: true });
})();

// ── IDLE GLOBE: floating numbers & letters on a slowly turning ball, shown while the Questions panel is empty ──
(function () {
    const box = document.getElementById("idle-globe");
    const cv  = document.getElementById("idle-canvas");
    const msg = document.getElementById("idle-msg");
    const qs  = document.getElementById("questions");
    if (!box || !cv || !msg || !qs) return;
    const ctx = cv.getContext("2d");

    const GLYPHS = "0123456789012345678901234567890123456789+-\u00D7\u00F7=\u03C0\u221A%ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
    const COLORS = ["#4ade80", "#38bdf8", "#facc15", "#f472b6", "#a78bfa", "#fb923c", "#ffffff"];
    const N = 72, TWO_PI = Math.PI * 2;
    const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    const pick = a => a[(Math.random() * a.length) | 0];

    // spread the characters evenly over a sphere (Fibonacci sphere)
    const pts = [];
    for (let i = 0; i < N; i++) {
        const y = 1 - 2 * (i + 0.5) / N, r = Math.sqrt(1 - y * y), th = i * 2.399963;
        pts.push({ x: Math.cos(th) * r, y: y, z: Math.sin(th) * r,
                   g: pick(GLYPHS), c: pick(COLORS),
                   ph: Math.random() * TWO_PI, sp: 0.45 + Math.random() * 0.55, k: 0 });
    }

    let W = 0, H = 0, dpr = 1, running = false, raf = 0, t0 = performance.now();
    function size() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = cv.clientWidth; H = cv.clientHeight;
        cv.width = Math.max(1, W * dpr); cv.height = Math.max(1, H * dpr);
    }

    function frame(now) {
        if (!running) return;
        raf = requestAnimationFrame(frame);
        const t = (now - t0) / 1000;
        if (!W || !H) { size(); if (!W || !H) return; }
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, W, H);

        const cx = W / 2, cy = H / 2, R = Math.min(W, H) * 0.40;
        const ang = reduce ? 0.6 : t * 0.28, tilt = 0.38;
        const ca = Math.cos(ang), sa = Math.sin(ang), ct = Math.cos(tilt), st = Math.sin(tilt);

        // soft glow + outline + a few lines of latitude / longitude so it reads as a globe
        const g = ctx.createRadialGradient(cx, cy, R * 0.15, cx, cy, R * 1.12);
        g.addColorStop(0, "rgba(14,165,233,0.10)"); g.addColorStop(0.8, "rgba(14,165,233,0.06)"); g.addColorStop(1, "rgba(14,165,233,0)");
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R * 1.12, 0, TWO_PI); ctx.fill();
        ctx.lineWidth = 1.2; ctx.strokeStyle = "rgba(56,189,248,0.35)";
        ctx.beginPath(); ctx.arc(cx, cy, R, 0, TWO_PI); ctx.stroke();
        ctx.strokeStyle = "rgba(56,189,248,0.16)";
        for (const lat of [-0.5, 0, 0.5]) {                       // latitude rings
            const rr = R * Math.sqrt(1 - lat * lat);
            ctx.beginPath(); ctx.ellipse(cx, cy - lat * R * ct, rr, rr * st, 0, 0, TWO_PI); ctx.stroke();
        }
        for (let m = 0; m < 3; m++) {                             // longitude rings (turn with the globe)
            const rx = Math.abs(Math.cos(ang + m * Math.PI / 3)) * R;
            ctx.beginPath(); ctx.ellipse(cx, cy, Math.max(rx, 0.5), R, 0, 0, TWO_PI); ctx.stroke();
        }

        // characters: turn the ball, then draw back-to-front, fading in and out
        const list = [];
        for (const p of pts) {
            const x1 = p.x * ca + p.z * sa, z1 = -p.x * sa + p.z * ca;
            const y2 = p.y * ct - z1 * st, z2 = p.y * st + z1 * ct;
            const cyc = t * p.sp + p.ph, k = Math.floor(cyc / TWO_PI);
            if (k !== p.k) { p.k = k; p.g = pick(GLYPHS); p.c = pick(COLORS); }   // new character while invisible
            const fade = Math.pow((1 - Math.cos(cyc)) / 2, 1.3);                   // 0 -> 1 -> 0
            list.push({ X: cx + x1 * R, Y: cy + y2 * R, d: (z2 + 1) / 2, fade: fade, g: p.g, c: p.c });
        }
        list.sort((a, b) => a.d - b.d);
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        const base = Math.max(14, R * 0.22);
        for (const o of list) {
            const a = o.fade * (0.18 + 0.82 * o.d);
            if (a < 0.02) continue;
            ctx.globalAlpha = a;
            ctx.fillStyle = o.c;
            ctx.font = "700 " + (base * (0.55 + 0.7 * o.d)).toFixed(1) + "px system-ui, Arial, sans-serif";
            ctx.fillText(o.g, o.X, o.Y);
        }
        ctx.globalAlpha = 1;
    }

    function setRunning(on) {
        if (on === running) return;
        running = on;
        if (on) { size(); raf = requestAnimationFrame(frame); } else { cancelAnimationFrame(raf); }
    }

    // show the globe only while no question topic is visible
    function update() {
        const idle = !qs.querySelector(".stack-wrapper.visible-stack");
        box.classList.toggle("on", idle);
        document.body.classList.toggle("idle-on", idle);
        if (idle) {
            msg.innerHTML = document.body.classList.contains("allqs-done")
                ? "Getting your questions ready\u2026"
                : '<span class="idle-hand">\uD83D\uDC46</span> Push <b>All Qs</b>';
        }
        setRunning(idle && document.visibilityState === "visible");
    }
    let pend = 0;
    const sched = () => { if (!pend) pend = requestAnimationFrame(() => { pend = 0; update(); }); };
    new MutationObserver(sched).observe(qs, { childList: true, subtree: true, attributes: true, attributeFilter: ["class"] });
    new MutationObserver(sched).observe(document.body, { attributes: true, attributeFilter: ["class"] });
    document.addEventListener("visibilitychange", sched);
    window.addEventListener("resize", () => { size(); });
    if (window.ResizeObserver) new ResizeObserver(() => size()).observe(box);
    update();
})();

// ── SCREEN WAKE LOCK ──────────────────────────────────────────────────────────
let wakeLock = null;
async function requestWakeLock() {
    try {
        if ("wakeLock" in navigator) {
            wakeLock = await navigator.wakeLock.request("screen");
            wakeLock.addEventListener("release", ()=>{});
        }
    } catch(err) {}
}
document.addEventListener("visibilitychange", ()=>{
    if (wakeLock!==null && document.visibilityState==="visible") requestWakeLock();
});
requestWakeLock();
</script>
