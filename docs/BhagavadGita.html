                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
            </button>
            <div id="content-box">
                <div style="color:#8a7a5a; text-align:center; padding-top:40px;">🙏 Select a chapter from the left to begin.</div>
            </div>
        </div>
    </div>
</div>

<div id="navbar">
    <button id="menuBtn" title="Topics list">&#9776;</button>
    <button id="prevBtn" aria-label="Previous topic" title="Previous">&lt;<span class="nav-label"> Prev</span></button>
    <span id="counter">–</span>
    <button id="nextBtn" aria-label="Next topic" title="Next"><span class="nav-label">Next </span>&gt;</button>
    <div id="speedGroup" role="group" aria-label="Playback speed">
        <button id="speedMain" class="speed-main" title="Playback speed" aria-label="Playback speed" aria-haspopup="true" aria-expanded="false" disabled>1&times;</button>
        <div id="speedPop" hidden>
            <button class="speed-btn" data-rate="1"    title="Normal speed" aria-label="Normal speed" disabled>1&times;</button>
            <button class="speed-btn" data-rate="1.5"  title="1.5x speed"   aria-label="1.5x speed"   disabled>1.5&times;</button>
            <button class="speed-btn" data-rate="1.75" title="1.75x speed"  aria-label="1.75x speed"  disabled>1.75&times;</button>
        </div>
    </div>
    <button id="bmBtn" aria-label="Go to bookmark" title="Go to bookmark (double-tap a verse to place it)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg></button>
    <div id="lockHint" role="status" aria-live="polite"></div>
    <button id="lockBtn" title="Touch locked: tap to unlock" aria-label="Lock touch" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
    <button id="fsBtn" aria-label="Full screen" title="Full screen / reading mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg></button>
</div>

<div id="bm-toast" role="status"></div>

<div id="topic-tooltip"></div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────────────
// ★ BOOKMARK + REOPEN: double-tap a verse = gold dog-ear (ONE bookmark, saved in this browser's localStorage);
//   the bookmark button in the bottom bar jumps back to it. The page also reopens the last chapter. Search "BOOKMARK" below.
// Base path where category folders live, relative to this file.
// e.g. subjects/bhagavadgita/chapter1.html
const BASE_URL = "subjects/";

// ── CATEGORY / TOPIC DATA ─────────────────────────────────────────────────
// Each category: { name, slug, topics: [ [slug, label, desc, keywords, ext?], ... ] }
// ext is optional, defaults to "html". Use "md" for a Markdown source file —
// it'll be auto-rendered to HTML when loaded.
// Chapter titles below are the traditional/conventional names — replace the
// "label" (2nd item) in each row with whatever titles you want to use.
const categories = [
    {
        name: "Bhagavad Gita",
        slug: "bhagavadgita",
        topics: [
            ["chapter1",  "Ch 1 — Arjuna Vishada Yoga",         "The Grief of Arjuna",            "chapter 1 arjuna vishada yoga", "html"],
            ["chapter2",  "Ch 2 — Sankhya Yoga",                "Transcendental Knowledge",       "chapter 2 sankhya yoga", "html"],
            ["chapter3",  "Ch 3 — Karma Yoga",                  "Path of Action",                 "chapter 3 karma yoga", "html"],
            ["chapter4",  "Ch 4 — Jnana Karma Sanyasa Yoga",    "Path of Knowledge and Action",   "chapter 4 jnana karma sanyasa yoga", "html"],
            ["chapter5",  "Ch 5 — Karma Sanyasa Yoga",          "Path of Renunciation",           "chapter 5 karma sanyasa yoga", "html"],
            ["chapter6",  "Ch 6 — Dhyana Yoga",                 "Path of Meditation",             "chapter 6 dhyana yoga", "html"],
            ["chapter7",  "Ch 7 — Jnana Vijnana Yoga",          "Knowledge and Wisdom",           "chapter 7 jnana vijnana yoga", "html"],
            ["chapter8",  "Ch 8 — Akshara Brahma Yoga",         "The Imperishable Brahman",       "chapter 8 akshara brahma yoga", "html"],
            ["chapter9",  "Ch 9 — Raja Vidya Raja Guhya Yoga",  "King of Knowledge, King of Secrets", "chapter 9 raja vidya raja guhya yoga", "html"],
            ["chapter10", "Ch 10 — Vibhuti Yoga",               "Divine Glories",                 "chapter 10 vibhuti yoga", "html"],
            ["chapter11", "Ch 11 — Vishwarupa Darshana Yoga",   "Vision of the Universal Form",   "chapter 11 vishwarupa darshana yoga", "html"],
            ["chapter12", "Ch 12 — Bhakti Yoga",                "Path of Devotion",               "chapter 12 bhakti yoga", "html"],
            ["chapter13", "Ch 13 — Kshetra Kshetrajna Vibhaga Yoga", "The Field and the Knower",  "chapter 13 kshetra kshetrajna vibhaga yoga", "html"],
            ["chapter14", "Ch 14 — Gunatraya Vibhaga Yoga",     "The Three Modes of Nature",      "chapter 14 gunatraya vibhaga yoga", "html"],
            ["chapter15", "Ch 15 — Purushottama Yoga",          "The Supreme Divine Personality", "chapter 15 purushottama yoga", "html"],
            ["chapter16", "Ch 16 — Daivasura Sampad Vibhaga Yoga", "Divine and Demoniac Natures", "chapter 16 daivasura sampad vibhaga yoga", "html"],
            ["chapter17", "Ch 17 — Shraddhatraya Vibhaga Yoga", "The Threefold Faith",            "chapter 17 shraddhatraya vibhaga yoga", "html"],
            ["chapter18", "Ch 18 — Moksha Sanyasa Yoga",        "Liberation through Renunciation", "chapter 18 moksha sanyasa yoga", "html"]
        ]
    }
];

// ── STATE ───────────────────────────────────────────────────────────────
const sidebarList  = document.getElementById("sidebar-list");
const contentBox   = document.getElementById("content-box");
const counterEl     = document.getElementById("counter");
const tooltipEl      = document.getElementById("topic-tooltip");

const flatTopics = [];
let currentFlatIndex = -1;

function normalizeSearch(s) {
    return s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
}

// ── BUILD SIDEBAR ──────────────────────────────────────────────────────
categories.forEach((cat) => {
    const block = document.createElement("div");
    block.className = "category-block";

    const header = document.createElement("div");
    header.className = "category-header";
    header.innerHTML =
        '<span>' + cat.name + '</span>' +
        '<span class="count">' + (cat.topics.length ? cat.topics.length + " Chapters" : "") + '</span>' +
        '<span class="chev">&#9662;</span>';
    header.addEventListener("click", () => {
        block.classList.toggle("collapsed");
    });
    block.appendChild(header);

    const list = document.createElement("div");
    list.className = "topic-list";

    cat.topics.forEach(([slug, label, desc, keywords, ext]) => {
        const item = document.createElement("div");

        item.className = "topic-item";
        // label "Ch 1 — Arjuna Vishada Yoga" -> icon "1", small line "Chapter 1", bold line "Arjuna Vishada Yoga"
        const lm = label.match(/^\s*Ch\s*(\d+)\s*[—–-]\s*(.+)$/i);
        const chNo = lm ? lm[1] : "", chName = lm ? lm[2].trim() : label;
        const icon = document.createElement("div");
        icon.className = "t-icon";
        const pal = [["#ff9933","#c2410c"],["#f06595","#a61e4d"],["#4dabf7","#1c4fa0"],["#69db7c","#2b8a3e"],["#9775fa","#5f3dc4"],["#ffa94d","#a8420a"]];
        const pc = pal[((parseInt(chNo, 10) || 1) - 1) % pal.length];
        icon.style.setProperty("--g1", pc[0]); icon.style.setProperty("--g2", pc[1]);
        icon.textContent = chNo;
        const img = new Image();                      // optional picture: subjects/bhagavadgita/icons/<slug>.webp (e.g. chapter1.webp)
        img.alt = ""; img.loading = "lazy";
        img.onload = () => icon.appendChild(img);
        img.src = BASE_URL + cat.slug + "/icons/" + slug + ".webp";
        const body = document.createElement("div");
        body.className = "t-body";
        if (chNo) { const sub = document.createElement("div"); sub.className = "t-sub"; sub.textContent = "Chapter " + chNo; body.appendChild(sub); }
        const ttl = document.createElement("div");
        ttl.className = "t-title"; ttl.textContent = chName;
        body.appendChild(ttl);
        item.appendChild(icon); item.appendChild(body);
        item.dataset.search = normalizeSearch(cat.name + " " + label + " " + (keywords || ""));

        const fileExt = ext || "html";
        const path = BASE_URL + cat.slug + "/" + slug + "." + fileExt;
        const flatIndex = flatTopics.length;
        flatTopics.push({ path, label, catName: cat.name, ext: fileExt, el: item });

        item.addEventListener("click", () => loadTopic(flatIndex));

        item.addEventListener("mouseenter", () => {
            tooltipEl.textContent = desc || "";
            if (!desc) return;
            const rect = item.getBoundingClientRect();
            tooltipEl.style.left = (rect.right + 10) + "px";
            tooltipEl.style.top  = (rect.top + rect.height / 2) + "px";
            tooltipEl.classList.add("visible");
        });
        item.addEventListener("mouseleave", () => tooltipEl.classList.remove("visible"));

        list.appendChild(item);
    });

    block.appendChild(list);
    sidebarList.appendChild(block);
});
if (categories.length === 1) sidebarList.classList.add("single");
document.getElementById("sidebar-count").textContent = flatTopics.length + " Chapters";

// ── AUDIO SYNC (added) ──────────────────────────────────────────────────
// A topic page opts in by having  <audio data-ends="35,69,105,...">  where the
// list gives the END time of each .verse-block, in order (seconds or m:ss).
// Block 1 starts at 0; every other block starts where the previous one ends.
// Pages without data-ends are left alone.
// (Scripts inside fetched pages do not run, so this logic lives here.)
let pendingTapPlay = 0;   // timer: tap-to-play waits briefly so a double-tap (bookmark) can cancel it
let syncUserScrollUntil = 0;
const MANUAL_SCROLL_PAUSE_MS = 5000;
const contentPanel = document.getElementById("content-panel");
const audioDock    = document.getElementById("audio-dock");
let scrollAnim = null;

// Eased scroll (about 0.9 s) so the text glides to the next block instead of jumping
function smoothScrollTo(top, ms) {
    const startTop = contentBox.scrollTop;
    const delta = top - startTop;
    if (Math.abs(delta) < 2) return;
    const t0 = performance.now();
    const me = scrollAnim = {};
    (function step(now) {
        if (scrollAnim !== me) return;                                   // replaced by a newer scroll
        if (Date.now() < syncUserScrollUntil) { scrollAnim = null; return; }   // user took over
        const p = Math.min(1, (now - t0) / ms);
        const e = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;   // easeInOutCubic
        contentBox.scrollTop = startTop + delta * e;
        if (p < 1) requestAnimationFrame(step); else scrollAnim = null;
    })(t0);
}

["wheel", "touchmove", "mousedown"].forEach(evt =>
    contentBox.addEventListener(evt, e => {
        if (e.target.closest && e.target.closest(".audio-player")) return;
        syncUserScrollUntil = Date.now() + MANUAL_SCROLL_PAUSE_MS;
    }, { passive: true })
);

function parseSyncTime(str) {
    return str.trim().split(":").reduce((acc, part) => acc * 60 + Number(part), 0);
}

function stopAudioSync() {
    clearTimeout(pendingTapPlay);
    document.querySelectorAll("#content-panel audio").forEach(a => a.pause());
    contentBox.classList.remove("sync-on", "sync-playing");
    audioDock.innerHTML = "";                     // remove the pinned player
    document.querySelectorAll("#speedGroup .speed-btn").forEach(b => {
        b.disabled = true; b.classList.remove("active"); b.onclick = null;
    });
    if (window.resetSpeedUI) window.resetSpeedUI();
    contentPanel.classList.remove("has-dock");
    scrollAnim = null;
}

// ── CUSTOM PLAYER (dark/gold; green = played, grey = fetched, light blue = not fetched yet) ──
function fmtTime(sec) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    sec = Math.floor(sec);
    return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
}
function buildCustomPlayer(audio, holder) {
    audio.removeAttribute("controls"); audio.controls = false;
    const ICON_PLAY  = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
    const ICON_PAUSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';

    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "ap-btn"; btn.innerHTML = ICON_PLAY; btn.setAttribute("aria-label", "Play");
    const cur = document.createElement("span"); cur.className = "ap-time"; cur.textContent = "0:00";
    const bar = document.createElement("div");
    bar.className = "ap-bar"; bar.tabIndex = 0;
    bar.setAttribute("role", "slider"); bar.setAttribute("aria-label", "Seek");
    bar.innerHTML = '<div class="ap-track"><span class="ap-bufs"></span><span class="ap-played"></span></div><span class="ap-thumb"></span>';
    const tot = document.createElement("span"); tot.className = "ap-time"; tot.textContent = "0:00";
    const mute = document.createElement("button");
    mute.type = "button"; mute.className = "ap-btn ap-mute";
    const ICON_VOL  = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
    const ICON_MUTE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
    holder.append(btn, cur, bar, tot, mute);

    const bufs = bar.querySelector(".ap-bufs"), played = bar.querySelector(".ap-played"), thumb = bar.querySelector(".ap-thumb");
    let dragging = false, dragT = 0, raf = 0;

    function paint() {
        const d = audio.duration, ok = isFinite(d) && d > 0;
        const t = dragging ? dragT : audio.currentTime;
        const pct = ok ? Math.min(100, Math.max(0, t / d * 100)) : 0;
        played.style.width = pct + "%";
        thumb.style.left = pct + "%";
        cur.textContent = fmtTime(t);
        tot.textContent = ok ? fmtTime(d) : "0:00";
        bar.setAttribute("aria-valuemin", "0");
        bar.setAttribute("aria-valuemax", ok ? String(Math.floor(d)) : "0");
        bar.setAttribute("aria-valuenow", String(Math.floor(t)));
        bar.setAttribute("aria-valuetext", fmtTime(t) + " of " + (ok ? fmtTime(d) : "0:00"));
    }
    function paintBuffered() {
        const d = audio.duration;
        let html = "";
        if (isFinite(d) && d > 0) {
            const r = audio.buffered;
            for (let i = 0; i < r.length; i++) {
                const l = r.start(i) / d * 100, w = (r.end(i) - r.start(i)) / d * 100;
                html += '<span class="ap-buf" style="left:' + l + '%;width:' + w + '%"></span>';
            }
        }
        bufs.innerHTML = html;
    }
    function paintBtn() {
        btn.innerHTML = audio.paused ? ICON_PLAY : ICON_PAUSE;
        btn.setAttribute("aria-label", audio.paused ? "Play" : "Pause");
    }
    function paintMute() {
        const m = audio.muted || audio.volume === 0;
        mute.innerHTML = m ? ICON_MUTE : ICON_VOL;
        mute.setAttribute("aria-label", m ? "Unmute" : "Mute");
        mute.title = m ? "Unmute" : "Mute";
    }
    mute.addEventListener("click", () => {
        if (audio.muted || audio.volume === 0) { audio.muted = false; if (audio.volume === 0) audio.volume = 1; }
        else audio.muted = true;
        paintMute();
    });
    audio.addEventListener("volumechange", paintMute);
    function loop() { paint(); raf = audio.paused ? 0 : requestAnimationFrame(loop); }

    btn.addEventListener("click", () => {
        if (audio.paused) { const p = audio.play(); if (p && p.catch) p.catch(() => {}); }
        else audio.pause();
    });
    audio.addEventListener("play",  () => { paintBtn(); if (!raf) raf = requestAnimationFrame(loop); });
    audio.addEventListener("pause", () => { paintBtn(); paint(); });
    audio.addEventListener("ended", () => { paintBtn(); paint(); });
    audio.addEventListener("timeupdate", paint);
    audio.addEventListener("seeked", paint);
    ["progress", "loadedmetadata", "loadeddata", "durationchange", "canplay", "canplaythrough", "seeked"]
        .forEach(ev => audio.addEventListener(ev, () => { paintBuffered(); paint(); }));

    // Seek: click or drag; the audio jumps when the pointer is released
    function ratioFrom(e) {
        const r = bar.getBoundingClientRect();
        return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    }
    bar.addEventListener("pointerdown", e => {
        if (document.body.classList.contains("touch-locked")) return;   // touch lock: ignore the seek bar
        if (!(audio.duration > 0)) return;
        dragging = true; dragT = ratioFrom(e) * audio.duration;
        try { bar.setPointerCapture(e.pointerId); } catch (err) {}
        paint(); e.preventDefault();
    });
    bar.addEventListener("pointermove", e => { if (dragging) { dragT = ratioFrom(e) * audio.duration; paint(); } });
    bar.addEventListener("pointerup", e => {
        if (!dragging) return;
        dragging = false; audio.currentTime = dragT; paint();
    });
    bar.addEventListener("pointercancel", () => { dragging = false; paint(); });
    bar.addEventListener("keydown", e => {
        const d = audio.duration; if (!(d > 0)) return;
        let t = null;
        if (e.key === "ArrowRight") t = audio.currentTime + 5;
        else if (e.key === "ArrowLeft") t = audio.currentTime - 5;
        else if (e.key === "Home") t = 0;
        else if (e.key === "End") t = d;
        if (t === null) return;
        e.preventDefault(); e.stopPropagation(); audio.currentTime = Math.min(d, Math.max(0, t));
    });

    paintBtn(); paintMute(); paintBuffered(); paint();
}

function initAudioSync() {
    const audio = contentBox.querySelector("audio[data-ends]");
    if (!audio) return;

    const ends = audio.dataset.ends.split(",").map(parseSyncTime);
    const blocks = Array.from(contentBox.querySelectorAll(".verse-block"));
    if (ends.some(isNaN)) { console.warn("Audio sync: bad data-ends value"); return; }
    if (ends.length > blocks.length) {
        console.warn("Audio sync: " + ends.length + " times but only " + blocks.length + " blocks");
    }   // fewer times than blocks is fine: the remaining blocks are simply not synced
    const n = Math.min(ends.length, blocks.length);
    const starts = ends.slice(0, n).map((_, i) => (i === 0 ? 0 : ends[i - 1]));
    // Pin the player in the static dock above the scrolling text
    let holder = audio.closest(".audio-player");
    if (!holder) {   // page had a bare <audio>: wrap it so it sits in the pinned player
        holder = document.createElement("div"); holder.className = "audio-player";
        audio.parentNode.insertBefore(holder, audio); holder.appendChild(audio);
    }
    audioDock.appendChild(holder);
    contentPanel.classList.add("has-dock");
    buildCustomPlayer(audio, holder);   // replaces the browser's native controls

    // Playback speed: one pill in the nav bar (tap for the other two) = 1x / 1.5x / 1.75x. Choice is remembered.
    audio.setAttribute("controlsList", "nodownload noplaybackrate");   // hide the browser's own speed menu
    const SPEED_BTNS = Array.from(document.querySelectorAll("#speedGroup .speed-btn"));
    const SPEED_VALUES = SPEED_BTNS.map(b => parseFloat(b.dataset.rate));
    let rate = 1;
    try { const v = parseFloat(localStorage.getItem("audioRate")); if (SPEED_VALUES.includes(v)) rate = v; } catch (e) {}
    function paintSpeed() {
        SPEED_BTNS.forEach(b => { b.classList.toggle("active", parseFloat(b.dataset.rate) === rate); b.hidden = parseFloat(b.dataset.rate) === rate; });   // popup lists only the OTHER speeds
        if (window.setSpeedLabel) window.setSpeedLabel(rate);
    }
    function applyRate() { audio.defaultPlaybackRate = rate; audio.playbackRate = rate; }
    document.getElementById("speedMain").disabled = false;
    SPEED_BTNS.forEach(b => {
        b.disabled = false;
        b.onclick = () => {          // onclick (not addEventListener) so topics don't stack handlers
            rate = parseFloat(b.dataset.rate); applyRate(); paintSpeed();
            if (window.closeSpeedPop) window.closeSpeedPop();
            try { localStorage.setItem("audioRate", String(rate)); } catch (e) {}
        };
    });
    applyRate(); paintSpeed();
    audio.addEventListener("loadedmetadata", applyRate);   // some browsers reset the rate when the file loads

    contentBox.classList.add("sync-on");
    let active = -1;
    let syncDisabled = false;

    // If the mp3 is missing/unplayable: switch sync off so the page is plain, scrollable text.
    function disableSync() {
        if (syncDisabled) return;
        syncDisabled = true;
        if (active >= 0) blocks[active].classList.remove("verse-active");
        active = -1;
        contentBox.classList.remove("sync-on", "sync-playing");
        audioDock.innerHTML = '<div class="audio-missing">\uD83D\uDD07 Audio not available for this page</div>';
        scrollAnim = null;
    }
    const srcEl = audio.querySelector("source");
    if (srcEl) srcEl.addEventListener("error", disableSync);
    audio.addEventListener("error", disableSync);
    audio.preload = "metadata";            // make the browser try the file now, so a missing mp3 is noticed on load
    audio.load();
    setTimeout(() => {                      // safety net if no error event fires
        if (audio.readyState === 0 && audio.networkState === 3) disableSync();
    }, 5000);

    function blockAt(t) {
        for (let i = 0; i < n; i++) if (t < ends[i]) return i;
        return -1;   // after the last block: nothing highlighted
    }

    function scrollToBlock(block) {
        const boxRect = contentBox.getBoundingClientRect();
        const blkRect = block.getBoundingClientRect();
        const avail = contentBox.clientHeight;
        // block taller than the visible area: align its top; otherwise centre it
        const wantTop = blkRect.height > avail - 16 ? 8 : (avail - blkRect.height) / 2;
        smoothScrollTo(contentBox.scrollTop + (blkRect.top - boxRect.top) - wantTop, 900);
    }

    function update(forceScroll) {
        if (syncDisabled) return;
        const i = blockAt(audio.currentTime);
        if (i === active) return;
        if (active >= 0) blocks[active].classList.remove("verse-active");
        active = i;
        if (i < 0) return;
        blocks[i].classList.add("verse-active");
        if (forceScroll || Date.now() > syncUserScrollUntil) scrollToBlock(blocks[i]);
    }

    audio.addEventListener("play",       () => { contentBox.classList.add("sync-playing"); update(false); });
    audio.addEventListener("pause",      () => contentBox.classList.remove("sync-playing"));
    audio.addEventListener("ended",      () => { contentBox.classList.remove("sync-playing"); update(false); });
    audio.addEventListener("timeupdate", () => update(false));
    audio.addEventListener("seeked",     () => { syncUserScrollUntil = 0; update(true); });

    // Tap a block to jump to its start and play
    blocks.slice(0, n).forEach((block, i) => {
        block.addEventListener("click", () => {
            if (document.body.classList.contains("touch-locked")) return;   // touch lock: ignore taps on verses
            if (syncDisabled) return;
            clearTimeout(pendingTapPlay);
            pendingTapPlay = setTimeout(() => {      // short wait: a 2nd quick tap means "bookmark", not "play"
                audio.currentTime = starts[i] + 0.01;
                const p = audio.play();
                if (p && p.catch) p.catch(() => {});
            }, 280);
        });
    });
}


// ── MOBILE FIT: size EACH verse so its longest line just fits the width ──
const FIT_MIN = 12;   // px: below this, text is unreadable -> let that verse wrap instead
const FIT_MAX = 24;   // px: don't blow up very short verses beyond this
// ── MEANINGS: folder-style tabs under each verse. Telugu (.verse-purport) is open by default; English (.verse-translation) is the next tab ──
// Runs on every chapter load. Tapping a tab only switches that verse's own panel.
function enhanceMeanings() {
    contentBox.querySelectorAll(".verse-block").forEach(block => {
        if (block.querySelector(":scope > .mtabs")) return;
        const te = block.querySelector(":scope > .verse-purport");
        const en = block.querySelector(":scope > .verse-translation");
        const items = [];
        if (te) items.push({ key: "te", label: "Telugu", el: te });
        if (en) items.push({ key: "en", label: "English", el: en });
        if (!items.length) return;
        const box = document.createElement("div");
        box.className = "mtabs";
        const bar = document.createElement("div");
        bar.className = "mtab-bar"; bar.setAttribute("role", "tablist");
        box.appendChild(bar);
        const tabs = {}, panels = {};
        items.forEach(it => {
            const tab = document.createElement("button");
            tab.type = "button"; tab.className = "mtab mtab-" + it.key; tab.setAttribute("role", "tab"); tab.textContent = it.label;
            bar.appendChild(tab);
            const panel = document.createElement("div");
            panel.className = "mtab-panel"; panel.setAttribute("role", "tabpanel");
            panel.appendChild(it.el);
            box.appendChild(panel);
            tabs[it.key] = tab; panels[it.key] = panel;
            tab.addEventListener("click", e => { e.stopPropagation(); show(it.key); });   // switching tabs must not start the audio
        });
        const show = key => {
            box.dataset.active = key;
            items.forEach(it => {
                const on = it.key === key;
                tabs[it.key].setAttribute("aria-selected", on ? "true" : "false");
                tabs[it.key].tabIndex = on ? 0 : -1;
                panels[it.key].hidden = !on;
            });
        };
        bar.addEventListener("keydown", e => {
            if (items.length < 2 || (e.key !== "ArrowLeft" && e.key !== "ArrowRight")) return;
            const next = items.find(it => it.key !== box.dataset.active);
            show(next.key); tabs[next.key].focus(); e.preventDefault();
        });
        box.dataset.first = items[0].key;
        box.addEventListener("click", e => e.stopPropagation());   // reading a meaning must not start the audio either
        show(items[0].key);
        block.appendChild(box);
    });
}

function fitVerses() {
    const blocks = Array.from(contentBox.querySelectorAll(".verse-block, .verse-refrain"));
    if (!window.matchMedia("(max-width: 700px)").matches) {
        blocks.forEach(b => { b.style.fontSize = ""; b.style.whiteSpace = ""; });
        return;
    }
    if (!contentBox.clientWidth) return;   // content hidden (topic list is open)
    const TEST = 20;
    blocks.forEach(b => { b.style.whiteSpace = "nowrap"; b.style.fontSize = TEST + "px"; });
    const range = document.createRange();
    const results = blocks.map(b => {
        const cs = getComputedStyle(b);
        const avail = b.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
        const chipEl = b.querySelector(":scope > .mtabs");
        if (chipEl) { range.setStart(b, 0); range.setEndBefore(chipEl); }   // measure only the verse itself (not the tabs)
        else range.selectNodeContents(b);
        const w = range.getBoundingClientRect().width;     // width of widest line
        return w > 0 ? TEST * (avail / w) * 0.98 : FIT_MAX;
    });
    blocks.forEach((b, i) => {
        const fs = results[i];
        if (fs < FIT_MIN) { b.style.fontSize = FIT_MIN + "px"; b.style.whiteSpace = "normal"; }
        else { b.style.fontSize = (Math.floor(Math.min(fs, FIT_MAX) * 10) / 10) + "px"; }
    });
}
let fitTimer;
window.addEventListener("resize", () => { clearTimeout(fitTimer); fitTimer = setTimeout(fitVerses, 120); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitVerses);

// ── BOOKMARK + REOPEN LAST CHAPTER ──────────────────────────────────────
// ★ Double-tap (or double-click) a verse: a gold folded corner appears on it = THE bookmark (only one exists;
//   a new one replaces the old; double-tap it again to remove). It is saved at once in localStorage, as
//   chapter + verse number (not pixels), so it survives closing the page, clearing recent apps and resizes.
//   The bookmark button in the bottom bar opens that chapter and scrolls to the folded verse.
//   The last chapter you opened is reopened automatically when the page opens.
const BM_KEY = "gitaBookmark", LAST_KEY = "gitaLastTopic";
const DOUBLE_TAP_MS = 320;
try { localStorage.removeItem("gitaReaderState"); } catch (e) {}   // leftover from the earlier scroll-saving test
let bookmark = null;                 // { path, index, label }
try { bookmark = JSON.parse(localStorage.getItem(BM_KEY)); } catch (e) {}
if (!bookmark || typeof bookmark.path !== "string" || typeof bookmark.index !== "number") bookmark = null;
let pageLoaded = false, pendingJump = false, bmUserMoved = false;
const bmBtn = document.getElementById("bmBtn");
const bmToast = document.getElementById("bm-toast");
let toastTimer;

function saveBookmark() {
    try { if (bookmark) localStorage.setItem(BM_KEY, JSON.stringify(bookmark)); else localStorage.removeItem(BM_KEY); } catch (e) {}
}
function showToast(msg) {
    bmToast.textContent = msg; bmToast.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => bmToast.classList.remove("show"), 2200);
}
function paintBmBtn() { bmBtn.classList.toggle("has", !!bookmark); }
function bookmarkables() {           // blocks that can carry the bookmark: verses (or plain paragraphs if a page has none)
    const v = contentBox.querySelectorAll(".verse-block, .verse-refrain");
    return Array.from(v.length ? v : contentBox.querySelectorAll("p, li, blockquote, h2, h3"));
}
function blockFromTarget(t) {
    if (!t || !t.closest || t.closest("button, a, audio, .audio-player")) return null;
    const el = t.closest(".verse-block, .verse-refrain") || t.closest("p, li, blockquote, h2, h3");
    return el && bookmarkables().includes(el) ? el : null;
}
function markBookmark(topic) {       // draw the dog-ear if the bookmark is in the chapter now on screen
    contentBox.querySelectorAll(".bookmarked").forEach(n => n.classList.remove("bookmarked"));
    if (!bookmark || bookmark.path !== topic.path) return;
    const el = bookmarkables()[bookmark.index];
    if (el) el.classList.add("bookmarked");
}
function toggleBookmark(block) {
    const idx = bookmarkables().indexOf(block);
    if (idx < 0 || currentFlatIndex < 0) return;
    const topic = flatTopics[currentFlatIndex];
    if (bookmark && bookmark.path === topic.path && bookmark.index === idx) {
        bookmark = null; block.classList.remove("bookmarked");
        showToast("Bookmark removed");
    } else {
        contentBox.querySelectorAll(".bookmarked").forEach(n => n.classList.remove("bookmarked"));
        bookmark = { path: topic.path, index: idx, label: topic.label };
        block.classList.add("bookmarked");
        showToast("Bookmarked — tap the ribbon below to return here");
    }
    saveBookmark(); paintBmBtn();
    if (window.getSelection) window.getSelection().removeAllRanges();
}

// Double-tap detection (capture phase = runs before the verse's own tap-to-play handler)
let lastTapEl = null, lastTapAt = 0;
contentBox.addEventListener("click", e => {
    if (document.body.classList.contains("touch-locked")) { lastTapEl = null; return; }   // touch lock: no double-tap bookmark either
    const block = blockFromTarget(e.target);
    if (!block) { lastTapEl = null; return; }
    const now = Date.now();
    if (lastTapEl === block && now - lastTapAt < DOUBLE_TAP_MS) {
        e.stopPropagation();                 // 2nd tap: don't start audio
        clearTimeout(pendingTapPlay);        // ...and cancel the audio the 1st tap queued
        lastTapEl = null;
        toggleBookmark(block);
        return;
    }
    lastTapEl = block; lastTapAt = now;
}, true);
contentBox.addEventListener("mousedown", e => {      // desktop: stop the double-click from selecting a word
    if (e.detail > 1 && blockFromTarget(e.target)) e.preventDefault();
});
["wheel", "touchstart", "mousedown"].forEach(evt =>
    contentBox.addEventListener(evt, () => { bmUserMoved = true; }, { passive: true }));

function scrollToBookmarkBlock(flash) {
    const el = bookmark && bookmarkables()[bookmark.index];
    if (!el) return false;
    const box = contentBox.getBoundingClientRect(), r = el.getBoundingClientRect();
    const want = r.height > contentBox.clientHeight - 16 ? 8 : (contentBox.clientHeight - r.height) / 2;
    scrollAnim = null;
    contentBox.scrollTop += (r.top - box.top) - want;
    if (flash) { el.classList.add("bm-flash"); setTimeout(() => el.classList.remove("bm-flash"), 1500); }
    return true;
}
function jumpToBookmarkSoon() {      // verses get resized right after a chapter loads, so aim again a moment later
    bmUserMoved = false;
    const go = first => { if (!bmUserMoved) scrollToBookmarkBlock(first); };
    go(true);
    setTimeout(() => go(false), 350);
    setTimeout(() => go(false), 900);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => go(false));
}
bmBtn.addEventListener("click", () => {
    if (!bookmark) { showToast("No bookmark yet — double-tap a verse to place one"); return; }
    const i = flatTopics.findIndex(t => t.path === bookmark.path);
    if (i < 0) { showToast("Bookmarked chapter not found"); return; }
    if (i === currentFlatIndex && pageLoaded) {
        if (!scrollToBookmarkBlock(true)) showToast("Couldn't find the bookmarked verse");
        return;
    }
    pendingJump = true;              // open the chapter first; the jump happens once it has loaded
    loadTopic(i);
});
paintBmBtn();

// ── LOAD TOPIC ──────────────────────────────────────────────────────────
function loadTopic(flatIndex) {
    if (flatIndex < 0 || flatIndex >= flatTopics.length) return;
    currentFlatIndex = flatIndex;
    const topic = flatTopics[flatIndex];
    pageLoaded = false;
    try { localStorage.setItem(LAST_KEY, topic.path); } catch (e) {}   // BOOKMARK/REOPEN: remember last chapter
    stopAudioSync();   // (added) stop previous topic's audio
    if (window.matchMedia("(max-width: 700px)").matches) setSidebarCollapsed(true);   // phone: hide list after picking

    flatTopics.forEach(t => t.el.classList.remove("active"));
    topic.el.classList.add("active");
    topic.el.scrollIntoView({ block: "nearest" });

    counterEl.textContent = (flatIndex + 1) + " / " + flatTopics.length;
    contentBox.innerHTML = '<div style="color:#8a7a5a;text-align:center;padding:40px 0;">Loading…</div>';
    copyBtn.classList.remove("show");

    fetch(topic.path)
        .then(r => {
            if (r.status === 404) { const e = new Error("missing"); e.isMissing = true; throw e; }   // page not written yet
            if (!r.ok) throw new Error("HTTP " + r.status + " for " + topic.path);
            return r.text();
        })
        .then(raw => {
            if (currentFlatIndex !== flatIndex) return;   // another topic was picked meanwhile: drop this stale response
            const html = (topic.ext === "md" && window.marked) ? marked.parse(raw) : raw;
            contentBox.innerHTML = html;
            contentBox.scrollTop = 0;
            enhanceMeanings();   // fold the meanings behind chips (before audio sync / fitting look at the blocks)
            wireCopyButtons();
            if (window.hljs) contentBox.querySelectorAll("pre code").forEach(b => hljs.highlightElement(b));
            initAudioSync();   // (added) wire up audio highlighting if the page has it
            placeCopyBtn(); copyBtn.classList.add("show");
            fitVerses();
            setTimeout(fitVerses, 300);   // re-fit once fonts settle
            pageLoaded = true; markBookmark(topic);   // BOOKMARK: draw the dog-ear if it is in this chapter
            if (pendingJump) { pendingJump = false; jumpToBookmarkSoon(); }
        })
        .catch(err => {
            if (err.isMissing) {   // missing page = work in progress: just an icon
                contentBox.innerHTML = '<div role="img" aria-label="Work in progress" title="Work in progress" ' +
                    'style="text-align:center;font-size:64px;padding:70px 0;">🚧</div>';
                return;
            }
            contentBox.innerHTML =
                '<div style="color:#b5432f;padding:12px 0;text-align:center;">' + err.message +
                '<br><br>Make sure this page is served over http(s) (e.g. GitHub Pages or a local server) — ' +
                'opening the file directly (file://) blocks fetch() for security reasons.</div>';
        });
}

// ── COPY-CODE BUTTONS (on every <pre> in loaded content, as in the original) ──
function wireCopyButtons() {
    contentBox.querySelectorAll("pre").forEach(pre => {
        if (pre.querySelector(".copy-code-btn")) return;
        const btn = document.createElement("button");
        btn.className = "copy-code-btn";
        btn.textContent = "Copy";
        btn.addEventListener("click", () => {
            copyText(pre.innerText.replace(/^Copy\n?/, "")).then(() => {
                btn.textContent = "Copied"; btn.classList.add("copied");
                setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("copied"); }, 1200);
            });
        });
        pre.style.position = "relative";
        pre.appendChild(btn);
    });
}

// ── COPY BUTTON ──────────────────────────────────────────────────────────
const copyBtn = document.getElementById("copyBtn");
function placeCopyBtn() {   // sit just below the audio dock (if any), top-right of the text area
    copyBtn.style.top = ((contentPanel.classList.contains("has-dock") ? audioDock.offsetHeight : 0) + 8) + "px";
}
if (window.ResizeObserver) new ResizeObserver(placeCopyBtn).observe(audioDock);
window.addEventListener("resize", placeCopyBtn);

function topicPlainText() {
    const c = contentBox.cloneNode(true);
    c.querySelectorAll("audio, .audio-player, script, style, button, .verse-label, .copy-code-btn").forEach(n => n.remove());
    // collapse HTML source whitespace first, then turn <br> and block ends into real line breaks
    const tw = document.createTreeWalker(c, NodeFilter.SHOW_TEXT);
    for (let n = tw.nextNode(); n; n = tw.nextNode()) n.nodeValue = n.nodeValue.replace(/\s+/g, " ");
    c.querySelectorAll("br").forEach(br => br.replaceWith("\n"));
    c.querySelectorAll("p,div,h1,h2,h3,h4,h5,h6,ul,ol,blockquote,pre,hr").forEach(el => el.append("\n\n"));
    c.querySelectorAll("li").forEach(el => el.append("\n"));
    return c.textContent.split("\n").map(l => l.trim()).join("\n").replace(/\n{3,}/g, "\n\n").trim();
}
function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    return new Promise((res, rej) => {   // fallback for plain http / file://
        const ta = document.createElement("textarea");
        ta.value = text; ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
        document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy") ? res() : rej(); } catch (e) { rej(e); } finally { ta.remove(); }
    });
}
copyBtn.onclick = () => {
    copyText(topicPlainText()).then(() => {
        copyBtn.classList.add("done"); copyBtn.title = "Copied";
        setTimeout(() => { copyBtn.classList.remove("done"); copyBtn.title = "Copy text"; }, 1600);
    }).catch(() => { copyBtn.title = "Copy failed"; });
};

document.getElementById("prevBtn").onclick = () => loadTopic(currentFlatIndex - 1 < 0 ? flatTopics.length - 1 : currentFlatIndex - 1);
document.getElementById("nextBtn").onclick = () => loadTopic((currentFlatIndex + 1) % flatTopics.length);

document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.tagName === "AUDIO") return;  // (added) AUDIO: arrows seek
    if (e.key === "ArrowRight") { e.preventDefault(); document.getElementById("nextBtn").click(); }
    if (e.key === "ArrowLeft")  { e.preventDefault(); document.getElementById("prevBtn").click(); }
});

// Swipe the text area: left = Next chapter, right = Previous chapter (only while unlocked)
(function () {
    let sx = 0, sy = 0, st = 0, tracking = false;
    contentBox.addEventListener("touchstart", e => {
        tracking = e.touches.length === 1;
        if (!tracking) return;
        sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now();
    }, { passive: true });
    contentBox.addEventListener("touchcancel", () => { tracking = false; }, { passive: true });
    contentBox.addEventListener("touchend", e => {
        if (!tracking) return;
        tracking = false;
        const t = e.changedTouches[0];
        const dx = t.clientX - sx, dy = t.clientY - sy;
        if (Date.now() - st > 700) return;                          // slow drag: not a swipe
        if (Math.abs(dx) < 70 || Math.abs(dy) > Math.abs(dx) * 0.5) return;   // too short, or mostly vertical (scrolling)
        const sel = window.getSelection && window.getSelection();
        if (sel && !sel.isCollapsed) return;                        // user is selecting text
        if (document.body.classList.contains("touch-locked")) {     // touch lock: a real swipe only shows the hint
            if (window.showLockHint) window.showLockHint();
            return;
        }
        document.getElementById(dx < 0 ? "nextBtn" : "prevBtn").click();
    }, { passive: true });
})();


// ── SEARCH ───────────────────────────────────────────────────────────────
const searchInput = document.getElementById("topic-search");
const searchCount = document.getElementById("search-count");
const searchClear = document.getElementById("search-clear");

function runSearch() {
    const q = normalizeSearch(searchInput.value.trim());
    searchClear.classList.toggle("visible", searchInput.value.length > 0);

    if (!q) {
        flatTopics.forEach(t => t.el.classList.remove("search-match", "search-dim"));
        document.querySelectorAll(".category-block").forEach(b => b.classList.remove("collapsed", "search-dim-all"));
        searchCount.textContent = "";
        return;
    }

    let matches = 0;
    flatTopics.forEach(t => {
        const isMatch = t.el.dataset.search.includes(q);
        t.el.classList.toggle("search-match", isMatch);
        t.el.classList.toggle("search-dim", !isMatch);
        if (isMatch) matches++;
    });

    document.querySelectorAll(".category-block").forEach(block => {
        const hasMatch = !!block.querySelector(".topic-item.search-match");
        block.classList.remove("collapsed");
        block.classList.toggle("search-dim-all", !hasMatch && block.querySelectorAll(".topic-item").length > 0);
    });

    searchCount.textContent = matches === 0 ? "No topics found" : matches + " topic" + (matches === 1 ? "" : "s") + " found";
}

searchInput.addEventListener("input", runSearch);
searchClear.addEventListener("click", () => { searchInput.value = ""; runSearch(); searchInput.focus(); });
searchInput.addEventListener("keydown", e => {
    if (e.key === "Escape" && searchInput.value) { e.stopPropagation(); searchInput.value = ""; runSearch(); }
});

// ── SIDEBAR COLLAPSE ──────────────────────────────────────────────────
const sidebarEl = document.getElementById("sidebar");
const toggleBtn  = document.getElementById("sidebar-toggle");
function setSidebarCollapsed(collapsed) {
    sidebarEl.classList.toggle("collapsed", collapsed);
    toggleBtn.innerHTML = collapsed ? "&#187;" : "&#171;";
    toggleBtn.title = collapsed ? "Expand sidebar" : "Collapse sidebar";
    tooltipEl.classList.remove("visible");
    document.body.classList.toggle("side-open", !collapsed);
    const mb = document.getElementById("menuBtn");
    if (mb) mb.classList.toggle("open", !collapsed);
    setTimeout(fitVerses, 250);   // re-fit after sidebar width animation
}
document.getElementById("menuBtn").addEventListener("click",
    () => setSidebarCollapsed(!sidebarEl.classList.contains("collapsed")));
toggleBtn.addEventListener("click", () => setSidebarCollapsed(!sidebarEl.classList.contains("collapsed")));

// ── SPEED PILL + POPUP ────────────────────────────────────────────────
// The pill shows the current speed (1x / 1.5x / 1.75x). Tap it to pop up the other two.
const speedMain = document.getElementById("speedMain");
const speedPop  = document.getElementById("speedPop");
window.closeSpeedPop = () => { speedPop.hidden = true; speedMain.setAttribute("aria-expanded", "false"); };
window.setSpeedLabel = r => { speedMain.innerHTML = r + "&times;"; };
window.resetSpeedUI  = () => { window.closeSpeedPop(); speedMain.disabled = true; speedMain.innerHTML = "1&times;"; };
speedMain.addEventListener("click", e => {
    e.stopPropagation();
    if (speedMain.disabled) return;
    speedPop.hidden = !speedPop.hidden;
    speedMain.setAttribute("aria-expanded", speedPop.hidden ? "false" : "true");
});
document.addEventListener("click", e => { if (!speedPop.hidden && !speedPop.contains(e.target)) window.closeSpeedPop(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") window.closeSpeedPop(); });

// ── FULLSCREEN / READING MODE ─────────────────────────────────────────
const fsBtn = document.getElementById("fsBtn");
const FS_ENTER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>';   // corners pointing out = go full screen
const FS_EXIT  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h5V3M21 8h-5V3M3 16h5v5M21 16h-5v5"/></svg>';   // corners pointing in = leave full screen
function setReading(on) {
    document.body.classList.toggle("reading", on);
    fsBtn.innerHTML = on ? FS_EXIT : FS_ENTER;
    fsBtn.title = on ? "Exit full screen" : "Full screen / reading mode";
    fsBtn.setAttribute("aria-label", on ? "Exit full screen" : "Full screen");
    setTimeout(fitVerses, 250);
}
fsBtn.addEventListener("click", () => {
    if (!document.body.classList.contains("reading")) {
        setReading(true);
        const el = document.documentElement;
        if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    } else {
        setReading(false);
        if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    }
});
document.addEventListener("fullscreenchange", () => {   // e.g. phone's back gesture exits fullscreen
    if (!document.fullscreenElement) setReading(false);
    setTimeout(fitVerses, 250);
});

// ── TOUCH LOCK ────────────────────────────────────────────────────────
// While locked: verse taps, double-tap bookmark and the seek bar are ignored, and left/right swipes only show a hint.
// Scrolling up/down, Play/Pause, Prev/Next buttons, speed and the meaning chips still work.
// It starts LOCKED each time the page opens; tap the padlock to unlock.
const lockBtn = document.getElementById("lockBtn");
const LOCK_SVG   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';   // closed padlock = locked
const UNLOCK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg>';   // open padlock = unlocked
function setTouchLock(on) {
    document.body.classList.toggle("touch-locked", on);
    lockBtn.setAttribute("aria-pressed", on ? "true" : "false");
    lockBtn.innerHTML = on ? LOCK_SVG : UNLOCK_SVG;
    lockBtn.title = on ? "Touch locked: tap to unlock" : "Lock touch (ignore accidental taps)";
}
const lockHint = document.getElementById("lockHint");
let lockHintTimer = null;
window.showLockHint = () => {
    const nav = document.getElementById("navbar");
    lockHint.style.bottom = (window.innerHeight - nav.getBoundingClientRect().top + 10) + "px";
    lockHint.innerHTML = UNLOCK_SVG + "<span>Unlock to swipe</span>";
    lockHint.classList.add("show");
    clearTimeout(lockHintTimer);
    lockHintTimer = setTimeout(() => lockHint.classList.remove("show"), 1600);
};
lockBtn.addEventListener("click", () => setTouchLock(!document.body.classList.contains("touch-locked")));
setTouchLock(true);   // locked by default every time the page opens

document.body.classList.add("side-open");
document.getElementById("menuBtn").classList.add("open");
counterEl.textContent = "– / " + flatTopics.length;

// REOPEN: on page open, go straight to the last chapter you were reading (does nothing on a first visit)
(function () {
    let last = null;
    try { last = localStorage.getItem(LAST_KEY); } catch (e) {}
    const i = flatTopics.findIndex(t => t.path === last);
    if (i >= 0) loadTopic(i);
})();
</script>
