<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1604">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pictures</title>
<style>
:root{--ink:#0a1018;--panel:#142030;--line:#223349;--text:#e8eef6;--mute:#8b9bb0;--accent:#4f93e0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none;background:var(--ink);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;max-width:760px;margin:0 auto;display:flex;flex-direction:column;padding-top:0}
button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:44px;height:44px;cursor:pointer}
button:active{background:var(--line)}
button:disabled{opacity:.3;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent)}
#list,#viewer,#login{display:none;flex:1;min-height:0}
body[data-v=list] #list{display:flex;flex-direction:column;padding:10px 12px 6px}
#box{flex:1;min-height:0;overflow-y:auto;border:1px solid var(--line);border-radius:14px;padding:6px}
body[data-v=view] #viewer{display:block;position:relative;overflow:hidden;touch-action:none}
body[data-v=login] #login{display:flex;flex-direction:column;justify-content:center;gap:12px;padding:24px}
body[data-v=login] footer{display:none}
.topic{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;height:auto;min-height:40px;margin:0 0 4px;padding:5px 12px;text-align:left;border-radius:10px}
.topic>span:first-child{flex:1;min-width:0}
.topic b{display:block;font-weight:600;font-size:14px;line-height:1.3}
.topic small{display:block;color:var(--mute);font-size:11px;line-height:1.3}
.topic small:empty{display:none}
.topic .r{flex:none;display:flex;align-items:center;gap:8px}
.topic em.n{flex:none;font-style:normal;font-size:11px;font-weight:600;line-height:1;padding:3px 8px;border-radius:10px;color:#e2b877;background:rgba(255,153,51,.1);border:1px solid rgba(255,153,51,.3);font-variant-numeric:tabular-nums}
.topic.hd{display:flex}
.topic.hd i{font-style:normal;color:var(--mute);transition:transform .15s}
.grp.open>.hd i{transform:rotate(90deg)}
.kids{display:none;margin:-1px 0 6px 10px;padding-left:8px;border-left:2px solid var(--line)}
.grp.open>.kids{display:block}
.kids .topic:last-child{margin-bottom:0}
.bm{display:inline-block;width:15px;height:15px;margin-left:8px;vertical-align:-2px;fill:#f5b942;stroke:#f5b942;stroke-width:1.5;stroke-linejoin:round}
.link{display:block;margin:14px auto 0;background:none;border:0;color:var(--mute);height:auto;padding:8px;font-size:14px}
#track{display:flex;position:absolute;left:0;top:0}
#track>.msg{flex:0 0 100%}
.slide{flex:none;position:relative}
.slide img{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);object-fit:contain;border-radius:6px;transform-origin:center;will-change:transform;user-select:none;-webkit-user-drag:none}
.slide img:not([src]){visibility:hidden}
.msg{color:var(--mute);text-align:center;padding:48px 20px;line-height:1.5}
.arrow{display:none;position:absolute;top:50%;margin-top:-22px;z-index:3;border-radius:50%;background:#0a1018cc;font-size:26px;line-height:1;place-items:center}
#toast{position:absolute;top:76px;left:50%;transform:translateX(-50%);z-index:8;background:#0a1018e6;border:1px solid var(--line);border-radius:12px;padding:8px 16px;text-align:center;max-width:86%;pointer-events:none;opacity:0;transition:opacity .9s ease}
#toast.on{opacity:1;transition:opacity .2s}
#toast small{display:block;color:var(--mute);font-size:12px}
#toast b{font-size:15px}
#aL{left:10px}#aR{right:10px}
@media (pointer:fine){body[data-v=view] .arrow{display:grid}}
footer{position:relative;display:flex;gap:6px;align-items:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,153,51,.28)}
.mid{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px}
footer svg,#fsx svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block;margin:auto}
#info{position:absolute;left:0;right:0;bottom:calc(100% + 4px);text-align:center;line-height:1.25;pointer-events:none;color:rgba(232,238,246,.6);text-shadow:0 1px 3px rgba(0,0,0,.85)}
#cnt{display:block;font-size:13px;font-weight:600}
#lbl{display:block;font-size:11px;padding:0 14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body:not([data-v=view]) #info,#panel:not([hidden]) ~ #info{display:none}
#fsx{display:none;position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));right:12px;z-index:5;border-radius:50%;background:#0a1018cc}
#panel{position:absolute;right:12px;bottom:calc(100% + 8px);z-index:6;display:flex;flex-direction:column;gap:8px;padding:10px;background:rgba(20,32,48,.72);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px}
#panel[hidden],#pinrow[hidden]{display:none}
#prow,#pinrow{display:flex;gap:8px;align-items:center}
#pin{width:110px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:0 12px;font:inherit;letter-spacing:3px}
#pinerr{color:#ff8f8f;font-size:12px;min-height:0}
#del.on{border-color:#e5484d;color:#ff8f8f}
#slide{flex:1;min-width:0;max-width:340px;height:44px;position:relative;margin:0 4px;border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.04);overflow:hidden}
#slide.off{display:none}
#fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(229,72,77,.28)}
#hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-left:40px;font-size:11px;letter-spacing:.3px;color:var(--mute);white-space:nowrap;pointer-events:none}
#trash{position:absolute;left:2px;top:2px;min-width:38px;width:38px;height:38px;border-radius:50%;color:#ff8f8f;border-color:#e5484d66;touch-action:none;cursor:grab;transition:transform .2s ease}
#trash.drag{transition:none;cursor:grabbing}
#trash svg{width:20px;height:20px}
#info.warn{color:#ff9a9a}
body.max footer{display:none!important}
body.max #fsx{display:block}
/* ── saffron top ribbon ── */
#top{position:relative;z-index:5;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(11px + env(safe-area-inset-top)) 16px 11px;background:linear-gradient(135deg,#2a1604,#4a2808 50%,#2a1604);border-bottom:1px solid rgba(255,153,51,.6);animation:ribGlow 4.5s ease-in-out infinite}
#top h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.3px;color:#ffd9a0;text-shadow:0 0 12px rgba(255,153,51,.55)}
#rtxt{color:#e2b877;font-size:12px;white-space:nowrap}
#top .glint{position:absolute;top:0;bottom:0;left:0;width:34%;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,170,70,.24),transparent);transform:translateX(-120%) skewX(-18deg);animation:ribSweep 7s ease-in-out infinite}
@keyframes ribGlow{0%,100%{box-shadow:0 4px 16px -6px rgba(255,153,51,.35)}50%{box-shadow:0 6px 28px -4px rgba(255,153,51,.75)}}
@keyframes ribSweep{0%{transform:translateX(-120%) skewX(-18deg)}60%,100%{transform:translateX(320%) skewX(-18deg)}}
body[data-v=login] #top,body[data-v=view] #top{display:none}
body[data-v=login] #app,body[data-v=view] #app,body.nobar #app{padding-top:env(safe-area-inset-top)}
body[data-v=view] #toast{top:calc(14px + env(safe-area-inset-top))}
body.nobar #top{display:none}
body.max #top{display:none}
body.max #app{padding-top:0}

/* ── start screen: title + glowing saffron Start button; tap = full screen, then it fades away ── */
#start-screen{position:fixed;inset:0;z-index:10000;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 24px calc(32px + env(safe-area-inset-bottom,0px)) 0;background:radial-gradient(circle at 50% 38%,#4a2606 0%,#0a1018 70%);--start-img:none}
#start-screen::before{content:"";position:absolute;inset:0;background:var(--start-img) center/cover no-repeat;opacity:0}
#start-screen.ready::before{animation:startReveal 5s ease-in-out forwards}
@keyframes startReveal{to{opacity:1}}
#start-text{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);padding:0 20px;text-align:center;pointer-events:none}
#start-text h1{margin:0 0 10px;font-size:clamp(30px,min(9vw,14vh),56px);letter-spacing:.5px;color:#ffd9a0;text-shadow:0 0 24px rgba(255,153,51,.6),0 2px 12px rgba(0,0,0,.6);opacity:0;transform:translateY(28px)}
#start-text p{margin:0;color:#e2b877;font-size:15px;opacity:0;transform:translateY(28px)}
#start-screen.ready #start-text h1{animation:textRise 2.6s cubic-bezier(.2,.7,.3,1) .6s forwards}
#start-screen.ready #start-text p{animation:textRise 2.6s cubic-bezier(.2,.7,.3,1) 1.6s forwards}
@keyframes textRise{to{opacity:1;transform:none}}
#start-btn{position:relative;z-index:1;appearance:none;cursor:pointer;width:76px;height:76px;min-width:0;border-radius:50%;padding:0;border:2px solid rgba(255,255,255,.9);color:#3a1c02;font:700 11px/1 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;background:radial-gradient(circle at 35% 30%,#ffe9c9 0%,#ff9933 60%,#e07a14 100%);opacity:0;pointer-events:none}
#start-screen.btn-on #start-btn{pointer-events:auto;animation:startBtnIn .8s ease-out forwards,startGlow 1.8s ease-in-out infinite}
@keyframes startBtnIn{to{opacity:1}}
#start-btn:active{transform:scale(.95)}
@keyframes startGlow{0%,100%{box-shadow:0 0 8px 2px rgba(255,153,51,.75),0 0 18px 6px rgba(255,153,51,.45),inset 0 1px 0 rgba(255,255,255,.7)}50%{box-shadow:0 0 16px 6px rgba(255,190,110,1),0 0 34px 14px rgba(255,153,51,.7),inset 0 1px 0 rgba(255,255,255,.7)}}
#start-screen.leaving{pointer-events:none;animation:startFade 2.5s ease forwards}
#start-screen.leaving #start-btn{animation:startBtnOut 2.5s ease forwards}
@keyframes startFade{0%,15%{opacity:1}100%{opacity:0}}
@keyframes startBtnOut{0%{transform:scale(1);opacity:1}100%{transform:scale(1.3);opacity:0}}
@media (prefers-reduced-motion:reduce){#top,#top .glint{animation:none}#start-screen.btn-on #start-btn{opacity:1;animation:none}#start-screen.ready #start-text h1,#start-screen.ready #start-text p{animation-duration:.01s;animation-delay:0s}#start-screen.leaving{animation-duration:.3s}#start-screen.leaving #start-btn{animation:none}}

/* ── upload dialog ── */
#ud{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,8,12,.74);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#ud[hidden]{display:none}
#ubox{width:min(420px,100%);max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:16px;background:var(--panel);border:1px solid rgba(255,153,51,.45);border-radius:16px;box-shadow:0 0 28px -6px rgba(255,153,51,.4)}
#ubox h3{margin:0;font-size:17px;color:#ffd9a0}
#ubox label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute)}
#ubox label[hidden]{display:none}
#ubox input[type=text],#ubox select{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--ink);color:var(--text);padding:0 12px;font:inherit;font-size:14px;min-width:0}
#ubox input:disabled,#ubox select:disabled,#unewb:disabled{opacity:.5}
#ufrow{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--mute)}
#unewb{min-width:34px;width:34px;height:34px;border-radius:10px;color:#ffb25c;border-color:rgba(255,153,51,.4)}
#unewb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block;margin:auto}
#usum{margin:0;font-size:13px;color:#e2b877}
#uprev{color:var(--mute);font-size:12px;min-height:15px;word-break:break-all}
#uprog{display:flex;flex-direction:column;gap:6px}
#uprog[hidden]{display:none}
#ubar{height:6px;border-radius:3px;background:var(--ink);overflow:hidden}
#ubar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9933,#ffd9a0);transition:width .2s}
#ust{font-size:12px;color:var(--mute)}
#uerr{margin:0;color:#ff8f8f;font-size:13px;line-height:1.4}
#uerr:empty{display:none}
.urow{display:flex;gap:8px;justify-content:flex-end;margin-top:2px}
.urow button{min-width:88px;padding:0 16px}
#ugo{background:linear-gradient(135deg,#ffb25c,#ff9933);color:#3a1c02;font-weight:700;border-color:transparent}
#ugo:disabled{opacity:.4}

/* ── mobile app (Capacitor or installed to home screen): already full screen, so no max / min buttons ── */
body.app #max,body.app #fsx{display:none!important}
body{-webkit-touch-callout:none}
#login h2{margin:0}#login p{margin:0;color:var(--mute);line-height:1.5}
#login input{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:0 14px;font:inherit}
#lerr{color:#ff8f8f}
@media (orientation:landscape) and (pointer:coarse), (orientation:landscape) and (max-height:500px){
  body[data-v=view] footer{display:none}
  body[data-v=view] #app{max-width:none;margin:0;padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left)}
  body[data-v=view] .slide img{inset:0;width:100%;height:100%;border-radius:0}
}
</style>
</head>
<body data-v="list">
<div id="start-screen">
  <div id="start-text"><h1>Pictures</h1><p>Tap a folder to open its photos</p></div>
  <button id="start-btn" type="button">Start</button>
</div>
<div id="app">
  <header id="top"><h1>Pictures</h1><small id="rtxt"></small><i class="glint"></i></header>
  <div id="list"><div id="box"></div></div>
  <div id="login">
    <h2>Enter 4 Digits PIN</h2>
    <p>Saved only in this browser on this device.</p>
    <input id="tokin" type="password" autocomplete="off" placeholder="Aak Sri. He has the PIN ...">
    <button id="tsave">Save PIN</button>
    <p id="lerr"></p>
  </div>
  <div id="viewer">
    <div id="track"></div>
    <button class="arrow" id="aL" aria-label="Previous photo">&#8249;</button>
    <button class="arrow" id="aR" aria-label="Next photo">&#8250;</button>
    <div id="toast"><small></small><b></b></div>
  </div>
  <footer id="foot">
    <button id="menu" aria-label="Folders"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div class="mid">
    <button id="prevF" aria-label="Previous folder"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div id="slide" class="off"><div id="fill"></div><span id="hint">slide to delete</span>
      <button id="trash" aria-label="Slide right to delete this photo"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg></button></div>
    <button id="nextF" aria-label="Next folder"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <button id="gear" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    <div id="panel" hidden>
      <div id="prow">
        <button id="refresh" aria-label="Refresh folders"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v5h-5"/></svg></button>
        <button id="upl" aria-label="Upload photos"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg></button>
        <button id="max" aria-label="Full screen"></button>
        <button id="key" aria-label="Change token"><svg viewBox="0 0 24 24"><path d="M21 2l-2 2m-7.6 7.6a5.5 5.5 0 1 1-7.8 7.8 5.5 5.5 0 0 1 7.8-7.8zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg></button>
        <button id="del" aria-label="Delete mode"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg></button>
      </div>
      <div id="pinrow" hidden><input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="PIN"><button id="pinok">OK</button></div>
      <small id="pinerr"></small>
    </div>
    <div id="info"><b id="cnt"></b><small id="lbl"></small></div>
  </footer>
</div>
<input id="ufile" type="file" accept="image/*" multiple hidden>
<div id="ud" hidden><div id="ubox" role="dialog" aria-label="Upload photos">
  <h3>Upload photos</h3>
  <p id="usum"></p>
  <div id="ufrow"><span>Folder</span><button id="unewb" type="button" aria-label="New folder"></button></div>
  <select id="ufold"></select>
  <input id="unew" type="text" placeholder="Folder name (use / for a sub-folder)" autocomplete="off" autocapitalize="off" hidden>
  <label>First file name<input id="uname" type="text" autocomplete="off" autocapitalize="off"></label>
  <small id="uprev"></small>
  <div id="uprog" hidden><div id="ubar"><i></i></div><small id="ust"></small></div>
  <p id="uerr"></p>
  <div class="urow"><button id="ucancel" type="button">Cancel</button><button id="ugo" type="button">Upload</button></div>
</div></div>
<button id="fsx" aria-label="Exit full screen"><svg viewBox="0 0 24 24"><path d="M3 8h5V3M21 8h-5V3M3 16h5v5M21 16h-5v5"/></svg></button>

<script>
// Running as an app (Android Capacitor, or installed to the home screen)? Already full screen: no max / min buttons.
const IN_APP = !!(window.Capacitor && typeof window.Capacitor.isNativePlatform === "function" && window.Capacitor.isNativePlatform())
  || matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
if (IN_APP) document.body.classList.add("app");
// ── CONFIG ──────────────────────────────────────────────────────────────
const OWNER = "nerdysrisha", REPO = "pictures";
// Folders are discovered automatically, including sub-folders at any depth (one call to GitHub lists the whole repo).
// Any folder that directly contains photos becomes one entry, e.g. "all designs / Kitchen". New folders show up on refresh.
// Landscape phone + landscape photo: fill the whole screen (crops edges). Max share of the photo allowed to be
// cropped; 0.5 fills normal 4:3 / 16:9 photos. Set 0 to never fill (always show the whole photo).
const FILL_MAX_CROP = 0.5;
const DELETE_PIN = "6559";                                   // PIN that unlocks delete mode (change it here)
const NEWEST_FIRST = true, FIRST = 5, AHEAD = 2, BEHIND = 1;   // preload: first 5 on open, then 2 ahead / 1 behind

// ── HELPERS ─────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const FULL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const nat = (a, b) => a.localeCompare(b, undefined, {numeric: true});
let mem = "";
const getTok = () => { try { return localStorage.getItem("ghtok") || mem; } catch (e) { return mem; } };
const setTok = v => { mem = v; try { v ? localStorage.setItem("ghtok", v) : localStorage.removeItem("ghtok"); } catch (e) {} };
const getLast = () => { try { return localStorage.getItem("lastFolder") || ""; } catch (e) { return ""; } };
const setLast = v => { try { localStorage.setItem("lastFolder", v); } catch (e) {} };
const bmIcon = () => { const s = document.createElement("span"); s.innerHTML = '<svg class="bm" viewBox="0 0 24 24" aria-label="Last visited"><path d="M6 3h12v18l-6-4-6 4z"/></svg>'; return s.firstChild; };
const enc = p => p.split("/").map(encodeURIComponent).join("/");
const hdr = raw => ({Authorization: "Bearer " + getTok(), Accept: raw ? "application/vnd.github.raw" : "application/vnd.github+json"});
const api = (path, raw) => fetch("https://api.github.com/repos/" + OWNER + "/" + REPO + "/contents/" + enc(path), {headers: hdr(raw)});
const show = v => { document.body.dataset.v = v; closePanel(); updateBar(); };

// Folders are fetched from the repo root and sorted newest first (names start with yyyy mm dd)
let parsed = [], loaded = false, truncated = false;
const parseFolder = n => {

};
async function loadFolders() {
  const my = ++ticket;
  $("box").innerHTML = '<div class="msg">Loading folders...</div>'; show("list");
  try {
    const r = await fetch("https://api.github.com/repos/" + OWNER + "/" + REPO + "/git/trees/HEAD?recursive=1", {headers: hdr(false)});
    if (my !== ticket) return false;
    if (r.status === 401) { setTok(""); fail("PIN was rejected. Enter it again."); return false; }
    if (!r.ok) { $("box").innerHTML = '<div class="msg">Could not load folders (error ' + r.status + '). Reload to retry.</div>'; return false; }
    const data = await r.json();
    if (my !== ticket) return false;
    const dirs = {};                                         // folder path -> its photos (same shape as a folder listing)
    (data.tree || []).forEach(x => {
      if (x.type !== "blob" || !/\.(webp|jpe?g|png|gif)$/i.test(x.path)) return;
      const i = x.path.lastIndexOf("/"); if (i < 0) return;  // ignore loose files in the repo root
      const dir = x.path.slice(0, i);
      if (dir.split("/").some(seg => seg.startsWith("."))) return;
      (dirs[dir] = dirs[dir] || []).push({name: x.path.slice(i + 1), type: "file", sha: x.sha});
    });
    listCache = dirs; truncated = !!data.truncated;
    parsed = Object.keys(dirs).map(parseFolder).sort((a, b) => NEWEST_FIRST ? nat(b.n, a.n) : nat(a.n, b.n));
    loaded = true; renderList(); return true;
  } catch (e) { if (my === ticket) $("box").innerHTML = '<div class="msg">Network error. Reload to retry.</div>'; return false; }
}

// ── FOLDER LIST ─────────────────────────────────────────────────────────
const openGroups = new Set();                              // which top-level folders are expanded
let autoOpened = false;                                  // open the last-visited group once, on first list render
function renderList() {
  const g = $("box"); g.innerHTML = "";
  const last = getLast(), lastTop = last.split("/")[0];
  if (!autoOpened) { autoOpened = true; if (last) openGroups.add(lastTop); }
  const groups = new Map();                                // top-level folder -> its entries (itself and/or sub-folders)
  parsed.forEach(f => { const top = f.n.split("/")[0]; if (!groups.has(top)) groups.set(top, []); groups.get(top).push(f); });
  const cnt = f => (listCache[f.n] || []).filter(x => x.type === "file" && /\.(webp|jpe?g|png|gif)$/i.test(x.name)).length;
  const dstr = f => f.y ? f.d + " " + MON[f.mo - 1] + " " + f.y : "";
  const row = (f, title, sub) => {
    const b = document.createElement("button");
    b.className = "topic"; b.innerHTML = "<span><b></b><small></small></span><em class=\"n\"></em>";
    const tb = b.firstChild.firstChild;
    tb.textContent = title; tb.nextSibling.textContent = sub; b.lastChild.textContent = cnt(f);
    if (last && f.n === last) tb.appendChild(bmIcon());
    b.onclick = () => { savedScroll = g.scrollTop; location.hash = "f=" + encodeURIComponent(f.n); };
    return b;
  };
  groups.forEach((list, top) => {
    if (list.length === 1 && list[0].n === top) { g.appendChild(row(list[0], list[0].t, dstr(list[0]))); return; }
    const t = parseFolder(top), wrap = document.createElement("div");
    wrap.className = "grp" + (openGroups.has(top) ? " open" : "");
    const h = document.createElement("button");
    h.className = "topic hd"; h.innerHTML = "<span><b></b><small></small></span><span class=\"r\"><em class=\"n\"></em><i>&#9656;</i></span>";
    const tot = list.reduce((a, f) => a + cnt(f), 0); h.querySelector("em").textContent = tot;
    h.firstChild.firstChild.textContent = t.t;
    if (last && top === lastTop) h.firstChild.firstChild.appendChild(bmIcon());
    h.firstChild.lastChild.textContent = (dstr(t) ? dstr(t) + " \u00b7 " : "") + list.length + (list.length === 1 ? " folder" : " folders");
    h.onclick = () => { wrap.classList.toggle("open"); wrap.classList.contains("open") ? openGroups.add(top) : openGroups.delete(top); };
    const kids = document.createElement("div"); kids.className = "kids";
    list.forEach(f => kids.appendChild(row(f, f.n === top ? "Photos in this folder" : f.n.slice(top.length + 1).replace(/\//g, " / "), "")));
    wrap.appendChild(h); wrap.appendChild(kids); g.appendChild(wrap);
  });
  const note2 = t => { const d = document.createElement("div"); d.className = "msg"; d.textContent = t; g.appendChild(d); };
  if (!parsed.length) note2("No folders with photos found.");
  if (truncated) note2("The repo is very large, so this list may be incomplete.");
}

// ── VIEWER STATE ────────────────────────────────────────────────────────
const track = $("track"), V = $("viewer");
let cur = -1, files = [], cache = [], imgs = [], idx = 0, ticket = 0;
let unlocked = false, delBusy = false;
let savedScroll = 0, listCache = {}, startEnd = false, pending = null, toastT = 0;
let SW = 0, SH = 0, sc = 1, tx = 0, ty = 0, g = null, lastTap = 0, wheelLock = 0;

const note = t => { track.innerHTML = ""; const d = document.createElement("div"); d.className = "msg"; d.textContent = t; track.appendChild(d); };
const fail = t => { $("lerr").textContent = t; show("login"); };
function freeUrls() { cache.forEach(p => p && p.then && p.then(u => u && URL.revokeObjectURL(u))); cache = []; imgs = []; files = []; }

function updateBar() {
  const v = document.body.dataset.v, inView = v === "view";
  $("cnt").textContent = inView ? (files.length ? (idx + 1) + " / " + files.length : "") : (v === "list" ? parsed.length + " folders" : "");
  $("lbl").textContent = inView && cur >= 0 ? parsed[cur].t : "Pictures";
  $("rtxt").textContent = v === "list" && parsed.length ? parsed.length + " folders" : "";
  $("slide").classList.toggle("off", !(unlocked && inView && files.length));
  $("prevF").disabled = !inView;
  $("nextF").disabled = !inView;
}

async function openFolder(i) {
  const my = ++ticket; cur = i; setLast(parsed[i].n); freeUrls(); resetZoom();
  track.style.transition = "none"; track.style.transform = "";
  note("Loading photos..."); show("view"); fit();
  try {
    let list = listCache[parsed[i].n];
    if (!list) {
      const r = await api(parsed[i].n);
      if (my !== ticket) return;
      if (r.status === 401) { setTok(""); return fail("PIN was rejected. Enter it again."); }
      if (!r.ok) return note("Could not open this folder (error " + r.status + "). Check the folder name exists in the repo and the PIN can read it.");
      list = await r.json();
      if (my !== ticket) return;
      listCache[parsed[i].n] = list;
    }
    files = list.filter(x => x.type === "file" && /\.(webp|jpe?g|png|gif)$/i.test(x.name)).map(x => x.name).sort(nat);
    if (!files.length) { startEnd = false; pending = null; updateBar(); return note("No photos in this folder."); }
    track.innerHTML = ""; cache = new Array(files.length); imgs = [];
    files.forEach(() => {
      const s = document.createElement("div"); s.className = "slide";
      const im = document.createElement("img"); im.alt = ""; im.draggable = false; im.onload = () => applyFill(im);
      s.appendChild(im); track.appendChild(s); imgs.push(im);
    });
    fit();
    const n = files.length, s0 = startEnd ? Math.max(0, n - FIRST) : 0;
    place(startEnd ? n - 1 : 0, false);
    for (let k = s0; k < s0 + FIRST; k++) load(k);
    startEnd = false;
    if (pending) { toast(pending.a, pending.b); pending = null; }
  } catch (e) { if (my === ticket) note("Network error. Check your connection and try again."); }
}

function load(k) {
  if (k < 0 || k >= files.length || cache[k]) return;
  const my = ticket, im = imgs[k];
  const p = api(parsed[cur].n + "/" + files[k], true)
    .then(r => { if (r.status === 401) throw 401; if (!r.ok) throw r.status; return r.blob(); })
    .then(b => { const u = URL.createObjectURL(b); if (my === ticket && im.isConnected) im.src = u; else URL.revokeObjectURL(u); return u; })
    .catch(e => { const j = cache.indexOf(p); if (j >= 0) cache[j] = 0; if (e === 401 && my === ticket) { setTok(""); fail("PIN was rejected. Enter it again."); } });
  cache[k] = p;
}
function loadNear(i) {
  const n = files.length;
  for (let d = -BEHIND; d <= AHEAD; d++) load(i + d);
}

function place(i, anim) {
  idx = i;
  track.style.transition = anim ? "transform .28s ease" : "none";
  track.style.transform = "translateX(" + (-i * SW) + "px)";
  updateBar(); loadNear(i);
  if (i >= files.length - 2) prefetch(cur + 1);
  if (i <= 1) prefetch(cur - 1);
}
function go(d) {
  const n = files.length; if (!n) return;
  const j = idx + d;
  if (j >= 0 && j < n) { resetZoom(); return place(j, true); }
  const L = parsed.length;
  if (L < 2) { resetZoom(); return place(d > 0 ? 0 : n - 1, true); }
  const f = (cur + (d > 0 ? 1 : -1) + L) % L;             // past the last / first photo: next / previous folder (loops)
  const wrapped = d > 0 ? cur === L - 1 : cur === 0;
  startEnd = d < 0;
  pending = {a: wrapped ? (d > 0 ? "Back to the first folder" : "Back to the last folder") : (d > 0 ? "Next folder" : "Previous folder"), b: parsed[f].t};
  location.replace("#f=" + encodeURIComponent(parsed[f].n));
}
function prefetch(j) {                                    // fetch the neighbouring folder's photo list in advance
  j = (j + parsed.length) % parsed.length;
  if (listCache[parsed[j].n] || listCache["~" + j]) return;
  listCache["~" + j] = 1;
  api(parsed[j].n).then(r => r.ok ? r.json() : null).then(l => { if (l) listCache[parsed[j].n] = l; }).catch(() => {});
}
function toast(a, b) {
  const t = $("toast"); t.firstChild.textContent = a; t.firstChild.style.display = a ? "block" : "none"; t.lastChild.textContent = b;
  t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2000);
}
function step(d) {
  const j = (cur + d + parsed.length) % parsed.length;
  if (j !== cur) location.replace("#f=" + encodeURIComponent(parsed[j].n));
}

// ── ZOOM + SWIPE ────────────────────────────────────────────────────────
function paint() { const im = imgs[idx]; if (im) im.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + sc + ")"; }
function resetZoom() { sc = 1; tx = ty = 0; paint(); }
function clamp() {

}
function zoomAt(x, y, s) {

  clamp(); paint();
}
const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
V.addEventListener("touchstart", e => {
  if (!files.length) return;
  if (e.touches.length === 2) { place(idx, false); g = {m: "pinch", d: dist(e.touches), s: sc}; return; }
  const t = e.touches[0];
  g = {m: sc > 1 ? "pan" : "swipe", x: t.clientX, y: t.clientY, tx, ty, moved: false};
}, {passive: true});
V.addEventListener("touchmove", e => {
  if (!g) return; e.preventDefault();

}, {passive: false});
V.addEventListener("touchend", e => {

    else lastTap = now;
  } else if (g.m === "swipe") {

});
V.addEventListener("touchcancel", () => { if (g && g.m === "swipe") place(idx, true); g = null; });
V.addEventListener("wheel", e => {
  e.preventDefault();
  if (e.ctrlKey) { zoomAt(e.clientX, e.clientY, Math.min(6, Math.max(1, sc * (e.deltaY < 0 ? 1.15 : 0.87)))); return; }
  if (sc > 1) { tx -= e.deltaX; ty -= e.deltaY; clamp(); paint(); return; }

V.addEventListener("dblclick", e => { if (matchMedia("(pointer:fine)").matches) sc > 1 ? resetZoom() : zoomAt(e.clientX, e.clientY, 2.5); });
function fit() {                                          // size app, viewer and slides in pixels (robust in landscape)
  const vv = window.visualViewport, H0 = Math.round(vv ? vv.height : innerHeight);
  $("app").style.height = H0 + "px";
  if (document.body.dataset.v !== "view") return;
  const foot = $("foot"), fb = getComputedStyle(foot).display === "none" ? 0 : foot.offsetHeight;
  SW = V.clientWidth;
  const H = Math.max(50, H0 - Math.round(V.getBoundingClientRect().top) - fb);
  const sl = track.querySelectorAll(".slide");
  track.style.width = (sl.length ? sl.length * SW : SW) + "px"; track.style.height = H + "px";
  sl.forEach(x => { x.style.width = SW + "px"; x.style.height = H + "px"; });
  SH = H; imgs.forEach(applyFill);
}
function applyFill(im) {
  const w = im.naturalWidth, h = im.naturalHeight; if (!w || !h || !SH) return;
  const rs = SW / SH, rp = w / h, crop = 1 - Math.min(rs / rp, rp / rs);
  im.style.objectFit = (SW > SH && w > h && crop <= FILL_MAX_CROP) ? "cover" : "contain";
}
function realign() { fit(); if (files.length) { resetZoom(); place(idx, false); } }
window.addEventListener("resize", realign);
window.addEventListener("orientationchange", () => { setTimeout(realign, 100); setTimeout(realign, 500); });
if (window.visualViewport) visualViewport.addEventListener("resize", realign);
document.addEventListener("fullscreenchange", () => setTimeout(realign, 150));

// ── BUTTONS + KEYS ──────────────────────────────────────────────────────
$("aL").onclick = () => go(-1); $("aR").onclick = () => go(1);
$("prevF").onclick = () => step(-1); $("nextF").onclick = () => step(1);
$("menu").onclick = () => { location.hash = ""; };
// settings panel (gear): refresh, full screen, delete mode
const panel = $("panel");
function closePanel() { panel.hidden = true; $("pinrow").hidden = true; $("pin").value = ""; $("pinerr").textContent = ""; }
$("gear").onclick = e => { e.stopPropagation(); panel.hidden ? (panel.hidden = false) : closePanel(); };
panel.addEventListener("click", e => e.stopPropagation());
document.addEventListener("click", closePanel);
$("refresh").onclick = () => {                                   // re-read the folder list (and photo lists) from GitHub
  closePanel();
  if (document.body.dataset.v === "list") savedScroll = $("box").scrollTop;
  loaded = false; listCache = {}; route();
};
const syncLock = () => { $("del").classList.toggle("on", unlocked); updateBar(); };
let pinFor = "";                                                  // what the PIN is being asked for: "del" or "tok"
const askPin = what => { pinFor = what; $("pin").value = ""; $("pinerr").textContent = ""; $("pinrow").hidden = false; $("pin").focus(); };
$("del").onclick = () => {
  if (unlocked) { unlocked = false; closePanel(); syncLock(); return; }
  askPin("del");
};
$("key").onclick = () => askPin("tok");
function tryPin() {
  if ($("pin").value === DELETE_PIN) {
    closePanel();
    if (pinFor === "tok") changeToken();
    else { unlocked = true; syncLock(); toast("", "Delete unlocked"); }
  }
  else { $("pinerr").textContent = "Wrong PIN"; $("pin").value = ""; }
}
$("pinok").onclick = tryPin;
$("pin").addEventListener("keydown", e => { if (e.key === "Enter") tryPin(); });

// permanently delete the photo on screen (needs the PIN to have Contents: read & write)
async function delPhoto(expect) {
  if (!unlocked || !files.length || delBusy || files[idx] !== expect) return;
  const name = files[idx], folder = parsed[cur].n, k = idx;
  const ent = (listCache[folder] || []).find(x => x.name === name);
  if (!ent) return toast("", "Tap refresh, then try again");
  delBusy = true; $("trash").disabled = true;
  try {
    const r = await fetch("https://api.github.com/repos/" + OWNER + "/" + REPO + "/contents/" + enc(folder + "/" + name), {
      method: "DELETE", headers: {...hdr(false), "Content-Type": "application/json"},
      body: JSON.stringify({message: "Delete " + name, sha: ent.sha})});
    if (!r.ok) return toast("Delete failed (" + r.status + ")", r.status === 401 || r.status === 403 || r.status === 404 ? "PIN needs Contents: read & write" : "Tap refresh and try again");
    listCache[folder] = listCache[folder].filter(x => x.name !== name);
    if (cur >= 0 && parsed[cur].n === folder && files[k] === name) removeSlide(k, folder);
  } catch (e) { toast("", "Network error, not deleted"); }

}
function removeSlide(k, folder) {
  resetZoom();
  const c = cache[k]; c && c.then && c.then(u => u && URL.revokeObjectURL(u));
  files.splice(k, 1); cache.splice(k, 1); imgs.splice(k, 1); track.removeChild(track.children[k]);
  if (!files.length) {
    if (!listCache[folder].length) { loaded = false; listCache = {}; location.hash = ""; return; }   // empty folder disappears from git
    note("No photos in this folder."); updateBar(); return;
  }
  fit(); place(Math.min(k, files.length - 1), false); toast("", "Deleted");
}

// slide-to-delete: drag the trash handle all the way to the right (releasing early springs back)
const hd = $("trash"), sl = $("slide");
let sd = null;
const maxX = () => sl.clientWidth - hd.offsetWidth - 4;
function slideTo(x) { hd.style.transform = "translateX(" + x + "px)"; $("fill").style.width = x > 0 ? (x + hd.offsetWidth + 2) + "px" : "0"; }
hd.addEventListener("pointerdown", e => {
  if (delBusy || !unlocked || !files.length) return;
  sd = {x: e.clientX, dx: 0, name: files[idx]};
  hd.setPointerCapture(e.pointerId); hd.classList.add("drag");
  $("info").classList.add("warn"); $("lbl").textContent = "Delete: " + sd.name;
});
hd.addEventListener("pointermove", e => { if (sd) { sd.dx = Math.max(0, Math.min(maxX(), e.clientX - sd.x)); slideTo(sd.dx); } });
function endSlide(e) {
  if (!sd) return;
  const d = sd; sd = null; hd.classList.remove("drag"); $("info").classList.remove("warn"); updateBar();
  if (e.type === "pointerup" && d.dx >= maxX() * 0.9) { slideTo(maxX()); delPhoto(d.name).finally(() => slideTo(0)); }
  else slideTo(0);
}
hd.addEventListener("pointerup", endSlide); hd.addEventListener("pointercancel", endSlide);
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || !$("ud").hidden || document.body.dataset.v !== "view") return;
  if (e.key === "ArrowRight") { e.preventDefault(); go(1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); go(-1); }
  else if (e.key === "ArrowDown") { e.preventDefault(); step(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); step(-1); }
  else if (e.key === "Escape" && !document.body.classList.contains("max")) location.hash = "";
});

// full screen (iPhone Safari has no API: hide the bar instead)

const COL = '<svg viewBox="0 0 24 24"><path d="M3 8h5V3M21 8h-5V3M3 16h5v5M21 16h-5v5"/></svg>';

  else document.body.classList.toggle("max", on);

// ── PIN ───────────────────────────────────────────────────────────────
function changeToken() { setTok(""); unlocked = false; syncLock(); $("lerr").textContent = ""; $("tokin").value = ""; route(); }
async function saveToken() {
  const v = $("tokin").value.trim(); if (!v) return;
  $("lerr").textContent = "Checking...";
  setTok(v);
  try {
    const r = await fetch("https://api.github.com/repos/" + OWNER + "/" + REPO, {headers: hdr(false)});
    if (r.ok) { $("lerr").textContent = ""; $("tokin").value = ""; return route(); }
    setTok(""); $("lerr").textContent = r.status === 401 ? "GitHub rejected this PIN. Check it and try again."
      : "This PIN cannot read " + OWNER + "/" + REPO + " (error " + r.status + "). Check its repository access.";
  } catch (e) { setTok(""); $("lerr").textContent = "Network error. Check your connection and try again."; }
}
$("tsave").onclick = saveToken;
$("tokin").addEventListener("keydown", e => { if (e.key === "Enter") saveToken(); });

// ── ROUTING (#f=<folder name>) ──────────────────────────────────────────
async function route() {
  if (!getTok()) { ++ticket; return show("login"); }
  if (!loaded && !(await loadFolders())) return;
  const m = location.hash.match(/^#f=(.+)$/);
  if (!m) { ++ticket; freeUrls(); cur = -1; show("list"); renderList(); $("box").scrollTop = savedScroll; return; }
  const i = parsed.findIndex(f => f.n === decodeURIComponent(m[1]));
  if (i < 0) { location.hash = ""; return; }
  openFolder(i);
}
window.addEventListener("hashchange", route);
route();

// ── UPLOAD (gear panel) ─────────────────────────────────────────────────
// Pick photos from the gallery -> choose / create a folder -> each photo is converted to WebP (quality 80%, JPEG if the browser cannot)
// and pushed to the repo with the next free number as its name. GIFs and photos that are already WebP are sent as they are.
const WEBP_OK = (() => { try { return document.createElement("canvas").toDataURL("image/webp").startsWith("data:image/webp"); } catch (e) { return false; } })();
const UQ = 0.8, UMAX = 4096;
const PLUS = '<svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM12 10v6M9 13h6"/></svg>', BACK = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const IMG_RE = /\.(webp|jpe?g|png|gif)$/i;
let upFiles = [], upBusy = false, upStop = false, upNew = false;

const folderNames = f => (listCache[f] || []).filter(x => x.type === "file").map(x => x.name);
function suggestName(folder) {                       // last number in the folder + 1, same prefix and zero padding
  let best = null;
  folderNames(folder).forEach(n => { const m = n.match(/^(.*?)(\d+)\.[A-Za-z0-9]+$/); if (m && (!best || +m[2] > best.num)) best = {p: m[1], num: +m[2], w: m[2].length}; });
  return best ? best.p + String(best.num + 1).padStart(best.w, "0") : "0001";
}
function makeNamer(val, taken) {                     // "0043" -> 0043, 0044, 0045 ... skipping names already in the folder
  val = val.trim().replace(IMG_RE, "");
  const m = val.match(/^(.*?)(\d+)$/);
  let p = m ? m[1] : (val ? val + " " : ""), num = m ? +m[2] : 1, w = m ? m[2].length : 0;
  return ext => { for (;;) { const n = p + String(num++).padStart(w, "0") + "." + ext; if (!taken.has(n.toLowerCase())) { taken.add(n.toLowerCase()); return n; } } };
}
const takenSet = folder => new Set(folderNames(folder).map(n => n.toLowerCase()));
const today = () => { const d = new Date(); return d.getFullYear() + " " + String(d.getMonth() + 1).padStart(2, "0") + " " + String(d.getDate()).padStart(2, "0") + " "; };
const destFolder = () => upNew ? $("unew").value.trim().replace(/\\/g, "/").replace(/\/+/g, "/").replace(/^\/|\/$/g, "") : $("ufold").value;
const upErr = t => { $("uerr").textContent = t || ""; };

function upPreview() {
  const f = destFolder(), ext = WEBP_OK ? "webp" : "jpg";
  if (!f || !upFiles.length) { $("uprev").textContent = ""; return; }
  const nm = makeNamer($("uname").value, takenSet(f)); let a = nm(ext), b = a;
  for (let i = 1; i < upFiles.length; i++) b = nm(ext);
  $("uprev").textContent = upFiles.length > 1 ? "Saved as " + a + " \u2026 " + b : "Saved as " + a;
}
function upFolderChanged(focus) {
  $("ufold").hidden = upNew; $("unew").hidden = !upNew;
  $("unewb").innerHTML = upNew ? BACK : PLUS; $("unewb").setAttribute("aria-label", upNew ? "Choose an existing folder" : "New folder");
  if (upNew && !$("unew").value) $("unew").value = today();
  $("uname").value = suggestName(upNew ? "" : $("ufold").value);
  upErr(); upPreview();
  if (upNew && focus === true) { const u = $("unew"); u.focus(); u.setSelectionRange(u.value.length, u.value.length); }
}
function openUpload(files) {
  upFiles = files.slice().sort((a, b) => (a.lastModified - b.lastModified) || nat(a.name, b.name));   // oldest photo first, so numbers follow the date taken
  const sel = $("ufold"); sel.innerHTML = "";
  parsed.forEach(f => { const o = document.createElement("option"); o.value = f.n; o.textContent = f.n.replace(/\//g, " / "); sel.appendChild(o); });
  const last = getLast();
  upNew = !parsed.length;
  if (parsed.length) sel.value = cur >= 0 && parsed[cur] ? parsed[cur].n : (parsed.some(f => f.n === last) ? last : parsed[0].n);
  $("unew").value = "";
  $("usum").textContent = upFiles.length + (upFiles.length === 1 ? " photo selected" : " photos selected");
  $("uprog").hidden = true; $("ubar").firstChild.style.width = "0";
  $("ugo").disabled = false; $("ugo").textContent = "Upload"; $("ucancel").textContent = "Cancel";
  ["ufold", "unew", "uname", "unewb"].forEach(i => $(i).disabled = false);
  upFolderChanged();
  $("ud").hidden = false;
}
const closeUpload = () => { if (upBusy) return; $("ud").hidden = true; upFiles = []; };

$("upl").onclick = () => { closePanel(); $("ufile").click(); };
$("ufile").onchange = () => { const fl = Array.from($("ufile").files || []).filter(f => /^image\//.test(f.type) || IMG_RE.test(f.name)); $("ufile").value = ""; if (fl.length) openUpload(fl); };
$("ufold").onchange = () => upFolderChanged();
$("unewb").onclick = () => { upNew = !upNew; upFolderChanged(true); };
$("unew").oninput = () => { upErr(); upPreview(); };
$("uname").oninput = upPreview;
$("ucancel").onclick = () => { if (upBusy) { upStop = true; $("ucancel").disabled = true; $("ucancel").textContent = "Stopping\u2026"; } else closeUpload(); };
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("ud").hidden) closeUpload(); });

const readB64 = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result.split(",")[1]); r.onerror = () => rej(new Error("read")); r.readAsDataURL(b); });
const loadImg = f => new Promise((res, rej) => { const u = URL.createObjectURL(f), im = new Image(); im.onload = () => { URL.revokeObjectURL(u); res(im); }; im.onerror = () => { URL.revokeObjectURL(u); rej(new Error("decode")); }; im.src = u; });
const canvasBlob = (c, type, q) => new Promise(res => c.toBlob(res, type, q));
async function convert(file) {
  const gif = file.type === "image/gif" || /\.gif$/i.test(file.name), web = file.type === "image/webp" || /\.webp$/i.test(file.name);
  if (gif || web) return {blob: file, ext: gif ? "gif" : "webp"};
  let src; try { src = await createImageBitmap(file, {imageOrientation: "from-image"}); } catch (e) { src = await loadImg(file); }
  const w0 = src.width || src.naturalWidth, h0 = src.height || src.naturalHeight, k = Math.min(1, UMAX / Math.max(w0, h0));
  const c = document.createElement("canvas"); c.width = Math.round(w0 * k); c.height = Math.round(h0 * k);
  const x = c.getContext("2d"); x.drawImage(src, 0, 0, c.width, c.height);
  let blob = await canvasBlob(c, "image/webp", UQ), ext = "webp";
  if (!blob || blob.type !== "image/webp") { x.globalCompositeOperation = "destination-over"; x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); blob = await canvasBlob(c, "image/jpeg", UQ); ext = "jpg"; }
  if (src.close) src.close(); c.width = c.height = 0;
  if (!blob) throw new Error("convert");
  return {blob, ext};
}

$("ugo").onclick = async () => {
  if (upBusy) return;
  const folder = destFolder();
  if (!folder) return upErr("Type a folder name.");
  if (folder.split("/").some(seg => !seg.trim() || seg.startsWith("."))) return upErr("Folder names cannot be empty or start with a dot.");
  if (!$("uname").value.trim()) return upErr("Type the first file name.");
  upErr(); upBusy = true; upStop = false;
  ["ufold", "unew", "uname", "unewb"].forEach(i => $(i).disabled = true);
  $("ugo").disabled = true; $("ucancel").textContent = "Stop"; $("uprog").hidden = false;
  const total = upFiles.length, next = makeNamer($("uname").value, takenSet(folder));
  let ok = 0, bad = 0, msg = "";
  for (let i = 0; i < total && !upStop; i++) {
    $("ust").textContent = "Uploading " + (i + 1) + " of " + total + (bad ? " \u00b7 " + bad + " failed" : "");
    $("ubar").firstChild.style.width = Math.round(i / total * 100) + "%";
    let conv, b64;
    try { conv = await convert(upFiles[i]); b64 = await readB64(conv.blob); }
    catch (e) { bad++; continue; }
    let sent = false, fatal = false;
    for (let t = 0; t < 6 && !sent; t++) {
      const name = next(conv.ext);
      try {
        const r = await fetch("https://api.github.com/repos/" + OWNER + "/" + REPO + "/contents/" + enc(folder + "/" + name), {
          method: "PUT", headers: {...hdr(false), "Content-Type": "application/json"},
          body: JSON.stringify({message: "Add " + name, content: b64})});
        if (r.ok) {
          const j = await r.json();
          if (!listCache[folder]) listCache[folder] = [];
          if (!parsed.some(f => f.n === folder)) {          // brand-new folder: add it to the list
            const keep = cur >= 0 && parsed[cur] ? parsed[cur].n : null;
            parsed.push(parseFolder(folder)); parsed.sort((a, b) => NEWEST_FIRST ? nat(b.n, a.n) : nat(a.n, b.n));
            if (keep) cur = parsed.findIndex(f => f.n === keep);
          }
          listCache[folder].push({name, type: "file", sha: j.content && j.content.sha});
          sent = true; ok++;
        } else if (r.status === 422) continue;               // name already taken: try the next number
        else { fatal = true; msg = r.status === 401 || r.status === 403 || r.status === 404 ? "The PIN needs Contents: read & write for this repository." : "GitHub error " + r.status + "."; break; }
      } catch (e) { fatal = true; msg = "Network error."; break; }
    }
    if (fatal) { bad += total - i; break; }
    if (!sent) bad++;
  }
  upBusy = false;
  $("ubar").firstChild.style.width = Math.round(ok / total * 100) + "%";
  if (document.body.dataset.v === "list") { renderList(); }
  updateBar();
  if (ok && !bad && !upStop) { $("ud").hidden = true; upFiles = []; toast("", "Uploaded " + ok + (ok === 1 ? " photo" : " photos") + " to " + folder.replace(/\//g, " / ")); return; }
  $("ust").textContent = "Uploaded " + ok + " of " + total + (upStop ? " (stopped)" : "") + (bad && !upStop ? " \u00b7 " + bad + " not uploaded" : "");
  upErr(msg || (bad && !upStop ? "Some photos could not be read or uploaded." : ""));
  $("ucancel").disabled = false; $("ucancel").textContent = "Close";
};

// ── START SCREEN ────────────────────────────────────────────────────────
// Full screen can only be requested from a tap, so the tap on "Start" asks for it, then the screen fades away (2.5 s).
// (iPhone Safari has no full-screen API: there only the top ribbon is hidden. In an app it is already full screen.)
(function () {
  const scr = $("start-screen"), btn = $("start-btn");
  const m = /url\(["']?(.*?)["']?\)/.exec(getComputedStyle(scr).getPropertyValue("--start-img"));
  const ready = () => scr.classList.add("ready");
  if (m) { const img = new Image(); img.onload = img.onerror = ready; img.src = m[1]; setTimeout(ready, 1500); } else ready();
  setTimeout(() => scr.classList.add("btn-on"), 1000);
  let done = false;
  const finish = () => { if (!done) { done = true; scr.remove(); realign(); } };
  btn.addEventListener("click", () => {
    if (!IN_APP) { if (canFS) setMax(true); else document.body.classList.add("nobar"); }
    setTimeout(realign, 150);
    scr.classList.add("leaving");
    scr.addEventListener("animationend", e => { if (e.target === scr) finish(); });
    setTimeout(finish, 3200);
  });
})();
</script>
