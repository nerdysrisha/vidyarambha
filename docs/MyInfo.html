<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1018">
<title>MyInfo</title>
<style>
:root{--ink:#0a1018;--panel:#142030;--line:#223349;--text:#e8eef6;--mute:#8b9bb0;--accent:#4f93e0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{height:100dvh;max-width:760px;margin:0 auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:44px;height:44px;cursor:pointer}
button:active{background:var(--line)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent)}
button[hidden]{display:none}
button:disabled{opacity:.3;cursor:default}
#list{flex:1;overflow-y:auto;padding:10px 12px calc(14px + env(safe-area-inset-bottom))}
.cat{margin-bottom:8px}
.cat>button{width:100%;display:flex;justify-content:space-between;align-items:center;padding:0 16px;font-weight:650;font-size:17px;text-align:left}
.cat>button i{font-style:normal;color:var(--mute);transition:transform .15s}
button.cat.direct{width:100%;display:flex;align-items:center;padding:0 16px;margin-bottom:8px;font-weight:650;font-size:17px;text-align:left}
.cat.open>button i{transform:rotate(90deg)}
.topics{display:none;padding:0 0 4px 22px;margin-left:18px}
.cat.open .topics{display:block}
.topic{position:relative;display:block;width:100%;height:auto;min-height:52px;margin-top:6px;padding:8px 14px;text-align:left;background:transparent}
.topic::before{content:"";position:absolute;left:-22px;top:calc(50% - 1px);width:22px;height:2px;background:var(--line)}
.topic::after{content:"";position:absolute;left:-22px;top:-6px;bottom:-1px;width:2px;background:var(--line)}
.topic:last-child::after{bottom:50%}
.topic b{display:block;font-weight:600;font-size:16px}
.topic small{color:var(--mute)}
.empty{color:var(--mute);padding:8px 14px}
#viewer{flex:1;min-height:0;position:relative;display:none}
#slides,#page{height:100%;overflow-y:auto}
#slides[hidden],#page[hidden]{display:none}
/* swipe + pinch-zoom are handled in JS (one image per swipe, left/right) */
#slides{display:flex;overflow:hidden;touch-action:none}
#slides>.msg{flex:0 0 100%}
.slide{flex:0 0 100%;min-width:0;height:100%;display:grid;place-items:center;padding:6px}
.slide img:not([src]){visibility:hidden}
.slide img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;transform-origin:center;will-change:transform;user-select:none;-webkit-user-drag:none}
#page{padding:12px 14px 24px;line-height:1.5}
#page img{max-width:100%;height:auto;display:block;margin:10px 0;border-radius:6px}
#page h1,#page h2,#page h3{margin:.6em 0 .3em}
footer{display:flex;gap:6px;align-items:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
footer button svg,#fsx svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block;margin:auto}
#mid{flex:1;min-width:0;text-align:center;line-height:1.25}
#cnt{display:block;font-size:16px;font-weight:650}
#lbl{display:block;color:var(--mute);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.view #viewer{display:block}body.view #list{display:none}
/* maximize: hide the bar, show a small floating minimize button */
#fsx{display:none;position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));right:12px;z-index:5;border-radius:50%;background:#0a1018cc}
body.max footer{display:none!important}
body.max #fsx{display:block}
body.max #app{padding-top:0}
#zoom{position:fixed;inset:0;background:#000;display:none;touch-action:none;overflow:hidden;z-index:9}
#zoom img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
#zoom button{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:2;border-radius:50%;background:#0a1018cc}
.msg{color:var(--mute);text-align:center;padding:48px 20px;line-height:1.5}
/* LANDSCAPE (phones/tablets): no bar, no margins - the image gets the whole screen */
@media (orientation:landscape) and (pointer:coarse), (orientation:landscape) and (max-height:500px){
  body.view footer{display:none}
  body.view #app{max-width:none;margin:0;padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left)}
  body.view .slide{padding:0}
  body.view .slide img{border-radius:0}
}
</style>
</head>
<body>
<div id="app">
  <div id="list"><div id="cats"></div></div>
  <div id="viewer">
    <div id="slides"></div>
    <div id="page" hidden></div>
  </div>
  <footer>
    <button id="menu" aria-label="Topics"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <button id="prevT" aria-label="Previous topic"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div id="mid"><b id="cnt"></b><small id="lbl">Topics</small></div>
    <button id="nextT" aria-label="Next topic"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <button id="max" aria-label="Full screen"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg></button>
  </footer>
</div>
<button id="fsx" aria-label="Exit full screen"><svg viewBox="0 0 24 24"><path d="M3 8h5V3M21 8h-5V3M3 16h5v5M21 16h-5v5"/></svg></button>
<div id="zoom"><button id="zclose" aria-label="Close">&#10005;</button><img alt=""></div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────────────
// Files live under docs/subjects/myinfo/<cat-slug>/
// Row: [slug, label, desc, keywords, count]
//   count > 0  -> IMAGE topic: shows <cat-slug>/<slug>/1.webp ... <count>.webp   (no html file needed)
//   count = 0  -> PAGE topic:  loads <cat-slug>/<slug>.html   (use FULL paths for <img> inside it)
const BASE_URL = "subjects/myinfo/";
const IMG_EXT = "webp";
// The count in each row is a MAXIMUM. The page checks which images really exist
// and only shows those (e.g. count 40 with 30 files -> 30 slides).
// WRAP = true : swiping past the last image goes back to the first (and vice versa).
const WRAP = true;
// Image loading: on opening a topic only the first PRELOAD_FIRST images are fetched; after that,
// while you swipe, just BEHIND images before and AHEAD images after the current one are kept ready.
const PRELOAD_FIRST = 5, AHEAD = 2, BEHIND = 1;

const categories = [
    {
        name: "Home Designs",
        slug: "home-designs",
        topics: [
            ["balcony-designs",   "Balcony Designs",   "Balcony ideas",             "balcony terrace plants seating", 100],
            ["bathroom",          "Bathroom",          "Bathroom ideas",            "bathroom shower toilet vanity tiles", 100],
            ["curtains",          "Curtains",          "Curtain ideas",             "curtains drapes blinds window", 100],
            ["drainage-closure",  "Drainage Closure",  "Drainage closure ideas",    "drainage closure cover drain", 100],
            ["elevation-removal", "Elevation Removal", "Elevation removal ideas",   "elevation removal facade exterior", 100],
            ["furniture",         "Furniture",         "Furniture ideas",           "furniture sofa table chair bed", 100],
            ["kitchen",           "Kitchen",           "Kitchen ideas",             "kitchen cabinets countertop cooking", 100],
            ["misc-designs",      "Misc Designs",      "Miscellaneous ideas",       "misc miscellaneous design ideas", 100],
            ["nairobi-apartment", "Nairobi Apartment", "Nairobi apartment designs", "nairobi apartment flat interior", 100],
            ["parking design",    "Parking Design",    "Parking ideas",             "parking car garage carport", 100],
            ["pergola-designs",   "Pergola Designs",   "Pergola ideas",             "pergola shade garden outdoor", 100],
            ["planter-boxes",     "Planter Boxes",     "Planter box ideas",         "planter boxes plants garden pots", 100],
            ["portico-designs",   "Portico Designs",   "Portico ideas",             "portico entrance porch canopy", 100],
            ["simple-box",        "Simple Box",        "Simple box designs",        "simple box minimal modern", 100]
            // ["sofa-designs", "Sofa Designs", "", "sofa couch living room", 8]
        ]
    },
    {
        // direct image category: no sub-topics, images sit right in the folder
        // subjects/myinfo/lisbon-transport/1.webp, 2.webp ... (count = maximum)
        name: "Lisbon Transport",
        slug: "lisbon-transport",
        count: 100,
        topics: []
    }
];

// ── STATE ───────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const flat = [];
let cur = -1;

const hashOf = t => t.cat.slug + (t.slug ? "/" + t.slug : "");
categories.forEach(cat => {
    if (cat.count) {                                   // category that itself holds the images
        const t = {cat, slug: "", label: cat.name, n: cat.count, isImg: true};
        const b = document.createElement("button"); b.className = "cat direct";
        b.innerHTML = "<span></span>"; b.firstChild.textContent = cat.name;
        b.onclick = () => { location.hash = hashOf(t); };
        t.el = b; t.idx = flat.length; flat.push(t);
        $("cats").appendChild(b);
        return;
    }
    const block = document.createElement("div"); block.className = "cat open";
    const head = document.createElement("button");
    head.innerHTML = "<span></span><i>&#8250;</i>"; head.firstChild.textContent = cat.name;
    head.onclick = () => block.classList.toggle("open");
    const list = document.createElement("div"); list.className = "topics";
    if (!cat.topics.length) list.innerHTML = '<div class="empty">No topics yet</div>';
    cat.topics.forEach(([slug, label, desc, kw, n]) => {
        const t = {cat, slug, label, n: n || 0, key: norm(cat.name + " " + label + " " + (kw || ""))};
        t.isImg = t.n > 0;
        const b = document.createElement("button"); b.className = "topic";
        b.innerHTML = "<b></b>";
        b.firstChild.textContent = label;
        t.el = b; t.idx = flat.length; flat.push(t);
        b.onclick = () => { location.hash = hashOf(t); };
        list.appendChild(b);
    });
    block.append(head, list); block.dataset.n = cat.topics.length;
    $("cats").appendChild(block);
});

// ── ROUTING (phone back button works: list -> topic) ────────────────────
window.addEventListener("hashchange", route);
function route() {
    const [c, s = ""] = location.hash.slice(1).split("/");
    const i = flat.findIndex(t => t.cat.slug === c && t.slug === s);
    $("zoom").style.display = "none";
    document.body.classList.toggle("view", i >= 0);
    if (i < 0) {
        cur = -1;
        $("cnt").textContent = ""; $("lbl").textContent = "Topics";
        $("prevT").disabled = $("nextT").disabled = true;
        return;
    }
    show(i);
}
// ☰ : always opens the topic list
$("menu").onclick = () => { if (cur >= 0) location.hash = ""; };

// Finds how many images 1..max actually exist (binary search, ~6 quick probes for 40)
const loads = src => new Promise(res => { const im = new Image(); im.onload = () => res(true); im.onerror = () => res(false); im.src = src; });
// HEAD request = nothing is downloaded; falls back to a normal image probe if fetch isn't possible (e.g. opened from a file)
async function exists(src) {
    try { return (await fetch(src, {method: "HEAD"})).ok; } catch (e) { return loads(src); }
}
async function countImages(base, max) {
    let lo = 0, hi = max;
    while (lo < hi) {
        const mid = (lo + hi + 1) >> 1;
        if (await exists(base + mid + "." + IMG_EXT)) lo = mid; else hi = mid - 1;
    }
    return lo;
}

function show(i) {
    cur = i; const t = flat[i], isImg = t.isImg;
    $("lbl").textContent = t.label;
    $("prevT").disabled = i === 0; $("nextT").disabled = i === flat.length - 1;
    $("slides").hidden = !isImg; $("page").hidden = isImg;
    const s = $("slides"), p = $("page");
    s.innerHTML = ""; p.innerHTML = ""; s.scrollLeft = 0; p.scrollTop = 0; $("cnt").textContent = "";
    sc = 1; tx = ty = 0; g = null; lastIdx = -1;
    const dir = BASE_URL + t.cat.slug + "/";
    if (isImg) {
        const base = t.slug ? dir + t.slug + "/" : dir;
        s.innerHTML = '<div class="msg">Loading...</div>';
        countImages(base, t.n).then(n => {
            if (cur !== i) return;                       // user already moved on
            s.innerHTML = "";
            if (!n) { s.innerHTML = '<div class="msg">No images found<br>' + base + "1." + IMG_EXT + "</div>"; return; }
            for (let k = 1; k <= n; k++) {
                const d = document.createElement("div"); d.className = "slide";
                const im = new Image(); im.alt = t.label + " " + k; im.decoding = "async";
                im.onerror = () => { d.innerHTML = '<div class="msg">' + k + "." + IMG_EXT + " not found</div>"; };
                d.dataset.src = base + k + "." + IMG_EXT;          // fetched later by loadImg()
                d.appendChild(im); s.appendChild(d);
            }
            lastIdx = 0; loadNear(0);
            for (let k = 0; k < Math.min(n, PRELOAD_FIRST); k++) loadImg(s.children[k]);
            updateCount();
        });
    } else {
        p.innerHTML = '<div class="msg">Loading...</div>';
        fetch(dir + t.slug + ".html").then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
            .then(h => { if (cur === i) p.innerHTML = h; })
            .catch(e => { if (cur === i) p.innerHTML = '<div class="msg">' + e.message + "<br>" + dir + t.slug + ".html</div>"; });
    }
}
$("page").addEventListener("click", e => { if (e.target.tagName === "IMG") openZoom(e.target.src); });

// ── SLIDES: swipe left/right (1 image per swipe) + pinch-zoom ──────────────
const S = $("slides"); let lastIdx = -1, anim = 0, wheelLock = 0, lastTap = 0, g = null, sc = 1, tx = 0, ty = 0, zImg = null;
const maxLeft = () => Math.max(0, S.scrollWidth - S.clientWidth);
const idx = () => Math.round(S.scrollLeft / Math.max(1, S.clientWidth));
const mid = t => t.length < 2 ? {x: t[0].clientX, y: t[0].clientY} : {x: (t[0].clientX + t[1].clientX) / 2, y: (t[0].clientY + t[1].clientY) / 2};
const gap = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
const ctr = () => { const r = S.getBoundingClientRect(); return {x: r.left + r.width / 2, y: r.top + r.height / 2}; };
const curImg = () => { const d = S.children[idx()]; return d && d.querySelector("img"); };

function loadImg(d) { const im = d && d.firstChild; if (im && d.dataset.src && !im.src) im.src = d.dataset.src; }
function loadNear(i) {                                   // current + BEHIND before + AHEAD after (wraps around)
    const n = S.children.length;
    for (let j = -BEHIND; j <= AHEAD; j++) {
        const k = i + j;
        if (!WRAP && (k < 0 || k >= n)) continue;
        loadImg(S.children[((k % n) + n) % n]);
    }
}
function paint() { if (zImg) zImg.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + sc + ")"; }
function clampPan() {
    if (!zImg) return;
    const mx = Math.max(0, (zImg.offsetWidth * sc - S.clientWidth) / 2), my = Math.max(0, (zImg.offsetHeight * sc - S.clientHeight) / 2);
    tx = Math.max(-mx, Math.min(mx, tx)); ty = Math.max(-my, Math.min(my, ty));
}
function resetZoom() { sc = 1; tx = ty = 0; paint(); zImg = null; }
function zoomAt(x, y, ns) {                              // zoom keeping the point under (x,y) fixed
    if (!zImg) zImg = curImg(); if (!zImg) return;
    const c = ctr(), mx = x - c.x, my = y - c.y;
    ns = Math.max(1, Math.min(6, ns));
    tx = mx - ns * (mx - tx) / sc; ty = my - ns * (my - ty) / sc; sc = ns;
    if (sc === 1) { tx = ty = 0; clampPan(); paint(); zImg = null; return; }
    clampPan(); paint();
}
function goTo(i, ms) {
    const n = S.children.length;
    if (!n) return;
    const target = WRAP && n > 1 ? ((i % n) + n) % n : Math.max(0, Math.min(n - 1, i));
    if (target !== idx() && sc !== 1) resetZoom();
    cancelAnimationFrame(anim);
    if (WRAP && n > 1 && (i < 0 || i > n - 1)) {          // wrap around: jump to the other end
        S.scrollLeft = target * S.clientWidth; updateCount(); return;
    }
    const from = S.scrollLeft, to = target * S.clientWidth, t0 = performance.now();
    const f = now => {
        const k = Math.min(1, (now - t0) / ms);
        S.scrollLeft = from + (to - from) * (1 - Math.pow(1 - k, 3));
        updateCount();
        if (k < 1) anim = requestAnimationFrame(f);
    };
    anim = requestAnimationFrame(f);
}
function startPinch(e) {
    if (g && g.mode === "swipe" && g.moved) S.scrollLeft = g.base * S.clientWidth;   // snap back first
    if (!zImg) zImg = curImg();
    const m = mid(e.touches), c = ctr();
    g = {mode: "pinch", d0: gap(e.touches), s0: sc, qx: (m.x - c.x - tx) / sc, qy: (m.y - c.y - ty) / sc};
}
S.addEventListener("touchstart", e => {
    cancelAnimationFrame(anim);
    if (e.touches.length >= 2) { startPinch(e); return; }
    const t = e.touches[0];
    g = {mode: sc > 1 ? "pan" : "swipe", x: t.clientX, y: t.clientY, left: S.scrollLeft, tx0: tx, ty0: ty, base: idx(), moved: false};
}, {passive: true});
S.addEventListener("touchmove", e => {
    if (!g) return;
    e.preventDefault();
    if (e.touches.length >= 2) {
        if (g.mode !== "pinch") startPinch(e);
        const m = mid(e.touches), c = ctr();
        sc = Math.max(1, Math.min(6, g.s0 * gap(e.touches) / g.d0));
        tx = m.x - c.x - sc * g.qx; ty = m.y - c.y - sc * g.qy;
        clampPan(); paint();
        return;
    }
    if (g.mode === "pinch" || g.mode === "none") return;
    const t = e.touches[0], dx = t.clientX - g.x, dy = t.clientY - g.y;
    if (Math.abs(dx) > 8 || Math.abs(dy) > 8) g.moved = true;
    if (g.mode === "pan") { tx = g.tx0 + dx; ty = g.ty0 + dy; clampPan(); paint(); }
    else { S.scrollLeft = Math.max(0, Math.min(maxLeft(), g.left - dx)); updateCount(); }
}, {passive: false});
S.addEventListener("touchend", e => {
    if (!g) return;
    if (e.touches.length > 0) {                          // one finger of a pinch lifted
        if (sc < 1.02) resetZoom();
        const t = e.touches[0];
        g = sc > 1 ? {mode: "pan", x: t.clientX, y: t.clientY, tx0: tx, ty0: ty, moved: true} : {mode: "none"};
        return;
    }
    const t = e.changedTouches[0], now = Date.now();
    if (g.mode === "pinch") { if (sc < 1.02) resetZoom(); g = null; return; }
    if (g.mode === "none") { g = null; return; }
    if (!g.moved) {                                      // tap: double-tap toggles zoom
        if (now - lastTap < 300) { lastTap = 0; if (sc > 1) resetZoom(); else zoomAt(t.clientX, t.clientY, 2.5); }
        else lastTap = now;
        g = null; return;
    }
    if (g.mode === "swipe") {
        const dx = t.clientX - g.x;
        // always 1 image per swipe; only a LONG swipe (60%+ of screen width) skips more (max 3)
        let steps = 0;
        if (Math.abs(dx) > 35) steps = Math.min(3, 1 + Math.floor(Math.abs(dx) / (S.clientWidth * 0.6)));
        goTo(g.base + (dx < 0 ? 1 : -1) * steps, 260 + steps * 140);
    }
    g = null;
});
S.addEventListener("touchcancel", () => { if (g && g.mode === "swipe") goTo(g.base, 200); g = null; });
S.addEventListener("wheel", e => {
    e.preventDefault();
    if (e.ctrlKey) { zoomAt(e.clientX, e.clientY, sc * (e.deltaY < 0 ? 1.15 : 0.87)); return; }   // trackpad pinch / ctrl+wheel
    if (sc > 1) { tx -= e.deltaX; ty -= e.deltaY; clampPan(); paint(); return; }
    if (Date.now() < wheelLock) return;
    wheelLock = Date.now() + 450;
    const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    goTo(idx() + (d > 0 ? 1 : -1), 320);
}, {passive: false});
// rotating the phone / entering full screen changes the slide width: keep the same image in view
function realign() {
    if (sc !== 1) resetZoom();
    if (S.children.length && lastIdx >= 0) { cancelAnimationFrame(anim); S.scrollLeft = lastIdx * S.clientWidth; }
}
if (window.ResizeObserver) new ResizeObserver(realign).observe(S); else window.addEventListener("resize", realign);

// ── IMAGE COUNTER + TOPIC STEPPING ──────────────────────────────────────
function updateCount() {
    const n = S.children.length, i = Math.min(Math.max(0, n - 1), idx());
    if (n && i !== lastIdx) { lastIdx = i; loadNear(i); }
    $("cnt").textContent = n ? (i + 1) + " / " + n : "";
}
function topicStep(d) {
    const j = cur + d; if (j < 0 || j >= flat.length) return;
    location.replace("#" + hashOf(flat[j]));
}
$("prevT").onclick = () => topicStep(-1); $("nextT").onclick = () => topicStep(1);

// ── MAXIMIZE (YouTube style: same button toggles expand / collapse) ─────
const EXP = '<svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>';
const COL = '<svg viewBox="0 0 24 24"><path d="M3 8h5V3M21 8h-5V3M3 16h5v5M21 16h-5v5"/></svg>';
const root = document.documentElement, canFS = !!root.requestFullscreen;
const setIcon = on => { $("max").innerHTML = on ? COL : EXP; $("max").setAttribute("aria-label", on ? "Exit full screen" : "Full screen"); };
function setMax(on) {
    if (canFS) {   // real fullscreen: bar stays, icon flips
        if (on) root.requestFullscreen().catch(() => {});
        else if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    } else document.body.classList.toggle("max", on);   // iPhone Safari: hide the bar instead
    setIcon(on);
}
$("max").onclick = () => setMax(canFS ? !document.fullscreenElement : !document.body.classList.contains("max"));
$("fsx").onclick = () => setMax(false);
document.addEventListener("fullscreenchange", () => setIcon(!!document.fullscreenElement));

document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT") return;
    if ($("zoom").style.display === "block") { if (e.key === "Escape") $("zoom").style.display = "none"; return; }
    if (cur < 0) return;
    const im = flat[cur].isImg;      // images: left/right = image, up/down = topic.  pages: left/right = topic
    if (im && e.key === "ArrowRight") { e.preventDefault(); goTo(idx() + 1, 320); }
    else if (im && e.key === "ArrowLeft") { e.preventDefault(); goTo(idx() - 1, 320); }
    else if (im && e.key === "ArrowDown") { e.preventDefault(); topicStep(1); }
    else if (im && e.key === "ArrowUp") { e.preventDefault(); topicStep(-1); }
    else if (e.key === "ArrowLeft") topicStep(-1);
    else if (e.key === "ArrowRight") topicStep(1);
    else if (e.key === "Escape" && !document.body.classList.contains("max")) location.hash = "";
});

// ── ZOOM: pinch, drag, double-tap, wheel ────────────────────────────────
const Z = $("zoom"), zi = Z.querySelector("img");
let zsc = 1, ztx = 0, zty = 0, zd0 = 0, zs0 = 1, zp0 = null, zTap = 0, zmd = null;
const zpaint = () => { zi.style.transform = "translate(" + ztx + "px," + zty + "px) scale(" + zsc + ")"; };
function openZoom(src) { zi.src = src; zsc = 1; ztx = zty = 0; zpaint(); Z.style.display = "block"; }
$("zclose").onclick = () => { Z.style.display = "none"; };
const zdist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
Z.addEventListener("touchstart", e => {
    if (e.touches.length === 2) { zd0 = zdist(e.touches); zs0 = zsc; zp0 = null; }
    else if (e.touches.length === 1) {
        zp0 = {x: e.touches[0].clientX - ztx, y: e.touches[0].clientY - zty};
        const now = Date.now();
        if (now - zTap < 300 && e.target === zi) { zsc = zsc > 1 ? 1 : 2.5; if (zsc === 1) ztx = zty = 0; zpaint(); }
        zTap = now;
    }
}, {passive: false});
Z.addEventListener("touchmove", e => {
    e.preventDefault();
    if (e.touches.length === 2) zsc = Math.min(6, Math.max(1, zs0 * zdist(e.touches) / zd0));
    else if (zp0 && zsc > 1) { ztx = e.touches[0].clientX - zp0.x; zty = e.touches[0].clientY - zp0.y; }
    zpaint();
}, {passive: false});
Z.addEventListener("touchend", () => { if (zsc <= 1) { zsc = 1; ztx = zty = 0; zpaint(); } });
Z.addEventListener("wheel", e => { e.preventDefault(); zsc = Math.min(6, Math.max(1, zsc * (e.deltaY < 0 ? 1.15 : 0.87))); if (zsc === 1) ztx = zty = 0; zpaint(); }, {passive: false});
Z.addEventListener("mousedown", e => { if (zsc > 1) zmd = {x: e.clientX - ztx, y: e.clientY - zty}; });
window.addEventListener("mousemove", e => { if (zmd) { ztx = e.clientX - zmd.x; zty = e.clientY - zmd.y; zpaint(); } });
window.addEventListener("mouseup", () => { zmd = null; });

route();
</script>
