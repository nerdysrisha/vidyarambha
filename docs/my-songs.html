<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1018">
<title>My Songs</title>
<style>
:root{--ink:#0a1018;--panel:#142030;--line:#223349;--text:#e8eef6;--mute:#8b9bb0;--accent:#4f93e0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;max-width:760px;margin:0 auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:44px;height:44px;cursor:pointer}
button:active{background:var(--line)}
button:disabled{opacity:.3;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent)}
svg.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block;margin:auto}
svg.ico.f{fill:currentColor}

/* banner */
#top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,#142030,#0f2a4a)}
#top h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.3px}
#gp{position:relative;display:flex;align-items:center;gap:8px;min-height:37px;font-weight:600;font-size:13px;cursor:pointer;user-select:none}
#gp input{position:absolute;opacity:0;width:0;height:0}
.sw{position:relative;flex:none;width:41px;height:24px;border-radius:12px;background:var(--panel);border:1px solid var(--line);transition:background .2s,border-color .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--mute);transition:transform .2s,background .2s}
#gp input:checked+.sw{background:var(--accent);border-color:var(--accent)}
#gp input:checked+.sw::after{transform:translateX(17px);background:#fff}
#gp input:focus-visible+.sw{outline:2px solid var(--accent)}
body.max #top{display:none}
body.max #app{padding-top:0}
body[data-v=login] #top,body[data-v=login] footer{display:none}

/* views */
#list,#songs,#login{display:none;flex:1;min-height:0}
body[data-v=list] #list{display:flex;flex-direction:column;padding:10px 12px 6px}
body[data-v=folder] #songs{display:flex;flex-direction:column;padding:10px 12px 6px}
body[data-v=login] #login{display:flex;flex-direction:column;justify-content:center;gap:12px;padding:24px}
#box,#sbox{flex:1;min-height:0;overflow-y:auto;border:1px solid var(--line);border-radius:14px;padding:8px}
#shead{display:flex;align-items:baseline;gap:10px;padding:2px 4px 8px}
#sttl{font-size:17px;font-weight:700}
#scnt{color:var(--mute);font-size:13px}

/* folder rows */
.topic{display:block;width:100%;height:auto;min-height:47px;margin:0 0 5px;padding:7px 13px;text-align:left}
.topic[data-dir]{touch-action:pan-y;transition:transform .18s ease,border-color .15s,background .15s}
.topic.drag{transition:none}
.topic.go{border-color:var(--accent);background:#1a2c44}
.topic b{display:block;font-weight:600;font-size:14.5px}
.topic small{color:var(--mute);font-size:12px}
.topic.hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.topic.hd i{font-style:normal;color:var(--mute);transition:transform .15s}
.grp.open>.hd i{transform:rotate(90deg)}
.kids{display:none;margin:-2px 0 8px 12px;padding-left:10px;border-left:2px solid var(--line)}
.grp.open>.kids{display:block}
.kids .topic:last-child{margin-bottom:0}
.bm{display:inline-block;width:15px;height:15px;margin-left:8px;vertical-align:-2px;fill:#f5b942;stroke:#f5b942;stroke-width:1.5;stroke-linejoin:round}

/* song rows */
.song{display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 14px;margin-bottom:6px}
.song b{flex:1;min-width:0;font-weight:500;font-size:15px;overflow-wrap:anywhere}
.song .ic{min-width:26px;flex:none;text-align:right;color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums}
.song.now{border-color:var(--accent);background:#1a2c44}
.song.now b{color:var(--accent)}
.song.now .ic{color:var(--accent)}
.wave{display:none;align-items:flex-end;gap:3px;height:20px;flex:none}
.song.now .wave{display:flex}
.wave.mini{display:inline-flex;height:14px;margin:0}
.rp{display:none;flex:none}
.rp svg{width:14px;height:14px;fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;display:block}
.rep .song.now .rp,.rep .nl .rp{display:flex}
#rep.on{border-color:var(--accent);color:var(--accent)}
.nl{display:flex;align-items:center;gap:10px;margin:4px 0 2px;color:var(--accent);font-size:13px;font-weight:600}
.mq{flex:1;min-width:0;overflow:hidden;white-space:nowrap}
.mq .t{display:inline-block;white-space:nowrap}
.mq .t.run{animation:mq linear infinite}
.mq .t.run span{display:inline-block;padding-right:36px}
#box:not(.playing) .mq .t.run{animation-play-state:paused}
.grp.open>.hd .mq{display:none}
@keyframes mq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.mq .t.run{animation:none}}
.wave.mini i{height:14px}
.wave i{display:block;width:3px;height:20px;border-radius:2px;background:var(--accent);transform-origin:bottom;transform:scaleY(.3)}
.playing .wave i{animation:eq .9s ease-in-out infinite}
.playing .wave i:nth-child(2){animation-duration:1.1s;animation-delay:-.3s}
.playing .wave i:nth-child(3){animation-duration:.7s;animation-delay:-.5s}
.playing .wave i:nth-child(4){animation-duration:1s;animation-delay:-.2s}
@keyframes eq{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.playing .wave i{animation:none}}
.msg{color:var(--mute);text-align:center;padding:48px 20px;line-height:1.5}

/* footer player */
footer{position:relative;padding:8px 12px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
#bar[hidden]{display:none}
#mute{min-width:36px;width:36px;height:36px;border-radius:50%;flex:none}
#mute svg.ico{width:20px;height:20px}
#bar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);margin-bottom:6px}
#seek{flex:1;min-width:0;height:24px;accent-color:var(--accent)}
#ctl{display:flex;align-items:center;justify-content:space-between}
.mid{display:flex;align-items:center;gap:10px}
#play{width:64px;border-radius:22px}
#panel{position:absolute;right:12px;bottom:calc(100% + 8px);z-index:6;display:flex;flex-direction:column;gap:8px;padding:10px;background:rgba(20,32,48,.8);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px}
#panel[hidden],#pinrow[hidden]{display:none}
#prow,#pinrow{display:flex;gap:8px;align-items:center}
#pin{width:110px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:0 12px;font:inherit;letter-spacing:3px}
#pinerr{color:#ff8f8f;font-size:12px}
#toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:4;background:#0a1018e6;border:1px solid var(--line);border-radius:12px;padding:8px 16px;text-align:center;max-width:86%;pointer-events:none;opacity:0;transition:opacity .9s ease}
#toast.on{opacity:1;transition:opacity .2s}
#toast b{font-size:15px}

/* landscape: now-playing view (only while a song is loaded) */
#ls{display:none;position:relative;overflow:hidden;flex:1;min-height:0;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:0 72px}
#lsprv,#lsnow,#lsnx{position:relative;z-index:1;width:100%;min-height:1.3em}
#lsprv,#lsnx{font-size:clamp(14px,4vh,20px);color:rgba(139,155,176,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lsnow{flex:none;font-size:clamp(24px,8vh,42px);font-weight:700;line-height:1.3;margin:6px 0}
#lsarr{position:absolute;right:14px;top:50%;transform:translateY(-50%);z-index:2;display:flex;flex-direction:column;gap:14px}
.lsout{animation:lsout 2s ease-in-out forwards}
.lsout.up{--o:-24px}.lsout.dn{--o:24px}
.lsin{animation:lsin 1.3s cubic-bezier(.22,.61,.36,1) both}
.lsin.up{--i:36px}.lsin.dn{--i:-36px}
#lsnow.lsin{animation-delay:0s}#lsprv.lsin{animation-delay:.12s}#lsnx.lsin{animation-delay:.28s}
@keyframes lsout{to{opacity:0;transform:translateY(var(--o))}}
@keyframes lsin{from{opacity:0;transform:translateY(var(--i))}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.lsout,.lsin{animation:none}}
#gnr{position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:5;max-width:86%;text-align:center;background:rgba(10,16,24,.82);border:1px solid var(--accent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:14px;padding:8px 20px;pointer-events:none;opacity:0;transition:opacity 2s ease}
#gnr.on{opacity:1;transition:opacity .5s ease}
#gnr small{display:block;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--accent)}
#gnr b{font-size:16px}
#ls:not(.playing) .mq .t.run{animation-play-state:paused}
#lsfx{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#lsrip{position:absolute;left:-130px;bottom:-130px;width:260px;height:260px}
#lsrip i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);opacity:0;transform:scale(.2);animation:rip 6s ease-out infinite}
#lsrip i:nth-child(2){animation-delay:-2s}
#lsrip i:nth-child(3){animation-delay:-4s}
@keyframes rip{0%{opacity:.55;transform:scale(.2)}100%{opacity:0;transform:scale(1)}}
.dot{position:absolute;width:6px;height:6px;border-radius:50%;background:#7db5f5;box-shadow:0 0 10px 3px rgba(79,147,224,.55);opacity:.7;animation:drift 32s ease-in-out infinite}
.dot:nth-child(1){left:10%;top:22%}
.dot:nth-child(2){left:80%;top:16%;width:4px;height:4px;animation-duration:40s;animation-delay:-14s}
.dot:nth-child(3){left:30%;top:60%;width:8px;height:8px;animation-duration:46s;animation-delay:-8s;opacity:.45}
.dot:nth-child(4){left:65%;top:50%;animation-duration:36s;animation-delay:-20s}
.dot:nth-child(5){left:48%;top:12%;width:4px;height:4px;animation-duration:52s;animation-delay:-26s}
@keyframes drift{0%,100%{transform:translate(0,0)}25%{transform:translate(18vw,8vh)}50%{transform:translate(-6vw,22vh)}75%{transform:translate(-20vw,-6vh)}}
#ls:not(.playing) #lsfx *{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){#lsfx *{animation:none}}
@media (orientation:landscape) and (max-height:520px){
  body.hasq:not([data-v=login]) :is(#top,#list,#songs,#menu,#gear,#prevS,#nextS,#rep){display:none}
  body.hasq:not([data-v=login]) #ls{display:flex}
  body.hasq:not([data-v=login]) :is(footer,#lsarr){transition:opacity .35s ease}
  body.hasq:not([data-v=login]).ctl-fade :is(footer,#lsarr){opacity:0;pointer-events:none;transition:opacity 6s ease}
  body.hasq:not([data-v=login]) #gnr{top:10px}
  body.hasq:not([data-v=login]) footer{display:flex;align-items:center;gap:10px;padding-top:6px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
  body.hasq:not([data-v=login]) #bar{flex:1;min-width:0;margin-bottom:0}
  body.hasq:not([data-v=login]) #ctl{flex:none}
}

/* start screen: title + glowing round Start button; tapping it goes full screen and the screen fades away.
   Optional picture: set --start-img: url("...") below. */
#start-screen{position:fixed;inset:0;z-index:10000;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 24px calc(32px + env(safe-area-inset-bottom,0px)) 0;background:radial-gradient(circle at 50% 38%,#16355a 0%,#0a1018 70%);--start-img:none}
#start-screen::before{content:"";position:absolute;inset:0;background:var(--start-img) center/cover no-repeat;opacity:0}
#start-screen.ready::before{animation:startReveal 5s ease-in-out forwards}
@keyframes startReveal{to{opacity:1}}
#start-text{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);padding:0 20px;text-align:center;pointer-events:none}
#start-text h1{margin:0 0 10px;font-size:clamp(30px,min(9vw,14vh),56px);letter-spacing:.5px;text-shadow:0 2px 12px rgba(0,0,0,.6);opacity:0;transform:translateY(28px)}
#start-text p{margin:0;color:var(--mute);font-size:15px;opacity:0;transform:translateY(28px)}
#start-screen.ready #start-text h1{animation:textRise 2.6s cubic-bezier(.2,.7,.3,1) .6s forwards}
#start-screen.ready #start-text p{animation:textRise 2.6s cubic-bezier(.2,.7,.3,1) 1.6s forwards}
@keyframes textRise{to{opacity:1;transform:none}}
#start-btn{position:relative;z-index:1;appearance:none;cursor:pointer;width:76px;height:76px;min-width:0;border-radius:50%;padding:0;border:2px solid rgba(255,255,255,.9);color:#05213f;font:700 11px/1 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;background:radial-gradient(circle at 35% 30%,#cfe5ff 0%,#4f93e0 60%,#2f78cc 100%);opacity:0;pointer-events:none}
#start-screen.btn-on #start-btn{pointer-events:auto;animation:startBtnIn .8s ease-out forwards,startGlow 1.8s ease-in-out infinite}
@keyframes startBtnIn{to{opacity:1}}
#start-btn:active{transform:scale(.95)}
@keyframes startGlow{0%,100%{box-shadow:0 0 8px 2px rgba(79,147,224,.75),0 0 18px 6px rgba(79,147,224,.45),inset 0 1px 0 rgba(255,255,255,.7)}50%{box-shadow:0 0 16px 6px rgba(120,175,240,1),0 0 34px 14px rgba(79,147,224,.7),inset 0 1px 0 rgba(255,255,255,.7)}}
#start-screen.leaving{pointer-events:none;animation:startFade 2.5s ease forwards}
#start-screen.leaving #start-btn{animation:startBtnOut 2.5s ease forwards}
@keyframes startFade{0%,15%{opacity:1}100%{opacity:0}}
@keyframes startBtnOut{0%{transform:scale(1);opacity:1}100%{transform:scale(1.3);opacity:0}}
@media (prefers-reduced-motion:reduce){#start-screen.btn-on #start-btn{opacity:1;animation:none}#start-screen.ready #start-text h1,#start-screen.ready #start-text p{animation-duration:.01s;animation-delay:0s}#start-screen.leaving{animation-duration:.3s}#start-screen.leaving #start-btn{animation:none}}
#prevS,#nextS,#lsup,#lsdn{touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}

/* swipe-left hint, now-playing card in the folder view */
.topic[data-dir]{position:relative}
.topic.dragl::after{content:"\21C4";position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--mute);font-size:18px}
.topic.go.dragl::after{color:var(--accent)}
#npc{display:none;flex:none;align-items:center;gap:12px;margin:0 0 10px;padding:10px 14px;border:1px solid var(--accent);background:#1a2c44;border-radius:12px;cursor:pointer}
#npc:not([hidden]){display:flex}
#npc .wave{display:flex}
#npc b{display:block;flex:1;min-width:0;font-size:16px;font-weight:600;color:var(--accent);overflow-wrap:anywhere}
.npout{animation:npout .6s ease-in-out forwards}
.npin{animation:npin .9s cubic-bezier(.22,.61,.36,1) both}
@keyframes npout{to{opacity:0;transform:translateY(-8px)}}
@keyframes npin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.npout,.npin{animation:none}}
#npc:not(.playing) .wave i{animation-play-state:paused}

/* landscape song name: light sweep across the letters + reveal from left to right on a new song */
#lsnow .t{filter:drop-shadow(0 0 10px rgba(79,147,224,.35))}
#lsnow .t span{background:linear-gradient(100deg,var(--text) 0%,var(--text) 42%,#bfe0ff 49%,#fff 52%,#bfe0ff 55%,var(--text) 62%,var(--text) 100%) 100% 0/300% 100% no-repeat;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shim 8s ease-in-out infinite}
@keyframes shim{0%,45%{background-position:100% 0}100%{background-position:0 0}}
#ls:not(.playing) #lsnow .t span{animation-play-state:paused}
#lsnow.lsin{-webkit-mask-image:linear-gradient(90deg,#000 0%,#000 33.3%,transparent 66.6%,transparent 100%);mask-image:linear-gradient(90deg,#000 0%,#000 33.3%,transparent 66.6%,transparent 100%);-webkit-mask-size:300% 100%;mask-size:300% 100%;animation:lsin 1.3s cubic-bezier(.22,.61,.36,1) both,lsreveal 2.4s ease-out both}
@keyframes lsreveal{from{-webkit-mask-position:100% 0;mask-position:100% 0;filter:blur(7px)}to{-webkit-mask-position:0 0;mask-position:0 0;filter:blur(0)}}
@media (prefers-reduced-motion:reduce){#lsnow .t span{animation:none}#lsnow.lsin{animation:none;-webkit-mask-image:none;mask-image:none}}

/* login */
#login h2{margin:0}#login p{margin:0;color:var(--mute);line-height:1.5}
#login input{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:0 14px;font:inherit}
#lerr{color:#ff8f8f}
</style>
</head>
<body data-v="list">
<div id="start-screen">
  <div id="start-text"><h1>My Songs</h1><p>Swipe a folder right to play it</p></div>
  <button id="start-btn" type="button">Start</button>
</div>
<div id="app">
  <header id="top">
    <h1>My Songs</h1>
    <label id="gp"><span>Global Play</span><input id="gps" type="checkbox" role="switch"><span class="sw"></span></label>
  </header>
  <div id="list"><div id="box"></div></div>
  <div id="songs">
    <div id="shead"><b id="sttl"></b><small id="scnt"></small></div>
    <div id="npc" hidden><span class="wave"><i></i><i></i><i></i><i></i></span><b></b></div>
    <div id="sbox"></div>
  </div>
  <div id="login">
    <h2>Enter 4 Digits PIN</h2>
    <p>Saved only in this browser on this device.</p>
    <input id="tokin" type="password" autocomplete="off" placeholder="Aak Sri. He has the PIN ...">
    <button id="tsave">Save PIN</button>
    <p id="lerr"></p>
  </div>
  <div id="ls"><div id="lsfx"><div id="lsrip"><i></i><i></i><i></i></div><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><div id="lsprv"></div><div id="lsnow" class="mq"><span class="t"></span></div><div id="lsnx"></div><div id="lsarr"><button id="lsup" aria-label="Previous song"><svg class="ico" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button><button id="lsdn" aria-label="Next song"><svg class="ico" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button></div></div>
  <div id="gnr"><small>New genre</small><b></b></div>
  <div id="toast"><b></b></div>
  <footer id="foot">
    <div id="bar" hidden><span id="tcur">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek"><span id="tdur">0:00</span><button id="mute" aria-label="Mute"></button></div>
    <div id="ctl">
      <button id="menu" aria-label="Folders"><svg class="ico" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="mid">
        <button id="prevS" aria-label="Previous song"><svg class="ico" viewBox="0 0 24 24"><path d="M19 20L9 12l10-8zM5 19V5"/></svg></button>
        <button id="play" aria-label="Play"></button>
        <button id="nextS" aria-label="Next song"><svg class="ico" viewBox="0 0 24 24"><path d="M5 4l10 8-10 8zM19 5v14"/></svg></button>
        <button id="rep" aria-label="Repeat this song" aria-pressed="false"><svg class="ico" viewBox="0 0 24 24"><path d="M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/></svg></button>
      </div>
      <button id="gear" aria-label="Settings"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
    <div id="panel" hidden>
      <div id="prow">
        <button id="refresh" aria-label="Refresh folders"><svg class="ico" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v5h-5"/></svg></button>
        <button id="max" aria-label="Full screen"></button>
        <button id="key" aria-label="Change token"><svg class="ico" viewBox="0 0 24 24"><path d="M21 2l-2 2m-7.6 7.6a5.5 5.5 0 1 1-7.8 7.8 5.5 5.5 0 0 1 7.8-7.8zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg></button>
      </div>
      <div id="pinrow" hidden><input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="PIN"><button id="pinok">OK</button></div>
      <small id="pinerr"></small>
    </div>
  </footer>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────────────
const OWNER = "nerdysrisha", REPO = "mysongs";
// Every folder that directly contains songs (at any depth) becomes one entry. New folders show up on refresh.
// Global Play: shuffles the songs inside ONE folder, plays them all, then moves on to the next folder (genres never mix).
const ADMIN_PIN = "6559";                                  // PIN that lets you change the saved token (change it here)
const AUDIO_RE = /\.(mp3|m4a|wav|ogg|flac)$/i;
const MIME = {mp3: "audio/mpeg", m4a: "audio/mp4", wav: "audio/wav", ogg: "audio/ogg", flac: "audio/flac"};
const TOK_KEY = "ghtok_songs", LAST_KEY = "lastFolder_songs";

// ── HELPERS ─────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const nat = (a, b) => a.localeCompare(b, undefined, {numeric: true});
const nice = x => x.replace(/\//g, " / ");
const pretty = n => n.replace(AUDIO_RE, "").replace(/_/g, " ");
const fmt = s => { if (!isFinite(s) || s < 0) s = 0; return Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0"); };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let mem = "";
const getTok = () => { try { return localStorage.getItem(TOK_KEY) || mem; } catch (e) { return mem; } };
const setTok = v => { mem = v; try { v ? localStorage.setItem(TOK_KEY, v) : localStorage.removeItem(TOK_KEY); } catch (e) {} };
const getLast = () => { try { return localStorage.getItem(LAST_KEY) || ""; } catch (e) { return ""; } };
const setLast = v => { try { localStorage.setItem(LAST_KEY, v); } catch (e) {} };
const bmIcon = () => { const s = document.createElement("span"); s.innerHTML = '<svg class="bm" viewBox="0 0 24 24" aria-label="Last visited"><path d="M6 3h12v18l-6-4-6 4z"/></svg>'; return s.firstChild; };
const RPI = '<svg viewBox="0 0 24 24"><path d="M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/></svg>';
const curName = () => Q ? pretty(Q.names[Q.pos]) : "";
let lsDir = 1, lsShown = null, lsBusy = false, lsWant = null;   // landscape lines: slide direction, what is drawn, wanted state
function lsApply(w) {
  lsShown = w; $("lsprv").textContent = w.prev; $("lsnx").textContent = w.next;
  $("lsnow").dataset.t = w.cur; fitMarquees();
}
function lsUpdate(w) {                                     // old lines fade out and drift away, then the new ones rise into place
  lsWant = w;
  if (lsBusy) return;
  const sh = lsShown;
  if (sh && sh.prev === w.prev && sh.cur === w.cur && sh.next === w.next) return;
  if (!sh || !w.cur || !sh.cur) return lsApply(w);         // first draw or stopped: no animation
  lsBusy = true;
  const dir = lsDir > 0 ? "up" : "dn", els = ["lsprv", "lsnow", "lsnx"].map($);
  els.forEach(e => e.classList.add("lsout", dir));
  setTimeout(() => {
    lsApply(lsWant);
    els.forEach(e => { e.classList.remove("lsout"); void e.offsetWidth; e.classList.add("lsin"); });
    setTimeout(() => { els.forEach(e => e.classList.remove("lsin", "up", "dn")); lsBusy = false; lsUpdate(lsWant); }, 1650);
  }, 2000);
}
let gnrT = 0;
function showGenre(dir) {                                  // banner: new genre, stays ~6s, then fades slowly
  const el = $("gnr"); el.lastChild.textContent = nice(dir); el.classList.add("on");
  clearTimeout(gnrT); gnrT = setTimeout(() => el.classList.remove("on"), 6000);
}
const nextName = () => {                                   // name of the song that follows (may be the first of the next folder)
  if (!Q) return "";
  if (Q.pos + 1 < Q.names.length) return pretty(Q.names[Q.pos + 1]);
  if (!Q.global) return "";
  if (!Q.next && parsed.length) Q.next = buildQ(nextDir(Q.dir), Q.global);
  return Q.next && Q.next.names.length ? pretty(Q.next.names[0]) : "";
};
const nowLine = () => {                                    // wave + song name (loops right to left when too long)
  const d = document.createElement("div"); d.className = "nl";
  d.innerHTML = '<span class="wave mini"><i></i><i></i><i></i><i></i></span><span class="rp">' + RPI + '</span><span class="mq"><span class="t"></span></span>';
  d.querySelector(".mq").dataset.t = curName(); return d;
};
function fitMarquees() {
  document.querySelectorAll(".mq").forEach(mq => {
    const t = mq.firstChild, txt = mq.dataset.t || "";
    t.className = "t"; t.style.animationDuration = ""; t.innerHTML = "";
    const a = document.createElement("span"); a.textContent = txt; t.appendChild(a);
    if (mq.clientWidth && a.offsetWidth > mq.clientWidth) {           // too long for the row: scroll it

}
const enc = p => p.split("/").map(encodeURIComponent).join("/");
const hdr = raw => ({Authorization: "Bearer " + getTok(), Accept: raw ? "application/vnd.github.raw" : "application/vnd.github+json"});
const api = (path, raw) => fetch("https://api.github.com/repos/" + OWNER + "/" + REPO + "/contents/" + enc(path), {headers: hdr(raw)});
const show = v => { document.body.dataset.v = v; closePanel(); updateBar(); };
const fail = t => { $("lerr").textContent = t; show("login"); };

// ── STATE ───────────────────────────────────────────────────────────────
let parsed = [], loaded = false, truncated = false, listCache = {}, ticket = 0, cur = -1, savedScroll = 0;
const au = new Audio(); au.preload = "auto";
let repeat = false, repPath = "";                           // repeat-one: loop a single song until switched off
let shownPD = "";                                          // which folder the list last showed as "playing"
let Q = null, gActive = false, loading = false, playTicket = 0, errRun = 0, seeking = false, toastT = 0;
const urlCache = new Map();                                // song path -> Promise of its playable blob url

// ── FOLDERS (one call to GitHub lists the whole repo) ───────────────────
async function loadFolders() {
  const my = ++ticket;
  $("box").innerHTML = '<div class="msg">Loading folders...</div>'; show("list");
  try {
    const r = await fetch("https://api.github.com/repos/" + OWNER + "/" + REPO + "/git/trees/HEAD?recursive=1", {headers: hdr(false)});
    if (my !== ticket) return false;
    if (r.status === 401) { setTok(""); fail("PIN was rejected. Enter it again."); return false; }
    if (!r.ok) { $("box").innerHTML = '<div class="msg">Could not load folders (error ' + r.status + '). Reload to retry.</div>'; return false; }
    const data = await r.json();
    if (my !== ticket) return false;

      const dir = x.path.slice(0, i);

  } catch (e) { if (my === ticket) $("box").innerHTML = '<div class="msg">Network error. Reload to retry.</div>'; return false; }
}
const filesOf = dir => (listCache[dir] || []).map(x => x.name).sort(nat);
const cnt = n => n + (n === 1 ? " song" : " songs");
function updateCounts() {                                  // the playing folder shows "position/total songs"
  const fmtC = f => Q && Q.dir === f.n ? (Q.pos + 1) + "/" + cnt(f.count) + (Q.shuf ? " · shuffle" : "") : cnt(f.count);
  document.querySelectorAll("#box .topic[data-dir]").forEach(b => {
    const f = parsed.find(x => x.n === b.dataset.dir), sm = b.querySelector("small");
    if (f && sm) sm.textContent = fmtC(f);
  });
  if (cur >= 0 && parsed[cur]) $("scnt").textContent = fmtC(parsed[cur]);
}

const openGroups = new Set();                              // which top-level folders are expanded
let autoOpened = false;                                    // open the last-visited group once, on first list render
function renderList() {
  const g = $("box"); g.innerHTML = "";
  const last = getLast(), lastTop = last.split("/")[0];
  const pdir = Q ? Q.dir : "", ptop = pdir.split("/")[0];   // folder that is playing right now (gets the wave)
  if (!autoOpened) { autoOpened = true; if (last) openGroups.add(lastTop); }
  const groups = new Map();                                // top-level folder -> its entries (itself and/or sub-folders)
  parsed.forEach(f => { const top = f.n.split("/")[0]; if (!groups.has(top)) groups.set(top, []); groups.get(top).push(f); });
  const row = (f, title, sub) => {
    const b = document.createElement("button");
    b.className = "topic"; b.dataset.dir = f.n; b.innerHTML = "<b></b><small></small>";
    b.firstChild.textContent = title; b.lastChild.textContent = sub;
    if (last && f.n === last) b.firstChild.appendChild(bmIcon());
    if (pdir && f.n === pdir) b.insertBefore(nowLine(), b.lastChild);
    b.onclick = () => { savedScroll = g.scrollTop; location.hash = "f=" + encodeURIComponent(f.n); };
    return b;
  };

    if (list.length === 1 && list[0].n === top) { g.appendChild(row(list[0], list[0].t, cnt(list[0].count))); return; }
    const wrap = document.createElement("div");
    wrap.className = "grp" + (openGroups.has(top) ? " open" : "");
    const h = document.createElement("button");
    h.className = "topic hd"; h.innerHTML = "<span><b></b><small></small></span><i>&#9656;</i>";
    h.firstChild.firstChild.textContent = top;
    if (last && top === lastTop) h.firstChild.firstChild.appendChild(bmIcon());
    if (pdir && top === ptop) h.firstChild.insertBefore(nowLine(), h.firstChild.lastChild);
    h.firstChild.lastChild.textContent = list.length + (list.length === 1 ? " folder" : " folders") + " \u00b7 " + cnt(list.reduce((a, f) => a + f.count, 0));
    h.onclick = () => { wrap.classList.toggle("open"); wrap.classList.contains("open") ? openGroups.add(top) : openGroups.delete(top); fitMarquees(); };
    const kids = document.createElement("div"); kids.className = "kids";
    list.forEach(f => kids.appendChild(row(f, f.n === top ? "Songs in this folder" : f.n.slice(top.length + 1).replace(/\//g, " / "), cnt(f.count))));
    wrap.appendChild(h); wrap.appendChild(kids); g.appendChild(wrap);
  });
  const note2 = t => { const d = document.createElement("div"); d.className = "msg"; d.textContent = t; g.appendChild(d); };
  if (!parsed.length) note2("No folders with songs found.");
  if (truncated) note2("The repo is very large, so this list may be incomplete.");
  updateCounts(); fitMarquees();
}

// ── SONG LIST OF ONE FOLDER (shown only, nothing plays until tapped) ────
function openFolder(i) {
  cur = i; setLast(parsed[i].n);
  $("sttl").textContent = parsed[i].t; $("scnt").textContent = cnt(parsed[i].count);
  renderSongs(); show("folder"); $("sbox").scrollTop = 0;
  npShown = null; npUpdate(); centerNow(true, false);
}
function renderSongs() {
  const box = $("sbox"); box.innerHTML = "";
  if (cur < 0 || !parsed[cur]) return;
  const dir = parsed[cur].n, names = filesOf(dir);
  if (!names.length) { box.innerHTML = '<div class="msg">No songs in this folder.</div>'; return; }
  names.forEach((name, k) => {
    const b = document.createElement("button");
    b.className = "topic song"; b.dataset.p = dir + "/" + name; b.innerHTML = '<span class="ic">' + (k + 1) + '.</span><b></b><span class="rp">' + RPI + '</span><span class="wave"><i></i><i></i><i></i><i></i></span>';
    b.querySelector("b").textContent = pretty(name);
    b.onclick = () => { if (Q && curPath() === dir + "/" + name) togglePlay(); else startQueue(dir, k); };
    box.appendChild(b);
  });

}
function refreshMarks() {                                  // redraw the folder list so the bookmark moves (keeps scroll)
  if (document.body.dataset.v !== "list") return;
  const st = $("box").scrollTop; renderList(); $("box").scrollTop = st;
}
function markNow() {
  const p = curPath();
  document.querySelectorAll("#sbox .song").forEach(b => b.classList.toggle("now", !!p && b.dataset.p === p));
  npUpdate(); centerNow(false, true);
}
// pinned now-playing card at the top of the opened folder: old name fades out, new one fades in
let npShown = null, npT = 0, npT2 = 0;
function npUpdate() {
  const c = $("npc"), show = !!(Q && parsed[cur] && Q.dir === parsed[cur].n && document.body.dataset.v === "folder");
  c.hidden = !show; c.classList.toggle("playing", !au.paused && !loading);
  if (!show) { npShown = null; return; }
  const b = c.querySelector("b"), txt = pretty(Q.names[Q.pos]);
  if (npShown === null) { b.textContent = txt; npShown = txt; return; }
  if (npShown === txt) return;
  npShown = txt; clearTimeout(npT); clearTimeout(npT2); b.classList.remove("npin"); b.classList.add("npout");
  npT = setTimeout(() => {
    b.textContent = npShown; b.classList.remove("npout"); void b.offsetWidth; b.classList.add("npin");
    npT2 = setTimeout(() => b.classList.remove("npin"), 1000);
  }, 600);
}
$("npc").onclick = () => { if (Q) togglePlay(); };
// keep the playing song centred in the opened folder; a manual scroll pauses this for 5 s
let userScrollAt = 0, centerP = "", centerT = 0;
["touchstart", "wheel", "pointerdown"].forEach(ev => $("sbox").addEventListener(ev, () => { userScrollAt = Date.now(); }, {passive: true}));
function centerNow(force, smooth) {
  if (document.body.dataset.v !== "folder") return;
  const row = document.querySelector("#sbox .song.now"), p = curPath();
  if (!row || (!force && p === centerP)) return;
  const wait = 5000 - (Date.now() - userScrollAt);
  clearTimeout(centerT);
  if (!force && wait > 0) { centerT = setTimeout(() => { centerP = ""; centerNow(false, true); }, wait + 50); return; }
  centerP = p;
  const box = $("sbox"), rb = row.getBoundingClientRect(), bb = box.getBoundingClientRect();
  const top = box.scrollTop + (rb.top - bb.top) - (bb.height - rb.height) / 2;
  box.scrollTo({top: Math.max(0, top), behavior: smooth ? "smooth" : "auto"});
}

// ── PLAYER ──────────────────────────────────────────────────────────────
// Q = the folder being played: {dir, names (play order), pos, global, next (queue of the following folder)}
const fiOf = dir => parsed.findIndex(f => f.n === dir);
const nextDir = dir => parsed[(fiOf(dir) + 1) % parsed.length].n;           // last folder loops back to the first
const buildQ = (dir, global) => { const names = filesOf(dir); if (global) shuffle(names); return {dir, names, pos: 0, global, next: null}; };
const curPath = () => Q ? Q.dir + "/" + Q.names[Q.pos] : "";

function getUrl(path) {                                    // download a song once, keep it as a playable blob
  if (urlCache.has(path)) return urlCache.get(path);
  const ext = ((path.match(/\.([^.]+)$/) || [])[1] || "").toLowerCase();
  const p = api(path, true)
    .then(r => { if (r.status === 401) throw 401; if (!r.ok) throw r.status; return r.arrayBuffer(); })
    .then(buf => URL.createObjectURL(new Blob([buf], {type: MIME[ext] || "audio/mpeg"})))
    .catch(e => { urlCache.delete(path); throw e; });
  urlCache.set(path, p); return p;
}
function trimCache(keep) {                                 // keep only the current and the next song in memory
  urlCache.forEach((p, k) => { if (!keep.includes(k)) { urlCache.delete(k); p.then(u => URL.revokeObjectURL(u), () => {}); } });
}
function preloadNext() {                                   // download the next song while this one plays
  if (!Q) return null;
  let p = null;
  if (Q.pos + 1 < Q.names.length) p = Q.dir + "/" + Q.names[Q.pos + 1];
  else if (parsed.length && Q.global) {                    // only Global Play moves on to the next folder
    if (!Q.next) Q.next = buildQ(nextDir(Q.dir), Q.global);
    if (Q.next.names.length) p = Q.next.dir + "/" + Q.next.names[0];
  }
  if (p) getUrl(p).catch(() => {});

}
async function playCurrent() {
  if (!Q) return;
  const my = ++playTicket, path = curPath();
  if (repeat && path !== repPath) setRepeat(false);          // repeat belongs to one song only
  loading = true; $("seek").value = 0; $("tcur").textContent = "0:00"; $("tdur").textContent = "\u2026"; setNow();
  if (getLast() !== Q.dir) { setLast(Q.dir); refreshMarks(); }   // bookmark follows the folder that is playing
  try {
    const url = await getUrl(path);
    if (my !== playTicket) return;
    au.src = url; loading = false;
    const nx = preloadNext(); trimCache([path, nx]);
    setNow();
    await au.play();
  } catch (e) {
    if (my !== playTicket) return;
    loading = false; setNow();
    if (e === 401) { setTok(""); stopAll(); return fail("PIN was rejected. Enter it again."); }
    if (e && e.name === "AbortError") return;
    if (e && e.name === "NotAllowedError") return toast("Tap play to start");
    toast("Could not load this song"); skip();
  }
}
function startQueue(dir, k) {                              // tapped a song: play it, then the rest of the folder, then the next folder
  const all = filesOf(dir);
  if (gActive) Q = {dir, names: [all[k], ...shuffle(all.filter((_, i) => i !== k))], pos: 0, global: true, next: null};   // Global Play on: shuffle the rest
  else Q = {dir, names: all, pos: k, global: false, next: null};
  errRun = 0; lsDir = 1; playCurrent();
}
function startShuffle(dir) {                               // swipe left: shuffle this folder, stop when it ends (Global Play on = carry on to the next folder)
  const names = filesOf(dir); if (!names.length) return;
  shuffle(names);
  Q = {dir, names, pos: 0, global: gActive, next: null, shuf: true};
  errRun = 0; lsDir = 1; playCurrent();
}
function globalOn() {                                      // shuffle ONE folder at a time, then on to the next folder
  if (!parsed.length) { setGlobal(false); return toast("No songs found yet"); }
  errRun = 0;
  if (Q) {                                                 // already playing: keep this song, shuffle the rest of its folder
    const cp = Q.names[Q.pos], rest = shuffle(Q.names.filter((_, i) => i !== Q.pos));
    Q = {dir: Q.dir, names: [cp, ...rest], pos: 0, global: true, next: null};
    setGlobal(true); setNow(); trimCache([curPath(), preloadNext()]); return;
  }
  const dir = (document.body.dataset.v === "folder" && parsed[cur]) ? parsed[cur].n : parsed[0].n;
  Q = buildQ(dir, true); setGlobal(true); playCurrent();
}
function advance(d) {
  if (!Q || !parsed.length) return;
  lsDir = d > 0 ? 1 : -1;
  if (d > 0) {
    if (Q.pos + 1 < Q.names.length) Q.pos++;
    else { if (!Q.global) { toast("Folder finished"); return stopAll(); }   // Global Play off: stop after the last song
      const nq = Q.next || buildQ(nextDir(Q.dir), Q.global); if (!nq.names.length) return stopAll(); if (nq.dir !== Q.dir) showGenre(nq.dir); Q = nq; }
  } else {
    if (Q.pos === 0 || au.currentTime > 3) { au.currentTime = 0; if (au.paused && !loading) au.play().catch(() => {}); return; }
    Q.pos--;
  }

}
function skip() {                                          // a song failed: try the next, but give up after 3 failures in a row
  if (++errRun >= 3) { errRun = 0; toast("Stopped: songs could not be played"); au.pause(); return; }
  advance(1);
}
function togglePlay() {
  if (!Q || loading) return;
  if (au.paused) { if (au.getAttribute("src")) au.play().catch(() => {}); else playCurrent(); } else au.pause();
}
function setRepeat(on) {                                   // loop the song that is playing, forever
  repeat = on && !!Q; repPath = repeat ? curPath() : ""; au.loop = repeat;
  $("rep").classList.toggle("on", repeat); $("rep").setAttribute("aria-pressed", repeat ? "true" : "false");
  $("sbox").classList.toggle("rep", repeat); $("box").classList.toggle("rep", repeat);
}
function stopAll() {
  playTicket++; Q = null; loading = false; setGlobal(false); setRepeat(false);
  au.pause(); au.removeAttribute("src"); au.load();
  trimCache([]); $("seek").value = 0; $("tcur").textContent = $("tdur").textContent = "0:00";
  if ("mediaSession" in navigator) navigator.mediaSession.metadata = null;
  setNow();
}
function setGlobal(on) { gActive = on; $("gps").checked = on; }

const PLAY = '<svg class="ico f" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>';
const PAUSE = '<svg class="ico f" viewBox="0 0 24 24"><path d="M7 4h3.5v16H7zM13.5 4H17v16h-3.5z"/></svg>';
function syncPlay() {
  const on = !au.paused || loading;
  const pl = !au.paused && !loading;                                  // waves move only while music is really playing
  $("ls").classList.toggle("playing", pl);
  $("sbox").classList.toggle("playing", pl); $("box").classList.toggle("playing", pl);
  $("play").innerHTML = on ? PAUSE : PLAY; $("play").setAttribute("aria-label", on ? "Pause" : "Play");
  if ("mediaSession" in navigator) navigator.mediaSession.playbackState = Q ? (au.paused ? "paused" : "playing") : "none";
}
function setNow() {
  const pd = Q ? Q.dir : "";
  if (pd !== shownPD) { shownPD = pd; refreshMarks(); }     // playing folder changed: move the wave in the folder list
  document.querySelectorAll(".mq:not(#lsnow)").forEach(m => { m.dataset.t = curName(); }); fitMarquees();   // new song: update the name in the list
  $("bar").hidden = !Q; updateCounts();
  document.body.classList.toggle("hasq", !!Q);
  lsUpdate({prev: Q && Q.pos > 0 ? pretty(Q.names[Q.pos - 1]) : "", cur: curName(), next: nextName()});
  if (Q && "mediaSession" in navigator) navigator.mediaSession.metadata = new MediaMetadata({title: pretty(Q.names[Q.pos]), artist: nice(Q.dir), album: "My Songs"});
  markNow(); syncPlay(); updateBar();
}
function updateBar() { $("prevS").disabled = $("nextS").disabled = $("play").disabled = $("rep").disabled = !Q; }
function tick() {
  const d = au.duration;
  if (!seeking && isFinite(d) && d > 0) { $("seek").value = au.currentTime / d * 1000; $("tcur").textContent = fmt(au.currentTime); }
  $("tdur").textContent = fmt(d);
  if ("mediaSession" in navigator && navigator.mediaSession.setPositionState && isFinite(d) && d > 0) {
    try { navigator.mediaSession.setPositionState({duration: d, position: Math.min(au.currentTime, d), playbackRate: 1}); } catch (e) {}
  }
}
function toast(t) {
  const el = $("toast"); el.firstChild.textContent = t; el.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("on"), 2200);
}

au.addEventListener("ended", () => advance(1));
au.addEventListener("play", syncPlay); au.addEventListener("pause", syncPlay);
au.addEventListener("playing", () => { errRun = 0; });
au.addEventListener("timeupdate", tick); au.addEventListener("durationchange", tick);
au.addEventListener("error", () => { if (!Q || !au.getAttribute("src")) return; toast("Could not play this song"); skip(); });
const SPK = '<svg class="ico" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>';
const MUTED = '<svg class="ico" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4zM23 9l-6 6M17 9l6 6"/></svg>';
function syncMute() { $("mute").innerHTML = au.muted ? MUTED : SPK; $("mute").setAttribute("aria-label", au.muted ? "Unmute" : "Mute"); $("mute").style.color = au.muted ? "#ff8f8f" : ""; }
$("mute").onclick = () => { au.muted = !au.muted; syncMute(); };
au.addEventListener("volumechange", syncMute);
syncMute();
$("seek").addEventListener("input", () => { seeking = true; $("tcur").textContent = fmt($("seek").value / 1000 * au.duration); });
$("seek").addEventListener("change", () => { if (isFinite(au.duration)) au.currentTime = $("seek").value / 1000 * au.duration; seeking = false; });

// lock-screen / headphone controls
if ("mediaSession" in navigator) {
  const act = (n, f) => { try { navigator.mediaSession.setActionHandler(n, f); } catch (e) {} };
  act("play", () => { if (au.paused) togglePlay(); });
  act("pause", () => au.pause());
  act("previoustrack", () => advance(-1));
  act("nexttrack", () => advance(1));
  act("seekto", d => { if (d.seekTime != null) au.currentTime = d.seekTime; });
}

// ── SWIPE A FOLDER RIGHT = PLAY IN ORDER, LEFT = SHUFFLED ───────────────────────
(function () {
  const box = $("box"), TH = 60, MAXS = 12;
  let row = null, sx = 0, sy = 0, dx = 0, mode = 0, swiped = false;   // mode: 0 undecided, 1 horizontal swipe, 2 ignore (scrolling)
  box.addEventListener("pointerdown", e => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    const r = e.target.closest(".topic[data-dir]"); if (!r) return;
    row = r; sx = e.clientX; sy = e.clientY; dx = 0; mode = 0;
  });
  box.addEventListener("pointermove", e => {
    if (!row || mode === 2) return;
    dx = e.clientX - sx; const dy = e.clientY - sy;
    if (mode === 0) {
      if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { mode = 2; return; }
      if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * 1.5) { mode = 1; row.classList.add("drag"); } else return;
    }
    const s = Math.max(-MAXS, Math.min(MAXS, dx * 0.2));          // panel follows the finger, up to 12px either way
    row.style.transform = s ? "translateX(" + s + "px)" : "";
    row.classList.toggle("dragl", dx < 0);
    row.classList.toggle("go", Math.abs(dx) >= TH);
  });
  const end = e => {
    if (!row) return;
    const r = row, m = mode, go = m === 1 && e.type === "pointerup" && Math.abs(dx) >= TH, left = dx < 0;
    row = null; mode = 0;
    r.classList.remove("drag", "go", "dragl"); r.style.transform = "";      // snap back
    if (m === 1) { swiped = true; setTimeout(() => { swiped = false; }, 350); }
    if (go) {
      if (left) { startShuffle(r.dataset.dir); toast("Shuffling " + nice(r.dataset.dir)); }
      else { startQueue(r.dataset.dir, 0); toast("Playing " + nice(r.dataset.dir)); }
    }
  };
  box.addEventListener("pointerup", end); box.addEventListener("pointercancel", end);
  box.addEventListener("click", e => { if (swiped) { e.stopPropagation(); e.preventDefault(); } }, true);
})();

// ── HOLD PREV / NEXT = SLIDE BACKWARD / FORWARD THROUGH THE SONG ────────
function holdSeek(btn, dir, tap) {
  let to = 0, iv = 0, held = false, t0 = 0, after = 0;
  const stop = () => { clearTimeout(to); clearInterval(iv); to = iv = 0; };
  btn.addEventListener("pointerdown", e => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    stop(); held = false;
    to = setTimeout(() => {
      held = true; t0 = Date.now(); seeking = true;
      iv = setInterval(() => {
        const d = au.duration; if (!Q || !isFinite(d) || d <= 0) return;
        const step = Math.min(5, 1.5 + (Date.now() - t0) / 2000 * 1.5);   // speeds up the longer you hold
        const t = Math.max(0, Math.min(d - 0.5, au.currentTime + dir * step));
        au.currentTime = t; $("seek").value = t / d * 1000; $("tcur").textContent = fmt(t);
      }, 100);
    }, 450);
  });
  const end = () => {
    stop();
    if (held) { seeking = false; tick(); clearTimeout(after); after = setTimeout(() => { held = false; }, 400); }   // swallow the click that follows a long press
  };
  ["pointerup", "pointercancel", "pointerleave"].forEach(ev => btn.addEventListener(ev, end));
  btn.addEventListener("contextmenu", e => e.preventDefault());
  btn.onclick = () => { if (held) { held = false; return; } tap(); };
}
holdSeek($("prevS"), -1, () => advance(-1)); holdSeek($("nextS"), 1, () => advance(1));
holdSeek($("lsup"), -1, () => advance(-1)); holdSeek($("lsdn"), 1, () => advance(1));

// ── BUTTONS + KEYS ──────────────────────────────────────────────────────
$("gps").onchange = () => { $("gps").checked ? globalOn() : stopAll(); };
$("play").onclick = togglePlay;
$("rep").onclick = () => { if (Q) setRepeat(!repeat); };
$("menu").onclick = () => { location.hash = ""; };
// full screen (iPhone Safari has no API: hide the banner instead)
const EXP = '<svg class="ico" viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>';
const COL = '<svg class="ico" viewBox="0 0 24 24"><path d="M3 8h5V3M21 8h-5V3M3 16h5v5M21 16h-5v5"/></svg>';
const root = document.documentElement, canFS = !!root.requestFullscreen;
const setIcon = on => { $("max").innerHTML = on ? COL : EXP; $("max").setAttribute("aria-label", on ? "Exit full screen" : "Full screen"); };
function setMax(on) {
  if (canFS) { if (on) root.requestFullscreen().catch(() => {}); else if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); }
  else document.body.classList.toggle("max", on);
  setIcon(on);
}
$("max").onclick = () => { closePanel(); setMax(canFS ? !document.fullscreenElement : !document.body.classList.contains("max")); };
document.addEventListener("fullscreenchange", () => setIcon(!!document.fullscreenElement));
setIcon(false);
const panel = $("panel");
function closePanel() { panel.hidden = true; $("pinrow").hidden = true; $("pin").value = ""; $("pinerr").textContent = ""; }
$("gear").onclick = e => { e.stopPropagation(); panel.hidden ? (panel.hidden = false) : closePanel(); };
panel.addEventListener("click", e => e.stopPropagation());
document.addEventListener("click", closePanel);
$("refresh").onclick = () => {                             // re-read the folder list from GitHub
  closePanel();
  if (document.body.dataset.v === "list") savedScroll = $("box").scrollTop;
  loaded = false; listCache = {}; route();
};
$("key").onclick = () => { $("pin").value = ""; $("pinerr").textContent = ""; $("pinrow").hidden = false; $("pin").focus(); };
function tryPin() {
  if ($("pin").value === ADMIN_PIN) { closePanel(); changeToken(); }
  else { $("pinerr").textContent = "Wrong PIN"; $("pin").value = ""; }
}
$("pinok").onclick = tryPin;
$("pin").addEventListener("keydown", e => { if (e.key === "Enter") tryPin(); });
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || document.body.dataset.v === "login") return;
  if (e.key === "ArrowRight") advance(1);
  else if (e.key === "ArrowLeft") advance(-1);
  else if (e.key === "Escape" && !document.body.classList.contains("max")) location.hash = "";
});

// ── PIN ───────────────────────────────────────────────────────────────
function changeToken() { setTok(""); stopAll(); $("lerr").textContent = ""; $("tokin").value = ""; route(); }
async function saveToken() {
  const v = $("tokin").value.trim(); if (!v) return;
  $("lerr").textContent = "Checking...";
  setTok(v);
  try {
    const r = await fetch("https://api.github.com/repos/" + OWNER + "/" + REPO, {headers: hdr(false)});
    if (r.ok) { $("lerr").textContent = ""; $("tokin").value = ""; return route(); }
    setTok(""); $("lerr").textContent = r.status === 401 ? "GitHub rejected this PIN. Check it and try again."
      : "This PIN cannot read " + OWNER + "/" + REPO + " (error " + r.status + "). Check its repository access.";
  } catch (e) { setTok(""); $("lerr").textContent = "Network error. Check your connection and try again."; }
}
$("tsave").onclick = saveToken;
$("tokin").addEventListener("keydown", e => { if (e.key === "Enter") saveToken(); });

// ── ROUTING (#f=<folder name>) ──────────────────────────────────────────
async function route() {
  if (!getTok()) { ++ticket; return show("login"); }
  if (!loaded && !(await loadFolders())) return;
  const m = location.hash.match(/^#f=(.+)$/);
  if (!m) { ++ticket; cur = -1; renderList(); show("list"); fitMarquees(); $("box").scrollTop = savedScroll; return; }
  const i = parsed.findIndex(f => f.n === decodeURIComponent(m[1]));
  if (i < 0) { location.hash = ""; return; }
  openFolder(i);
}
window.addEventListener("hashchange", route);
window.addEventListener("resize", fitMarquees);
setNow();
route();

// ── LANDSCAPE: CONTROLS FADE AWAY AFTER ~7.5 s WITHOUT A TOUCH (then ~6 s fade); A TOUCH BRINGS THEM BACK ──
(function () {
  const B = document.body; let t = 0;
  const arm = () => { clearTimeout(t); t = setTimeout(() => { if (!au.paused) B.classList.add("ctl-fade"); }, 7500); };
  const wake = () => { B.classList.remove("ctl-fade"); arm(); };
  document.addEventListener("pointerdown", wake, true);
  document.addEventListener("keydown", wake, true);
  au.addEventListener("pause", () => { if (!au.ended && !loading) wake(); });   // paused: keep the controls visible
  au.addEventListener("playing", arm);
  wake();
})();

// ── START SCREEN ────────────────────────────────────────────────────────
// Full screen can only be requested from a tap, so the tap on "Start" asks for it, then the screen fades away (2.5 s).
// (iPhone Safari has no full-screen API: there the banner is hidden instead, like the full-screen button does.)
(function () {
  const scr = $("start-screen"), btn = $("start-btn");
  const m = /url\(["']?(.*?)["']?\)/.exec(getComputedStyle(scr).getPropertyValue("--start-img"));
  const ready = () => scr.classList.add("ready");
  if (m) { const img = new Image(); img.onload = img.onerror = ready; img.src = m[1]; setTimeout(ready, 1500); } else ready();
  setTimeout(() => scr.classList.add("btn-on"), 1000);       // the glowing button comes up 1 second after the screen opens
  let done = false;
  const finish = () => { if (!done) { done = true; scr.remove(); } };
  btn.addEventListener("click", () => {
    setMax(true);
    scr.classList.add("leaving");
    scr.addEventListener("animationend", e => { if (e.target === scr) finish(); });
    setTimeout(finish, 3200);                                // safety net
  });
})();
</script>
