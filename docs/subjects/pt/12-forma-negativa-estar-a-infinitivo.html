<h2>12. Forma negativa — estar + a + infinitivo</h2>
<p class="en">Negative form — estar + a + infinitive</p>

<h3>Estrutura <span class="en">(Structure)</span></h3>
<p class="pt">não + estar + a + infinitivo</p>

<h3>Exemplos <span class="en">(Examples)</span></h3>
<p class="pt">Eu não estou a brincar, Tu não estás a jogar, Ele não está a falar, Ela não está a comer, Não está a nevar, Não estão a conversar.</p>
