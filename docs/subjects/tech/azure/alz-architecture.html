<!--
  Azure Landing Zone — Architecture (fragment)
  Scoped under .alz-diagram. Just wraps the PNG so it fits the
  content panel nicely and can be click-expanded, since the source
  image is very wide/detailed.
-->
<style>
  .alz-diagram { text-align: center; }
  .alz-diagram .cap {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: #8a7a5a;
    margin-bottom: 10px;
  }
  .alz-diagram img {
    max-width: 100%;
    height: auto;
    border: 1px solid #e8e2d5;
    border-radius: 6px;
    cursor: zoom-in;
  }
  .alz-diagram img.zoomed {
    max-width: none;
    width: 1900px;
    cursor: zoom-out;
  }
</style>

<div class="alz-diagram">
  <div class="cap">Azure Landing Zone — conceptual architecture · click image to zoom</div>
  <img src="subjects/tech/azure/ALZ-ARCHITECTURE.png"
       alt="Azure Landing Zone architecture diagram"
       onclick="this.classList.toggle('zoomed')">
</div>
