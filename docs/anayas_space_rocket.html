<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Anaya's Space Rocket</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #05051a; color: white;
    font-family: system-ui, sans-serif; overflow: hidden;
  }
  #game {
    display: block; width: 100vw; height: 100vh;
    background: radial-gradient(circle at 50% 30%, #17135c 0, #08082b 35%, #020211 100%);
  }
  #hud {
    position: fixed; top: 12px; left: 0; right: 0;
    display: flex; justify-content: space-around; gap: 10px;
    font-size: clamp(16px, 3vw, 25px); font-weight: 800;
    text-shadow: 0 2px 5px #000; pointer-events: none;
  }
  #help {
    position: fixed; bottom: 10px; left: 0; right: 0;
    text-align: center; opacity: .9; font-size: 14px;
    pointer-events: none;
  }
  #start {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: rgba(0,0,20,.55);
  }
  .card {
    text-align: center; padding: 30px; border-radius: 24px;
    background: rgba(25,20,85,.94); border: 2px solid #7b75ff;
    box-shadow: 0 0 40px #514cff66; max-width: 420px;
  }
  button {
    border: 0; border-radius: 999px; padding: 14px 30px;
    font-size: 20px; font-weight: 800; cursor: pointer;
    background: #fff; color: #17135c;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div>⭐ Score: <span id="score">0</span></div>
  <div>❤️ Lives: <span id="lives">3</span></div>
  <div>🚀 Level: <span id="level">1</span></div>
</div>
<div id="help">Move with ← → or A/D • Shoot with SPACE • On a phone, touch left/right to move</div>
<div id="start">
  <div class="card">
    <div style="font-size:60px">🚀</div>
    <h1>Anaya's Space Rocket</h1>
    <p>Blast the falling aliens! 👽</p>
    <button id="play">START GAME</button>
  </div>
</div>

<script>
const canvas = document.getElementById("game"), ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score"), livesEl = document.getElementById("lives"), levelEl = document.getElementById("level");
let W, H, running=false, score=0, lives=3, level=1, keys={}, bullets=[], aliens=[], stars=[];
let rocket = {x:0, y:0, w:52, h:64, speed:7}, last=0, spawnTimer=0, shootCooldown=0;

function resize(){
  W=canvas.width=innerWidth*devicePixelRatio; H=canvas.height=innerHeight*devicePixelRatio;
  canvas.style.width=innerWidth+"px"; canvas.style.height=innerHeight+"px";
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  W=innerWidth; H=innerHeight;
  rocket.x=W/2; rocket.y=H-90;
  stars=Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2+.4,s:Math.random()*1.5+.2}));
}
addEventListener("resize", resize); resize();

addEventListener("keydown", e=>{ keys[e.key.toLowerCase()]=true; if(e.code==="Space") e.preventDefault(); });
addEventListener("keyup", e=>keys[e.key.toLowerCase()]=false);

canvas.addEventListener("pointermove", e=>{ if(running && e.pointerType!=="mouse") rocket.x=e.clientX; });
canvas.addEventListener("pointerdown", e=>{ if(running){ rocket.x=e.clientX; shoot(); }});

document.getElementById("play").onclick=()=>start();

function start(){
  score=0; lives=3; level=1; bullets=[]; aliens=[]; running=true;
  document.getElementById("start").style.display="none"; updateHud();
  requestAnimationFrame(loop);
}

function updateHud(){
 scoreEl.textContent=score; livesEl.textContent=lives; levelEl.textContent=level;
}

function shoot(){
 if(shootCooldown<=0){
   bullets.push({x:rocket.x, y:rocket.y-30, r:4, speed:11});
   shootCooldown=14;
 }
}

function spawnAlien(){
 const size=38+Math.random()*10;
 aliens.push({x:size/2+Math.random()*(W-size), y:-size, size, speed:1.5+Math.random()*1.5+level*.18, phase:Math.random()*6.28});
}

function hit(a,b){
 return Math.abs(a.x-b.x)<(a.size+b.r*2)/2 && Math.abs(a.y-b.y)<(a.size+b.r*2)/2;
}

function loop(t){
 if(!running) return;
 const dt=Math.min(2,(t-last)/16.67||1); last=t;
 ctx.clearRect(0,0,W,H);

 // stars
 for(const s of stars){ s.y+=s.s*dt; if(s.y>H)s.y=0; ctx.globalAlpha=.35+s.r/3; ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill(); }
 ctx.globalAlpha=1;

 if(keys["arrowleft"]||keys["a"]) rocket.x-=rocket.speed*dt;
 if(keys["arrowright"]||keys["d"]) rocket.x+=rocket.speed*dt;
 if(keys[" "]) shoot();
 rocket.x=Math.max(30,Math.min(W-30,rocket.x));
 shootCooldown-=dt;

 spawnTimer-=dt;
 if(spawnTimer<=0){ spawnAlien(); spawnTimer=Math.max(18,55-level*2); }

 // bullets
 for(const b of bullets) b.y-=b.speed*dt;
 bullets=bullets.filter(b=>b.y>-20);

 // aliens
 for(const a of aliens){ a.y+=a.speed*dt; a.x+=Math.sin(a.y/35+a.phase)*.7*dt; }

 // collisions
 for(let i=aliens.length-1;i>=0;i--){
   const a=aliens[i];
   let destroyed=false;
   for(let j=bullets.length-1;j>=0;j--){
     if(hit(a,bullets[j])){
       aliens.splice(i,1); bullets.splice(j,1); score+=10; level=1+Math.floor(score/100); updateHud(); destroyed=true; break;
     }
   }
   if(destroyed) continue;
   if(a.y>H-80){
     aliens.splice(i,1); lives--; updateHud();
     if(lives<=0){ gameOver(); return; }
   }
 }

 // rocket
 drawRocket(rocket.x,rocket.y);

 // bullets
 ctx.fillStyle="#8ff"; for(const b of bullets){ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();}

 // aliens
 for(const a of aliens) drawAlien(a);

 requestAnimationFrame(loop);
}

function drawRocket(x,y){
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle="#ddd"; ctx.beginPath(); ctx.moveTo(0,-34); ctx.lineTo(23,27); ctx.quadraticCurveTo(0,42,-23,27); ctx.closePath(); ctx.fill();
  ctx.fillStyle="#5cf"; ctx.beginPath(); ctx.arc(0,-8,10,0,Math.PI*2); ctx.fill();
  ctx.fillStyle="#f55"; ctx.beginPath(); ctx.moveTo(-23,25);ctx.lineTo(-34,38);ctx.lineTo(-18,34);ctx.closePath();ctx.fill();
  ctx.beginPath(); ctx.moveTo(23,25);ctx.lineTo(34,38);ctx.lineTo(18,34);ctx.closePath();ctx.fill();
  ctx.fillStyle="#ffb52e"; ctx.beginPath();ctx.moveTo(-9,30);ctx.lineTo(0,55+Math.random()*8);ctx.lineTo(9,30);ctx.closePath();ctx.fill();
  ctx.restore();
}

function drawAlien(a){
  ctx.save();ctx.translate(a.x,a.y);const s=a.size/40;
  ctx.fillStyle="#72e35c";ctx.beginPath();ctx.ellipse(0,0,18*s,15*s,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#72e35c";ctx.lineWidth=3*s;
  ctx.beginPath();ctx.moveTo(-10*s,10*s);ctx.lineTo(-20*s,22*s);ctx.moveTo(10*s,10*s);ctx.lineTo(20*s,22*s);ctx.stroke();
  ctx.fillStyle="#fff";ctx.beginPath();ctx.ellipse(-7*s,-3*s,5*s,7*s,0,0,Math.PI*2);ctx.ellipse(7*s,-3*s,5*s,7*s,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#222";ctx.beginPath();ctx.arc(-7*s,-2*s,2.5*s,0,Math.PI*2);ctx.arc(7*s,-2*s,2.5*s,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function gameOver(){
 running=false;
 document.getElementById("start").style.display="grid";
 document.querySelector("#start h1").textContent="Game Over! 🌟";
 document.querySelector("#start p").innerHTML=`Great flying, Anaya! Your score was <b>${score}</b>.`;
 document.getElementById("play").textContent="PLAY AGAIN";
}
</script>
</body>
</html>
