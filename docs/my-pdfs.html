<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1018">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>My PDFs</title>
<style>
:root{--ink:#0a1018;--panel:#142030;--line:#223349;--text:#e8eef6;--mute:#8b9bb0;--accent:#4f93e0;--a:79,147,224}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none;background:var(--ink);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-touch-callout:none}
#app{position:fixed;inset:0;max-width:760px;margin:0 auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:44px;height:44px;cursor:pointer}
button:active{background:var(--line)}button:disabled{opacity:.3;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent)}
#landing,#list,#viewer,#login{display:none;flex:1;min-height:0}
body[data-v=list] #list{display:flex;flex-direction:column;padding:10px 12px 6px}
#frame{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;margin-top:20px}
#box{flex:1;min-height:0;overflow-y:auto;border:1px solid var(--line);border-radius:14px;padding:26px 6px 44px}
#ribbon{position:absolute;top:-17px;left:50%;transform:translateX(-50%);z-index:3;height:34px;padding:0 30px;display:flex;align-items:center;justify-content:center;border-radius:17px;background:linear-gradient(180deg,#5aa0ee,#3a78c4);color:#fff;font-size:16px;font-weight:700;letter-spacing:.6px;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.35);box-shadow:0 2px 10px rgba(var(--a),.35),inset 0 1px 0 rgba(255,255,255,.25);pointer-events:none}
#ribbon::before,#ribbon::after{content:"";position:absolute;top:7px;width:26px;height:34px;background:#2a5a96;z-index:-1;border-radius:6px}
#ribbon::before{left:-18px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,28% 50%)}
#ribbon::after{right:-18px;clip-path:polygon(0 0,100% 0,72% 50%,100% 100%,0 100%)}
body[data-v=view] #viewer{display:block;position:relative;overflow:auto;overscroll-behavior:contain;touch-action:pan-x pan-y;outline:none}
body[data-v=login] #login{display:flex;flex-direction:column;justify-content:center;gap:12px;padding:24px}
body[data-v=login] footer,body[data-v=login] #info,body[data-v=landing] footer,body[data-v=landing] #info{display:none}
.topic{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;height:auto;min-height:40px;margin:0 0 4px;padding:5px 12px;text-align:left;border-radius:10px}
.topic>span:first-child{flex:1;min-width:0}
.topic b{display:block;font-weight:600;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.topic small{display:block;color:var(--mute);font-size:11px;line-height:1.3}.topic small:empty{display:none}
.topic .r{flex:none;display:flex;align-items:center;gap:8px}
.topic em.n{flex:none;font-style:normal;font-size:11px;font-weight:600;padding:3px 8px;border-radius:10px;color:#9cc4f2;background:rgba(var(--a),.1);border:1px solid rgba(var(--a),.3);white-space:nowrap}
.topic.hd i{font-style:normal;color:var(--mute);transition:transform .15s}.grp.open>.hd i{transform:rotate(90deg)}
.kids{display:none;margin:-1px 0 6px 10px;padding-left:8px;border-left:2px solid var(--line)}.grp.open>.kids{display:block}
.bm{display:inline-block;width:15px;height:15px;margin-left:8px;vertical-align:-2px;fill:#f5b942;stroke:#f5b942;stroke-width:1.5;stroke-linejoin:round}
.msg{color:var(--mute);text-align:center;padding:48px 20px;line-height:1.5}.msg.bad{color:#ff8f8f}
#pages{display:flex;flex-direction:column;align-items:center;width:max-content;min-width:100%;padding:8px 0 44px}
.pg{position:relative;flex:none;margin:0 0 8px;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.5);overflow:hidden}
.pg canvas{display:block;width:100%;height:100%}
.pg i{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;color:#9aa4b2;font-size:14px}
#vmsg{position:absolute;left:0;right:0;top:32%;z-index:2;pointer-events:none}#vmsg[hidden],body:not([data-v=view]) #vmsg{display:none}
#toast{position:absolute;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:8;background:#0a1018e6;border:1px solid var(--line);border-radius:12px;padding:8px 16px;text-align:center;max-width:86%;pointer-events:none;opacity:0;transition:opacity .9s}
#toast.on{opacity:1;transition:opacity .2s}#toast small{display:block;color:var(--mute);font-size:12px}#toast b{font-size:15px}
footer{position:relative;display:flex;gap:6px;align-items:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));border-top:1px solid rgba(var(--a),.3)}
.mid{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px}
footer svg,#fsx svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block;margin:auto}
#info{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 6px);max-width:80%;padding:4px 14px;border-radius:12px;background:rgba(10,16,24,.85);text-align:center;line-height:1.25;pointer-events:none;border:1px solid var(--line)}
#info.none,#panel:not([hidden]) ~ #info{display:none}
#cnt{display:block;font-size:13px;font-weight:600}#lbl{display:block;font-size:11px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#info.warn #lbl{color:#ff9a9a}
#fsx{display:none;position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));right:12px;z-index:5;border-radius:50%;background:#0a1018cc}
body.max footer{display:none!important}body.max #fsx{display:block}
#panel{position:absolute;right:12px;bottom:calc(100% + 8px);z-index:6;display:flex;flex-direction:column;gap:8px;padding:10px;background:rgba(20,32,48,.8);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px}
#panel[hidden],#pinrow[hidden],#gorow[hidden],#goBtn[hidden]{display:none}
#prow,#pinrow,#gorow{display:flex;gap:8px;align-items:center}
#pin,#gopg{width:110px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:0 12px;font:inherit}#pin{letter-spacing:3px}
#pinerr{color:#ff8f8f;font-size:12px}#del.on{border-color:#e5484d;color:#ff8f8f}
#slide{flex:1;min-width:0;max-width:340px;height:44px;position:relative;margin:0 4px;border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.04);overflow:hidden}#slide.off{display:none}
#fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(229,72,77,.28)}
#hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-left:40px;font-size:11px;color:var(--mute);white-space:nowrap;pointer-events:none}
#trash{position:absolute;left:2px;top:2px;min-width:38px;width:38px;height:38px;border-radius:50%;color:#ff8f8f;border-color:#e5484d66;touch-action:none;cursor:grab;transition:transform .2s}
#trash.drag{transition:none;cursor:grabbing}#trash svg{width:20px;height:20px}
body.app #max,body.app #fsx,body.app #upl{display:none!important}
#login h2{margin:0}#login p{margin:0;color:var(--mute);line-height:1.5}
#login input{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:0 14px;font:inherit}#lerr{color:#ff8f8f!important}
body[data-v=landing] #landing{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;background:radial-gradient(circle at 50% 38%,rgba(var(--a),.16),transparent 62%)}
#landing .logo{width:78px;height:78px;fill:none;stroke:var(--accent);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 10px rgba(var(--a),.55))}
#landing h1{margin:4px 0 0;font-size:36px;letter-spacing:.5px}
#landing p{margin:0;color:var(--mute);font-size:14px}
#landing{position:relative}
#start{position:absolute;right:24px;bottom:calc(30px + env(safe-area-inset-bottom));min-width:0;width:88px;height:88px;padding:0;border-radius:50%;font-size:14px;font-weight:700;letter-spacing:1px;color:#fff;border:1px solid rgba(var(--a),.95);background:linear-gradient(180deg,#5aa0ee,#3a78c4);animation:glow 2s ease-in-out infinite}
#start:active{transform:scale(.97);background:#3a78c4}
@keyframes glow{0%,100%{box-shadow:0 0 8px rgba(var(--a),.5),0 0 18px rgba(var(--a),.3)}50%{box-shadow:0 0 20px rgba(var(--a),.95),0 0 46px rgba(var(--a),.6)}}
@media (prefers-reduced-motion:reduce){#start{animation:none;box-shadow:0 0 20px rgba(var(--a),.7)}}
.topic.pdf{background:transparent;border-color:transparent}
.topic.pdf b{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:14.5px;color:#f3d9a4}
.topic.pdf small{color:#b9a374}
.topic.pdf:active{background:rgba(245,185,66,.1)}
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
#fup,#fdn{display:none;position:fixed;right:calc(12px + env(safe-area-inset-right));z-index:5;width:50px;height:50px;min-width:0;padding:0;border-radius:50%;background:rgba(10,16,24,.7);align-items:center;justify-content:center}
#fup{top:calc(50% - 56px)}#fdn{top:calc(50% + 6px)}
#fup svg,#fdn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;display:block}
@media (orientation:landscape) and (max-height:500px){
  footer{display:none!important}
  body[data-v=view] #fup,body[data-v=view] #fdn{display:flex}
}
</style>
</head>
<body data-v="landing">
<div id="app">
  <div id="landing">
    <svg class="logo" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 13h6M9 16h4"/></svg>
    <h1>My PDFs</h1><p>All your documents, one tap away</p>
    <button id="start">START</button>
  </div>
  <div id="list"><div id="frame"><div id="ribbon">My PDFs</div><div id="box"></div></div></div>
  <div id="login">
    <h2>Enter 4 Digits PIN</h2><p>Saved only in this browser on this device.</p>
    <input id="tokin" type="password" autocomplete="off" placeholder="PIN">
    <button id="tsave">Save PIN</button><p id="lerr"></p>
  </div>
  <div id="viewer" tabindex="-1"><div id="pages"></div></div>
  <div id="vmsg" class="msg" hidden></div>
  <div id="toast"><small></small><b></b></div>
  <footer id="foot">
    <button id="menu" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div class="mid">
      <button id="prevF"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      <div id="slide" class="off"><div id="fill"></div><span id="hint">slide to delete</span>
        <button id="trash" aria-label="Slide right to delete this PDF"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg></button></div>
      <button id="nextF"><svg viewBox="0 0 24 24"><path d="M12 5v14M19 12l-7 7-7-7"/></svg></button>
    </div>
    <button id="gear" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    <div id="panel" hidden>
      <div id="prow">
        <button id="refresh" aria-label="Refresh"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v5h-5"/></svg></button>
        <button id="goBtn" aria-label="Go to page" hidden><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h5"/></svg></button>
        <button id="upl" aria-label="Upload PDFs"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg></button>
        <button id="max" aria-label="Full screen"></button>
        <button id="key" aria-label="Change PIN"><svg viewBox="0 0 24 24"><path d="M21 2l-2 2m-7.6 7.6a5.5 5.5 0 1 1-7.8 7.8 5.5 5.5 0 0 1 7.8-7.8zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg></button>
        <button id="del" aria-label="Delete mode"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg></button>
      </div>
      <div id="pinrow" hidden><input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="PIN"><button id="pinok">OK</button></div>
      <div id="gorow" hidden><input id="gopg" type="number" inputmode="numeric" min="1" placeholder="Page"><button id="gook">Go</button></div>
      <small id="pinerr"></small>
    </div>
    <div id="info"><b id="cnt"></b><small id="lbl"></small></div>
  </footer>
</div>
<button id="fup" aria-label="Page up"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
<button id="fdn" aria-label="Page down"><svg viewBox="0 0 24 24"><path d="M12 5v14M19 12l-7 7-7-7"/></svg></button>
<input id="ufile" type="file" accept="application/pdf,.pdf" multiple hidden>
<button id="fsx" aria-label="Exit full screen"><svg viewBox="0 0 24 24"><path d="M3 8h5V3M21 8h-5V3M3 16h5v5M21 16h-5v5"/></svg></button>

<script>
// Installed app (Capacitor / home screen)? Already full screen: no max / upload buttons.
const IN_APP = !!(window.Capacitor && typeof window.Capacitor.isNativePlatform === "function" && window.Capacitor.isNativePlatform())
  || matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
if (IN_APP) document.body.classList.add("app");
// ── CONFIG ──────────────────────────────────────────────────────────────
const OWNER = "nerdysrisha", REPO = "mypdfs", TOK_KEY = "ghtok_pdfs";
const API = "https://api.github.com/repos/" + OWNER + "/" + REPO;
const DELETE_PIN = "6559";            // unlocks delete mode and PIN change
const NEWEST_FIRST = false;           // folder order (true = names starting yyyy mm dd, newest first)
const PDF_RE = /\.pdf$/i, MAX_ZOOM = 4, MAXPX = 8e6, UP_MAX = 50 * 1048576;
const CDN = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
// ── HELPERS ─────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const nat = (a, b) => a.localeCompare(b, undefined, {numeric: true});
const mb = n => n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
const enc = p => p.split("/").map(encodeURIComponent).join("/");
const ls = (k, v) => { try { if (v === undefined) return localStorage.getItem(k) || ""; v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) { return ""; } };
let mem = "";
const getTok = () => ls(TOK_KEY) || mem;
const setTok = v => { mem = v; ls(TOK_KEY, v || null); };
const posMap = () => { try { return JSON.parse(ls("pdfpos") || "{}"); } catch (e) { return {}; } };
const getPos = p => +posMap()[p] || 0;
const setPos = (p, i) => { const m = posMap(); i > 0 ? m[p] = i : delete m[p]; ls("pdfpos", JSON.stringify(m)); };
const hdr = raw => ({Authorization: "Bearer " + getTok(), Accept: raw ? "application/vnd.github.raw" : "application/vnd.github+json"});
const api = (path, raw) => fetch(API + "/contents/" + enc(path), {headers: hdr(raw)});
const bmIcon = () => { const s = document.createElement("span"); s.innerHTML = '<svg class="bm" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>'; return s.firstChild; };
const show = v => { document.body.dataset.v = v; closePanel(); fit(); updateBar(); };
let ticket = 0, toastT = 0;
function toast(a, b) {
  const t = $("toast"); t.firstChild.textContent = a; t.firstChild.style.display = a ? "block" : "none"; t.lastChild.textContent = b;
  t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2000);
}
const fail = t => { $("lerr").textContent = t; closeDoc(); show("login"); };

// ── DATA: one call lists the whole repo; folders = directories that hold PDFs ──
let parsed = [], dirs = {}, byPath = {}, loaded = false, truncated = false;
const parseFolder = n => {
  if (n === "/") return {n, y: 0, mo: 0, d: 0, t: "Main folder"};
  const m = n.match(/^(\d{4}) (\d{2}) (\d{2}) (.*)$/), nice = x => x.replace(/\//g, " / ");
  return m ? {n, y: +m[1], mo: +m[2], d: +m[3], t: nice(m[4])} : {n, y: 0, mo: 0, d: 0, t: nice(n)};
};
const sortFolders = () => parsed.sort((a, b) => NEWEST_FIRST ? nat(b.n, a.n) : nat(a.n, b.n));
const topOf = n => n === "/" ? "/" : n.split("/")[0];
function build(data) {
  const d = {}, bp = {};
  (data.tree || []).forEach(x => {
    if (x.type !== "blob" || !PDF_RE.test(x.path) || x.path.split("/").some(s => s.startsWith("."))) return;
    const i = x.path.lastIndexOf("/"), dir = i < 0 ? "" : x.path.slice(0, i), fid = dir || "/";
    const f = {path: x.path, name: x.path.slice(i + 1), dir, fid, size: x.size || 0, sha: x.sha};
    (d[fid] = d[fid] || []).push(f); bp[f.path] = f;
  });
  Object.values(d).forEach(a => a.sort((p, q) => nat(p.name, q.name)));
  dirs = d; byPath = bp; truncated = !!data.truncated; parsed = Object.keys(d).map(parseFolder); sortFolders();
}
async function loadTree(quiet) {
  const my = quiet ? ticket : ++ticket;
  if (!quiet) { $("box").innerHTML = '<div class="msg">Loading folders...</div>'; show("list"); }
  try {
    const r = await fetch(API + "/git/trees/HEAD?recursive=1", {headers: hdr(false)});
    if (my !== ticket) return false;
    if (r.status === 401) { setTok(""); fail("PIN was rejected. Enter it again."); return false; }
    if (!r.ok) { if (quiet) toast("Refresh failed (" + r.status + ")", ""); else $("box").innerHTML = '<div class="msg">Could not load folders (error ' + r.status + '). Reload to retry.</div>'; return false; }
    const data = await r.json(); if (my !== ticket) return false;
    build(data); loaded = true; if (!quiet) renderList(); return true;
  } catch (e) { if (my === ticket) { if (quiet) toast("", "Network error"); else $("box").innerHTML = '<div class="msg">Network error. Reload to retry.</div>'; } return false; }
}

// ── FOLDER LIST: tap a folder, its PDFs open right under it; tap a PDF to read ──
const openGroups = new Set(); let autoOpened = false, savedScroll = 0;
function renderList() {
  const g = $("box"); g.innerHTML = "";
  const last = ls("lastFolder_pdfs"), lastPdf = ls("lastPdf_pdfs"), lastTop = last ? topOf(last) : "";
  if (!autoOpened) { autoOpened = true; if (last) { openGroups.add(last); openGroups.add("g:" + lastTop); } }
  const groups = new Map();
  parsed.forEach(f => { const t = topOf(f.n); if (!groups.has(t)) groups.set(t, []); groups.get(t).push(f); });
  const cnt = f => (dirs[f.n] || []).length, dstr = f => f.y ? f.d + " " + MON[f.mo - 1] + " " + f.y : "";
  const pdfRow = x => {
    const b = document.createElement("button"); b.className = "topic pdf"; b.innerHTML = "<span><b></b><small></small></span>";
    const tb = b.firstChild.firstChild, p = getPos(x.path);
    tb.textContent = x.name.replace(PDF_RE, ""); tb.nextSibling.textContent = p ? "Last read: page " + (p + 1) : "";
    if (x.path === lastPdf) tb.appendChild(bmIcon());
    b.onclick = () => { savedScroll = g.scrollTop; location.hash = "p=" + encodeURIComponent(x.path); };
    return b;
  };
  const accordion = (key, title, sub, count, isLast, fill) => {
    const wrap = document.createElement("div"); wrap.className = "grp" + (openGroups.has(key) ? " open" : "");
    const h = document.createElement("button"); h.className = "topic hd";
    h.innerHTML = "<span><b></b><small></small></span><span class=\"r\"><em class=\"n\"></em><i>&#9656;</i></span>";

      const path = dir ? dir + "/" + name : name;
      try {
        const r = await fetch(API + "/contents/" + enc(path), {method: "PUT", headers: {...hdr(false), "Content-Type": "application/json"}, body: JSON.stringify({message: "Add " + name, content: b64})});
        if (r.ok) {
          const j = await r.json(), nf = {path, name, dir, fid, size: fl[i].size, sha: j.content && j.content.sha};
          (dirs[fid] = dirs[fid] || []).push(nf); dirs[fid].sort((p, q) => nat(p.name, q.name)); byPath[path] = nf; sent = true; ok++;
        } else if (r.status !== 422) break;
      } catch (e) { break; }
    }
    if (!sent) bad++;
  }
  upBusy = false; updateBar();
  toast(bad ? "Uploaded " + ok + ", failed " + bad : "Uploaded " + ok + (ok === 1 ? " PDF" : " PDFs"), bad ? "Needs Contents: read & write, and files under 50 MB" : "");
};

// ── PIN ─────────────────────────────────────────────────────────────────
function changeToken() { setTok(""); loaded = false; unlocked = false; syncLock(); $("lerr").textContent = ""; $("tokin").value = ""; route(); }
async function saveToken() {
  const v = $("tokin").value.trim(); if (!v) return; $("lerr").textContent = "Checking..."; setTok(v);
  try {
    const r = await fetch(API, {headers: hdr(false)});
    if (r.ok) { $("lerr").textContent = ""; $("tokin").value = ""; return route(); }
    setTok(""); $("lerr").textContent = r.status === 401 ? "GitHub rejected this PIN. Check it and try again." : "This PIN cannot read " + OWNER + "/" + REPO + " (error " + r.status + "). Check its repository access.";
  } catch (e) { setTok(""); $("lerr").textContent = "Network error. Check your connection and try again."; }
}
$("tsave").onclick = saveToken; $("tokin").addEventListener("keydown", e => { if (e.key === "Enter") saveToken(); });

// ── ROUTING: landing -> (none) = folders with PDFs under them, #p=<path> = reader ──
let started = false;
async function route() {
  if (!started) { ++ticket; closeDoc(); return show("landing"); }
  if (!getTok()) { ++ticket; closeDoc(); return show("login"); }
  if (!loaded && !(await loadTree())) return;
  const h = location.hash; let m;
  if ((m = h.match(/^#p=(.+)$/))) { const f = byPath[decodeURIComponent(m[1])]; if (!f) { location.hash = ""; return; } return openPdf(f); }
  ++ticket; closeDoc();
  show("list"); renderList(); $("box").scrollTop = savedScroll;
}
// PDF handed over by Android ("Open with" / Share): MainActivity copies it to cache, page opens it
function checkIncoming() {
  try {
    if (!(window.AndroidPdf && window.AndroidPdf.pending)) return false;
    const j = window.AndroidPdf.pending(); if (!j) return false;
    const o = JSON.parse(j); started = true;
    openPdf({path: "local:" + o.name, name: o.name, fid: "\u0000local", size: o.size || 0, local: window.Capacitor.convertFileSrc("file://" + o.path)});
    return true;
  } catch (e) { return false; }
}
window.addEventListener("incomingpdf", checkIncoming);
window.addEventListener("hashchange", route);
// START: web = go full screen (needs this tap); installed app is already full screen
$("start").onclick = () => { started = true; if (!IN_APP && canFS && !document.fullscreenElement) setMax(true); if (!checkIncoming()) route(); };
if (getTok()) pdfjsReady().catch(() => {});
if (!checkIncoming()) route();
</script>
